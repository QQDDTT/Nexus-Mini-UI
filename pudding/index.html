<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#23120b" />
  <title>保卫布丁 · PUDDING DEFENSE | Nexus-Mini</title>
  <link rel="icon" type="image/svg+xml" href="../assets/pudding-defense/icon.svg" />
  <link rel="stylesheet" href="../assets/pudding-defense/style.css" />
  <style>
    :root {
      --void: #23120b;
      --panel: rgba(74, 37, 24, 0.88);
      --border: rgba(255, 251, 235, 0.35);
      --cyan: #fde047;
      --gold: #fb7185;
      --red: #ef4444;
      --green: #10b981;
      --text: #fffbeb;
      --muted: #fde68a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100vw; height: 100dvh; overflow: hidden; overscroll-behavior: none;
      background: var(--void); color: var(--text);
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #td-layout {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: max(6px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      gap: 6px;
      background: radial-gradient(circle at 50% 40%, #3b1d11 0%, #23120b 85%);
    }
    .top-bar {
      height: 44px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding-right: 112px;
      gap: 6px;
      flex-wrap: nowrap;
    }
    .hud-group { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
    .hud-pill {
      min-height: 44px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 10px;
      color: var(--text);
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.73rem;
      white-space: nowrap;
    }
    .hud-val { font-weight: 800; color: var(--cyan); }
    .hud-val.gold { color: var(--gold); }
    .board-container {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    canvas {
      background: #2b160e;
      border: 2px solid rgba(253, 224, 71, 0.42);
      border-radius: 12px;
      max-width: 100%; max-height: 100%;
      aspect-ratio: 16 / 9;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
      touch-action: none;
    }
    /* Bottom Compact Icon-Only Tower Dock */
    .tower-dock {
      height: 50px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .tower-btn {
      width: 48px; height: 48px;
      min-width: 48px; min-height: 48px;
      padding: 0;
      border-radius: 12px;
      background: var(--panel);
      border: 1.5px solid var(--border);
      color: var(--text);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .tower-btn.active {
      background: rgba(253, 224, 71, 0.18);
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(253, 224, 71, 0.36);
      transform: translateY(-2px);
    }
    .tower-btn img { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }
    .skill-btn {
      width: 48px; height: 48px;
      min-width: 48px; min-height: 48px;
      padding: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #fde047 0%, #fb7185 100%);
      border: 1.5px solid #fef08a;
      color: #030712;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 0 16px rgba(253, 224, 71, 0.42);
    }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 8000;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.active { display: flex; }
    .modal-card {
      max-width: 460px; width: 100%;
      background: rgba(9, 14, 26, 0.96);
      border: 1px solid rgba(253, 224, 71, 0.55);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
  </style>
</head>
<body>
  <div id="td-layout">
    <!-- 顶部状态栏 -->
    <header class="top-bar">
      <div class="hud-group">
        <div class="hud-pill pd-frosting-pill">
          <img src="../assets/pudding-defense/icon.svg" alt="" width="18" height="18" />
          <span style="font-weight:800;">保卫布丁</span>
          <span class="hud-val" id="hud-wave">波次 1 / 15</span>
        </div>
        <div class="hud-pill pd-frosting-pill">
          <span>糖币</span>
          <span class="hud-val gold" id="hud-gold">360</span>
        </div>
        <div class="hud-pill pd-frosting-pill">
          <span>布丁</span>
          <span class="hud-val" id="hud-pudding">10 / 10 HP</span>
        </div>
        <div class="hud-pill pd-frosting-pill">
          <span>糖晶</span>
          <span class="hud-val gold" id="hud-crystals">600</span>
        </div>
      </div>
      <div class="hud-group">
        <button class="hud-pill pd-frosting-pill" id="btn-speed" aria-label="切换战斗倍速" title="切换战斗倍速" style="width:44px;min-width:44px;padding:0;justify-content:center;cursor:pointer;color:var(--cyan);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>
        </button>
      </div>
    </header>

    <!-- 16x9 战术棋盘画布 -->
    <main class="board-container">
      <canvas id="td-canvas" width="960" height="540"></canvas>
    </main>

    <!-- 底部五大甜品卫士纯图标建造栏与全屏暴风雪技能按钮 -->
    <footer class="tower-dock" id="tower-dock">
      <button class="tower-btn active" data-tower="boba" aria-label="波波连射塔" title="波波连射塔">
        <img src="../assets/pudding-defense/sprites/tower-boba.svg" alt="Boba" />
      </button>
      <button class="tower-btn" data-tower="frost" aria-label="冰霜北极熊" title="冰霜北极熊">
        <img src="../assets/pudding-defense/sprites/tower-frost.svg" alt="Frost" />
      </button>
      <button class="tower-btn" data-tower="sun" aria-label="太阳蛋黄炮" title="太阳蛋黄炮">
        <img src="../assets/pudding-defense/sprites/tower-sun.svg" alt="Sun" />
      </button>
      <button class="tower-btn" data-tower="missile" aria-label="泡泡糖导弹" title="泡泡糖导弹">
        <img src="../assets/pudding-defense/sprites/tower-missile.svg" alt="Missile" />
      </button>
      <button class="tower-btn" data-tower="prism" aria-label="彩虹棱镜塔" title="彩虹棱镜塔">
        <img src="../assets/pudding-defense/sprites/tower-prism.svg" alt="Prism" />
      </button>
      <button class="skill-btn" id="btn-blizzard" aria-label="糖霜暴风雪" title="糖霜暴风雪">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
    </footer>
  </div>

  <script src="../shared/nexus-sdk.js?v=20261108"></script>
  <script>
  /**
   * 标准微游菜单清单入口 (Step 1 & Step 3 标准模板结构)
   * - 仅初始化第二层游戏菜单清单 (Tier 2 Menu)，零游戏引擎逻辑、零后台循环、零自动建房广播。
   * - 唯有通过【⑥ 房间大厅】创建/加入房间并点击【🚀 启动游戏 · 进入战场】，
   *   才由 SDK 唤起启动加载画面并按需加载 ./engine.js 启动游戏。
   */
  NexusSDK.initShellUI({
    gameId: 'pudding-defense',
    gameTitle: '保卫布丁 · 焦糖烘焙工坊',
    engineUrl: './engine.js',
    storagePrefix: 'NEXUS_MINI_PUDDING_',
    defaultSave: function(isAdmin) {
      return {
        currency: { sugarCrystals: isAdmin ? 99999 : 600 },
        goldenPuddings: isAdmin ? 30 : 0,
        clearedChapters: isAdmin ? 5 : 1
      };
    }
  });
</script>
</body>
</html>

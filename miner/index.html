<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <title>掘金先锋 · GOLD MINER | Nexus-Mini</title>
  <link rel="icon" type="image/svg+xml" href="../assets/gold-miner/icon.svg" />
  <style>
    :root {
      --void: #030712;
      --panel: rgba(13, 20, 36, 0.84);
      --border: rgba(0, 240, 255, 0.24);
      --cyan: #00f0ff;
      --gold: #fbbf24;
      --red: #ef4444;
      --green: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100vw; height: 100dvh; overflow: hidden; overscroll-behavior: none;
      background: var(--void); color: var(--text);
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #mine-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      touch-action: none;
    }
    .top-bar {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: 120px;
      z-index: 100;
      display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;
      pointer-events: none;
    }
    .hud-chip {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex; align-items: center; gap: 5px;
      font-size: 0.74rem;
      white-space: nowrap;
    }
    .hud-val { font-weight: 800; color: var(--cyan); }
    .hud-val.gold { color: var(--gold); }
    .bottom-controls {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      z-index: 120;
      display: flex; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .ctrl-group {
      pointer-events: auto;
      display: flex; gap: 8px; align-items: center;
    }
    .act-btn {
      min-height: 48px;
      padding: 0 16px;
      border-radius: 12px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.82rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: 8px;
      cursor: pointer;
    }
    .act-btn:active { transform: scale(0.95); }
    .act-btn.primary {
      min-height: 60px; padding: 0 24px;
      background: linear-gradient(135deg, #00f0ff 0%, #0284c7 100%);
      border: 2px solid #67e8f9;
      color: #030712;
      font-size: 0.94rem; font-weight: 900;
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.42);
    }
    .act-btn.danger {
      border-color: rgba(239, 68, 68, 0.55);
      color: #fca5a5;
    }
    .act-btn img { width: 24px; height: 24px; object-fit: contain; }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 8000;
      background: rgba(3, 7, 18, 0.86);
      backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.active { display: flex; }
    .modal-card {
      max-width: 560px; width: 100%;
      background: rgba(9, 14, 26, 0.96);
      border: 1px solid rgba(0, 240, 255, 0.55);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .shop-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .shop-item {
      background: rgba(5, 8, 17, 0.78);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      text-align: center;
    }
    .shop-item img { width: 44px; height: 44px; object-fit: contain; }
    @media (max-width: 680px) {
      .shop-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="mine-canvas"></canvas>

  <!-- 顶部矿层与收益仪表盘 -->
  <header class="top-bar">
    <div class="hud-chip">
      <img src="../assets/gold-miner/icon.svg" alt="" width="20" height="20" />
      <span style="font-weight:800;">掘金先锋</span>
      <span class="hud-val" id="hud-stage">矿层 #1</span>
    </div>
    <div class="hud-chip">
      <span>现金/目标</span>
      <span class="hud-val gold" id="hud-cash">$0 / $650</span>
    </div>
    <div class="hud-chip">
      <span>计时</span>
      <span class="hud-val" id="hud-timer">60s</span>
    </div>
    <div class="hud-chip">
      <span>金条</span>
      <span class="hud-val gold" id="hud-bars">850</span>
    </div>
    <div class="hud-chip">
      <span id="hud-lan" style="color:var(--green);">2P 合力起吊中</span>
    </div>
  </header>

  <!-- 底部双手操控栏 (纯图标无文字) -->
  <div class="bottom-controls">
    <div class="ctrl-group">
      <button class="act-btn danger" id="btn-dynamite" aria-label="投掷雷管" title="投掷雷管" style="width:54px;height:54px;padding:0;border-radius:14px;justify-content:center;">
        <img src="../assets/gold-miner/sprites/item-dynamite.svg" alt="Dynamite" style="width:30px;height:30px;" />
      </button>
    </div>
    <div class="ctrl-group">
      <button class="act-btn primary" id="btn-launch-hook" aria-label="发射合金抓钩" title="发射合金抓钩" style="width:68px;height:68px;min-height:68px;padding:0;border-radius:50%;justify-content:center;">
        <img src="../assets/gold-miner/sprites/claw-hook.svg" alt="Hook" style="width:34px;height:34px;" />
      </button>
    </div>
  </div>

  <script src="../shared/nexus-sdk.js"></script>
  <script>
    (() => {
      NexusSDK.initShellUI({ gameId: 'gold-miner', gameTitle: '掘金先锋' });

      const store = NexusSDK.createGameStorage('NEXUS_MINI_MINER_', (isAdmin) => ({
        currency: { goldBars: isAdmin ? 999999 : 850 },
        maxStage: isAdmin ? 50 : 1,
        bestCash: isAdmin ? 888888 : 1200,
        dynamites: isAdmin ? 99 : 3,
        tonicBuff: isAdmin ? true : false,
        cloverBuff: isAdmin ? true : false
      }));
      let saveData = store.load();

      const sprites = NexusSDK.loadSprites('gold-miner', {
        rig1: 'miner-rig-p1.svg',
        rig2: 'miner-rig-p2.svg',
        hook: 'claw-hook.svg',
        gold: 'gold-nugget.svg',
        giant: 'gold-giant.svg',
        rock: 'mineral-rock.svg',
        diamond: 'mineral-diamond.svg',
        bag: 'mystery-bag.svg',
        tnt: 'hazard-tnt.svg',
        dynamite: 'item-dynamite.svg',
        tonic: 'item-tonic.svg',
        clover: 'item-clover.svg'
      });

      const canvas = document.getElementById('mine-canvas');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      let stage = 1;
      let cash = 0;
      let targetCash = 650;
      let timeLeft = 60;
      let tickCount = 0;

      // 60Hz Harmonic Pendulum Hooks (P1 & P2)
      const MAX_THETA = (72 * Math.PI) / 180; // ±72°
      const p1Hook = {
        phase: 0,
        theta: 0,
        len: 42,
        state: 'swing', // 'swing' | 'extend' | 'retract'
        grabbed: null
      };
      const p2Hook = {
        phase: Math.PI * 0.5,
        theta: 0,
        len: 42,
        state: 'swing',
        grabbed: null,
        isRemote: false
      };

      let minerals = [];
      let floatingTexts = [];
      let explosions = [];

      function generateMineStage(stg) {
        const rng = NexusSDK.createSeededRandom(stg * 4099 + 77);
        minerals = [];
        targetCash = 500 + stg * 350;
        timeLeft = 60;
        p1Hook.state = 'swing'; p1Hook.len = 42; p1Hook.grabbed = null;
        p2Hook.state = 'swing'; p2Hook.len = 42; p2Hook.grabbed = null;

        const w = canvas.width;
        const h = canvas.height;
        const topY = Math.max(150, h * 0.28);

        const defs = [
          { type: 'giant', count: 2, r: 36, mass: 7.0, val: 500 },
          { type: 'gold', count: 5, r: 24, mass: 2.6, val: 200 },
          { type: 'diamond', count: 3 + Math.min(3, stg), r: 18, mass: 0.9, val: 650 },
          { type: 'rock', count: 4, r: 25, mass: 5.2, val: 45 },
          { type: 'bag', count: 2, r: 23, mass: 1.5, val: 350 },
          { type: 'tnt', count: 2, r: 24, mass: 1.2, val: 10 }
        ];

        defs.forEach((d) => {
          for (let i = 0; i < d.count; i++) {
            let x = 70 + rng() * (w - 140);
            let y = topY + rng() * (h - topY - 82);
            for (let attempt = 0; attempt < 24; attempt++) {
              const candX = 64 + rng() * (w - 128);
              const candY = topY + rng() * (h - topY - 82);
              const clash = minerals.some((m) => Math.hypot(candX - m.x, candY - m.y) < (d.r + m.r + 12));
              if (!clash) {
                x = candX;
                y = candY;
                break;
              }
            }
            minerals.push({
              id: `${d.type}_${i}_${Math.floor(rng() * 9999)}`,
              type: d.type,
              x, y,
              r: d.r,
              mass: d.mass,
              val: d.val,
              heldBy: []
            });
          }
        });
        updateHud();
      }

      // Timer countdown
      setInterval(() => {
        if (document.querySelector('.modal-backdrop.active')) return;
        if (timeLeft > 0) {
          timeLeft--;
          if (timeLeft === 0 || minerals.length === 0) {
            if (cash >= targetCash) {
              NexusSDK.audio.win();
              stage++;
              if (stage > (saveData.maxStage || 1)) saveData.maxStage = stage;
              saveData.currency.goldBars += 100;
              store.save(saveData);
              generateMineStage(stage);
            } else {
              generateMineStage(stage);
            }
          }
          updateHud();
        }
      }, 1000);

      function launchHook(hk, isP1) {
        if (hk.state === 'swing') {
          hk.state = 'extend';
          if (isP1) {
            NexusSDK.audio.hook();
            if (lan.isConnected()) lan.sendFast({ type: 'launch', theta: hk.theta });
          }
        }
      }

      function useDynamite() {
        const targetHook = p1Hook.grabbed ? p1Hook : (p2Hook.grabbed ? p2Hook : null);
        if (!targetHook || (saveData.dynamites || 0) <= 0) return;
        saveData.dynamites--;
        const item = targetHook.grabbed;
        explosions.push({ x: item.x, y: item.y, r: 10, maxR: 85, alpha: 1 });
        const idx = minerals.indexOf(item);
        if (idx >= 0) minerals.splice(idx, 1);
        if (p1Hook.grabbed === item) p1Hook.grabbed = null;
        if (p2Hook.grabbed === item) p2Hook.grabbed = null;
        targetHook.state = 'retract';
        NexusSDK.audio.explosion();
        store.save(saveData);
        updateHud();
      }

      function triggerTntExplosion(tnt) {
        NexusSDK.audio.explosion();
        explosions.push({ x: tnt.x, y: tnt.y, r: 12, maxR: 115, alpha: 1 });
        for (let i = minerals.length - 1; i >= 0; i--) {
          const m = minerals[i];
          if (m !== tnt && Math.hypot(m.x - tnt.x, m.y - tnt.y) < 115) {
            minerals.splice(i, 1);
          }
        }
      }

      function updateHookPhysics(hk, originX, originY, isP1) {
        if (hk.state === 'swing') {
          hk.phase += 0.032;
          hk.theta = Math.sin(hk.phase) * MAX_THETA;
          hk.len = 42;
        } else if (hk.state === 'extend') {
          hk.len += 8.2;
          const hx = originX + Math.sin(hk.theta) * hk.len;
          const hy = originY + Math.cos(hk.theta) * hk.len;

          // Check collision with minerals
          for (let i = 0; i < minerals.length; i++) {
            const m = minerals[i];
            if (Math.hypot(hx - m.x, hy - m.y) < m.r + 10) {
              if (m.type === 'tnt') {
                triggerTntExplosion(m);
                const idx = minerals.indexOf(m);
                if (idx >= 0) minerals.splice(idx, 1);
                hk.state = 'retract';
                break;
              }
              hk.grabbed = m;
              if (!m.heldBy.includes(hk)) m.heldBy.push(hk);
              hk.state = 'retract';
              if (isP1) NexusSDK.audio.hit();
              break;
            }
          }

          if (hx < 20 || hx > canvas.width - 20 || hy > canvas.height - 20) {
            hk.state = 'retract';
          }
        } else if (hk.state === 'retract') {
          let pullSpeed = 9.0;
          if (hk.grabbed) {
            const m0 = 2.2;
            const buff = saveData.tonicBuff ? 1.65 : 1.0;
            // Dual-hook cooperative crane boost (2.2x speed when both hooks lift same giant gold)
            const coopBoost = hk.grabbed.heldBy.length >= 2 ? 2.2 : 1.0;
            pullSpeed = 8.2 * ((m0 * buff * coopBoost) / (m0 + hk.grabbed.mass));
            const hx = originX + Math.sin(hk.theta) * hk.len;
            const hy = originY + Math.cos(hk.theta) * hk.len;
            hk.grabbed.x = hx;
            hk.grabbed.y = hy;
          }
          hk.len -= pullSpeed;
          if (hk.len <= 42) {
            hk.len = 42;
            hk.state = 'swing';
            if (hk.grabbed) {
              const item = hk.grabbed;
              hk.grabbed = null;
              if (p1Hook.grabbed === item) { p1Hook.grabbed = null; p1Hook.state = 'swing'; p1Hook.len = 42; }
              if (p2Hook.grabbed === item) { p2Hook.grabbed = null; p2Hook.state = 'swing'; p2Hook.len = 42; }
              const idx = minerals.indexOf(item);
              if (idx >= 0) {
                minerals.splice(idx, 1);
                let gain = item.val;
                if (item.type === 'diamond' && saveData.cloverBuff) gain = Math.round(gain * 1.5);
                if (item.type === 'bag') {
                  gain = saveData.cloverBuff ? 600 : (150 + Math.floor(Math.random() * 450));
                  saveData.dynamites = (saveData.dynamites || 0) + 1;
                }
                cash += gain;
                saveData.currency.goldBars += Math.round(gain * 0.2);
                if (cash > (saveData.bestCash || 0)) saveData.bestCash = cash;
                store.save(saveData);
                NexusSDK.audio.pickup();
                floatingTexts.push({ x: originX, y: originY + 20, txt: `+$${gain}`, life: 45 });
                updateHud();
              }
            }
          }
        }
      }

      // LAN Session
      const lan = NexusSDK.createLanSession('gold-miner', store.getAuth().room);
      lan.onStatus((st) => {
        const el = document.getElementById('hud-lan');
        if (st.connected) {
          el.textContent = `LAN 双钩合力已连接 (${st.peerLatencyMs}ms)`;
          el.style.color = '#00f0ff';
          p2Hook.isRemote = true;
        } else {
          el.textContent = '2P 勘探僚机协同起吊中';
          el.style.color = '#10b981';
          p2Hook.isRemote = false;
        }
      });
      lan.onFast((msg) => {
        if (msg.type === 'launch') {
          p2Hook.theta = msg.theta;
          launchHook(p2Hook, false);
        }
      });

      function updateHud() {
        document.getElementById('hud-stage').textContent = `矿层 #${stage}`;
        document.getElementById('hud-cash').textContent = `$${cash.toLocaleString()} / $${targetCash.toLocaleString()}`;
        document.getElementById('hud-timer').textContent = `${timeLeft}s`;
        document.getElementById('hud-bars').textContent = (saveData.currency?.goldBars ?? 0).toLocaleString();
      }

      function step() {
        tickCount++;
        const rig1X = canvas.width * 0.38;
        const rig2X = canvas.width * 0.62;
        const rigY = 108;

        updateHookPhysics(p1Hook, rig1X, rigY, true);
        updateHookPhysics(p2Hook, rig2X, rigY, false);

        // AI / Ghost Partner auto-assist on Giant Gold or Diamonds
        if (!p2Hook.isRemote && p2Hook.state === 'swing' && tickCount % 95 === 0) {
          launchHook(p2Hook, false);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          floatingTexts[i].y -= 1.2;
          floatingTexts[i].life--;
          if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
        }
        for (let i = explosions.length - 1; i >= 0; i--) {
          const ex = explosions[i];
          ex.r += (ex.maxR - ex.r) * 0.25;
          ex.alpha -= 0.05;
          if (ex.alpha <= 0) explosions.splice(i, 1);
        }
      }

      function drawRigAndHook(rigSprite, hk, originX, originY, cableColor) {
        if (rigSprite?.complete) {
          ctx.drawImage(rigSprite, originX - 34, originY - 52, 68, 68);
        }
        const hx = originX + Math.sin(hk.theta) * hk.len;
        const hy = originY + Math.cos(hk.theta) * hk.len;

        // Alloy Cable
        ctx.strokeStyle = cableColor;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(originX, originY);
        ctx.lineTo(hx, hy);
        ctx.stroke();

        // Claw Hook SVG Sprite
        if (sprites.hook?.complete) {
          ctx.save();
          ctx.translate(hx, hy);
          ctx.rotate(-hk.theta);
          ctx.drawImage(sprites.hook, -18, -10, 36, 36);
          ctx.restore();
        }
      }

      function render() {
        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Underground Stratum Horizon at y = 112
        const grad = ctx.createLinearGradient(0, 112, 0, canvas.height);
        grad.addColorStop(0, '#091326');
        grad.addColorStop(1, '#030712');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 112, canvas.width, canvas.height - 112);

        ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 112);
        ctx.lineTo(canvas.width, 112);
        ctx.stroke();

        // Render Minerals using Multi-Layer SVG Sprites
        minerals.forEach((m) => {
          const sp = sprites[m.type] || sprites.gold;
          const sz = m.r * 2.2;
          if (sp?.complete) {
            ctx.drawImage(sp, m.x - sz / 2, m.y - sz / 2, sz, sz);
          }
          if (m.heldBy.length >= 2) {
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.r + 6, 0, Math.PI * 2);
            ctx.stroke();
          }
        });

        // Render 1P & 2P Miner Rigs + Claw Hooks
        drawRigAndHook(sprites.rig1, p1Hook, canvas.width * 0.38, 108, '#00f0ff');
        drawRigAndHook(sprites.rig2, p2Hook, canvas.width * 0.62, 108, '#fbbf24');

        // Explosions
        explosions.forEach((ex) => {
          ctx.strokeStyle = `rgba(239, 68, 68, ${ex.alpha})`;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
          ctx.stroke();
        });

        // Floating Cash Popups
        floatingTexts.forEach((ft) => {
          ctx.fillStyle = '#fbbf24';
          ctx.font = 'bold 18px Orbitron, sans-serif';
          ctx.fillText(ft.txt, ft.x - 20, ft.y);
        });
      }

      function loop() {
        step();
        render();
        requestAnimationFrame(loop);
      }

      // Controls
      document.getElementById('btn-launch-hook').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        launchHook(p1Hook, true);
      });
      canvas.addEventListener('pointerdown', () => {
        launchHook(p1Hook, true);
      });
      document.getElementById('btn-dynamite').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        useDynamite();
      });
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'KeyS' || e.code === 'ArrowDown') launchHook(p1Hook, true);
        if (e.code === 'KeyW' || e.code === 'ArrowUp') useDynamite();
      });

      generateMineStage(1);
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>

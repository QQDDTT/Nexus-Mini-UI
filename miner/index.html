<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#181009" />
  <title>掘金先锋 · GOLD MINER | Nexus-Mini</title>
  <link rel="icon" type="image/svg+xml" href="../assets/gold-miner/icon.svg" />
  <link rel="stylesheet" href="../assets/gold-miner/style.css" />
  <style>
    :root {
      --void: #181009;
      --panel: rgba(44, 29, 17, 0.90);
      --border: rgba(245, 158, 11, 0.38);
      --cyan: #fbbf24;
      --gold: #fde047;
      --red: #ef4444;
      --green: #10b981;
      --text: #fef3c7;
      --muted: #fcd34d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100vw; height: 100dvh; overflow: hidden; overscroll-behavior: none;
      background: var(--void); color: var(--text);
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #mine-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      touch-action: none;
    }
    .top-bar {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: 120px;
      z-index: 100;
      display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;
      pointer-events: none;
    }
    .hud-chip {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex; align-items: center; gap: 5px;
      font-size: 0.74rem;
      white-space: nowrap;
    }
    .hud-val { font-weight: 800; color: var(--cyan); }
    .hud-val.gold { color: var(--gold); }
    .bottom-controls {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      z-index: 120;
      display: flex; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .ctrl-group {
      pointer-events: auto;
      display: flex; gap: 8px; align-items: center;
    }
    .act-btn {
      min-height: 48px;
      padding: 0 16px;
      border-radius: 12px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.82rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: 8px;
      cursor: pointer;
    }
    .act-btn:active { transform: scale(0.95); }
    .act-btn.primary {
      min-height: 60px; padding: 0 24px;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      border: 2px solid #fde047;
      color: #030712;
      font-size: 0.94rem; font-weight: 900;
      box-shadow: 0 0 22px rgba(251, 191, 36, 0.45);
    }
    .act-btn.danger {
      border-color: rgba(239, 68, 68, 0.55);
      color: #fca5a5;
    }
    .act-btn img { width: 24px; height: 24px; object-fit: contain; }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 8000;
      background: rgba(3, 7, 18, 0.86);
      backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.active { display: flex; }
    .modal-card {
      max-width: 560px; width: 100%;
      background: rgba(9, 14, 26, 0.96);
      border: 1px solid rgba(251, 191, 36, 0.55);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .shop-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .shop-item {
      background: rgba(5, 8, 17, 0.78);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      text-align: center;
    }
    .shop-item img { width: 44px; height: 44px; object-fit: contain; }
    @media (max-width: 680px) {
      .shop-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="mine-canvas"></canvas>

  <!-- 顶部矿层与收益仪表盘 -->
  <header class="top-bar">
    <div class="hud-chip">
      <img src="../assets/gold-miner/icon.svg" alt="" width="20" height="20" />
      <span style="font-weight:800;">掘金先锋</span>
      <span class="hud-val" id="hud-stage">矿层 #1</span>
    </div>
    <div class="hud-chip">
      <span>现金/目标</span>
      <span class="hud-val gold" id="hud-cash">$0 / $650</span>
    </div>
    <div class="hud-chip">
      <span>计时</span>
      <span class="hud-val" id="hud-timer">60s</span>
    </div>
    <div class="hud-chip">
      <span>金条</span>
      <span class="hud-val gold" id="hud-bars">850</span>
    </div>
    <div class="hud-chip">
      <span id="hud-lan" style="color:var(--green);">2P 合力起吊中</span>
    </div>
  </header>

  <!-- 底部双手操控栏 (纯图标无文字) -->
  <div class="bottom-controls">
    <div class="ctrl-group">
      <button class="act-btn danger" id="btn-dynamite" aria-label="投掷雷管" title="投掷雷管" style="width:54px;height:54px;padding:0;border-radius:14px;justify-content:center;">
        <img src="../assets/gold-miner/sprites/item-dynamite.svg" alt="Dynamite" style="width:30px;height:30px;" />
      </button>
    </div>
    <div class="ctrl-group">
      <button class="act-btn primary" id="btn-launch-hook" aria-label="发射合金抓钩" title="发射合金抓钩" style="width:68px;height:68px;min-height:68px;padding:0;border-radius:50%;justify-content:center;">
        <img src="../assets/gold-miner/sprites/claw-hook.svg" alt="Hook" style="width:34px;height:34px;" />
      </button>
    </div>
  </div>

  <!-- 局间矿工杂货铺整备弹窗（由第二层菜单底部「打开局间矿工杂货铺整备」唤起，弹窗打开期间计时暂停） -->
  <div class="modal-backdrop" id="shop-modal" role="dialog" aria-modal="true" aria-labelledby="shop-title">
    <div class="modal-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <strong id="shop-title" style="font-size:1rem;color:#fbbf24;white-space:nowrap;">局间矿工杂货铺</strong>
        <span style="font-size:0.8rem;white-space:nowrap;">金条储备：<b id="shop-bars" style="color:#fbbf24;">0</b></span>
      </div>
      <div class="shop-grid" id="shop-grid"></div>
      <div id="shop-msg" style="font-size:0.72rem;color:#d6c7a1;min-height:1em;"></div>
      <button class="act-btn primary" id="btn-close-shop" style="justify-content:center;min-height:44px;white-space:nowrap;">整备完毕 · 下井开采</button>
    </div>
  </div>
  <button id="btn-open-shop" type="button" hidden aria-hidden="true" tabindex="-1"></button>

  <script src="../shared/nexus-sdk.js?v=4.0"></script>
  <script>
  /**
   * 标准微游菜单清单入口 (Step 1 & Step 3 标准模板结构)
   * - 仅初始化第二层游戏菜单清单 (Tier 2 Menu)，零游戏引擎逻辑、零后台循环、零自动建房广播。
   * - 唯有通过【⑥ 房间大厅】创建/加入房间并点击【🚀 启动游戏 · 进入战场】，
   *   才由 SDK 唤起启动加载画面并按需加载 ./engine.js 启动游戏。
   */
  NexusSDK.initShellUI({
    gameId: 'gold-miner',
    gameTitle: '掘金先锋 · 地心岩层勘探站',
    engineUrl: './engine.js',
    storagePrefix: 'GOLD_MINER_V3_SAVE_',
    defaultSave: function(isAdmin) {
      return {
        gold: isAdmin ? 999999 : 1200,
        stage: 1,
        dynamite: isAdmin ? 99 : 3,
        levels: { winch: isAdmin ? 5 : 1, cable: isAdmin ? 5 : 1, scanner: isAdmin ? 5 : 1, lamp: isAdmin ? 5 : 1 }
      };
    }
  });
</script>
</body>
</html>

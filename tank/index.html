<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1f26" />
  <title>钢铁防线 · TANK BATTLE | Nexus-Mini</title>
  <link rel="icon" type="image/svg+xml" href="../assets/tank-battle/icon.svg" />
  <link rel="stylesheet" href="../assets/tank-battle/style.css?v=20261102a" />
  <style>
    :root {
      --void: #141215;
      --panel: #282c34;
      --border: #4b5362;
      --cyan: #f59e0b;
      --gold: #fde047;
      --red: #ef4444;
      --green: #22c55e;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100vw; height: 100dvh; overflow: hidden; overscroll-behavior: none;
      background-color: var(--void);
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
        linear-gradient(180deg, #242932 0%, #1b1f26 100%);
      color: var(--text);
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #app {
      width: 100%; height: 100%;
      display: grid;
      grid-template-columns: 198px 1fr 198px;
      gap: 8px;
      padding:
        max(6px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(6px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
      align-items: center;
    }

    /* 左右重型发蓝乌金钢操控舱（4px 厚断面 + 四角沉头内六角螺栓） */
    .t3-wing {
      height: 100%;
      background: linear-gradient(180deg, #303742 0%, #232830 100%);
      border-top: 2px solid #566170;
      border-left: 2px solid #47515e;
      border-right: 2px solid #181c21;
      border-bottom: 4px solid #121519;
      border-radius: 3px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.72), inset 0 0 16px rgba(0, 0, 0, 0.38);
      padding: 8px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 5px;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .brand-stamp {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-bottom: 5px;
      border-bottom: 2px solid #181c22;
    }
    .brand-stamp img {
      width: 26px;
      height: 26px;
      border-radius: 3px;
      border: 1px solid #566170;
      flex-shrink: 0;
    }
    .brand-stamp h1 {
      font-size: 0.8rem;
      font-weight: 800;
      color: #d6deea;
      letter-spacing: 0.05em;
      white-space: nowrap;
      text-shadow: 0 1px 2px #0e1114;
    }
    .brand-stamp p {
      font-size: 0.58rem;
      font-family: "Consolas", monospace;
      color: #c48f5a;
      white-space: nowrap;
    }

    /* 深冲压乌金钢遥测读数槽 */
    .wing-stat-box {
      background: #1a1e24;
      border: 1px solid #3d4552;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.82);
      padding: 5px 7px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-radius: 2px;
    }
    .wing-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "Consolas", "Noto Sans SC", monospace;
      font-size: 0.64rem;
      color: #98a3b0;
      white-space: nowrap;
    }
    .wing-stat-row strong {
      color: #d6deea;
      font-weight: 800;
    }
    .wing-stat-row strong.brass {
      color: #dfc08e;
    }

    /* 左翼：全向液压车体操纵摇杆 (简化单拇指 360° 矢量推进与转向，触控热区 138x138px / 摇杆帽 56x56px >= 44x44px) */
    .joystick-housing {
      width: 138px;
      height: 138px;
      margin: 4px auto;
      background: radial-gradient(circle at 50% 50%, #15191f 0%, #1f252e 68%, #2c3440 100%);
      border: 2.5px solid #4a5464;
      border-radius: 50%;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.92), 0 2px 6px rgba(0, 0, 0, 0.75), 0 0 0 2px #14171c;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    .joystick-housing::before,
    .joystick-housing::after {
      content: "";
      position: absolute;
      pointer-events: none;
      background: rgba(182, 192, 204, 0.14);
    }
    .joystick-housing::before {
      width: 82%;
      height: 1px;
    }
    .joystick-housing::after {
      width: 1px;
      height: 82%;
    }
    .joystick-ring-guide {
      position: absolute;
      width: 88px;
      height: 88px;
      border: 1px dashed rgba(223, 192, 142, 0.28);
      border-radius: 50%;
      pointer-events: none;
    }
    .joystick-cardinal {
      position: absolute;
      font-size: 0.48rem;
      font-weight: 800;
      color: #7d8998;
      font-family: "Consolas", monospace;
      pointer-events: none;
      line-height: 1;
    }
    .joystick-cardinal.n { top: 5px; left: 50%; transform: translateX(-50%); color: #dfc08e; }
    .joystick-cardinal.s { bottom: 5px; left: 50%; transform: translateX(-50%); }
    .joystick-cardinal.w { left: 6px; top: 50%; transform: translateY(-50%); }
    .joystick-cardinal.e { right: 6px; top: 50%; transform: translateY(-50%); }
    .joystick-knob {
      width: 56px;
      height: 56px;
      min-width: 56px;
      min-height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #525d6e 0%, #363e4a 58%, #232830 100%);
      border-top: 2px solid #c48f5a;
      border-left: 2px solid #738296;
      border-right: 2px solid #1b2026;
      border-bottom: 3px solid #12151a;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.85), inset 0 1px 2px rgba(255, 255, 255, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      pointer-events: none;
      transition: transform 0.05s linear;
      color: #dfc08e;
      font-size: 0.52rem;
      font-weight: 800;
      font-family: "Consolas", "Noto Sans SC", monospace;
      letter-spacing: 0.02em;
    }
    .joystick-housing.active .joystick-knob {
      transition: none;
      background: radial-gradient(circle at 38% 35%, #667387 0%, #424c5a 58%, #2b313b 100%);
      border-top-color: #f59e0b;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.9), 0 0 12px rgba(217, 119, 6, 0.45);
      color: #fde68a;
    }
    .joystick-knob-core {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(223, 192, 142, 0.65);
      background: rgba(20, 24, 30, 0.65);
      margin-bottom: 1px;
    }

    /* 中央 1:1 铸钢防盾 360° 全向战术沙盘取景框 */
    .stage-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .battlefield-bezel {
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #3a424f 0%, #242932 100%);
      border-top: 2px solid #5c6878;
      border-left: 2px solid #4c5663;
      border-right: 3px solid #171b20;
      border-bottom: 4px solid #111418;
      border-radius: 3px;
      padding: 5px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }
    #battle-canvas {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      background: #1d2128;
      border: 2px solid #13161b;
      box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.85);
      display: block;
      touch-action: none;
    }

    /* 防线失守 / 战役结算克虏伯钢印弹窗 */
    .battle-modal-overlay {
      position: absolute;
      inset: 5px;
      background: rgba(18, 21, 26, 0.90);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 30;
      text-align: center;
      border: 1px solid #4a5462;
    }
    .battle-modal-overlay.visible {
      display: flex;
    }
    .battle-modal-card {
      width: 100%;
      max-width: 280px;
      background: linear-gradient(180deg, #323944 0%, #222730 100%);
      border-top: 2px solid #c48f5a;
      border-left: 2px solid #566170;
      border-right: 2px solid #181c21;
      border-bottom: 4px solid #111418;
      padding: 14px 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .battle-modal-title {
      font-size: 0.96rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #dfc08e;
    }
    .battle-modal-desc {
      font-size: 0.7rem;
      color: #b6c0cc;
      line-height: 1.45;
    }
    .battle-modal-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }
    .battle-modal-btn {
      min-height: 44px;
      width: 100%;
      padding: 0 12px;
      background: linear-gradient(180deg, #8c633b 0%, #6b4b2b 55%, #543a20 100%);
      color: #efe5da;
      border-top: 2px solid #b88758;
      border-left: 2px solid #9c7046;
      border-right: 2px solid #362514;
      border-bottom: 3px solid #24180d;
      border-radius: 2px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .battle-modal-btn.secondary {
      background: linear-gradient(180deg, #3c4450 0%, #2b313a 100%);
      color: #c5ced9;
      border-color: #5b6778 #1a1e24 #13161b #4b5563;
    }

    /* 右翼：陀螺稳定火控舱（中央开火键 + 两侧炮塔左/右旋按钮） */
    .fire-housing {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      margin: auto 0;
      width: 100%;
    }
    .fortify-btn {
      width: 100%;
      min-height: 44px;
      padding: 0 6px;
      background: linear-gradient(180deg, #3c4450 0%, #2b313a 100%);
      color: #dfc08e;
      border-top: 1.5px solid #5b6778;
      border-left: 1.5px solid #4b5563;
      border-right: 1.5px solid #1a1e24;
      border-bottom: 3px solid #13161b;
      border-radius: 2px;
      font-size: 0.66rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.6);
    }
    .fortify-btn:active {
      transform: translateY(1px);
    }

    /* 开火键双翼炮塔旋转三联总成 */
    .turret-fire-cluster {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      width: 100%;
    }
    .turret-turn-btn {
      min-width: 44px;
      width: 44px;
      min-height: 68px;
      height: 68px;
      background: linear-gradient(180deg, #3a424f 0%, #262c35 100%);
      color: #dfc08e;
      border-top: 1.5px solid #5b6778;
      border-left: 1.5px solid #4b5563;
      border-right: 1.5px solid #1a1e24;
      border-bottom: 3px solid #13161b;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.72);
      font-family: "Consolas", "Noto Sans SC", monospace;
      font-size: 0.56rem;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .turret-turn-btn svg {
      width: 18px;
      height: 18px;
    }
    .turret-turn-btn:active,
    .turret-turn-btn.pressed {
      background: linear-gradient(180deg, #4b5668 0%, #343c48 100%);
      color: #f5e2c8;
      border-top-color: #c48f5a;
      transform: translateY(1px);
    }

    .fire-plunger {
      width: 78px;
      height: 78px;
      min-width: 68px;
      min-height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #9c6f44 0%, #75512f 55%, #52371e 100%);
      color: #f0e4d6;
      border: 3.5px solid #3a424f;
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.82),
        inset 0 2px 3px rgba(255, 255, 255, 0.28),
        inset 0 -4px 6px rgba(0, 0, 0, 0.68);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      touch-action: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.88);
      flex-shrink: 0;
    }
    .fire-plunger strong {
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .fire-plunger span {
      font-size: 0.5rem;
      font-family: "Consolas", monospace;
      color: #e3c598;
      white-space: nowrap;
    }
    .fire-plunger:active,
    .fire-plunger.pressed {
      transform: scale(0.96);
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.85),
        inset 0 3px 6px rgba(0, 0, 0, 0.75);
    }

    @media (max-width: 880px) {
      #app { grid-template-columns: 184px 1fr 184px; gap: 6px; padding: 6px; }
      .dpad-housing { width: 140px; height: 140px; }
      .fire-plunger { width: 72px; height: 72px; }
    }

    /* 紧凑横屏 (667x375) 专项适配：保证中央战场充裕 1:1 正方形空间且所有按键 >= 44x44px */
    @media (max-width: 740px) {
      #app { grid-template-columns: 158px 1fr 158px; gap: 4px; padding: 4px; }
      .t3-wing { padding: 5px; gap: 3px; }
      .brand-stamp img { width: 22px; height: 22px; }
      .brand-stamp h1 { font-size: 0.72rem; }
      .wing-stat-box { padding: 4px 5px; gap: 2px; }
      .wing-stat-row { font-size: 0.58rem; }
      .dpad-housing { width: 138px; height: 138px; gap: 1px; padding: 1px; }
      .turret-fire-cluster { gap: 2px; }
      .turret-turn-btn { width: 44px; min-width: 44px; height: 56px; min-height: 56px; font-size: 0.52rem; }
      .fire-plunger { width: 54px; height: 54px; min-width: 52px; min-height: 52px; border-width: 2.5px; }
      .fire-plunger strong { font-size: 0.62rem; }
      .fire-plunger span { font-size: 0.44rem; }
      .fortify-btn { font-size: 0.6rem; padding: 0 4px; }
    }

    /* 机械设置：紧凑拇指热区模式 (nx-touch-compact) */
    body.nx-touch-compact .dpad-housing {
      transform: scale(0.94);
      margin-bottom: 4px;
    }
    body.nx-touch-compact .fire-housing {
      gap: 4px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 左翼：重型发蓝炮钢遥测槽与【以车体为参照】的差速转向方向盘 -->
    <aside class="t3-wing tb-rivets">
      <div>
        <div class="brand-stamp">
          <img src="../assets/tank-battle/icon.svg" alt="Tank Battle" />
          <div>
            <h1>钢铁防线</h1>
            <p id="hud-lan">360° 陀螺火控协同</p>
          </div>
        </div>
        <div class="wing-stat-box" style="margin-top:4px;">
          <div class="wing-stat-row"><span>当前防区</span><strong class="brass" id="hud-stage">第 1 关</strong></div>
          <div class="wing-stat-row"><span>敌方装甲</span><strong id="hud-enemies">14 辆</strong></div>
          <div class="wing-stat-row"><span>军械硬币</span><strong class="brass" id="hud-coins">500</strong></div>
          <div class="wing-stat-row"><span>车体/炮塔角</span><strong id="hud-angles">0° / 0°</strong></div>
        </div>
      </div>

      <!-- 全向液压车体操纵摇杆 (简化单拇指 360° 矢量推进与转向) -->
      <div>
        <div class="joystick-housing" id="hull-joystick" role="slider" aria-label="全向车体移动摇杆" title="拖动摇杆控制车体 360° 移动方向 (或使用 WASD)">
          <div class="joystick-ring-guide"></div>
          <span class="joystick-cardinal n">N</span>
          <span class="joystick-cardinal s">S</span>
          <span class="joystick-cardinal w">W</span>
          <span class="joystick-cardinal e">E</span>
          <div class="joystick-knob" id="hull-joystick-knob">
            <div class="joystick-knob-core"></div>
            <span>MOVE</span>
          </div>
        </div>
        <div style="font-size:0.54rem;text-align:center;font-family:Consolas,monospace;color:#8592a1;margin-top:2px;white-space:nowrap;">
          全向车体移动摇杆 (或 WASD)
        </div>
      </div>
    </aside>

    <!-- 中央：360° 全向异形工事战术沙盘与主战场画布 (强制 1:1 正方形) -->
    <main class="stage-wrap" id="stage-wrap">
      <div class="battlefield-bezel tb-rivets" id="battlefield-bezel">
        <canvas id="battle-canvas" width="624" height="624"></canvas>
        <!-- 防线失守 / 战役结算模态框 -->
        <div class="battle-modal-overlay" id="battle-result-modal">
          <div class="battle-modal-card tb-rivets">
            <div class="battle-modal-title" id="modal-result-title">防线失守 · 作战失利</div>
            <div class="battle-modal-desc" id="modal-result-desc">统帅鹰标地堡遭到敌军高初速穿甲弹击穿，当前战区防御宣告失守。</div>
            <div class="battle-modal-actions">
              <button class="battle-modal-btn" id="btn-modal-redeploy">重新部署防线</button>
              <button class="battle-modal-btn secondary" id="btn-modal-armory">返回重装军械库</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 右翼：开火键双翼独立炮塔转向按钮 (↺ / FIRE / ↻)、异形钢障加固与装甲状态槽 -->
    <aside class="t3-wing tb-rivets" style="padding-top:46px;">
      <div class="fire-housing">
        <button class="fortify-btn" id="btn-fortify-base" aria-label="加固核心地堡防线" title="消耗 50 军械币升级基地防爆跳弹钢障">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="8 11 12 15 16 11"/></svg>
          <span>-50</span>
        </button>

        <!-- 炮塔左旋 / 主炮击发 / 炮塔右旋 纯符号化操控集群 -->
        <div class="turret-fire-cluster">
          <button class="turret-turn-btn" id="btn-turret-ccw" aria-label="炮塔左旋" title="逆时针旋转炮塔 (Q / J)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>

          <button class="fire-plunger" id="btn-fire" aria-label="主炮击发" title="高初速尾翼稳定脱壳穿甲弹击发 (空格 / K)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="9"/><line x1="12" y1="2" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="2" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="22" y2="12"/></svg>
            <span id="hud-ammo-vel">980px/s</span>
          </button>

          <button class="turret-turn-btn" id="btn-turret-cw" aria-label="炮塔右旋" title="顺时针旋转炮塔 (E / L)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
            </svg>
          </button>
        </div>

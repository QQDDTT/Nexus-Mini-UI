<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <title>微界演化 · MICRO-GENESIS | Nexus-Mini</title>
  <link rel="icon" type="image/svg+xml" href="../assets/micro-genesis/icon.svg" />
  <style>
    :root {
      --void: #030712;
      --panel: rgba(13, 20, 36, 0.84);
      --border: rgba(0, 240, 255, 0.24);
      --cyan: #00f0ff;
      --gold: #fbbf24;
      --red: #ef4444;
      --green: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100vw; height: 100dvh; overflow: hidden; overscroll-behavior: none;
      background: var(--void); color: var(--text);
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #petri-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      touch-action: none;
    }
    .top-hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: 72px;
      z-index: 100;
      display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;
      pointer-events: none;
    }
    .hud-pill {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex; align-items: center; gap: 5px;
      font-size: 0.74rem;
      white-space: nowrap;
    }
    .hud-val { font-weight: 800; color: var(--cyan); }
    .hud-val.gold { color: var(--gold); }
    .bottom-bar {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      z-index: 120;
      display: flex; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .btn-row { pointer-events: auto; display: flex; gap: 8px; align-items: center; }
    .bio-btn {
      width: 52px; height: 52px;
      min-width: 52px; min-height: 52px;
      padding: 0;
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1.5px solid var(--border);
      color: var(--text);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .bio-btn:active { transform: scale(0.92); }
    .bio-btn.primary {
      width: 68px; height: 68px;
      min-width: 68px; min-height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00f0ff 0%, #0284c7 100%);
      border: 2px solid #67e8f9;
      color: #030712;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.42);
    }
    .bio-btn.gold { border-color: rgba(251, 191, 36, 0.55); color: var(--gold); }
    .bio-btn img { width: 30px; height: 30px; object-fit: contain; pointer-events: none; }
    .bio-btn.primary img { width: 34px; height: 34px; }
  </style>
</head>
<body>
  <canvas id="petri-canvas"></canvas>

  <!-- 顶部生态生物量与基因序列仪表盘 -->
  <header class="top-hud">
    <div class="hud-pill">
      <img src="../assets/micro-genesis/icon.svg" alt="" width="18" height="18" />
      <span style="font-weight:800;">微界演化</span>
      <span class="hud-val" id="hud-biomass">生物量 62%</span>
    </div>
    <div class="hud-pill">
      <span>ATP</span>
      <span class="hud-val" id="hud-atp">120</span>
    </div>
    <div class="hud-pill">
      <span>DNA</span>
      <span class="hud-val gold" id="hud-dna">1,500</span>
    </div>
    <div class="hud-pill">
      <span>结晶</span>
      <span class="hud-val gold" id="hud-helix">80</span>
    </div>
    <div class="hud-pill">
      <span id="hud-lan" style="color:var(--green);">观测雷达与生态仇恨运行中</span>
    </div>
  </header>

  <!-- 底部纯图标按钮：左下体节切换 + 信息素切换 + 观测视距透镜，右下骨颚突刺 + 有丝分裂 -->
  <div class="bottom-bar">
    <div class="btn-row">
      <button class="bio-btn gold" id="btn-cycle-soma" aria-label="切换细胞体节" title="切换细胞体节">
        <img id="soma-btn-ico" src="../assets/micro-genesis/sprites/soma-diploid.svg" alt="Soma" />
      </button>
      <button class="bio-btn" id="btn-pheromone" aria-label="切换信息素指令" title="切换信息素指令" style="border-color:rgba(239,68,68,0.75);">
        <img id="pheromone-ico" src="../assets/micro-genesis/sprites/organ-cnidocyte.svg" alt="Pheromone" />
      </button>
      <button class="bio-btn" id="btn-toggle-fov" aria-label="切换观测与仇恨雷达" title="切换观测与仇恨雷达" style="border-color:rgba(0,240,255,0.65);color:var(--cyan);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="btn-row">
      <button class="bio-btn" id="btn-dash-bite" aria-label="骨颚突刺撕咬" title="骨颚突刺撕咬" style="border-color:rgba(239,68,68,0.75);box-shadow:0 0 14px rgba(239,68,68,0.28);">
        <img src="../assets/micro-genesis/sprites/organ-mandible.svg" alt="Dash Bite" />
      </button>
      <button class="bio-btn primary" id="btn-mitosis" aria-label="有丝分裂增殖" title="有丝分裂增殖">
        <img src="../assets/micro-genesis/sprites/organ-chloroplast.svg" alt="Mitosis" />
      </button>
    </div>
  </div>

  <script src="../shared/nexus-sdk.js?v=3.3"></script>
  <script>
    (() => {
      NexusSDK.initShellUI({ gameId: 'micro-genesis', gameTitle: '微界演化' });

      const store = NexusSDK.createGameStorage('NEXUS_MINI_GENESIS_', (isAdmin) => ({
        currency: { genePoints: isAdmin ? 999999 : 1500, helixShards: isAdmin ? 9999 : 80 },
        arenaTier: isAdmin ? '寒武纪霸主 (Tier VI)' : '原生代新星 (Tier II)',
        winStreak: isAdmin ? 88 : 3,
        soma: 'diploid',
        organs: ['flagella', 'mandible', 'chloroplast', 'chitin', 'cnidocyte']
      }));
      let saveData = store.load();

      const sprites = NexusSDK.loadSprites('micro-genesis', {
        prokaryote: 'soma-prokaryote.svg',
        diploid: 'soma-diploid.svg',
        titan: 'soma-titan.svg',
        flagella: 'organ-flagella.svg',
        mandible: 'organ-mandible.svg',
        chitin: 'organ-chitin.svg',
        cnidocyte: 'organ-cnidocyte.svg',
        chloroplast: 'organ-chloroplast.svg',
        algae: 'env-algae.svg',
        vent: 'env-vent.svg',
        planarian: 'boss-planarian.svg',
        anomalocaris: 'boss-anomalocaris.svg'
      });

      const canvas = document.getElementById('petri-canvas');
      const ctx = canvas.getContext('2d');
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      // Expanded Petri-Dish World Dimensions (Screen displays local viewport centered on Alpha)
      const WORLD_W = 2800;
      const WORLD_H = 1800;

      let atp = 150;
      let currentSoma = saveData.soma || 'diploid';
      let activeOrgans = new Set(saveData.organs || ['flagella', 'mandible', 'chloroplast', 'chitin', 'cnidocyte']);
      let pheromoneMode = 'hunt'; // 'hunt' | 'forage' | 'guard'
      let showFovOverlay = true;  // Observation & Hatred Radar visualization toggle
      let tick = 0;
      let nextEntityId = 1;

      // Juice & Kinesthetics State
      let hitStopFrames = 0;
      let screenTrauma = 0;

      // Visual FX Pools
      let shockwaves = [];
      let particles = [];
      let slashArcs = [];
      let lightningArcs = [];
      let vortices = [];
      let mitosisAnims = [];
      let marineSnow = [];

      for (let i = 0; i < 130; i++) {
        marineSnow.push({
          x: Math.random() * WORLD_W,
          y: Math.random() * WORLD_H,
          r: 0.8 + Math.random() * 1.8,
          alpha: 0.12 + Math.random() * 0.25,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -0.15 - Math.random() * 0.25
        });
      }

      // Player Alpha Specimen (Positioned at World Center; Camera locks Alpha to Screen Center)
      const alpha = {
        id: 'alpha',
        x: WORLD_W * 0.5,
        y: WORLD_H * 0.5,
        vx: 0,
        vy: 0,
        tx: WORLD_W * 0.5,
        ty: WORLD_H * 0.5,
        angle: 0,
        hp: 260,
        maxHp: 260,
        size: 54,
        mass: 3.4,
        fov: 215,
        scaleX: 1,
        scaleY: 1,
        flash: 0,
        jawSnap: 0,
        dashTimer: 0,
        ventBoost: 0
      };

      // Camera State (Locked to Alpha so Alpha is always centered on screen)
      let camX = alpha.x;
      let camY = alpha.y;
      let isPointerDown = false;
      let pointerOffsetX = 0;
      let pointerOffsetY = 0;

      let friendlyCells = [];
      let rivalCells = [];
      let nutrients = [];
      let vents = [
        { x: WORLD_W * 0.44, y: WORLD_H * 0.46, pulse: 0 },
        { x: WORLD_W * 0.58, y: WORLD_H * 0.55, pulse: Math.PI },
        { x: WORLD_W * 0.22, y: WORLD_H * 0.28, pulse: 1.1 },
        { x: WORLD_W * 0.78, y: WORLD_H * 0.26, pulse: 2.3 },
        { x: WORLD_W * 0.25, y: WORLD_H * 0.74, pulse: 3.7 },
        { x: WORLD_W * 0.76, y: WORLD_H * 0.75, pulse: 4.5 },
        { x: WORLD_W * 0.50, y: WORLD_H * 0.20, pulse: 0.8 },
        { x: WORLD_W * 0.50, y: WORLD_H * 0.82, pulse: 5.2 }
      ];
      let toxinDarts = [];

      const RIVAL_ZONES = [
        // Inner ring territories (near player's initial local viewport edge)
        { x: WORLD_W * 0.58, y: WORLD_H * 0.42, isBoss: false },
        { x: WORLD_W * 0.41, y: WORLD_H * 0.60, isBoss: false },
        { x: WORLD_W * 0.61, y: WORLD_H * 0.58, isBoss: false },
        // Mid & Outer ring territories across the 2800x1800 world
        { x: WORLD_W * 0.32, y: WORLD_H * 0.34, isBoss: false },
        { x: WORLD_W * 0.70, y: WORLD_H * 0.32, isBoss: false },
        { x: WORLD_W * 0.30, y: WORLD_H * 0.70, isBoss: false },
        { x: WORLD_W * 0.72, y: WORLD_H * 0.68, isBoss: false },
        { x: WORLD_W * 0.18, y: WORLD_H * 0.50, isBoss: false },
        { x: WORLD_W * 0.84, y: WORLD_H * 0.50, isBoss: false },
        { x: WORLD_W * 0.50, y: WORLD_H * 0.24, isBoss: false },
        // Deep-water Ancient Boss Lairs
        { x: WORLD_W * 0.66, y: WORLD_H * 0.48, isBoss: true },
        { x: WORLD_W * 0.26, y: WORLD_H * 0.46, isBoss: true }
      ];

      function initEcosystem() {
        friendlyCells = [];
        rivalCells = [];
        nutrients = [];
        // Distribute initial friendly colony around Alpha in world space (no clumping)
        for (let i = 0; i < 6; i++) {
          const ang = (Math.PI * 2 * i) / 6;
          const dist = 105 + (i % 2) * 45;
          spawnFriendlyCell(
            Math.max(80, Math.min(WORLD_W - 80, alpha.x + Math.cos(ang) * dist)),
            Math.max(80, Math.min(WORLD_H - 80, alpha.y + Math.sin(ang) * dist)),
            false
          );
        }
        // Spawn Rival Cells & Ancient Bosses in their distributed world territories
        RIVAL_ZONES.forEach((z) => {
          spawnRivalCell(z.isBoss, z);
        });
        // Seed nutrients near central starting basin and across the entire world
        for (let i = 0; i < 14; i++) {
          const ang = (Math.PI * 2 * i) / 14;
          const r = 130 + Math.random() * 260;
          spawnNutrient(alpha.x + Math.cos(ang) * r, alpha.y + Math.sin(ang) * r, false);
        }
        for (let i = 0; i < 65; i++) spawnNutrient();
        updateHud();
      }

      function getSomaSpecs(somaKey) {
        if (somaKey === 'prokaryote') return { hp: 65, size: 30, mass: 1.1, speed: 1.25, fov: 175 };
        if (somaKey === 'titan') return { hp: 200, size: 50, mass: 3.0, speed: 0.84, fov: 155 };
        return { hp: 110, size: 38, mass: 1.8, speed: 1.0, fov: 165 };
      }

      function spawnFriendlyCell(x, y, withMitosisFX = true) {
        const spec = getSomaSpecs(currentSoma);
        const slotIdx = friendlyCells.length;
        const angle = (Math.PI * 2 * (slotIdx + 1)) / 7 + (Math.random() - 0.5) * 0.3;
        if (withMitosisFX) {
          mitosisAnims.push({ x, y, angle, soma: currentSoma, size: spec.size, progress: 0 });
          spawnShockwave(x, y, spec.size * 1.3, '#00f0ff', 2.5);
          spawnParticles(x, y, '#00f0ff', 10, 2.8, 3.5);
        }
        friendlyCells.push({
          id: 'fc_' + (nextEntityId++),
          slotIdx,
          x: x + Math.cos(angle) * 18,
          y: y + Math.sin(angle) * 18,
          vx: Math.cos(angle) * 3.8,
          vy: Math.sin(angle) * 3.8,
          angle,
          wanderAngle: angle,
          patrolAnchor: {
            x: Math.max(120, Math.min(WORLD_W - 120, alpha.x + (Math.random() - 0.5) * 720)),
            y: Math.max(120, Math.min(WORLD_H - 120, alpha.y + (Math.random() - 0.5) * 520))
          },
          soma: currentSoma,
          hp: spec.hp,
          maxHp: spec.hp,
          size: spec.size,
          mass: spec.mass,
          fov: spec.fov,
          speedMult: spec.speed,
          scaleX: 1.35,
          scaleY: 0.72,
          flash: 6,
          jawSnap: 0,
          shootCd: 45 + Math.floor(Math.random() * 25),
          hitCd: 0,
          hatredMap: new Map(), // enemyId -> threat value
          aggroTarget: null,    // Currently locked rival entity
          forageTarget: null
        });
      }

      function spawnRivalCell(isBoss, homeOverride) {
        const types = isBoss ? ['planarian', 'anomalocaris'] : ['prokaryote', 'diploid', 'titan'];
        const type = types[Math.floor(Math.random() * types.length)];
        const hp = isBoss ? 380 : (type === 'titan' ? 145 : 88);
        const sz = isBoss ? 66 : (type === 'titan' ? 46 : 36);
        const mass = isBoss ? 5.2 : (type === 'titan' ? 2.6 : 1.5);
        const fov = isBoss ? 225 : (type === 'prokaryote' ? 180 : 160);
        const hx = homeOverride ? homeOverride.x : (160 + Math.random() * (WORLD_W - 320));
        const hy = homeOverride ? homeOverride.y : (140 + Math.random() * (WORLD_H - 280));
        const ang = Math.random() * Math.PI * 2;
        rivalCells.push({
          id: 'rv_' + (nextEntityId++),
          x: hx + (Math.random() - 0.5) * 40,
          y: hy + (Math.random() - 0.5) * 40,
          homeX: hx,
          homeY: hy,
          vx: Math.cos(ang) * 1.4,
          vy: Math.sin(ang) * 1.4,
          angle: ang,
          wanderAngle: ang,
          type,
          isBoss,
          hp,
          maxHp: hp,
          size: sz,
          mass,
          fov,
          scaleX: 1.25,
          scaleY: 0.8,
          flash: 0,
          poisonTimer: 0,
          hitCd: 0,
          hatredMap: new Map(), // friendlyId -> threat value
          aggroTarget: null     // Locked target only when inside FOV or provoked
        });
      }

      function spawnNutrient(x, y, isMeat = false) {
        if (nutrients.length >= 85) return;
        nutrients.push({
          x: x ?? (90 + Math.random() * (WORLD_W - 180)),
          y: y ?? (90 + Math.random() * (WORLD_H - 180)),
          vx: isMeat ? (Math.random() - 0.5) * 3.8 : (Math.random() - 0.5) * 0.4,
          vy: isMeat ? (Math.random() - 0.5) * 3.8 : (Math.random() - 0.5) * 0.4,
          r: isMeat ? 14 : 16,
          rot: Math.random() * Math.PI * 2,
          isMeat,
          scale: 1
        });
      }

      // Hatred Registration Helper
      function addHatred(observer, target, amount) {
        if (!observer || !observer.hatredMap || !target || !target.id) return;
        const prev = observer.hatredMap.get(target.id) || 0;
        observer.hatredMap.set(target.id, Math.min(240, prev + amount));
      }

      // Evaluate Observation Cone + Distance + Crowding Penalty to pick best non-clumping target
      function updateObservationAndHatred(observer, candidates, attackerCountMap, isFriendlyObserver) {
        if (!observer.hatredMap) observer.hatredMap = new Map();

        // 1. Decay existing hatred over time & drop targets that left leash radius
        const leashDist = (observer.fov || 170) * 1.65;
        for (const [tid, val] of observer.hatredMap.entries()) {
          const cand = candidates.find((c) => c.id === tid && c.hp > 0);
          if (!cand || Math.hypot(cand.x - observer.x, cand.y - observer.y) > leashDist) {
            observer.hatredMap.delete(tid);
          } else {
            const nextVal = val * 0.982 - 0.12;
            if (nextVal <= 1) observer.hatredMap.delete(tid);
            else observer.hatredMap.set(tid, nextVal);
          }
        }

        // 2. Scan Observation Sensory Radius & Forward Vision Cone (±105°)
        const fov = observer.fov || 170;
        const forwardAngle = observer.angle - Math.PI / 2;
        for (const cand of candidates) {
          if (cand.hp <= 0) continue;
          const dx = cand.x - observer.x;
          const dy = cand.y - observer.y;
          const dist = Math.hypot(dx, dy);
          if (dist <= fov) {
            const dirToTarget = Math.atan2(dy, dx);
            const angleDiff = Math.abs(Math.atan2(Math.sin(dirToTarget - forwardAngle), Math.cos(dirToTarget - forwardAngle)));
            // Forward 210° cone has 100% acuity; rear peripheral sense within 48% radius
            const inSight = angleDiff <= 1.85 || dist <= fov * 0.48;
            if (inSight) {
              const proximityGain = (1 - dist / fov) * 2.4;
              const bossBonus = cand.isBoss ? 0.8 : 0;
              addHatred(observer, cand, proximityGain + bossBonus);
            }
          }
        }

        // 3. Select highest-utility target with Anti-Clustering Crowding Penalty
        // Max 2 attackers per single target so the whole swarm NEVER piles onto 1 cell!
        let bestTarget = null;
        let bestScore = 10; // Minimum hatred threshold to engage
        for (const [tid, rawThreat] of observer.hatredMap.entries()) {
          const cand = candidates.find((c) => c.id === tid && c.hp > 0);
          if (!cand) continue;
          const currentAttackers = attackerCountMap.get(cand.id) || 0;
          const maxAllowed = cand.isBoss ? 3 : 2;
          // Heavy crowding penalty if already swarmed by >= maxAllowed allies
          const crowdPenalty = currentAttackers >= maxAllowed ? 0.18 : (1 / (1 + currentAttackers * 0.55));
          const dist = Math.hypot(cand.x - observer.x, cand.y - observer.y);
          const distFactor = Math.max(0.35, 1 - dist / (fov * 1.6));
          const score = rawThreat * crowdPenalty * distFactor;
          if (score > bestScore) {
            bestScore = score;
            bestTarget = cand;
          }
        }

        observer.aggroTarget = bestTarget;
        if (bestTarget) {
          attackerCountMap.set(bestTarget.id, (attackerCountMap.get(bestTarget.id) || 0) + 1);
        }
      }

      // Animation Spawners
      function spawnShockwave(x, y, maxR, color, lineWidth = 2.5) {
        shockwaves.push({ x, y, r: 6, maxR, color, alpha: 0.95, lineWidth });
      }

      function spawnParticles(x, y, color, count = 8, speed = 3.5, size = 3.5) {
        for (let i = 0; i < count; i++) {
          const a = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
          const sp = speed * (0.5 + Math.random() * 0.8);
          particles.push({
            x, y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            r: size * (0.65 + Math.random() * 0.6),
            color,
            alpha: 1,
            decay: 0.028 + Math.random() * 0.02
          });
        }
      }

      function spawnBiteSlash(x, y, angle, radius, color = '#ef4444') {
        slashArcs.push({ x, y, angle, r: radius, alpha: 1.0, color });
      }

      function spawnDeflectArc(x1, y1, x2, y2, color = '#fbbf24') {
        lightningArcs.push({ x1, y1, x2, y2, color, life: 8 });
      }

      // Collision Physics Engine + Hatred Provocation on Impact
      function resolvePairCollision(a, b, mode) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 0.001;
        const rA = (a.size || 40) * 0.46;
        const rB = (b.size || 40) * 0.46;
        const minDist = rA + rB;
        if (dist >= minDist) return false;

        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = minDist - dist;
        const totalMass = (a.mass || 1.5) + (b.mass || 1.5);

        a.x -= nx * overlap * ((b.mass || 1.5) / totalMass);
        a.y -= ny * overlap * ((b.mass || 1.5) / totalMass);
        b.x += nx * overlap * ((a.mass || 1.5) / totalMass);
        b.y += ny * overlap * ((a.mass || 1.5) / totalMass);

        const cx = a.x + nx * rA;
        const cy = a.y + ny * rA;

        if (mode === 'flock') {
          const push = 1.45;
          a.vx -= nx * push * 0.55;
          a.vy -= ny * push * 0.55;
          b.vx += nx * push * 0.55;
          b.vy += ny * push * 0.55;
          a.scaleX = 1.14; a.scaleY = 0.88;
          b.scaleX = 1.14; b.scaleY = 0.88;
          return true;
        }

        if (mode === 'combat') {
          const knock = a === alpha && alpha.dashTimer > 0 ? 9.5 : 5.4;
          a.vx = -nx * knock * ((b.mass || 1.5) / totalMass);
          a.vy = -ny * knock * ((b.mass || 1.5) / totalMass);
          b.vx = nx * knock * ((a.mass || 1.5) / totalMass) * 1.35;
          b.vy = ny * knock * ((a.mass || 1.5) / totalMass) * 1.35;

          a.scaleX = 1.32; a.scaleY = 0.72;
          b.scaleX = 0.70; b.scaleY = 1.36;
          a.jawSnap = 10;

          const hasMandible = activeOrgans.has('mandible');
          const hasChitin = activeOrgans.has('chitin');
          const dashMult = (a === alpha && alpha.dashTimer > 0) ? 2.4 : 1.0;
          const biteDmg = (a === alpha ? 16 : 11) * (hasMandible ? 1.65 : 1.0) * dashMult;
          const enemyDmg = (b.isBoss ? 14 : 7) * (hasChitin ? 0.52 : 1.0);

          b.hp -= biteDmg;
          b.flash = 6;
          // Immediate Hatred Spike upon taking bite damage!
          addHatred(b, a, biteDmg * 3.2);
          addHatred(a, b, 35);

          if (a !== alpha) {
            a.hp -= enemyDmg;
            a.flash = 4;
          } else {
            screenTrauma = Math.min(1.0, screenTrauma + (b.isBoss ? 0.45 : 0.25));
          }

          if (a === alpha && (alpha.dashTimer > 0 || b.isBoss)) {
            hitStopFrames = 2;
          }

          const impactAngle = Math.atan2(ny, nx);
          spawnBiteSlash(cx, cy, impactAngle, rB * 0.95, '#ef4444');
          spawnParticles(cx, cy, '#ef4444', a === alpha ? 10 : 6, 4.2, 3.8);

          if (hasChitin || b.type === 'titan' || b.isBoss) {
            spawnShockwave(cx, cy, 34, '#fbbf24', 2.2);
            spawnDeflectArc(a.x, a.y, b.x, b.y, '#fbbf24');
            spawnParticles(cx, cy, '#fbbf24', 5, 4.8, 2.8);
            NexusSDK.audio.hit();
          } else {
            NexusSDK.audio.shoot();
          }
          return true;
        }
        return false;
      }

      function triggerAlphaDashBite() {
        if (atp < 15) return;
        atp -= 15;
        alpha.dashTimer = 16;
        alpha.jawSnap = 14;
        alpha.scaleX = 0.68;
        alpha.scaleY = 1.42;

        let ang = alpha.angle - Math.PI / 2;
        if (rivalCells.length > 0) {
          let best = rivalCells[0];
          let minD = Math.hypot(best.x - alpha.x, best.y - alpha.y);
          for (const rv of rivalCells) {
            const d = Math.hypot(rv.x - alpha.x, rv.y - alpha.y);
            if (d < minD) { minD = d; best = rv; }
          }
          if (minD <= alpha.fov * 1.35) {
            ang = Math.atan2(best.y - alpha.y, best.x - alpha.x);
            alpha.angle = ang + Math.PI / 2;
          }
        }
        alpha.vx = Math.cos(ang) * 12.5;
        alpha.vy = Math.sin(ang) * 12.5;
        alpha.tx = alpha.x + Math.cos(ang) * 160;
        alpha.ty = alpha.y + Math.sin(ang) * 160;

        spawnShockwave(alpha.x - Math.cos(ang) * 22, alpha.y - Math.sin(ang) * 22, 42, '#00f0ff', 2.8);
        spawnParticles(alpha.x - Math.cos(ang) * 24, alpha.y - Math.sin(ang) * 24, '#00f0ff', 12, 4.5, 3.5);
        spawnBiteSlash(alpha.x + Math.cos(ang) * 28, alpha.y + Math.sin(ang) * 28, ang, 34, '#00f0ff');
        NexusSDK.audio.laser();
        updateHud();
      }

      canvas.addEventListener('pointerdown', (e) => {
        isPointerDown = true;
        pointerOffsetX = e.clientX - canvas.width / 2;
        pointerOffsetY = e.clientY - canvas.height / 2;
        alpha.tx = Math.max(60, Math.min(WORLD_W - 60, camX + pointerOffsetX));
        alpha.ty = Math.max(60, Math.min(WORLD_H - 60, camY + pointerOffsetY));
        spawnShockwave(alpha.tx, alpha.ty, 26, 'rgba(0, 240, 255, 0.5)', 1.5);
        NexusSDK.audio.tap();
      });
      canvas.addEventListener('pointermove', (e) => {
        if (isPointerDown || e.buttons > 0) {
          pointerOffsetX = e.clientX - canvas.width / 2;
          pointerOffsetY = e.clientY - canvas.height / 2;
          alpha.tx = Math.max(60, Math.min(WORLD_W - 60, camX + pointerOffsetX));
          alpha.ty = Math.max(60, Math.min(WORLD_H - 60, camY + pointerOffsetY));
        }
      });
      window.addEventListener('pointerup', () => {
        isPointerDown = false;
      });
      window.addEventListener('pointercancel', () => {
        isPointerDown = false;
      });

      const lan = NexusSDK.createLanSession('micro-genesis', store.getAuth().room);
      lan.onStatus((st) => {
        const el = document.getElementById('hud-lan');
        if (st.connected) {
          el.textContent = `LAN 1v1 (${st.peerLatencyMs}ms)`;
          el.style.color = '#00f0ff';
        } else {
          el.textContent = '观测雷达与生态仇恨运行中';
          el.style.color = '#10b981';
        }
      });
      lan.onReliable((msg) => {
        if (msg.type === 'rival_wave') {
          spawnRivalCell(false);
          spawnRivalCell(false);
        }
      });

      function updateHud() {
        const fBio = friendlyCells.length + 2;
        const rBio = Math.max(1, rivalCells.length);
        const pct = Math.round((fBio / (fBio + rBio)) * 100);
        document.getElementById('hud-biomass').textContent = `生物量 ${pct}%`;
        document.getElementById('hud-atp').textContent = Math.floor(atp);
        document.getElementById('hud-dna').textContent = (saveData.currency?.genePoints ?? 0).toLocaleString();
        document.getElementById('hud-helix').textContent = (saveData.currency?.helixShards ?? 0).toLocaleString();
      }

      // Anti-Clustering Spatial Dispersion Force (repels any organism from high-density local clusters)
      function computeAntiClusterForce(self, allEntities, desiredRadius = 115) {
        let rx = 0;
        let ry = 0;
        let neighborCount = 0;
        for (const other of allEntities) {
          if (other === self) continue;
          const dx = self.x - other.x;
          const dy = self.y - other.y;
          const d = Math.hypot(dx, dy) || 0.001;
          if (d < desiredRadius) {
            neighborCount++;
            const strength = Math.pow((desiredRadius - d) / desiredRadius, 1.5);
            rx += (dx / d) * strength;
            ry += (dy / d) * strength;
          }
        }
        // Extra dispersion multiplier if local density > 3 cells
        const crowdBoost = neighborCount >= 3 ? 2.1 : 1.15;
        return { fx: rx * crowdBoost, fy: ry * crowdBoost, neighborCount };
      }

      function step() {
        tick++;
        if (hitStopFrames > 0) {
          hitStopFrames--;
          return;
        }

        screenTrauma = Math.max(0, screenTrauma - 0.045);
        alpha.scaleX += (1 - alpha.scaleX) * 0.18;
        alpha.scaleY += (1 - alpha.scaleY) * 0.18;
        if (alpha.flash > 0) alpha.flash--;
        if (alpha.jawSnap > 0) alpha.jawSnap--;
        if (alpha.dashTimer > 0) alpha.dashTimer--;
        if (alpha.ventBoost > 0) alpha.ventBoost--;

        if (activeOrgans.has('chloroplast')) {
          atp = Math.min(300, atp + 0.09);
        }
        if (Math.random() < 0.05) spawnNutrient();

        // Hydrothermal Vents
        vents.forEach((v) => {
          v.pulse += 0.05;
          if (Math.sin(v.pulse) > 0.96 && Math.random() < 0.35) {
            spawnShockwave(v.x, v.y, 72, 'rgba(251, 191, 36, 0.55)', 2.0);
          }
          const dAlpha = Math.hypot(alpha.x - v.x, alpha.y - v.y);
          if (dAlpha < 46 && alpha.ventBoost <= 0) {
            alpha.ventBoost = 45;
            atp = Math.min(300, atp + 18);
            const pushAng = Math.atan2(alpha.y - v.x, alpha.x - v.x);
            alpha.vx += Math.cos(pushAng) * 5.5;
            alpha.vy += Math.sin(pushAng) * 5.5;
            alpha.scaleX = 0.78; alpha.scaleY = 1.28;
            spawnShockwave(v.x, v.y, 64, '#fbbf24', 2.6);
            spawnParticles(v.x, v.y, '#fbbf24', 8, 3.8, 3.2);
            NexusSDK.audio.pickup();
            updateHud();
          }
        });

        // Move Alpha Specimen
        if (isPointerDown && alpha.dashTimer <= 0) {
          alpha.tx = Math.max(60, Math.min(WORLD_W - 60, alpha.x + pointerOffsetX));
          alpha.ty = Math.max(60, Math.min(WORLD_H - 60, alpha.y + pointerOffsetY));
        }
        const dx = alpha.tx - alpha.x;
        const dy = alpha.ty - alpha.y;
        const dist = Math.hypot(dx, dy);
        const spdBoost = (activeOrgans.has('flagella') ? 1.4 : 1.0) * (alpha.ventBoost > 0 ? 1.35 : 1.0);
        if (dist > 6 && alpha.dashTimer <= 0) {
          const targetAng = Math.atan2(dy, dx);
          alpha.vx = alpha.vx * 0.84 + Math.cos(targetAng) * 0.72 * spdBoost;
          alpha.vy = alpha.vy * 0.84 + Math.sin(targetAng) * 0.72 * spdBoost;
          alpha.angle = Math.atan2(alpha.vy, alpha.vx) + Math.PI / 2;
        } else {
          alpha.vx *= 0.88;
          alpha.vy *= 0.88;
        }
        alpha.x = Math.max(60, Math.min(WORLD_W - 60, alpha.x + alpha.vx));
        alpha.y = Math.max(60, Math.min(WORLD_H - 60, alpha.y + alpha.vy));

        // Lock Camera Center strictly to Player-Controlled Alpha Character
        camX = alpha.x;
        camY = alpha.y;

        if (Math.hypot(alpha.vx, alpha.vy) > 2.2 && tick % 6 === 0) {
          const tailAng = alpha.angle + Math.PI / 2;
          vortices.push({
            x: alpha.x + Math.cos(tailAng) * 26,
            y: alpha.y + Math.sin(tailAng) * 26,
            r: 4, maxR: 20, alpha: 0.55
          });
        }

        // Phagocytosis Suction Funnel
        for (let i = nutrients.length - 1; i >= 0; i--) {
          const n = nutrients[i];
          n.rot += 0.03;
          n.x = Math.max(50, Math.min(WORLD_W - 50, n.x + n.vx));
          n.y = Math.max(50, Math.min(WORLD_H - 50, n.y + n.vy));
          n.vx *= 0.94;
          n.vy *= 0.94;

          let consumer = null;
          let minD = Math.hypot(alpha.x - n.x, alpha.y - n.y);
          if (minD < 58) {
            consumer = alpha;
          } else {
            for (const fc of friendlyCells) {
              const d = Math.hypot(fc.x - n.x, fc.y - n.y);
              if (d < 46 && d < minD) {
                minD = d;
                consumer = fc;
              }
            }
          }

          if (consumer) {
            n.x += (consumer.x - n.x) * 0.26;
            n.y += (consumer.y - n.y) * 0.26;
            n.scale = Math.max(0.25, minD / 56);

            if (minD < 22) {
              consumer.scaleX = 1.24;
              consumer.scaleY = 1.24;
              consumer.jawSnap = 7;
              const gain = n.isMeat ? 24 : 14;
              atp = Math.min(300, atp + gain);
              spawnShockwave(n.x, n.y, 28, n.isMeat ? '#fbbf24' : '#10b981', 2.0);
              spawnParticles(n.x, n.y, n.isMeat ? '#fbbf24' : '#10b981', 6, 2.6, 2.8);
              NexusSDK.audio.pop();
              nutrients.splice(i, 1);

              if (atp >= 105 && friendlyCells.length < 14) {
                atp -= 40;
                spawnFriendlyCell(consumer.x, consumer.y, true);
              }
              updateHud();
            }
          } else {
            n.scale = Math.min(1, n.scale + 0.08);
          }
        }

        // =====================================================================
        // OBSERVATION & HATRED SYSTEM + ANTI-CLUSTERING DISPERSION AI
        // =====================================================================
        const allOrganisms = [alpha, ...friendlyCells, ...rivalCells];
        const rivalAttackerCounts = new Map();
        const friendlyAttackerCounts = new Map();

        // Update Friendly Colony Observation, Hatred & Distributed Patrol
        friendlyCells.forEach((fc, idx) => {
          fc.scaleX += (1 - fc.scaleX) * 0.18;
          fc.scaleY += (1 - fc.scaleY) * 0.18;
          if (fc.flash > 0) fc.flash--;
          if (fc.jawSnap > 0) fc.jawSnap--;
          if (fc.hitCd > 0) fc.hitCd--;

          // Update observation cone & hatred table against rivalCells
          updateObservationAndHatred(fc, rivalCells, rivalAttackerCounts, true);

          // Determine distributed goal point so cells NEVER converge on a single point
          const orbitSlotAngle = tick * 0.012 + (Math.PI * 2 * idx) / Math.max(1, friendlyCells.length);
          const guardRadius = 115 + (idx % 2) * 40;
          let goalX = alpha.x + Math.cos(orbitSlotAngle) * guardRadius;
          let goalY = alpha.y + Math.sin(orbitSlotAngle) * guardRadius;

          if (pheromoneMode === 'hunt') {
            if (fc.aggroTarget) {
              // Flank target at a slight offset angle based on idx to avoid stacking
              const flankOffset = ((idx % 3) - 1) * 0.55;
              const baseAng = Math.atan2(fc.aggroTarget.y - fc.y, fc.aggroTarget.x - fc.x) + flankOffset;
              goalX = fc.x + Math.cos(baseAng) * 90;
              goalY = fc.y + Math.sin(baseAng) * 90;
            } else {
              // No enemy observed in FOV: patrol local sector around Alpha
              fc.wanderAngle += (Math.random() - 0.5) * 0.18;
              const distFromAlpha = Math.hypot(fc.patrolAnchor.x - alpha.x, fc.patrolAnchor.y - alpha.y);
              if (Math.hypot(fc.x - fc.patrolAnchor.x, fc.y - fc.patrolAnchor.y) < 55 || distFromAlpha > 480) {
                const sectorAng = (Math.PI * 2 * idx) / Math.max(1, friendlyCells.length) + (Math.random() - 0.5) * 0.7;
                const sectorDist = 140 + Math.random() * 220;
                fc.patrolAnchor.x = Math.max(120, Math.min(WORLD_W - 120, alpha.x + Math.cos(sectorAng) * sectorDist));
                fc.patrolAnchor.y = Math.max(120, Math.min(WORLD_H - 120, alpha.y + Math.sin(sectorAng) * sectorDist));
              }
              goalX = fc.patrolAnchor.x + Math.cos(fc.wanderAngle) * 45;
              goalY = fc.patrolAnchor.y + Math.sin(fc.wanderAngle) * 45;
            }
          } else if (pheromoneMode === 'forage') {
            // Each cell claims a different nearby nutrient within local ecosystem
            if (nutrients.length > 0) {
              const nu = nutrients[idx % nutrients.length];
              goalX = nu.x;
              goalY = nu.y;
            }
          }

          const seekAng = Math.atan2(goalY - fc.y, goalX - fc.x);
          const disp = computeAntiClusterForce(fc, [alpha, ...friendlyCells], 112);

          fc.vx = fc.vx * 0.88 + (Math.cos(seekAng) * 0.34 + disp.fx * 0.48) * spdBoost * (fc.speedMult || 1);
          fc.vy = fc.vy * 0.88 + (Math.sin(seekAng) * 0.34 + disp.fy * 0.48) * spdBoost * (fc.speedMult || 1);
          fc.x = Math.max(60, Math.min(WORLD_W - 60, fc.x + fc.vx));
          fc.y = Math.max(60, Math.min(WORLD_H - 60, fc.y + fc.vy));
          if (Math.hypot(fc.vx, fc.vy) > 0.15) {
            fc.angle = Math.atan2(fc.vy, fc.vx) + Math.PI / 2;
          }

          // Cnidocyte Ranged Toxin Dart only at observed aggroTarget
          if (activeOrgans.has('cnidocyte') && fc.aggroTarget) {
            fc.shootCd--;
            if (fc.shootCd <= 0) {
              fc.shootCd = 62;
              const rv = fc.aggroTarget;
              const a = Math.atan2(rv.y - fc.y, rv.x - fc.x);
              fc.scaleX = 1.18; fc.scaleY = 0.85;
              toxinDarts.push({ owner: fc, x: fc.x, y: fc.y, vx: Math.cos(a) * 8.5, vy: Math.sin(a) * 8.5, life: 55 });
            }
          }
        });

        // Soft Membrane Boid Collisions
        for (let i = 0; i < friendlyCells.length; i++) {
          resolvePairCollision(alpha, friendlyCells[i], 'flock');
          for (let j = i + 1; j < friendlyCells.length; j++) {
            resolvePairCollision(friendlyCells[i], friendlyCells[j], 'flock');
          }
        }

        // Toxin Dart Collision + Hatred Provocation
        for (let i = toxinDarts.length - 1; i >= 0; i--) {
          const td = toxinDarts[i];
          td.x += td.vx; td.y += td.vy; td.life--;
          let hit = false;
          for (const rv of rivalCells) {
            if (Math.hypot(td.x - rv.x, td.y - rv.y) < rv.size * 0.52) {
              rv.hp -= 20;
              rv.flash = 5;
              rv.poisonTimer = 95;
              rv.scaleX = 0.78; rv.scaleY = 1.25;
              rv.vx += td.vx * 0.28;
              rv.vy += td.vy * 0.28;
              if (td.owner) addHatred(rv, td.owner, 48);
              spawnShockwave(td.x, td.y, 24, '#a855f7', 2.0);
              spawnParticles(td.x, td.y, '#10b981', 7, 3.2, 3.0);
              hit = true;
              break;
            }
          }
          if (hit || td.life <= 0) toxinDarts.splice(i, 1);
        }

        // Update Rival Cells & Ancient Boss Observation, Hatred & Territorial Patrol
        const friendlyTargets = [alpha, ...friendlyCells];
        for (let i = rivalCells.length - 1; i >= 0; i--) {
          const rv = rivalCells[i];
          rv.scaleX += (1 - rv.scaleX) * 0.16;
          rv.scaleY += (1 - rv.scaleY) * 0.16;
          if (rv.flash > 0) rv.flash--;
          if (rv.poisonTimer > 0) rv.poisonTimer--;
          if (rv.hitCd > 0) rv.hitCd--;

          if (rv.type === 'planarian' && rv.hp < rv.maxHp) rv.hp += 0.08;

          // Update Rival Observation & Hatred Table
          updateObservationAndHatred(rv, friendlyTargets, friendlyAttackerCounts, false);

          let goalX = rv.homeX;
          let goalY = rv.homeY;
          if (rv.aggroTarget) {
            // Pursue highest-hatred observed target
            goalX = rv.aggroTarget.x;
            goalY = rv.aggroTarget.y;
          } else {
            // Peaceful territorial patrol around home biome anchor (prevents map-wide mobbing)
            rv.wanderAngle += (Math.random() - 0.5) * 0.14;
            goalX = rv.homeX + Math.cos(rv.wanderAngle) * 85;
            goalY = rv.homeY + Math.sin(rv.wanderAngle) * 85;
          }

          const ang = Math.atan2(goalY - rv.y, goalX - rv.x);
          const disp = computeAntiClusterForce(rv, rivalCells, 128);
          const poisonSlow = rv.poisonTimer > 0 ? 0.48 : 1.0;
          const accel = (rv.aggroTarget ? (rv.isBoss ? 0.25 : 0.31) : 0.18) * poisonSlow;

          rv.vx = rv.vx * 0.87 + (Math.cos(ang) * accel + disp.fx * 0.42);
          rv.vy = rv.vy * 0.87 + (Math.sin(ang) * accel + disp.fy * 0.42);
          rv.x = Math.max(70, Math.min(WORLD_W - 70, rv.x + rv.vx));
          rv.y = Math.max(70, Math.min(WORLD_H - 70, rv.y + rv.vy));
          if (Math.hypot(rv.vx, rv.vy) > 0.15) {
            rv.angle = Math.atan2(rv.vy, rv.vx) + Math.PI / 2;
          }

          // Rival-vs-Rival Soft Separation
          for (let k = i - 1; k >= 0; k--) {
            resolvePairCollision(rv, rivalCells[k], 'flock');
          }

          // Combat Collision with Player Alpha
          if (rv.hitCd <= 0 && resolvePairCollision(alpha, rv, 'combat')) {
            rv.hitCd = 10;
          }

          // Combat Collision with Friendly Colony
          for (let j = friendlyCells.length - 1; j >= 0; j--) {
            const fc = friendlyCells[j];
            if (fc.hitCd <= 0 && resolvePairCollision(fc, rv, 'combat')) {
              fc.hitCd = 12;
              if (fc.hp <= 0) {
                spawnShockwave(fc.x, fc.y, 32, '#ef4444', 2.2);
                spawnParticles(fc.x, fc.y, '#00f0ff', 10, 3.8, 3.4);
                friendlyCells.splice(j, 1);
                updateHud();
              }
            }
          }

          // Rival / Boss Death Lysis & Planarian Fission
          if (rv.hp <= 0) {
            NexusSDK.audio.explosion();
            screenTrauma = Math.min(1.0, screenTrauma + (rv.isBoss ? 0.65 : 0.3));
            spawnShockwave(rv.x, rv.y, rv.size * 1.45, rv.isBoss ? '#fbbf24' : '#ef4444', 3.2);
            spawnParticles(rv.x, rv.y, rv.isBoss ? '#fbbf24' : '#ef4444', rv.isBoss ? 22 : 12, 5.2, 4.2);

            const drops = rv.isBoss ? 4 : 2;
            for (let d = 0; d < drops; d++) {
              spawnNutrient(rv.x + (Math.random() - 0.5) * 36, rv.y + (Math.random() - 0.5) * 36, true);
            }

            if (rv.isBoss && rv.type === 'planarian' && !rv.hasSplit) {
              for (let s = -1; s <= 1; s += 2) {
                rivalCells.push({
                  id: 'rv_' + (nextEntityId++),
                  x: rv.x + s * 32,
                  y: rv.y + s * 22,
                  homeX: Math.max(120, Math.min(WORLD_W - 120, rv.x + s * 110)),
                  homeY: Math.max(120, Math.min(WORLD_H - 120, rv.y + s * 70)),
                  vx: s * 4.8,
                  vy: -s * 2.8,
                  angle: rv.angle,
                  wanderAngle: rv.angle,
                  type: 'planarian',
                  isBoss: false,
                  hasSplit: true,
                  hp: 130,
                  maxHp: 130,
                  size: 44,
                  mass: 2.4,
                  fov: 175,
                  scaleX: 1.4,
                  scaleY: 0.65,
                  flash: 8,
                  poisonTimer: 0,
                  hitCd: 15,
                  hatredMap: new Map(),
                  aggroTarget: null
                });
              }
            }

            saveData.currency.genePoints += rv.isBoss ? 250 : 45;
            if (rv.isBoss) saveData.currency.helixShards += 5;
            store.save(saveData);
            atp = Math.min(300, atp + 35);
            const oldHome = { x: rv.homeX, y: rv.homeY };
            rivalCells.splice(i, 1);
            setTimeout(() => spawnRivalCell(Math.random() < 0.25, oldHome), 1400);
            updateHud();
          }
        }

        // Update FX Pools
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.r += (sw.maxR - sw.r) * 0.22;
          sw.alpha -= 0.048;
          if (sw.alpha <= 0.02) shockwaves.splice(i, 1);
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.92;
          p.vy *= 0.92;
          p.alpha -= p.decay;
          if (p.alpha <= 0.02) particles.splice(i, 1);
        }
        for (let i = slashArcs.length - 1; i >= 0; i--) {
          slashArcs[i].alpha -= 0.11;
          slashArcs[i].r += 1.8;
          if (slashArcs[i].alpha <= 0) slashArcs.splice(i, 1);
        }
        for (let i = lightningArcs.length - 1; i >= 0; i--) {
          lightningArcs[i].life--;
          if (lightningArcs[i].life <= 0) lightningArcs.splice(i, 1);
        }
        for (let i = vortices.length - 1; i >= 0; i--) {
          const vt = vortices[i];
          vt.r += (vt.maxR - vt.r) * 0.12;
          vt.alpha -= 0.022;
          if (vt.alpha <= 0.02) vortices.splice(i, 1);
        }
        for (let i = mitosisAnims.length - 1; i >= 0; i--) {
          mitosisAnims[i].progress += 0.065;
          if (mitosisAnims[i].progress >= 1) mitosisAnims.splice(i, 1);
        }
        marineSnow.forEach((ms) => {
          ms.x = (ms.x + ms.vx + WORLD_W) % WORLD_W;
          ms.y = (ms.y + ms.vy + WORLD_H) % WORLD_H;
        });
      }

      // Draw Observation Cone & Hatred Lock Reticle / Tether
      function drawSensoryAndHatredLayer() {
        if (!showFovOverlay) return;

        // 1. Alpha Leader Sensory Vision Cone
        const alphaHeading = alpha.angle - Math.PI / 2;
        ctx.save();
        ctx.translate(alpha.x, alpha.y);
        ctx.rotate(alphaHeading);
        const coneGrad = ctx.createRadialGradient(0, 0, 12, 0, 0, alpha.fov);
        coneGrad.addColorStop(0, 'rgba(0, 240, 255, 0.12)');
        coneGrad.addColorStop(1, 'rgba(0, 240, 255, 0)');
        ctx.fillStyle = coneGrad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, alpha.fov, -1.05, 1.05);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(0, 240, 255, 0.22)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(0, 0, alpha.fov, -1.05, 1.05);
        ctx.stroke();
        ctx.restore();

        // 2. Rival Observation Cones & Hatred Lock Tethers
        rivalCells.forEach((rv) => {
          const heading = rv.angle - Math.PI / 2;
          const isAggro = !!rv.aggroTarget;
          ctx.save();
          ctx.translate(rv.x, rv.y);
          ctx.rotate(heading);
          const rGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, rv.fov * 0.85);
          rGrad.addColorStop(0, isAggro ? 'rgba(239, 68, 68, 0.13)' : 'rgba(251, 191, 36, 0.06)');
          rGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
          ctx.fillStyle = rGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, rv.fov * 0.85, -0.95, 0.95);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          // Hatred Lock Line & Threat Ring when locked onto a target
          if (rv.aggroTarget) {
            const threatVal = rv.hatredMap?.get(rv.aggroTarget.id) || 30;
            const threatRatio = Math.min(1, threatVal / 120);
            ctx.save();
            ctx.strokeStyle = `rgba(239, 68, 68, ${0.22 + threatRatio * 0.45})`;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 4]);
            ctx.beginPath();
            ctx.moveTo(rv.x, rv.y);
            ctx.lineTo(rv.aggroTarget.x, rv.aggroTarget.y);
            ctx.stroke();
            ctx.setLineDash([]);

            // Pulsing Aggro Ring around Rival
            ctx.strokeStyle = rv.isBoss ? '#fbbf24' : '#ef4444';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.arc(rv.x, rv.y, rv.size * 0.56 + Math.sin(tick * 0.25) * 3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
        });

        // 3. Friendly Colony Hatred Lock Tethers
        friendlyCells.forEach((fc) => {
          if (fc.aggroTarget) {
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.28)';
            ctx.lineWidth = 1.2;
            ctx.setLineDash([3, 4]);
            ctx.beginPath();
            ctx.moveTo(fc.x, fc.y);
            ctx.lineTo(fc.aggroTarget.x, fc.aggroTarget.y);
            ctx.stroke();
            ctx.restore();
          }
        });
      }

      function drawOrganismsWithOrgans(entity, somaKey, isAlpha) {
        const { x, y, angle, size } = entity;
        const sx = entity.scaleX || 1;
        const sy = entity.scaleY || 1;
        const jaw = entity.jawSnap || 0;
        const swimWave = Math.sin(tick * 0.22 + x * 0.05) * 0.14;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle + swimWave * 0.35);
        ctx.scale(sx, sy);

        if (activeOrgans.has('flagella') && sprites.flagella?.complete) {
          ctx.save();
          ctx.translate(0, size * 0.28);
          ctx.rotate(Math.sin(tick * 0.35) * 0.28);
          ctx.drawImage(sprites.flagella, -size * 0.35, 0, size * 0.7, size * 0.7);
          ctx.restore();
        }

        if (activeOrgans.has('mandible') && sprites.mandible?.complete) {
          const jawSpread = jaw > 0 ? Math.sin(jaw * 0.6) * 0.32 : 0;
          const jawThrust = jaw > 0 ? -size * 0.16 : 0;
          ctx.save();
          ctx.translate(0, -size * 0.55 + jawThrust);
          ctx.scale(1 + jawSpread, 1);
          ctx.drawImage(sprites.mandible, -size * 0.42, -size * 0.32, size * 0.84, size * 0.72);
          ctx.restore();
        }

        const somaSprite = sprites[somaKey] || sprites.diploid;
        if (somaSprite?.complete) {
          ctx.drawImage(somaSprite, -size / 2, -size / 2, size, size);
        }

        if (activeOrgans.has('chloroplast') && sprites.chloroplast?.complete) {
          ctx.drawImage(sprites.chloroplast, -size * 0.24, -size * 0.24, size * 0.48, size * 0.48);
        }
        if (activeOrgans.has('chitin') && sprites.chitin?.complete) {
          ctx.drawImage(sprites.chitin, -size * 0.42, -size * 0.42, size * 0.84, size * 0.84);
        }

        if (entity.flash > 0) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
          ctx.beginPath();
          ctx.arc(0, 0, size * 0.46, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();

        if (isAlpha) {
          ctx.strokeStyle = alpha.dashTimer > 0 ? '#fbbf24' : '#00f0ff';
          ctx.lineWidth = alpha.dashTimer > 0 ? 3 : 2;
          ctx.beginPath();
          ctx.arc(x, y, size * 0.66, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function renderMinimap() {
        const mapW = 104;
        const mapH = 66;
        const mx = canvas.width - mapW - 68;
        const my = 10;
        const scaleX = mapW / WORLD_W;
        const scaleY = mapH / WORLD_H;

        ctx.save();
        ctx.fillStyle = 'rgba(7, 13, 30, 0.84)';
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.28)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(mx, my, mapW, mapH, 8);
        ctx.fill();
        ctx.stroke();

        // Hydrothermal vents on minimap
        ctx.fillStyle = 'rgba(251, 191, 36, 0.7)';
        vents.forEach((v) => {
          ctx.beginPath();
          ctx.arc(mx + v.x * scaleX, my + v.y * scaleY, 1.8, 0, Math.PI * 2);
          ctx.fill();
        });

        // Rival organisms on minimap
        rivalCells.forEach((rv) => {
          ctx.fillStyle = rv.isBoss ? '#fbbf24' : '#ef4444';
          ctx.beginPath();
          ctx.arc(mx + rv.x * scaleX, my + rv.y * scaleY, rv.isBoss ? 2.6 : 1.7, 0, Math.PI * 2);
          ctx.fill();
        });

        // Friendly colony on minimap
        ctx.fillStyle = '#00f0ff';
        friendlyCells.forEach((fc) => {
          ctx.beginPath();
          ctx.arc(mx + fc.x * scaleX, my + fc.y * scaleY, 1.4, 0, Math.PI * 2);
          ctx.fill();
        });

        // Current Local Screen Viewport Rectangle (Centered on Alpha)
        const vw = canvas.width * scaleX;
        const vh = canvas.height * scaleY;
        const vx = Math.max(mx, Math.min(mx + mapW - vw, mx + (camX - canvas.width / 2) * scaleX));
        const vy = Math.max(my, Math.min(my + mapH - vh, my + (camY - canvas.height / 2) * scaleY));
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.65)';
        ctx.lineWidth = 1;
        ctx.strokeRect(vx, vy, vw, vh);

        // Alpha Leader at center of viewport
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(mx + alpha.x * scaleX, my + alpha.y * scaleY, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function render() {
        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        if (screenTrauma > 0.01) {
          const shake = screenTrauma * screenTrauma * 14;
          ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        }

        // Camera Transform: Center Viewport Strictly on Player-Controlled Alpha
        const camOffsetX = canvas.width / 2 - camX;
        const camOffsetY = canvas.height / 2 - camY;
        ctx.translate(camOffsetX, camOffsetY);

        // World-Space Microscopic Petri-Dish Grid (Culled to visible local viewport)
        const gridStep = 64;
        const startX = Math.max(0, Math.floor((camX - canvas.width / 2 - gridStep) / gridStep) * gridStep);
        const endX = Math.min(WORLD_W, Math.ceil((camX + canvas.width / 2 + gridStep) / gridStep) * gridStep);
        const startY = Math.max(0, Math.floor((camY - canvas.height / 2 - gridStep) / gridStep) * gridStep);
        const endY = Math.min(WORLD_H, Math.ceil((camY + canvas.height / 2 + gridStep) / gridStep) * gridStep);

        ctx.strokeStyle = 'rgba(0, 240, 255, 0.035)';
        ctx.lineWidth = 1;
        for (let x = startX; x <= endX; x += gridStep) {
          ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, endY); ctx.stroke();
        }
        for (let y = startY; y <= endY; y += gridStep) {
          ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(endX, y); ctx.stroke();
        }

        // World Petri-Dish Containment Border & Ecological Sector Rings
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.28)';
        ctx.lineWidth = 4;
        ctx.strokeRect(20, 20, WORLD_W - 40, WORLD_H - 40);

        RIVAL_ZONES.forEach((z) => {
          ctx.strokeStyle = z.isBoss ? 'rgba(251, 191, 36, 0.08)' : 'rgba(239, 68, 68, 0.05)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(z.x, z.y, z.isBoss ? 190 : 135, 0, Math.PI * 2);
          ctx.stroke();
        });

        marineSnow.forEach((ms) => {
          ctx.fillStyle = `rgba(148, 163, 184, ${ms.alpha})`;
          ctx.beginPath();
          ctx.arc(ms.x, ms.y, ms.r, 0, Math.PI * 2);
          ctx.fill();
        });

        vortices.forEach((vt) => {
          ctx.strokeStyle = `rgba(0, 240, 255, ${vt.alpha})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(vt.x, vt.y, vt.r, 0, Math.PI * 2);
          ctx.stroke();
        });

        vents.forEach((v) => {
          const auraR = 44 + Math.sin(v.pulse) * 6;
          const grad = ctx.createRadialGradient(v.x, v.y, 8, v.x, v.y, auraR);
          grad.addColorStop(0, 'rgba(251, 191, 36, 0.22)');
          grad.addColorStop(1, 'rgba(251, 191, 36, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(v.x, v.y, auraR, 0, Math.PI * 2);
          ctx.fill();

          if (sprites.vent?.complete) {
            ctx.drawImage(sprites.vent, v.x - 42, v.y - 42, 84, 84);
          }
        });

        // Observation Cones & Hatred Lock Lines Layer
        drawSensoryAndHatredLayer();

        nutrients.forEach((n) => {
          ctx.save();
          ctx.translate(n.x, n.y);
          ctx.rotate(n.rot);
          ctx.scale(n.scale || 1, n.scale || 1);
          if (sprites.algae?.complete) {
            ctx.drawImage(sprites.algae, -18, -18, 36, 36);
          }
          if (n.isMeat) {
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
        });

        mitosisAnims.forEach((ma) => {
          const p = ma.progress;
          const sep = p * ma.size * 0.65;
          ctx.save();
          ctx.translate(ma.x, ma.y);
          ctx.rotate(ma.angle);
          ctx.strokeStyle = `rgba(0, 240, 255, ${1 - p})`;
          ctx.lineWidth = (1 - p) * 10;
          ctx.beginPath();
          ctx.moveTo(-sep, 0);
          ctx.lineTo(sep, 0);
          ctx.stroke();
          ctx.restore();
        });

        friendlyCells.forEach((fc) => {
          drawOrganismsWithOrgans(fc, fc.soma, false);
        });

        drawOrganismsWithOrgans(alpha, currentSoma, true);

        rivalCells.forEach((rv) => {
          const sp = sprites[rv.type] || sprites.diploid;
          ctx.save();
          ctx.translate(rv.x, rv.y);
          ctx.rotate(rv.angle);
          ctx.scale(rv.scaleX || 1, rv.scaleY || 1);
          if (sp?.complete) {
            ctx.drawImage(sp, -rv.size / 2, -rv.size / 2, rv.size, rv.size);
          }
          if (rv.poisonTimer > 0) {
            ctx.strokeStyle = 'rgba(168, 85, 247, 0.75)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 0, rv.size * 0.48, 0, Math.PI * 2);
            ctx.stroke();
          }
          if (rv.flash > 0) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.58)';
            ctx.beginPath();
            ctx.arc(0, 0, rv.size * 0.45, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          // Rival / Boss Health Bar + Hatred Meter Bar
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(rv.x - 22, rv.y - rv.size / 2 - 10, 44, 4);
          ctx.fillStyle = rv.isBoss ? '#fbbf24' : '#ef4444';
          ctx.fillRect(rv.x - 22, rv.y - rv.size / 2 - 10, 44 * Math.max(0, rv.hp / rv.maxHp), 4);

          if (rv.aggroTarget) {
            const hVal = Math.min(1, (rv.hatredMap?.get(rv.aggroTarget.id) || 0) / 120);
            ctx.fillStyle = '#a855f7';
            ctx.fillRect(rv.x - 22, rv.y - rv.size / 2 - 5, 44 * hVal, 2);
          }
        });

        toxinDarts.forEach((td) => {
          ctx.fillStyle = '#10b981';
          ctx.beginPath();
          ctx.arc(td.x, td.y, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#a855f7';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });

        slashArcs.forEach((sl) => {
          ctx.save();
          ctx.translate(sl.x, sl.y);
          ctx.rotate(sl.angle);
          ctx.strokeStyle = sl.color;
          ctx.globalAlpha = sl.alpha;
          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(0, 0, sl.r, -Math.PI * 0.42, Math.PI * 0.42);
          ctx.stroke();
          ctx.restore();
        });

        lightningArcs.forEach((la) => {
          ctx.save();
          ctx.strokeStyle = la.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(la.x1, la.y1);
          const mx = (la.x1 + la.x2) / 2 + (Math.random() - 0.5) * 14;
          const my = (la.y1 + la.y2) / 2 + (Math.random() - 0.5) * 14;
          ctx.lineTo(mx, my);
          ctx.lineTo(la.x2, la.y2);
          ctx.stroke();
          ctx.restore();
        });

        shockwaves.forEach((sw) => {
          ctx.save();
          ctx.strokeStyle = sw.color;
          ctx.globalAlpha = Math.max(0, sw.alpha);
          ctx.lineWidth = sw.lineWidth;
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        });

        particles.forEach((p) => {
          ctx.save();
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        ctx.restore();
        renderMinimap();
      }

      function loop() {
        step();
        render();
        requestAnimationFrame(loop);
      }

      // UI Icon-Only Controls
      document.getElementById('btn-dash-bite').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        triggerAlphaDashBite();
      });

      document.getElementById('btn-mitosis').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (atp < 35) return;
        atp -= 35;
        alpha.scaleX = 1.38;
        alpha.scaleY = 0.68;
        spawnFriendlyCell(alpha.x, alpha.y, true);
        if (lan.isConnected()) lan.sendReliable({ type: 'rival_wave' });
        NexusSDK.audio.upgrade();
        updateHud();
      });

      document.getElementById('btn-toggle-fov').addEventListener('click', (e) => {
        NexusSDK.audio.tap();
        showFovOverlay = !showFovOverlay;
        e.currentTarget.style.borderColor = showFovOverlay ? 'rgba(0, 240, 255, 0.75)' : 'var(--border)';
        e.currentTarget.style.color = showFovOverlay ? 'var(--cyan)' : 'var(--muted)';
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') triggerAlphaDashBite();
        if (e.code === 'KeyE') document.getElementById('btn-mitosis').dispatchEvent(new PointerEvent('pointerdown'));
      });

      document.getElementById('btn-pheromone').addEventListener('click', (e) => {
        NexusSDK.audio.tap();
        const modes = [
          { id: 'hunt', border: 'rgba(239, 68, 68, 0.78)', color: '#ef4444' },
          { id: 'forage', border: 'rgba(16, 185, 129, 0.78)', color: '#10b981' },
          { id: 'guard', border: 'rgba(0, 240, 255, 0.78)', color: '#00f0ff' }
        ];
        const idx = (modes.findIndex((m) => m.id === pheromoneMode) + 1) % modes.length;
        pheromoneMode = modes[idx].id;
        e.currentTarget.style.borderColor = modes[idx].border;
        spawnShockwave(alpha.x, alpha.y, 78, modes[idx].color, 2.4);
      });

      const SOMA_LIST = [
        { id: 'prokaryote', src: '../assets/micro-genesis/sprites/soma-prokaryote.svg' },
        { id: 'diploid', src: '../assets/micro-genesis/sprites/soma-diploid.svg' },
        { id: 'titan', src: '../assets/micro-genesis/sprites/soma-titan.svg' }
      ];
      document.getElementById('btn-cycle-soma').addEventListener('click', () => {
        NexusSDK.audio.upgrade();
        const idx = (SOMA_LIST.findIndex((s) => s.id === currentSoma) + 1) % SOMA_LIST.length;
        currentSoma = SOMA_LIST[idx].id;
        saveData.soma = currentSoma;
        const spec = getSomaSpecs(currentSoma);
        alpha.mass = spec.mass * 1.4;
        alpha.scaleX = 1.32;
        alpha.scaleY = 0.74;
        spawnShockwave(alpha.x, alpha.y, 56, '#fbbf24', 2.6);
        document.getElementById('soma-btn-ico').src = SOMA_LIST[idx].src;
        store.save(saveData);
      });

      initEcosystem();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>

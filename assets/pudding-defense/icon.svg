<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="puddingGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
    <linearGradient id="caramelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景圆形深空光晕 -->
  <circle cx="64" cy="64" r="60" fill="#030712" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.3"/>
  <ellipse cx="64" cy="106" rx="42" ry="8" fill="rgba(0,0,0,0.4)"/>

  <!-- 布丁身体 -->
  <path d="M 32 98 C 28 66, 38 48, 64 48 C 90 48, 100 66, 96 98 C 92 108, 36 108, 32 98 Z" fill="url(#puddingGlow)"/>

  <!-- 头顶流淌焦糖浆 -->
  <path d="M 38 58 C 42 66, 48 68, 52 60 C 56 68, 64 69, 68 61 C 72 68, 80 67, 84 59 C 90 54, 94 48, 64 48 C 34 48, 36 54, 38 58 Z" fill="url(#caramelGrad)"/>

  <!-- 五官：黑曜石大眼睛与星星高光 -->
  <ellipse cx="50" cy="74" rx="5" ry="7" fill="#0f172a" />
  <circle cx="48" cy="71" r="2.2" fill="#ffffff" />
  <circle cx="51.5" cy="76" r="1" fill="#ffffff" />

  <ellipse cx="78" cy="74" rx="5" ry="7" fill="#0f172a" />
  <circle cx="76" cy="71" r="2.2" fill="#ffffff" />
  <circle cx="79.5" cy="76" r="1" fill="#ffffff" />

  <!-- 粉红腮红 -->
  <ellipse cx="42" cy="81" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.6" />
  <ellipse cx="86" cy="81" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.6" />

  <!-- 萌萌微翘小嘴 -->
  <path d="M 61 78 Q 64 82 67 78" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- 黄金小皇冠 -->
  <path d="M 52 46 L 55 35 L 61 41 L 64 32 L 67 41 L 73 35 L 76 46 Z" fill="url(#crownGrad)" stroke="#ca8a04" stroke-width="1.5" filter="url(#softGlow)"/>
  <circle cx="55" cy="34" r="1.5" fill="#38bdf8"/>
  <circle cx="64" cy="31" r="2" fill="#ec4899"/>
  <circle cx="73" cy="34" r="1.5" fill="#38bdf8"/>
</svg>

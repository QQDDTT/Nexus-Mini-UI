<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="pudding-defense-icon-rig" data-root-anchor="64,64" data-has-aura="true">
  <defs>
    <!-- 1. 烘焙暖棕桌面接触软阴影 -->
    <radialGradient id="pdi-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#23120b" stop-opacity="0.72" />
      <stop offset="65%" stop-color="#23120b" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#23120b" stop-opacity="0" />

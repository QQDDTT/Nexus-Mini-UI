    <!-- 4. 香草白巧奶油糖霜材质 -->
    <linearGradient id="tb-frosting" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <!-- 5. 焦糖布丁SSS次表面散射材质 -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="tower-boba-rig" data-root-anchor="64,96" data-has-aura="true">
  <defs>
    <!-- 1. 烘焙暖棕桌面接触软阴影 -->
    <radialGradient id="tb-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#23120b" stop-opacity="0.72" />
      <stop offset="65%" stop-color="#23120b" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#23120b" stop-opacity="0" />
    </radialGradient>
    <!-- 2. 糖果甜点暖光场 -->
    <radialGradient id="tb-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#23120b" stop-opacity="0" />
    </radialGradient>
    <!-- 3. 金黄威化饼干茶托材质 -->
    <linearGradient id="tb-wafer" x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <!-- 4. 香草白巧奶油糖霜材质 -->
    <linearGradient id="mj-frosting" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <!-- 5. 焦糖布丁SSS次表面散射材质 -->
    <radialGradient id="mj-custard" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="48%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>
    <!-- 6. 草莓果冻SSS次表面散射材质 -->
    <radialGradient id="mj-berry" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="45%" stop-color="#f472b6" />
      <stop offset="85%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </radialGradient>
    <!-- 7. 丝滑琥珀焦糖淋面材质 -->
    <linearGradient id="mj-caramel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="55%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <!-- 8. 果冻水滴边缘高光贴图 -->
    <linearGradient id="mj-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />

      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#f472b6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#23120b" stop-opacity="0" />
    </radialGradient>
    <!-- 3. 金黄威化饼干茶托材质 -->

    <linearGradient id="oc-frosting" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <!-- 5. 焦糖布丁SSS次表面散射材质 -->
    <radialGradient id="oc-custard" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="48%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>
    <!-- 6. 草莓果冻SSS次表面散射材质 -->
    <radialGradient id="oc-berry" cx="38%" cy="32%" r="68%">

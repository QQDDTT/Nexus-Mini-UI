<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- STYLE-170 x STYLE-142: Hexagonal Forged Titanium & Molten Gold Tactical Supply Drop Pod -->
    <linearGradient id="pc-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="pc-hatch-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="28%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="pc-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Ground Cast Shadow & Hexagonal Beacon Ring -->
  <ellipse id="part-shadow-cast" cx="34" cy="36" rx="25" ry="25" fill="#030406" opacity="0.86"/>
  <polygon id="part-aura-ring-outer" points="32,3 58,18 58,46 32,61 6,46 6,18" fill="none" stroke="#fde047" stroke-width="1.2" stroke-opacity="0.6"/>
  <polygon id="part-aura-ring-inner" points="32,8 53,20 53,44 32,56 11,44 11,20" fill="none" stroke="#f97316" stroke-width="0.9" stroke-opacity="0.45"/>

  <!-- 2. Octagonal Forged Carbon & Titanium Drop Pod Base -->
  <g id="part-crate-base">
    <polygon points="21,8 43,8 56,21 56,43 43,56 21,56 8,43 8,21" fill="url(#pc-titanium)" stroke="#09090b" stroke-width="1.8"/>
    <polygon points="24,13 40,13 51,24 51,40 40,51 24,51 13,40 13,24" fill="#09090b" stroke="#f59e0b" stroke-width="1.1"/>
  </g>

  <!-- 3. Glowing Molten Gold Ordnance Core -->
  <g id="part-loot-core">
    <circle cx="32" cy="32" r="14" fill="url(#pc-core-glow)"/>
    <polygon points="32,20 35,28 44,28 37,33 39,42 32,37 25,42 27,33 20,28 29,28" fill="#fef9c3" stroke="#f59e0b" stroke-width="1"/>
  </g>

  <!-- 4. Four Interlocking Multi-Faceted Blast Clamps -->
  <g id="part-hatch-top">
    <polygon points="22,9 42,9 38,20 26,20" fill="url(#pc-hatch-gold)" stroke="#09090b" stroke-width="1.2"/>
  </g>
  <g id="part-hatch-bottom">
    <polygon points="26,44 38,44 42,55 22,55" fill="url(#pc-hatch-gold)" stroke="#09090b" stroke-width="1.2"/>
  </g>
  <g id="part-hatch-left">
    <polygon points="9,22 20,26 20,38 9,42" fill="url(#pc-hatch-gold)" stroke="#09090b" stroke-width="1.2"/>
  </g>
  <g id="part-hatch-right">
    <polygon points="55,22 55,42 44,38 44,26" fill="url(#pc-hatch-gold)" stroke="#09090b" stroke-width="1.2"/>
  </g>

  <!-- 5. Specular Rim & Core Corona -->
  <path id="part-light-rim-crate" d="M21,8 H43 L56,21 M22,9 H42" fill="none" stroke="#fef9c3" stroke-width="1.4" stroke-linecap="round"/>
  <circle id="part-aura-corona-top" cx="32" cy="32" r="3" fill="#ffffff"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- STYLE-170 x STYLE-142: High-Voltage Electromagnetic Sniper Tank Destroyer -->
    <linearGradient id="esh-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="22%" stop-color="#a855f7"/>
      <stop offset="52%" stop-color="#6b21a8"/>
      <stop offset="82%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#130524"/>
    </linearGradient>
    <linearGradient id="esh-carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Heat-Blued Railgun Barrel (Gold Muzzle -> Magenta/Violet -> Deep Indigo) -->
    <linearGradient id="esh-railgun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="18%" stop-color="#f59e0b"/>
      <stop offset="42%" stop-color="#e879f9"/>
      <stop offset="68%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="esh-turret-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#7e22ce"/>
      <stop offset="82%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#090414"/>
    </linearGradient>
    <radialGradient id="esh-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#7e22ce" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Cast Shadow & Hexagonal Basalt Magma-Crystal Footprint -->
  <ellipse id="part-shadow-cast" cx="34" cy="36" rx="25" ry="27" fill="#040507" opacity="0.85"/>
  <polygon id="part-aura-ring-outer" points="32,3 58,18 58,46 32,61 6,46 6,18" fill="url(#esh-aura)" stroke="#e879f9" stroke-width="0.9" stroke-opacity="0.45"/>
  <polygon id="part-aura-ring-inner" points="32,9 52,20 52,44 32,55 12,44 12,20" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- 2. Sniper Laser Sight Cone & Rear Recoil Hydraulic Spades -->
  <polygon id="part-light-cone-main" points="32,12 24,0 40,0" fill="#e879f9" opacity="0.24"/>
  <g id="part-spade-L">
    <polygon points="14,52 22,52 20,62 11,60" fill="url(#esh-carbon)" stroke="#c084fc" stroke-width="0.9"/>
  </g>
  <g id="part-spade-R">
    <polygon points="42,52 50,52 53,60 44,62" fill="url(#esh-carbon)" stroke="#c084fc" stroke-width="0.9"/>
  </g>

  <!-- 3. Heavy Low-Profile Tracks -->
  <g id="part-track-left">
    <rect x="7" y="12" width="9" height="42" rx="2" fill="url(#esh-carbon)" stroke="#09090b" stroke-width="1.4"/>
    <path d="M8 17 H15 M8 23 H15 M8 29 H15 M8 35 H15 M8 41 H15 M8 47 H15" stroke="#64748b" stroke-width="1.3"/>
  </g>
  <g id="part-track-right">
    <rect x="48" y="12" width="9" height="42" rx="2" fill="url(#esh-carbon)" stroke="#09090b" stroke-width="1.4"/>
    <path d="M49 17 H56 M49 23 H56 M49 29 H56 M49 35 H56 M49 41 H56 M49 47 H56" stroke="#64748b" stroke-width="1.3"/>
  </g>

  <!-- 4. Angular Wedge Casemate Chassis -->
  <g id="part-hull-chassis">
    <polygon points="32,9 49,16 50,51 42,55 22,55 14,51 15,16" fill="url(#esh-hull)" stroke="#09090b" stroke-width="1.5"/>
    <polygon points="18,18 46,18 48,48 16,48" fill="url(#esh-carbon)" opacity="0.55"/>
    <!-- Capacitor Cooling Louvers -->
    <path d="M22 46 H42 M22 50 H42" stroke="#e879f9" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 5. Long Split-Rail Tempered Electromagnetic Cannon & Cryo Fins -->
  <g id="part-cooling-fin-L">
    <polygon points="22,12 27,9 27,25 22,23" fill="url(#esh-carbon)" stroke="#f0abfc" stroke-width="0.8"/>
  </g>
  <g id="part-cooling-fin-R">
    <polygon points="37,9 42,12 42,23 37,25" fill="url(#esh-carbon)" stroke="#f0abfc" stroke-width="0.8"/>
  </g>
  <g id="part-barrel-railgun">
    <rect x="27.5" y="1" width="3.5" height="27" rx="1" fill="url(#esh-railgun)" stroke="#09090b" stroke-width="1"/>
    <rect x="33" y="1" width="3.5" height="27" rx="1" fill="url(#esh-railgun)" stroke="#09090b" stroke-width="1"/>
    <!-- Plasma Gap Arcs -->
    <line x1="32" y1="3" x2="32" y2="25" stroke="#fde047" stroke-width="1.4" stroke-dasharray="2 2"/>
  </g>

  <!-- 6. Radial Multi-Faceted Stealth Sniper Turret -->
  <g id="part-turret-body">
    <polygon points="32,16 46,24 44,43 32,48 20,43 18,24" fill="url(#esh-turret-facet)" stroke="#09090b" stroke-width="1.5"/>
    <polygon points="32,16 46,24 32,32" fill="#f5d0fe" opacity="0.32"/>
    <polygon points="32,16 18,24 32,32" fill="#c084fc" opacity="0.24"/>
    <polygon points="18,24 20,43 32,32" fill="#3b0764" opacity="0.55"/>
    <polygon points="46,24 44,43 32,32" fill="#1e1b4b" opacity="0.52"/>
    <polygon points="20,43 32,48 44,43 32,32" fill="#09090b" opacity="0.7"/>
  </g>

  <!-- 7. Specular Chamfer Highlights & Core -->
  <path id="part-light-rim-body" d="M18,24 L32,16 L46,24" fill="none" stroke="#fef08a" stroke-width="1.3" stroke-linecap="round"/>
  <circle id="part-aura-corona-top" cx="32" cy="32" r="3.2" fill="#fde047" stroke="#e879f9" stroke-width="1.2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- STYLE-170 x STYLE-142: V-Chevron Sloped Forged Titanium & Heat-Blued Ricochet Blast Wall -->
    <linearGradient id="ts-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="22%" stop-color="#94a3b8"/>
      <stop offset="52%" stop-color="#475569"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ts-temper-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#c084fc"/>
      <stop offset="82%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ts-carbon-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <!-- 1. Ground Cast Shadow & Ricochet Spark Field -->
  <polygon id="part-shadow-cast" points="32,5 61,20 61,52 32,63 5,52 5,20" fill="#030406" opacity="0.9"/>
  <polygon id="part-aura-ring-outer" points="32,2 60,18 60,48 32,62 4,48 4,18" fill="none" stroke="#c084fc" stroke-width="0.9" stroke-opacity="0.4"/>
  <polygon id="part-aura-ring-inner" points="32,6 56,20 56,46 32,58 8,46 8,20" fill="none" stroke="#fde047" stroke-width="0.7" stroke-opacity="0.32"/>

  <!-- 2. Octagonal Forged Carbon Interlocking Base Frame -->
  <g id="part-steel-frame">
    <polygon id="part-steel-core" points="18,4 46,4 60,18 60,46 46,60 18,60 4,46 4,18" fill="url(#ts-carbon-core)" stroke="#09090b" stroke-width="2"/>
    <!-- High-Visibility Tungsten-Gold & Violet Tempered Edge Strips -->
    <polygon points="20,7 44,7 57,20 57,44 44,57 20,57 7,44 7,20" fill="url(#ts-titanium)" stroke="url(#ts-temper-bevel)" stroke-width="1.8"/>
  </g>

  <!-- 3. Angled V-Chevron Sloped Ricochet Armor Plates -->
  <g id="part-armor-plate-core">
    <!-- Upper V-Chevron Deflector Wedge -->
    <polygon points="32,9 53,22 53,34 32,21 11,34 11,22" fill="url(#ts-temper-bevel)" stroke="#09090b" stroke-width="1.4"/>
    <!-- Lower V-Chevron Deflector Wedge -->
    <polygon points="32,25 53,38 53,51 32,38 11,51 11,38" fill="url(#ts-titanium)" stroke="#09090b" stroke-width="1.4"/>
    <!-- Central Diamond Deflection Ridge -->
    <polygon points="32,14 44,22 32,30 20,22" fill="#f8fafc" opacity="0.4"/>
  </g>

  <!-- 4. Heavy Tungsten Anchor Bolts -->
  <g id="part-rivet-group">
    <circle id="part-corner-tl" cx="21" cy="12" r="2.2" fill="#fde047" stroke="#09090b" stroke-width="0.9"/>
    <circle id="part-corner-tr" cx="43" cy="12" r="2.2" fill="#fde047" stroke="#09090b" stroke-width="0.9"/>
    <circle id="part-corner-bl" cx="21" cy="52" r="2.2" fill="#c084fc" stroke="#09090b" stroke-width="0.9"/>
    <circle id="part-corner-br" cx="43" cy="52" r="2.2" fill="#c084fc" stroke="#09090b" stroke-width="0.9"/>
  </g>

  <!-- 5. Specular Chamfer Rim & Apex Corona -->
  <path id="part-light-rim-steel" d="M11,22 L32,9 L53,22 M11,38 L32,25 L53,38" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <circle id="part-aura-corona-top" cx="32" cy="22" r="2.2" fill="#ffffff"/>
</svg>

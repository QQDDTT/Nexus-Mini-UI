<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- STYLE-170 x STYLE-142: Hexagonal Columnar Basalt Bunker with 1200C Molten Gold Magma Veins -->
    <linearGradient id="tb-basalt-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="28%" stop-color="#3f3f46"/>
      <stop offset="62%" stop-color="#27272a"/>
      <stop offset="88%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="tb-ceramic-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="25%" stop-color="#d97706"/>
      <stop offset="58%" stop-color="#9a3412"/>
      <stop offset="85%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1c0a05"/>
    </linearGradient>
    <linearGradient id="tb-magma-seam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- 1. Ground Shadow & Magma Glow Base -->
  <polygon id="part-shadow-cast" points="33,4 61,19 61,49 33,63 7,49 7,19" fill="#030406" opacity="0.88"/>
  <polygon id="part-aura-ring-outer" points="32,2 60,18 60,46 32,62 4,46 4,18" fill="none" stroke="#f97316" stroke-width="1" stroke-opacity="0.45"/>

  <!-- 2. Hexagonal Columnar Basalt Outer Fortress Wall -->
  <g id="part-mortar-bed">
    <polygon points="32,3 59,18 59,46 32,61 5,46 5,18" fill="url(#tb-basalt-top)" stroke="#09090b" stroke-width="2"/>
    <!-- Glowing 1200C Molten Gold Magma Fissures between Hexagonal Basalt Columns -->
    <path id="part-aura-seam-grid" d="M32,3 L32,61 M5,18 L59,46 M59,18 L5,46" stroke="url(#tb-magma-seam)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 3. Six Radial Multi-Faceted Basalt & Reactive Ceramic Armor Slabs -->
  <g id="part-brick-row-top">
    <polygon id="part-brick-tl" points="32,6 55,19 32,31 9,19" fill="url(#tb-ceramic-armor)" stroke="#09090b" stroke-width="1.3"/>
    <polygon id="part-brick-tr" points="32,9 49,19 32,28 15,19" fill="#fef08a" opacity="0.18"/>
  </g>
  <g id="part-brick-row-mid">
    <polygon id="part-brick-bl" points="7,21 30,33 30,57 7,44" fill="url(#tb-basalt-top)" stroke="#09090b" stroke-width="1.3"/>
    <polygon id="part-brick-br" points="57,21 57,44 34,57 34,33" fill="url(#tb-ceramic-armor)" stroke="#09090b" stroke-width="1.3"/>
  </g>
  <g id="part-brick-row-bot">
    <polygon points="32,20 44,27 44,39 32,46 20,39 20,27" fill="url(#tb-basalt-top)" stroke="#f59e0b" stroke-width="1.4"/>
    <polygon points="32,25 39,29 39,37 32,41 25,37 25,29" fill="#18181b" stroke="#fde047" stroke-width="1"/>
    <circle cx="32" cy="33" r="3" fill="#f97316"/>
  </g>

  <!-- 4. Battle-Hardened Impact Chips & Specular Rim -->
  <g id="part-damage-chips">
    <polygon points="16,15 21,13 19,18" fill="#09090b"/>
    <polygon points="46,38 51,36 49,42" fill="#09090b"/>
  </g>
  <g id="part-light-rim-bricks">
    <path id="part-light-rim-brick" d="M7,19 L32,5 L57,19 M20,27 L32,20 L44,27" fill="none" stroke="#fef08a" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
  </g>
  <circle id="part-aura-corona-top" cx="32" cy="33" r="1.5" fill="#fef9c3"/>
</svg>

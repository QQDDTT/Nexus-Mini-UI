<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- STYLE-170 x STYLE-142: Basalt Magma-Seam Citadel Pedestal & Heat-Forged Golden Eagle -->
    <linearGradient id="be-basalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="30%" stop-color="#27272a"/>
      <stop offset="65%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="be-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="22%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="78%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="be-wing-temper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="28%" stop-color="#f59e0b"/>
      <stop offset="62%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#31102f"/>
    </linearGradient>
    <radialGradient id="be-magma-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="32%" stop-color="#fde047"/>
      <stop offset="68%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
  </defs>

  <!-- 1. Ground Shadow & Hexagonal Basalt Magma-Vein Citadel Ring -->
  <ellipse id="part-shadow-cast" cx="34" cy="35" rx="28" ry="27" fill="#030406" opacity="0.88"/>
  <polygon id="part-aura-ring-outer" points="32,2 59,17 59,47 32,62 5,47 5,17" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.65"/>
  <polygon id="part-aura-ring-inner" points="32,7 54,19 54,45 32,57 10,45 10,19" fill="none" stroke="#fde047" stroke-width="0.9" stroke-opacity="0.45"/>

  <!-- 2. Octagonal Columnar Basalt Bunker Base with 1200C Molten Gold Seams -->
  <g id="part-pedestal-base">
    <polygon points="21,6 43,6 58,21 58,43 43,58 21,58 6,43 6,21" fill="url(#be-basalt)" stroke="#09090b" stroke-width="1.8"/>
    <polygon points="24,11 40,11 53,24 53,40 40,53 24,53 11,40 11,24" fill="#18181b" stroke="#f59e0b" stroke-width="1.1"/>
    <!-- Glowing Magma Fissure Lines -->
    <path d="M21,6 L24,11 M43,6 L40,11 M58,21 L53,24 M58,43 L53,40 M43,58 L40,53 M21,58 L24,53 M6,43 L11,40 M6,21 L11,24" stroke="#f97316" stroke-width="1.3"/>
  </g>

  <!-- 3. Multi-Faceted Tail Feathers -->
  <g id="part-tail-plume">
    <polygon points="24,42 40,42 45,56 32,52 19,56" fill="url(#be-wing-temper)" stroke="#09090b" stroke-width="1.3"/>
    <line x1="32" y1="42" x2="32" y2="52" stroke="#fef08a" stroke-width="1.1"/>
  </g>

  <!-- 4. Radial Multi-Faceted Titanium-Gold Wings -->
  <g id="part-wing-R">
    <polygon points="35,24 61,12 57,24 60,31 52,36 54,42 36,39" fill="url(#be-wing-temper)" stroke="#09090b" stroke-width="1.4"/>
    <polygon points="36,26 57,16 51,26 36,31" fill="#fef08a" opacity="0.38"/>
  </g>
  <g id="part-wing-L">
    <polygon points="29,24 3,12 7,24 4,31 12,36 10,42 28,39" fill="url(#be-wing-temper)" stroke="#09090b" stroke-width="1.4"/>
    <polygon points="28,26 7,16 13,26 28,31" fill="#fef08a" opacity="0.38"/>
  </g>

  <!-- 5. Hexagonal Aegis Core Shield -->
  <g id="part-core-shield">
    <polygon points="32,17 44,24 44,39 32,47 20,39 20,24" fill="url(#be-gold)" stroke="#09090b" stroke-width="1.5"/>
    <polygon points="32,21 40,26 40,37 32,42 24,37 24,26" fill="url(#be-magma-core)" stroke="#fef9c3" stroke-width="1"/>
  </g>

  <!-- 6. Aquila Command Head Crest -->
  <g id="part-eagle-head">
    <polygon points="32,7 39,14 36,22 28,22 25,14" fill="url(#be-gold)" stroke="#09090b" stroke-width="1.3"/>
    <polygon points="32,11 36,15 32,18 28,15" fill="#ffffff"/>
  </g>

  <!-- 7. Specular Wing Rim & Core Corona -->
  <path id="part-light-rim-wings" d="M4,13 L28,24 L32,8 L36,24 L60,13" fill="none" stroke="#fef9c3" stroke-width="1.4" stroke-linecap="round"/>
  <circle id="part-aura-corona-top" cx="32" cy="31" r="3.2" fill="#ffffff"/>
</svg>

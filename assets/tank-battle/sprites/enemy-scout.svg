<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- STYLE-170 x STYLE-142: 5-Stop Gooch Warm-to-Cool Forged Carbon & Titanium Gradients -->
    <linearGradient id="es-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="22%" stop-color="#dc2626"/>
      <stop offset="52%" stop-color="#991b1b"/>
      <stop offset="80%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c060b"/>
    </linearGradient>
    <linearGradient id="es-carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#27272a"/>
      <stop offset="65%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <!-- Heat-Blued Gun Barrel Gradient (Gold -> Violet -> Indigo -> Gunmetal) -->
    <linearGradient id="es-barrel-temper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="22%" stop-color="#f59e0b"/>
      <stop offset="48%" stop-color="#c084fc"/>
      <stop offset="72%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="es-turret-facet" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="25%" stop-color="#ef4444"/>
      <stop offset="58%" stop-color="#7f1d1d"/>
      <stop offset="85%" stop-color="#31102f"/>
      <stop offset="100%" stop-color="#11091a"/>
    </linearGradient>
    <radialGradient id="es-magma-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#dc2626" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="es-cone" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. Ground Cast Shadow & Hexagonal Basalt Magma-Vein Footprint -->
  <ellipse id="part-shadow-cast" cx="34" cy="36" rx="22" ry="26" fill="#040507" opacity="0.82"/>
  <polygon id="part-aura-ring-outer" points="32,4 56,18 56,46 32,60 8,46 8,18" fill="url(#es-magma-aura)" stroke="#f97316" stroke-width="0.9" stroke-opacity="0.42"/>
  <polygon id="part-aura-ring-inner" points="32,10 50,21 50,43 32,54 14,43 14,21" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- 2. Optical Target Scan Cone & Rear Magma-Afterburner Plume -->
  <polygon id="part-light-cone-main" points="32,20 18,2 46,2" fill="url(#es-cone)"/>
  <g id="part-thruster-plume">
    <polygon points="27,54 32,63 37,54" fill="#f97316" opacity="0.88"/>
    <polygon points="29,54 32,60 35,54" fill="#fde047"/>
  </g>

  <!-- 3. Half-Track Suspension: Front Armored Steering Wheels & Rear High-Grip Tracks -->
  <g id="part-wheel-front-L">
    <polygon points="10,14 16,12 17,25 10,24" fill="url(#es-carbon)" stroke="#09090b" stroke-width="1.2"/>
    <line x1="11" y1="16" x2="16" y2="16" stroke="#94a3b8" stroke-width="1"/>
    <line x1="11" y1="21" x2="16" y2="21" stroke="#94a3b8" stroke-width="1"/>
  </g>
  <g id="part-wheel-front-R">
    <polygon points="48,12 54,14 54,24 47,25" fill="url(#es-carbon)" stroke="#09090b" stroke-width="1.2"/>
    <line x1="48" y1="16" x2="53" y2="16" stroke="#94a3b8" stroke-width="1"/>
    <line x1="48" y1="21" x2="53" y2="21" stroke="#94a3b8" stroke-width="1"/>
  </g>
  <g id="part-track-rear-L">
    <rect x="9" y="29" width="8" height="23" rx="2" fill="url(#es-carbon)" stroke="#09090b" stroke-width="1.3"/>
    <path d="M10 33 H16 M10 38 H16 M10 43 H16 M10 48 H16" stroke="#71717a" stroke-width="1.2"/>
  </g>
  <g id="part-track-rear-R">
    <rect x="47" y="29" width="8" height="23" rx="2" fill="url(#es-carbon)" stroke="#09090b" stroke-width="1.3"/>
    <path d="M48 33 H54 M48 38 H54 M48 43 H54 M48 48 H54" stroke="#71717a" stroke-width="1.2"/>
  </g>

  <!-- 4. Diamond-Wedge Forged Carbon & Crimson Titanium Hull Chassis -->
  <g id="part-hull-chassis">
    <polygon points="32,8 47,19 49,49 39,55 25,55 15,49 17,19" fill="url(#es-hull)" stroke="#18181b" stroke-width="1.5"/>
    <!-- Forged Carbon Stealth Facets -->
    <polygon points="32,11 43,20 32,25 21,20" fill="url(#es-carbon)" stroke="#fca5a5" stroke-width="0.6" stroke-opacity="0.45"/>
    <polygon points="20,39 44,39 41,52 23,52" fill="#18181b" stroke="#dc2626" stroke-width="0.8"/>
    <!-- Glowing Magma Exhaust Louvers -->
    <path d="M24 43 H40 M25 46 H39 M26 49 H38" stroke="#f97316" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- 5. Heat-Blued Twin Rapid Rotary Autocannons -->
  <g id="part-barrel-twin-mg">
    <rect x="26.5" y="3" width="3.5" height="21" rx="1" fill="url(#es-barrel-temper)" stroke="#0f172a" stroke-width="1"/>
    <rect x="34" y="3" width="3.5" height="21" rx="1" fill="url(#es-barrel-temper)" stroke="#0f172a" stroke-width="1"/>
    <rect x="25.5" y="8" width="13" height="3" rx="1" fill="#334155" stroke="#fde047" stroke-width="0.6"/>
  </g>

  <!-- 6. Radial Multi-Faceted Stealth Recon Turret -->
  <g id="part-turret-body">
    <polygon points="32,16 43,23 41,37 32,42 23,37 21,23" fill="url(#es-turret-facet)" stroke="#09090b" stroke-width="1.4"/>
    <polygon points="32,16 43,23 32,29" fill="#fca5a5" opacity="0.28"/>
    <polygon points="32,16 21,23 32,29" fill="#ef4444" opacity="0.22"/>
    <polygon points="21,23 23,37 32,29" fill="#450a0a" opacity="0.5"/>
    <polygon points="43,23 41,37 32,29" fill="#1e1b4b" opacity="0.45"/>
    <polygon points="23,37 32,42 41,37 32,29" fill="#09090b" opacity="0.65"/>
  </g>

  <!-- 7. Specular Chamfer Rim & High-Luminance Optic Core -->
  <path id="part-light-rim-body" d="M32,9 L46,19 M22,23 L32,17 L42,23" fill="none" stroke="#fef08a" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
  <g id="part-sensor-optic">
    <polygon points="32,24 37,29 32,34 27,29" fill="#09090b" stroke="#f87171" stroke-width="1"/>
    <circle cx="32" cy="29" r="2.6" fill="#fde047"/>
  </g>
  <circle id="part-aura-corona-top" cx="32" cy="29" r="1.4" fill="#ffffff"/>
</svg>

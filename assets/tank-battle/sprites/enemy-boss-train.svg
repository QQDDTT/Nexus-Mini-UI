<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- STYLE-170 x STYLE-142: Dreadnought Armored Magma-Core Boss Train -->
    <linearGradient id="eb-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="18%" stop-color="#ef4444"/>
      <stop offset="48%" stop-color="#991b1b"/>
      <stop offset="78%" stop-color="#31102f"/>
      <stop offset="100%" stop-color="#09050d"/>
    </linearGradient>
    <linearGradient id="eb-carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="40%" stop-color="#27272a"/>
      <stop offset="75%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="eb-barrel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="eb-reactor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>

  <!-- 1. Ground Cast Shadow & Hexagonal Magma Field -->
  <ellipse id="part-shadow-cast" cx="34" cy="34" rx="28" ry="30" fill="#020305" opacity="0.9"/>
  <polygon id="part-aura-ring-outer" points="32,1 61,16 61,48 32,63 3,48 3,16" fill="#dc2626" fill-opacity="0.16" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.55"/>
  <polygon id="part-aura-ring-inner" points="32,5 56,18 56,46 32,59 8,46 8,18" fill="none" stroke="#fde047" stroke-width="0.9" stroke-opacity="0.4"/>

  <!-- 2. Headlight Cone, Forward Tungsten Ram & Rear Magma Thruster -->
  <polygon id="part-light-cone-main" points="32,8 12,0 52,0" fill="#fde047" opacity="0.25"/>
  <g id="part-cowcatcher-ram">
    <polygon points="32,1 50,9 46,14 18,14 14,9" fill="url(#eb-carbon)" stroke="#fde047" stroke-width="1.1"/>
    <path d="M22,12 L26,5 M32,12 L32,3 M42,12 L38,5" stroke="#f59e0b" stroke-width="1.4"/>
  </g>
  <g id="part-thruster-rear">
    <polygon points="22,57 32,64 42,57" fill="#f97316"/>
    <polygon points="26,57 32,62 38,57" fill="#fef08a"/>
  </g>

  <!-- 3. Six Articulated Heavy Rail Bogie Tracks -->
  <rect id="part-bogie-front-L" x="5" y="10" width="7" height="13" rx="1.5" fill="url(#eb-carbon)" stroke="#09090b" stroke-width="1.2"/>
  <rect id="part-bogie-front-R" x="52" y="10" width="7" height="13" rx="1.5" fill="url(#eb-carbon)" stroke="#09090b" stroke-width="1.2"/>
  <rect id="part-bogie-mid-L" x="5" y="25" width="7" height="14" rx="1.5" fill="url(#eb-carbon)" stroke="#09090b" stroke-width="1.2"/>
  <rect id="part-bogie-mid-R" x="52" y="25" width="7" height="14" rx="1.5" fill="url(#eb-carbon)" stroke="#09090b" stroke-width="1.2"/>
  <rect id="part-bogie-rear-L" x="5" y="41" width="7" height="13" rx="1.5" fill="url(#eb-carbon)" stroke="#09090b" stroke-width="1.2"/>
  <rect id="part-bogie-rear-R" x="52" y="41" width="7" height="13" rx="1.5" fill="url(#eb-carbon)" stroke="#09090b" stroke-width="1.2"/>

  <!-- 4. Three-Section Dreadnought Armored Hull Cars -->
  <g id="part-car-front">
    <polygon points="16,9 48,9 51,23 13,23" fill="url(#eb-armor)" stroke="#09090b" stroke-width="1.4"/>
  </g>
  <g id="part-car-rear">
    <polygon points="13,41 51,41 48,57 16,57" fill="url(#eb-armor)" stroke="#09090b" stroke-width="1.4"/>
  </g>
  <g id="part-car-mid">
    <polygon points="12,23 52,23 52,41 12,41" fill="url(#eb-carbon)" stroke="#f59e0b" stroke-width="1.2"/>
  </g>

  <!-- 5. VLS Missile Cells & Exposed 1200C Magma Fusion Core -->
  <g id="part-vls-hatch-L">
    <rect x="14" y="26" width="8" height="12" rx="1" fill="#18181b" stroke="#f97316" stroke-width="0.9"/>
    <circle cx="18" cy="29" r="1.4" fill="#fde047"/>
    <circle cx="18" cy="35" r="1.4" fill="#fde047"/>
  </g>
  <g id="part-vls-hatch-R">
    <rect x="42" y="26" width="8" height="12" rx="1" fill="#18181b" stroke="#f97316" stroke-width="0.9"/>
    <circle cx="46" cy="29" r="1.4" fill="#fde047"/>
    <circle cx="46" cy="35" r="1.4" fill="#fde047"/>
  </g>
  <g id="part-reactor-core">
    <polygon points="32,24 40,29 40,35 32,40 24,35 24,29" fill="url(#eb-reactor)" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- 6. Heat-Blued Main & Secondary Siege Barrels + Multi-Faceted Stealth Turrets -->
  <rect id="part-barrel-front" x="29" y="1" width="6" height="16" rx="1" fill="url(#eb-barrel)" stroke="#09090b" stroke-width="1"/>
  <rect id="part-barrel-rear-L" x="24" y="34" width="4.5" height="14" rx="1" fill="url(#eb-barrel)" stroke="#09090b" stroke-width="1"/>
  <rect id="part-barrel-rear-R" x="35.5" y="34" width="4.5" height="14" rx="1" fill="url(#eb-barrel)" stroke="#09090b" stroke-width="1"/>

  <g id="part-turret-front">
    <polygon points="32,11 43,16 40,24 24,24 21,16" fill="url(#eb-armor)" stroke="#fde047" stroke-width="1"/>
  </g>
  <g id="part-turret-rear">
    <polygon points="32,40 44,45 41,54 23,54 20,45" fill="url(#eb-armor)" stroke="#fde047" stroke-width="1"/>
  </g>
  <circle id="part-aa-turret-L" cx="18" cy="17" r="3.5" fill="url(#eb-carbon)" stroke="#fde047" stroke-width="0.9"/>
  <circle id="part-aa-turret-R" cx="46" cy="17" r="3.5" fill="url(#eb-carbon)" stroke="#fde047" stroke-width="0.9"/>

  <!-- 7. Specular Edge Rims & Core Corona -->
  <path id="part-light-rim-cars" d="M16,9 H48 M12,23 H52 M13,41 H51" fill="none" stroke="#fef08a" stroke-width="1.1"/>
  <path id="part-light-rim-turrets" d="M21,16 L32,11 L43,16 M20,45 L32,40 L44,45" fill="none" stroke="#ffffff" stroke-width="1.1"/>
  <circle id="part-aura-corona-top" cx="32" cy="32" r="2.8" fill="#ffffff"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="player-tank-p2-rig" data-root-anchor="64,68" data-has-aura="true">
  <defs>
    <!-- 1. 熔岩玄武岩接触软阴影与 1200°C 金脉热辐射光晕 (STYLE-170) -->
    <radialGradient id="p2-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d0b0e" stop-opacity="0.82" />
      <stop offset="62%" stop-color="#18141a" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#18141a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="p2-aura-field" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.32" />
      <stop offset="56%" stop-color="#a855f7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#141215" stop-opacity="0" />
    </radialGradient>

    <!-- 2. 锻造碳纤维与拉丝钛钨钢 6 阶 Gooch 冷暖渐变 (STYLE-142) -->
    <linearGradient id="p2-forged-carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#525a6b" />
      <stop offset="30%" stop-color="#39404d" />
      <stop offset="60%" stop-color="#272b35" />
      <stop offset="85%" stop-color="#1b1e26" />
      <stop offset="100%" stop-color="#2d2338" />
    </linearGradient>
    <linearGradient id="p2-titanium-facet" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#6b768a" />
      <stop offset="25%" stop-color="#4c5566" />
      <stop offset="55%" stop-color="#313744" />
      <stop offset="80%" stop-color="#21252f" />
      <stop offset="100%" stop-color="#312740" />
    </linearGradient>

    <!-- 3. 双联装滑膛炮管高温回火蓝-紫-金渐变色晕 (Titanium Heat-Bluing) -->
    <linearGradient id="p2-barrel-heat-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="18%" stop-color="#f59e0b" />
      <stop offset="36%" stop-color="#c084fc" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="75%" stop-color="#3f4758" />
      <stop offset="100%" stop-color="#252933" />
    </linearGradient>

    <linearGradient id="p2-gold-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="p2-rim-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="p2-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- [光影层 1] 车底玄武岩接触软阴影 (z=1, multiply) -->
  <g id="part-shadow-cast" data-pivot="64,70" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="70" rx="54" ry="50" fill="url(#p2-shadow-grad)" />
    <polygon points="64,18 106,42 106,94 64,118 22,94 22,42" fill="#0d0b0e" fill-opacity="0.48" />
  </g>

  <!-- [光影层 2A] 六方玄武岩熔岩金脉底座外环 (z=4, screen) -->
  <g id="part-aura-ring-outer" data-pivot="64,68" data-parent="root" data-z-index="4" data-blend="screen" data-motion="spin-cw" style="mix-blend-mode: screen">
    <circle cx="64" cy="68" r="58" fill="url(#p2-aura-field)" />
    <polygon points="64,11 113,39.5 113,96.5 64,125 15,96.5 15,39.5" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.76" stroke-linejoin="bevel" />
    <path d="M64,11 L64,21 M113,39.5 L104,44.5 M113,96.5 L104,91.5 M64,125 L64,115 M15,96.5 L24,91.5 M15,39.5 L24,44.5" stroke="#c084fc" stroke-width="1.4" stroke-opacity="0.82" />
  </g>

  <!-- [光影层 2B] 陀螺仪火控密位分划内环 (z=5, screen) -->
  <g id="part-aura-ring-inner" data-pivot="64,68" data-parent="root" data-z-index="5" data-blend="screen" data-motion="spin-ccw" style="mix-blend-mode: screen">
    <polygon points="64,23 103,45.5 103,90.5 64,113 25,90.5 25,45.5" fill="none" stroke="#c084fc" stroke-width="1.1" stroke-opacity="0.68" />
    <circle cx="64" cy="23" r="2.1" fill="#fde047" />
    <circle cx="103" cy="45.5" r="2.1" fill="#c084fc" />
    <circle cx="103" cy="90.5" r="2.1" fill="#fbbf24" />
    <circle cx="64" cy="113" r="2.1" fill="#fde047" />
    <circle cx="25" cy="90.5" r="2.1" fill="#fbbf24" />
    <circle cx="25" cy="45.5" r="2.1" fill="#c084fc" />
  </g>

  <!-- [光影层 3] 前向热能火控扫描光锥 (z=8, screen) -->
  <g id="part-light-cone-main" data-pivot="64,50" data-parent="part-turret-body" data-z-index="8" data-blend="screen" style="mix-blend-mode: screen">
    <polygon points="64,50 38,4 90,4" fill="url(#p2-aura-field)" opacity="0.68" />
    <line x1="64" y1="48" x2="64" y2="4" stroke="#fde047" stroke-width="0.8" stroke-opacity="0.72" />
  </g>

  <!-- [骨骼部件 1 & 2] 双侧燃气轮机尾焰喷流 (z=10) -->
  <g id="part-exhaust-plume-L" data-pivot="46,108" data-parent="part-hull-chassis" data-z-index="10" data-blend="screen" data-motion="scale-pulse" style="mix-blend-mode: screen">
    <polygon points="40,106 52,106 50,124 46,127 42,124" fill="#c084fc" fill-opacity="0.82" />
    <polygon points="43,106 49,106 46,121" fill="#fef08a" />
  </g>
  <g id="part-exhaust-plume-R" data-pivot="82,108" data-parent="part-hull-chassis" data-z-index="10" data-blend="screen" data-motion="scale-pulse" style="mix-blend-mode: screen">
    <polygon points="76,106 88,106 86,124 82,127 78,124" fill="#c084fc" fill-opacity="0.82" />
    <polygon points="79,106 85,106 82,121" fill="#fef08a" />
  </g>

  <!-- [骨骼部件 3 & 4] 左右独立重装差速钛钢履带 (z=15) -->
  <g id="part-track-left" data-pivot="26,68" data-parent="part-hull-chassis" data-z-index="15" data-blend="normal" data-motion="scroll-uv-left">
    <polygon points="16,28 22,22 34,22 34,110 22,110 16,104" fill="#161820" stroke="#fbbf24" stroke-width="1.8" stroke-linejoin="bevel" />
    <rect x="18" y="27" width="14" height="78" fill="#272b35" stroke="#424a59" stroke-width="0.9" />
    <path d="M17 33 H33 M17 42 H33 M17 51 H33 M17 60 H33 M17 69 H33 M17 78 H33 M17 87 H33 M17 96 H33" stroke="#fbbf24" stroke-width="1.3" stroke-opacity="0.72" />
    <circle cx="25" cy="32" r="3" fill="#181a22" stroke="#c084fc" stroke-width="0.9" />
    <circle cx="25" cy="66" r="3" fill="#181a22" stroke="#c084fc" stroke-width="0.9" />
    <circle cx="25" cy="100" r="3" fill="#181a22" stroke="#c084fc" stroke-width="0.9" />
  </g>
  <g id="part-track-right" data-pivot="102,68" data-parent="part-hull-chassis" data-z-index="15" data-blend="normal" data-motion="scroll-uv-right">
    <polygon points="94,22 106,22 112,28 112,104 106,110 94,110" fill="#161820" stroke="#fbbf24" stroke-width="1.8" stroke-linejoin="bevel" />
    <rect x="96" y="27" width="14" height="78" fill="#272b35" stroke="#424a59" stroke-width="0.9" />
    <path d="M95 33 H111 M95 42 H111 M95 51 H111 M95 60 H111 M95 69 H111 M95 78 H111 M95 87 H111 M95 96 H111" stroke="#fbbf24" stroke-width="1.3" stroke-opacity="0.72" />
    <circle cx="103" cy="32" r="3" fill="#181a22" stroke="#c084fc" stroke-width="0.9" />
    <circle cx="103" cy="66" r="3" fill="#181a22" stroke="#c084fc" stroke-width="0.9" />
    <circle cx="103" cy="100" r="3" fill="#181a22" stroke="#c084fc" stroke-width="0.9" />
  </g>

  <!-- [骨骼部件 5] 锻造碳纤维与楔形多面体主底盘 (z=25) -->
  <g id="part-hull-chassis" data-pivot="64,68" data-parent="root" data-z-index="25" data-blend="normal">
    <polygon points="42,18 86,18 98,34 98,98 86,110 42,110 30,98 30,34" fill="url(#p2-forged-carbon)" stroke="url(#p2-gold-edge)" stroke-width="2.2" stroke-linejoin="bevel" />
    <polygon points="42,18 64,14 86,18 92,36 64,32 36,36" fill="url(#p2-titanium-facet)" stroke="#fbbf24" stroke-width="1.2" stroke-linejoin="bevel" />
    <polygon points="36,36 64,32 92,36 92,94 82,104 46,104 36,94" fill="#252933" stroke="#4c5566" stroke-width="1.1" />
    <path d="M40 90 H88 M40 95 H88 M40 100 H88 M48 88 V103 M64 88 V103 M80 88 V103" stroke="#fbbf24" stroke-width="0.85" stroke-opacity="0.7" />
    <rect x="41" y="104" width="12" height="5" rx="1" fill="#4c1d95" stroke="#fbbf24" stroke-width="0.9" />
    <rect x="75" y="104" width="12" height="5" rx="1" fill="#4c1d95" stroke="#fbbf24" stroke-width="0.9" />
  </g>

  <!-- [骨骼部件 6] 360° 陀螺稳定轴承座圈 (z=30) -->
  <g id="part-turret-ring" data-pivot="64,68" data-parent="part-hull-chassis" data-z-index="30" data-blend="normal">
    <circle cx="64" cy="68" r="25" fill="#151820" stroke="#fbbf24" stroke-width="1.6" />
    <circle cx="64" cy="68" r="21.5" fill="#1e222b" stroke="#c084fc" stroke-width="0.9" stroke-opacity="0.75" />

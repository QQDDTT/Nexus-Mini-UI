  <g id="part-barrel-left" data-pivot="56,50" data-parent="part-turret-body" data-z-index="35" data-blend="normal" data-motion="recoil-y-alt-L">
    <circle cx="56" cy="50" r="6" fill="#1f242d" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="52" y="6" width="8" height="44" rx="1.5" fill="url(#p2-barrel-heat-blue)" stroke="url(#p2-gold-edge)" stroke-width="1.8" />
    <rect x="51" y="20" width="10" height="8" rx="1" fill="#2d3542" stroke="#fde047" stroke-width="1.1" />
    <line x1="56" y1="8" x2="56" y2="44" stroke="#fef9c3" stroke-width="0.9" />
  </g>
  <g id="part-barrel-right" data-pivot="72,50" data-parent="part-turret-body" data-z-index="35" data-blend="normal" data-motion="recoil-y-alt-R">
    <circle cx="72" cy="50" r="6" fill="#1f242d" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="68" y="6" width="8" height="44" rx="1.5" fill="url(#p2-barrel-heat-blue)" stroke="url(#p2-gold-edge)" stroke-width="1.8" />
    <rect x="67" y="20" width="10" height="8" rx="1" fill="#2d3542" stroke="#fde047" stroke-width="1.1" />
    <line x1="72" y1="8" x2="72" y2="44" stroke="#fef9c3" stroke-width="0.9" />
  </g>

  <!-- [骨骼部件 8 & 9] 双联炮口制退器护翼片 (z=38) -->
  <g id="part-rail-jaw-L" data-pivot="50,22" data-parent="part-barrel-left" data-z-index="38" data-blend="normal" data-motion="rotate-jaw-left">
    <polygon points="50,20 44,16 45,6 50,8" fill="#3d4859" stroke="#fde047" stroke-width="1.3" />
  </g>
  <g id="part-rail-jaw-R" data-pivot="78,22" data-parent="part-barrel-right" data-z-index="38" data-blend="normal" data-motion="rotate-jaw-right">
    <polygon points="78,20 84,16 83,6 78,8" fill="#3d4859" stroke="#fde047" stroke-width="1.3" />
  </g>

  <!-- [骨骼部件 10] 放射多面体反应装甲双联隐身炮塔 (z=40) -->
  <g id="part-turret-body" data-pivot="64,68" data-parent="part-turret-ring" data-z-index="40" data-blend="normal" data-motion="aim-rotate-360">
    <polygon points="50,40 78,40 90,56 86,82 74,95 54,95 42,82 38,56" fill="url(#p2-titanium-facet)" stroke="url(#p2-gold-edge)" stroke-width="2.2" stroke-linejoin="bevel" />
    <polygon points="50,40 64,52 78,40 82,58 64,56 46,58" fill="#485163" stroke="#fde047" stroke-width="0.9" stroke-opacity="0.8" />
    <polygon points="48,78 64,74 80,78 74,95 54,95" fill="#1e222b" stroke="#fbbf24" stroke-width="0.9" />
    <polygon points="64,55 75,62 75,74 64,81 53,74 53,62" fill="#161820" stroke="#fbbf24" stroke-width="1.4" />
    <circle cx="64" cy="68" r="6.5" fill="url(#p2-core-glow)" />
    <circle cx="64" cy="68" r="2.4" fill="#fef9c3" />
  </g>

  <!-- [光影层 4A & 4B] 0.4px 亚毫米倒角亮边与回火反光 (z=45, 46) -->
  <g id="part-light-rim-hull" data-pivot="64,68" data-parent="part-hull-chassis" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M42 18 L64 14 L86 18 L98 34 M30 34 L42 18" stroke="url(#p2-rim-glow)" stroke-width="2.4" stroke-linecap="round" />
  </g>
  <g id="part-light-rim-turret" data-pivot="64,68" data-parent="part-turret-body" data-z-index="46" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M50 40 H78 L90 56 M38 56 L50 40 M50 40 L64 52 L78 40" stroke="url(#p2-rim-glow)" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- [骨骼部件 11] 车长周视光电热像球 (z=50) -->
  <g id="part-radar-scanner" data-pivot="74,78" data-parent="part-turret-body" data-z-index="50" data-blend="normal" data-motion="spin-cw">
    <circle cx="74" cy="78" r="5.5" fill="#181b22" stroke="#fde047" stroke-width="1.4" />
    <path d="M68.5 76 C71 71 77 71 79.5 76" stroke="#c084fc" stroke-width="1.6" stroke-linecap="round" />
    <line x1="74" y1="78" x2="74" y2="70.5" stroke="#fef08a" stroke-width="1.3" />
    <circle cx="74" cy="78" r="2.0" fill="#fbbf24" />
  </g>

  <!-- [光影层 5] 顶层跳弹火星与回火电晕 (z=65, screen) -->
  <g id="part-aura-corona-top" data-pivot="64,68" data-parent="root" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <path d="M26 30 L34 22 L30 14 L42 10 M102 30 L94 22 L98 14 L86 10" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="42" cy="10" r="2.0" fill="#fef08a" />
    <circle cx="86" cy="10" r="2.0" fill="#fef08a" />
    <circle cx="64" cy="5" r="2.4" fill="#c084fc" />
  </g>
</svg>

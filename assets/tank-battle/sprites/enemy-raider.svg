<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- STYLE-170 x STYLE-142: 5-Stop Gooch Warm-to-Cool Interceptor Armor -->
    <linearGradient id="er-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="24%" stop-color="#ea580c"/>
      <stop offset="55%" stop-color="#9a3412"/>
      <stop offset="82%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#180905"/>
    </linearGradient>
    <linearGradient id="er-carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="35%" stop-color="#27272a"/>
      <stop offset="70%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <!-- Heat-Blued Twin Plasma Barrel Gradient -->
    <linearGradient id="er-barrel-temper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="20%" stop-color="#f97316"/>
      <stop offset="48%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="er-turret-facet" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="28%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#9a3412"/>
      <stop offset="85%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#13071e"/>
    </linearGradient>
    <radialGradient id="er-magma-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#ea580c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Cast Shadow & Hexagonal Basalt Magma Footprint -->
  <ellipse id="part-shadow-cast" cx="34" cy="35" rx="25" ry="26" fill="#040507" opacity="0.84"/>
  <polygon id="part-aura-ring-outer" points="32,4 58,18 58,46 32,60 6,46 6,18" fill="url(#er-magma-aura)" stroke="#fb923c" stroke-width="0.9" stroke-opacity="0.42"/>
  <polygon id="part-aura-ring-inner" points="32,9 52,20 52,44 32,55 12,44 12,20" fill="none" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.32"/>

  <!-- 2. Forward Targeting Cone & Twin Overdrive Exhaust Plumes -->
  <polygon id="part-light-cone-main" points="32,16 15,2 49,2" fill="#fb923c" opacity="0.18"/>
  <g id="part-exhaust-plume-L">
    <polygon points="18,54 22,63 26,54" fill="#f97316" opacity="0.9"/>
    <polygon points="20,54 22,59 24,54" fill="#fef08a"/>
  </g>
  <g id="part-exhaust-plume-R">
    <polygon points="38,54 42,63 46,54" fill="#f97316" opacity="0.9"/>
    <polygon points="40,54 42,59 44,54" fill="#fef08a"/>
  </g>

  <!-- 3. Swept-Wing Armored Tracks -->
  <g id="part-track-left">
    <polygon points="7,12 16,9 16,55 7,52" fill="url(#er-carbon)" stroke="#09090b" stroke-width="1.4"/>
    <path d="M8 16 H15 M8 22 H15 M8 28 H15 M8 34 H15 M8 40 H15 M8 46 H15" stroke="#71717a" stroke-width="1.3"/>
  </g>
  <g id="part-track-right">
    <polygon points="48,9 57,12 57,52 48,55" fill="url(#er-carbon)" stroke="#09090b" stroke-width="1.4"/>
    <path d="M49 16 H56 M49 22 H56 M49 28 H56 M49 34 H56 M49 40 H56 M49 46 H56" stroke="#71717a" stroke-width="1.3"/>
  </g>

  <!-- 4. Forward-Swept Winged ERA Hull Chassis -->
  <g id="part-hull-chassis">
    <polygon points="32,7 50,15 52,32 46,54 18,54 12,32 14,15" fill="url(#er-hull)" stroke="#18181b" stroke-width="1.5"/>
    <!-- Forged Carbon ERA Reactive Blocks -->
    <polygon points="16,16 29,11 29,24 14,27" fill="url(#er-carbon)" stroke="#fdba74" stroke-width="0.6" stroke-opacity="0.5"/>
    <polygon points="48,16 35,11 35,24 50,27" fill="url(#er-carbon)" stroke="#fdba74" stroke-width="0.6" stroke-opacity="0.5"/>
    <!-- Rear Turbine Deck -->
    <rect x="20" y="42" width="24" height="9" rx="1.5" fill="#18181b" stroke="#ea580c" stroke-width="0.9"/>
    <path d="M23 45 H41 M23 48 H41" stroke="#fb923c" stroke-width="1.3"/>
  </g>

  <!-- 5. Twin Heat-Blued Rapid Plasma Cannons -->
  <g id="part-barrel-plasma-L">
    <rect x="22" y="2" width="5" height="22" rx="1.2" fill="url(#er-barrel-temper)" stroke="#09090b" stroke-width="1.1"/>
    <rect x="21.5" y="2" width="6" height="3.5" rx="0.8" fill="#fef08a"/>
  </g>
  <g id="part-barrel-plasma-R">
    <rect x="37" y="2" width="5" height="22" rx="1.2" fill="url(#er-barrel-temper)" stroke="#09090b" stroke-width="1.1"/>
    <rect x="36.5" y="2" width="6" height="3.5" rx="0.8" fill="#fef08a"/>
  </g>

  <!-- 6. Radial Multi-Faceted Stealth Interceptor Turret -->
  <g id="part-turret-body">
    <polygon points="32,14 46,22 43,39 32,44 21,39 18,22" fill="url(#er-turret-facet)" stroke="#09090b" stroke-width="1.5"/>
    <polygon points="32,14 46,22 32,29" fill="#fed7aa" opacity="0.3"/>
    <polygon points="32,14 18,22 32,29" fill="#fb923c" opacity="0.22"/>
    <polygon points="18,22 21,39 32,29" fill="#431407" opacity="0.52"/>
    <polygon points="46,22 43,39 32,29" fill="#2e1065" opacity="0.48"/>
    <polygon points="21,39 32,44 43,39 32,29" fill="#09090b" opacity="0.68"/>
    <polygon points="32,23 38,29 32,35 26,29" fill="#18181b" stroke="#fb923c" stroke-width="1.1"/>
  </g>

  <!-- 7. Specular Edge Highlight & Core -->
  <path id="part-light-rim-body" d="M18,22 L32,14 L46,22 M15,15 L32,8 L49,15" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <circle id="part-aura-corona-top" cx="32" cy="29" r="2.8" fill="#fef08a" stroke="#f97316" stroke-width="1"/>
</svg>

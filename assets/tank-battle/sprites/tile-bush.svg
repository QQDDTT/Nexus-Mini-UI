<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- STYLE-170 x STYLE-142: Scorched Volcanic Ash-Fern & Stealth Camo Canopy over Magma Vents -->
    <linearGradient id="tbu-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="28%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#065f46"/>
      <stop offset="85%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="tbu-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="25%" stop-color="#34d399"/>
      <stop offset="58%" stop-color="#059669"/>
      <stop offset="85%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="tbu-crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#6ee7b7"/>
      <stop offset="68%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <!-- 1. Ground Shadow & Hexagonal Stealth Canopy Ring -->
  <ellipse id="part-shadow-cast" cx="33" cy="35" rx="28" ry="27" fill="#030507" opacity="0.72"/>
  <polygon id="part-aura-ring-outer" points="32,3 59,18 59,46 32,61 5,46 5,18" fill="none" stroke="#10b981" stroke-width="0.9" stroke-opacity="0.38"/>
  <polygon id="part-aura-ring-inner" points="32,9 53,21 53,43 32,55 11,43 11,21" fill="none" stroke="#fde047" stroke-width="0.7" stroke-opacity="0.28"/>

  <!-- 2. Four Quadrant Multi-Faceted Stealth Camo Netting & Mineral Frond Clusters -->
  <g id="part-frond-tl">
    <polygon id="part-tl" points="18,6 32,12 29,29 14,31 5,20 9,10" fill="url(#tbu-deep)" stroke="#022c22" stroke-width="1.3"/>
    <path d="M10,12 L26,25 M18,9 L24,22" stroke="#6ee7b7" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <g id="part-frond-tr">
    <polygon id="part-tr" points="46,6 56,11 59,22 49,32 34,29 33,12" fill="url(#tbu-mid)" stroke="#022c22" stroke-width="1.3"/>
    <path d="M53,12 L37,25 M45,9 L39,22" stroke="#a7f3d0" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <g id="part-frond-bl">
    <polygon id="part-bl" points="6,39 16,29 31,34 29,52 17,58 7,50" fill="url(#tbu-mid)" stroke="#022c22" stroke-width="1.3"/>
    <path d="M11,49 L27,37 M18,54 L25,40" stroke="#6ee7b7" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <g id="part-frond-br">
    <polygon id="part-br" points="34,34 49,30 58,41 55,53 43,59 31,51" fill="url(#tbu-deep)" stroke="#022c22" stroke-width="1.3"/>
    <path d="M52,49 L37,37 M44,54 L38,41" stroke="#34d399" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- 3. Central Sunlit Thermal-Masking Crown -->
  <g id="part-frond-center">
    <polygon points="32,14 45,21 47,35 38,46 25,45 17,34 20,20" fill="url(#tbu-crown)" stroke="#064e3b" stroke-width="1.3"/>
    <polygon points="32,20 40,25 38,36 32,40 25,35 25,25" fill="#a7f3d0" opacity="0.35"/>
    <!-- Glowing Geothermal Spore Nodes -->
    <circle cx="28" cy="27" r="1.8" fill="#fde047"/>
    <circle cx="36" cy="31" r="1.5" fill="#fde047"/>
    <circle cx="31" cy="36" r="1.4" fill="#fb923c"/>
  </g>

  <!-- 4. Specular Rim & Canopy Apex -->
  <path id="part-light-rim-bush" d="M20,20 L32,14 L45,21" fill="none" stroke="#fef9c3" stroke-width="1.3" stroke-linecap="round"/>
  <circle id="part-aura-corona-top" cx="32" cy="29" r="2" fill="#fef9c3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="player-tank-p1-rig" data-root-anchor="64,68" data-has-aura="true">
  <defs>
    <!-- 1. 熔岩玄武岩接触软阴影与 1200°C 金脉热辐射光晕 (STYLE-170) -->
    <radialGradient id="p1-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d0b0e" stop-opacity="0.82" />
      <stop offset="60%" stop-color="#18141a" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#18141a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="p1-aura-field" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.34" />
      <stop offset="52%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#141215" stop-opacity="0" />
    </radialGradient>

    <!-- 2. 锻造碳纤维与拉丝钛钨钢 6 阶 Gooch 冷暖渐变 (STYLE-142) -->
    <linearGradient id="p1-forged-carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5362" />
      <stop offset="28%" stop-color="#363c48" />
      <stop offset="58%" stop-color="#252932" />
      <stop offset="82%" stop-color="#1b1d24" />
      <stop offset="100%" stop-color="#2a2232" />
    </linearGradient>
    <linearGradient id="p1-titanium-facet" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#646e80" />
      <stop offset="22%" stop-color="#485060" />
      <stop offset="50%" stop-color="#2f3541" />
      <stop offset="78%" stop-color="#1f232c" />
      <stop offset="100%" stop-color="#2e253b" />
    </linearGradient>

    <!-- 3. 120mm 滑膛炮管高温回火蓝-紫-金渐变色晕 (Titanium Heat-Bluing Gradient) -->
    <linearGradient id="p1-barrel-heat-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="16%" stop-color="#f59e0b" />
      <stop offset="34%" stop-color="#c084fc" />
      <stop offset="52%" stop-color="#6366f1" />
      <stop offset="72%" stop-color="#3b4354" />
      <stop offset="100%" stop-color="#232730" />
    </linearGradient>

    <!-- 4. 0.4px 亚毫米倒角亮边与熔岩金脉折光 -->
    <linearGradient id="p1-magma-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="p1-rim-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="p1-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="42%" stop-color="#f59e0b" />
      <stop offset="78%" stop-color="#9333ea" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- [光影层 1] 车底玄武岩接触软阴影 (z=1, multiply) -->
  <g id="part-shadow-cast" data-pivot="64,70" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="70" rx="54" ry="50" fill="url(#p1-shadow-grad)" />
    <polygon points="64,18 106,42 106,94 64,118 22,94 22,42" fill="#0d0b0e" fill-opacity="0.48" />
  </g>

  <!-- [光影层 2A] 六方柱状节理玄武岩熔岩金脉底座外环 (z=4, screen) -->
  <g id="part-aura-ring-outer" data-pivot="64,68" data-parent="root" data-z-index="4" data-blend="screen" data-motion="spin-cw" style="mix-blend-mode: screen">
    <circle cx="64" cy="68" r="58" fill="url(#p1-aura-field)" />
    <polygon points="64,11 113,39.5 113,96.5 64,125 15,96.5 15,39.5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.76" stroke-linejoin="bevel" />
    <path d="M64,11 L64,21 M113,39.5 L104,44.5 M113,96.5 L104,91.5 M64,125 L64,115 M15,96.5 L24,91.5 M15,39.5 L24,44.5" stroke="#fde047" stroke-width="1.4" stroke-opacity="0.85" />
    <polygon points="61,9 67,9 64,15" fill="#fde047" />
    <polygon points="61,127 67,127 64,121" fill="#f59e0b" />
  </g>

  <!-- [光影层 2B] 陀螺仪火控密位分划内环 (z=5, screen) -->
  <g id="part-aura-ring-inner" data-pivot="64,68" data-parent="root" data-z-index="5" data-blend="screen" data-motion="spin-ccw" style="mix-blend-mode: screen">
    <polygon points="64,23 103,45.5 103,90.5 64,113 25,90.5 25,45.5" fill="none" stroke="#d97706" stroke-width="1.1" stroke-opacity="0.68" />
    <circle cx="64" cy="23" r="2.1" fill="#fde047" />
    <circle cx="103" cy="45.5" r="2.1" fill="#f59e0b" />
    <circle cx="103" cy="90.5" r="2.1" fill="#f59e0b" />
    <circle cx="64" cy="113" r="2.1" fill="#fde047" />
    <circle cx="25" cy="90.5" r="2.1" fill="#f59e0b" />
    <circle cx="25" cy="45.5" r="2.1" fill="#f59e0b" />
  </g>

  <!-- [光影层 3] 前向火控测距光锥 (z=8, screen) -->
  <g id="part-light-cone-main" data-pivot="64,50" data-parent="part-turret-body" data-z-index="8" data-blend="screen" style="mix-blend-mode: screen">
    <polygon points="64,50 42,4 86,4" fill="url(#p1-aura-field)" opacity="0.68" />
    <line x1="64" y1="48" x2="64" y2="4" stroke="#fde047" stroke-width="0.85" stroke-opacity="0.75" />
  </g>

  <!-- [骨骼部件 1 & 2] 双侧燃气轮机高温回火尾焰 (z=10) -->
  <g id="part-exhaust-plume-L" data-pivot="46,108" data-parent="part-hull-chassis" data-z-index="10" data-blend="screen" data-motion="scale-pulse" style="mix-blend-mode: screen">
    <polygon points="40,106 52,106 50,124 46,127 42,124" fill="#f59e0b" fill-opacity="0.82" />
    <polygon points="43,106 49,106 46,121" fill="#fef08a" />
  </g>
  <g id="part-exhaust-plume-R" data-pivot="82,108" data-parent="part-hull-chassis" data-z-index="10" data-blend="screen" data-motion="scale-pulse" style="mix-blend-mode: screen">
    <polygon points="76,106 88,106 86,124 82,127 78,124" fill="#f59e0b" fill-opacity="0.82" />
    <polygon points="79,106 85,106 82,121" fill="#fef08a" />
  </g>

  <!-- [骨骼部件 3 & 4] 左右重装差速钛钢履带总成 (z=15) -->
  <g id="part-track-left" data-pivot="26,68" data-parent="part-hull-chassis" data-z-index="15" data-blend="normal" data-motion="scroll-uv-left">
    <polygon points="16,28 22,22 34,22 34,110 22,110 16,104" fill="#16181f" stroke="#d97706" stroke-width="1.8" stroke-linejoin="bevel" />
    <rect x="18" y="27" width="14" height="78" fill="#252932" stroke="#3f4654" stroke-width="0.9" />
    <path d="M17 33 H33 M17 41 H33 M17 49 H33 M17 57 H33 M17 65 H33 M17 73 H33 M17 81 H33 M17 89 H33 M17 97 H33" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.72" />
    <circle cx="25" cy="32" r="3" fill="#181a20" stroke="#fde047" stroke-width="0.9" />
    <circle cx="25" cy="66" r="3" fill="#181a20" stroke="#fde047" stroke-width="0.9" />
    <circle cx="25" cy="100" r="3" fill="#181a20" stroke="#fde047" stroke-width="0.9" />
  </g>
  <g id="part-track-right" data-pivot="102,68" data-parent="part-hull-chassis" data-z-index="15" data-blend="normal" data-motion="scroll-uv-right">
    <polygon points="94,22 106,22 112,28 112,104 106,110 94,110" fill="#16181f" stroke="#d97706" stroke-width="1.8" stroke-linejoin="bevel" />
    <rect x="96" y="27" width="14" height="78" fill="#252932" stroke="#3f4654" stroke-width="0.9" />
    <path d="M95 33 H111 M95 41 H111 M95 49 H111 M95 57 H111 M95 65 H111 M95 73 H111 M95 81 H111 M95 89 H111 M95 97 H111" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.72" />
    <circle cx="103" cy="32" r="3" fill="#181a20" stroke="#fde047" stroke-width="0.9" />
    <circle cx="103" cy="66" r="3" fill="#181a20" stroke="#fde047" stroke-width="0.9" />
    <circle cx="103" cy="100" r="3" fill="#181a20" stroke="#fde047" stroke-width="0.9" />
  </g>

  <!-- [骨骼部件 5] 锻造碳纤维与多面体首上跳弹复合车体底盘 (z=25) -->
  <g id="part-hull-chassis" data-pivot="64,68" data-parent="root" data-z-index="25" data-blend="normal">
    <polygon points="44,18 84,18 98,34 98,98 86,110 42,110 30,98 30,34" fill="url(#p1-forged-carbon)" stroke="url(#p1-magma-edge)" stroke-width="2.2" stroke-linejoin="bevel" />
    <!-- 楔形多面体首上反应装甲块 (ERA Sloped Glacis) -->
    <polygon points="44,18 64,14 84,18 92,36 64,32 36,36" fill="url(#p1-titanium-facet)" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="bevel" />
    <polygon points="36,36 64,32 92,36 92,94 82,104 46,104 36,94" fill="#232730" stroke="#475061" stroke-width="1.1" />
    <!-- 锻造碳纤碎钻切面肌理与散热百叶格栅 -->
    <polygon points="40,42 54,39 50,52 38,50" fill="#313744" opacity="0.75" />
    <polygon points="88,42 74,39 78,52 90,50" fill="#313744" opacity="0.75" />
    <path d="M40 90 H88 M40 95 H88 M40 100 H88 M48 88 V103 M64 88 V103 M80 88 V103" stroke="#f59e0b" stroke-width="0.85" stroke-opacity="0.7" />
    <!-- 尾部回火蓝紫金排气装甲百叶 -->
    <rect x="41" y="104" width="12" height="5" rx="1" fill="#4c1d95" stroke="#f59e0b" stroke-width="0.9" />
    <rect x="75" y="104" width="12" height="5" rx="1" fill="#4c1d95" stroke="#f59e0b" stroke-width="0.9" />
  </g>

  <!-- [骨骼部件 6] 360° 陀螺仪火控液压轴承座圈 (z=30) -->
  <g id="part-turret-ring" data-pivot="64,68" data-parent="part-hull-chassis" data-z-index="30" data-blend="normal">
    <circle cx="64" cy="68" r="25" fill="#14161c" stroke="#f59e0b" stroke-width="1.6" />
    <circle cx="64" cy="68" r="21.5" fill="#1d2028" stroke="#fde047" stroke-width="0.9" stroke-opacity="0.75" />
  </g>

  <!-- [骨骼部件 7] 120mm 高温回火蓝-紫-金滑膛主炮管与热护套 (z=35) -->
  <g id="part-barrel-main" data-pivot="64,50" data-parent="part-turret-body" data-z-index="35" data-blend="normal" data-motion="recoil-y">
    <!-- 铸造防盾座 -->
    <polygon points="54,52 74,52 72,38 56,38" fill="#323846" stroke="#f59e0b" stroke-width="1.5" />
    <!-- 高温回火蓝紫金渐变主炮管 -->
    <rect x="58.5" y="4" width="11" height="44" rx="2" fill="url(#p1-barrel-heat-blue)" stroke="url(#p1-magma-edge)" stroke-width="1.8" />
    <!-- 抽烟装置 (Bore Evacuator) 与热护套箍环 -->
    <rect x="57" y="22" width="14" height="11" rx="2" fill="#2c323f" stroke="#fde047" stroke-width="1.1" />
    <line x1="64" y1="6" x2="64" y2="46" stroke="#fef9c3" stroke-width="1.1" stroke-opacity="0.85" />
    <path d="M58.5 13 H69.5 M58.5 37 H69.5" stroke="#fde047" stroke-width="0.9" />
  </g>

  <!-- [骨骼部件 8 & 9] 炮口制退器与电磁折角稳定翼片 (z=38) -->
  <g id="part-rail-jaw-L" data-pivot="58,20" data-parent="part-barrel-main" data-z-index="38" data-blend="normal" data-motion="rotate-jaw-left">
    <polygon points="58,18 51,15 51,3 57,1 58,12" fill="#3b4252" stroke="#fde047" stroke-width="1.3" />
    <line x1="54.5" y1="4" x2="54.5" y2="14" stroke="#c084fc" stroke-width="0.9" />
  </g>
  <g id="part-rail-jaw-R" data-pivot="70,20" data-parent="part-barrel-main" data-z-index="38" data-blend="normal" data-motion="rotate-jaw-right">
    <polygon points="70,18 77,15 77,3 71,1 70,12" fill="#3b4252" stroke="#fde047" stroke-width="1.3" />
    <line x1="73.5" y1="4" x2="73.5" y2="14" stroke="#c084fc" stroke-width="0.9" />
  </g>

  <!-- [骨骼部件 10] 放射多面体反应装甲折面隐身炮塔 (Radial Multi-Faceted Stealth Turret, Topology D, z=40) -->
  <g id="part-turret-body" data-pivot="64,68" data-parent="part-turret-ring" data-z-index="40" data-blend="normal" data-motion="aim-rotate-360">
    <!-- 外层放射八角折面隐身装甲壳 -->
    <polygon points="52,40 76,40 90,56 86,82 74,95 54,95 42,82 38,56" fill="url(#p1-titanium-facet)" stroke="url(#p1-magma-edge)" stroke-width="2.2" stroke-linejoin="bevel" />
    <!-- 放射多面体斜切反应装甲棱面分界线 (Radial Facet Ridges) -->
    <polygon points="52,40 64,52 76,40 82,58 64,56 46,58" fill="#464f60" stroke="#fde047" stroke-width="0.9" stroke-opacity="0.8" />
    <polygon points="38,56 50,60 48,78 42,82" fill="#38404f" stroke="#f59e0b" stroke-width="0.8" />
    <polygon points="90,56 78,60 80,78 86,82" fill="#252a34" stroke="#f59e0b" stroke-width="0.8" />
    <polygon points="48,78 64,74 80,78 74,95 54,95" fill="#1e222b" stroke="#d97706" stroke-width="0.9" />
    <!-- 中央陀螺火控核心舱盖 -->
    <polygon points="64,55 75,62 75,74 64,81 53,74 53,62" fill="#161820" stroke="#fde047" stroke-width="1.4" />
    <circle cx="64" cy="68" r="6.5" fill="url(#p1-core-glow)" />
    <circle cx="64" cy="68" r="2.4" fill="#fef9c3" />
  </g>

  <!-- [光影层 4A & 4B] 0.4px 亚毫米倒角高光亮边与银白跳弹擦痕 (z=45, 46) -->
  <g id="part-light-rim-hull" data-pivot="64,68" data-parent="part-hull-chassis" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M44 18 L64 14 L84 18 L98 34 M30 34 L44 18" stroke="url(#p1-rim-glow)" stroke-width="2.4" stroke-linecap="round" />
    <path d="M46 25 L53 29 M78 24 L84 30" stroke="#fef9c3" stroke-width="1.1" stroke-linecap="round" />
  </g>
  <g id="part-light-rim-turret" data-pivot="64,68" data-parent="part-turret-body" data-z-index="46" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M52 40 H76 L90 56 M38 56 L52 40 M52 40 L64 52 L76 40" stroke="url(#p1-rim-glow)" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- [骨骼部件 11] 车长周视光电热像球 (Panoramic Commander Optic Dome, z=50) -->
  <g id="part-radar-scanner" data-pivot="74,78" data-parent="part-turret-body" data-z-index="50" data-blend="normal" data-motion="spin-cw">
    <circle cx="74" cy="78" r="5.5" fill="#181b22" stroke="#fde047" stroke-width="1.4" />
    <path d="M68.5 76 C71 71 77 71 79.5 76" stroke="#c084fc" stroke-width="1.6" stroke-linecap="round" />
    <line x1="74" y1="78" x2="74" y2="70.5" stroke="#fef08a" stroke-width="1.3" />
    <circle cx="74" cy="78" r="2.0" fill="#f59e0b" />
  </g>

  <!-- [光影层 5] 顶层跳弹火星与高温回火电晕 (z=65, screen) -->
  <g id="part-aura-corona-top" data-pivot="64,68" data-parent="root" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <path d="M26 30 L34 22 L30 14 L42 10 M102 30 L94 22 L98 14 L86 10" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="42" cy="10" r="2.0" fill="#fef08a" />
    <circle cx="86" cy="10" r="2.0" fill="#fef08a" />
    <circle cx="64" cy="5" r="2.4" fill="#fde047" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- STYLE-170 x STYLE-142: Quad-Track Super-Heavy Mammoth Fortress Tank -->
    <linearGradient id="em-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="20%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="80%" stop-color="#3f1d24"/>
      <stop offset="100%" stop-color="#14070a"/>
    </linearGradient>
    <linearGradient id="em-carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="35%" stop-color="#27272a"/>
      <stop offset="70%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <!-- Heat-Blued Twin 155mm Heavy Siege Barrels -->
    <linearGradient id="em-barrel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="22%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="em-turret-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="24%" stop-color="#ef4444"/>
      <stop offset="55%" stop-color="#991b1b"/>
      <stop offset="82%" stop-color="#31102f"/>
      <stop offset="100%" stop-color="#0f0714"/>
    </linearGradient>
    <radialGradient id="em-magma-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#991b1b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Ground Cast Shadow & Heavy Hexagonal Basalt Magma Footprint -->
  <ellipse id="part-shadow-cast" cx="34" cy="36" rx="28" ry="28" fill="#030406" opacity="0.88"/>
  <polygon id="part-aura-ring-outer" points="32,2 60,17 60,47 32,62 4,47 4,17" fill="url(#em-magma-aura)" stroke="#ef4444" stroke-width="1.1" stroke-opacity="0.5"/>
  <polygon id="part-aura-ring-inner" points="32,7 55,19 55,45 32,57 9,45 9,19" fill="none" stroke="#f59e0b" stroke-width="0.9" stroke-opacity="0.38"/>

  <!-- 2. Siege Floodlight Cone -->
  <polygon id="part-light-cone-main" points="32,14 12,0 52,0" fill="#ef4444" opacity="0.2"/>

  <!-- 3. Quad Articulated Heavy Armored Track Pods -->
  <g id="part-track-front-L">
    <rect x="4" y="8" width="10" height="22" rx="2" fill="url(#em-carbon)" stroke="#09090b" stroke-width="1.4"/>
    <path d="M5 12 H13 M5 17 H13 M5 22 H13 M5 26 H13" stroke="#71717a" stroke-width="1.4"/>
  </g>
  <g id="part-track-front-R">
    <rect x="50" y="8" width="10" height="22" rx="2" fill="url(#em-carbon)" stroke="#09090b" stroke-width="1.4"/>
    <path d="M51 12 H59 M51 17 H59 M51 22 H59 M51 26 H59" stroke="#71717a" stroke-width="1.4"/>
  </g>
  <g id="part-track-rear-L">
    <rect x="4" y="34" width="10" height="23" rx="2" fill="url(#em-carbon)" stroke="#09090b" stroke-width="1.4"/>
    <path d="M5 38 H13 M5 43 H13 M5 48 H13 M5 53 H13" stroke="#71717a" stroke-width="1.4"/>
  </g>
  <g id="part-track-rear-R">
    <rect x="50" y="34" width="10" height="23" rx="2" fill="url(#em-carbon)" stroke="#09090b" stroke-width="1.4"/>
    <path d="M51 38 H59 M51 43 H59 M51 48 H59 M51 53 H59" stroke="#71717a" stroke-width="1.4"/>
  </g>

  <!-- 4. Super-Heavy Reactive Slab Hull Chassis -->
  <g id="part-hull-chassis">
    <polygon points="20,7 44,7 52,15 52,51 44,58 20,58 12,51 12,15" fill="url(#em-hull)" stroke="#09090b" stroke-width="1.6"/>
    <!-- Front Bulldozer Spaced ERA Glacis -->
    <polygon points="18,9 46,9 49,18 15,18" fill="url(#em-carbon)" stroke="#fca5a5" stroke-width="0.7" stroke-opacity="0.5"/>
    <!-- Rear Twin Fusion Reactor Grille -->
    <rect x="18" y="46" width="28" height="9" rx="1.5" fill="#09090b" stroke="#f97316" stroke-width="1"/>
    <path d="M21 49 H43 M21 52 H43" stroke="#fde047" stroke-width="1.4"/>
  </g>

  <!-- 5. Twin Heat-Blued Siege Cannons -->
  <g id="part-barrel-heavy-L">
    <rect x="21" y="1" width="6.5" height="23" rx="1.2" fill="url(#em-barrel)" stroke="#09090b" stroke-width="1.2"/>
    <rect x="20" y="1" width="8.5" height="4" rx="1" fill="#fde047" stroke="#09090b" stroke-width="0.8"/>
  </g>
  <g id="part-barrel-heavy-R">
    <rect x="36.5" y="1" width="6.5" height="23" rx="1.2" fill="url(#em-barrel)" stroke="#09090b" stroke-width="1.2"/>
    <rect x="35.5" y="1" width="8.5" height="4" rx="1" fill="#fde047" stroke="#09090b" stroke-width="0.8"/>
  </g>

  <!-- 6. Radial Octagonal Multi-Faceted Stealth Fortress Turret & Side Missile Pods -->
  <g id="part-missile-pod-L">
    <polygon points="9,24 16,21 16,39 9,36" fill="url(#em-carbon)" stroke="#f87171" stroke-width="1"/>
    <circle cx="12.5" cy="26" r="1.3" fill="#fde047"/>
    <circle cx="12.5" cy="30" r="1.3" fill="#fde047"/>
    <circle cx="12.5" cy="34" r="1.3" fill="#fde047"/>
  </g>
  <g id="part-missile-pod-R">
    <polygon points="48,21 55,24 55,36 48,39" fill="url(#em-carbon)" stroke="#f87171" stroke-width="1"/>
    <circle cx="51.5" cy="26" r="1.3" fill="#fde047"/>
    <circle cx="51.5" cy="30" r="1.3" fill="#fde047"/>
    <circle cx="51.5" cy="34" r="1.3" fill="#fde047"/>
  </g>
  <g id="part-turret-body">
    <polygon points="25,14 39,14 48,23 48,37 39,45 25,45 16,37 16,23" fill="url(#em-turret-facet)" stroke="#09090b" stroke-width="1.6"/>
    <!-- Radial Stealth Armor Facets -->
    <polygon points="25,14 39,14 32,30" fill="#fecaca" opacity="0.34"/>
    <polygon points="39,14 48,23 32,30" fill="#f87171" opacity="0.25"/>
    <polygon points="16,23 25,14 32,30" fill="#ef4444" opacity="0.22"/>
    <polygon points="16,23 16,37 32,30" fill="#450a0a" opacity="0.55"/>
    <polygon points="48,23 48,37 32,30" fill="#2e1065" opacity="0.5"/>
    <polygon points="16,37 25,45 39,45 48,37 32,30" fill="#09090b" opacity="0.72"/>
  </g>

  <!-- 7. Specular Chamfer Rim & Molten Core -->
  <path id="part-light-rim-body" d="M16,23 L25,14 L39,14 L48,23" fill="none" stroke="#fef08a" stroke-width="1.4" stroke-linecap="round"/>
  <polygon id="part-aura-corona-top" points="32,24 38,30 32,36 26,30" fill="#fde047" stroke="#dc2626" stroke-width="1.2"/>
</svg>

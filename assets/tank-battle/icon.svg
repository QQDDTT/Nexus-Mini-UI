<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- STYLE-170 x STYLE-142: Game App Icon — Hexagonal Basalt Magma Base + Radial Stealth Tank -->
    <linearGradient id="ic-basalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="ic-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="22%" stop-color="#22c55e"/>
      <stop offset="55%" stop-color="#15803d"/>
      <stop offset="82%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="ic-turret" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="25%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#166534"/>
      <stop offset="85%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="ic-barrel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="22%" stop-color="#f59e0b"/>
      <stop offset="52%" stop-color="#c084fc"/>
      <stop offset="78%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- 1. Hexagonal Basalt Badge Background & Molten Gold Seam -->
  <polygon id="part-shadow-cast" points="32,2 61,18 61,48 32,63 3,48 3,18" fill="url(#ic-basalt)" stroke="#f59e0b" stroke-width="2"/>
  <polygon id="part-aura-ring-outer" points="32,6 57,20 57,46 32,59 7,46 7,20" fill="none" stroke="#f97316" stroke-width="1" stroke-opacity="0.55"/>
  <polygon id="part-aura-ring-inner" points="32,10 52,22 52,44 32,55 12,44 12,22" fill="none" stroke="#fde047" stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- 2. Forged Carbon Armored Tracks -->
  <rect id="part-track-left" x="11" y="13" width="8" height="39" rx="2" fill="#18181b" stroke="#09090b" stroke-width="1.3"/>
  <rect id="part-track-right" x="45" y="13" width="8" height="39" rx="2" fill="#18181b" stroke="#09090b" stroke-width="1.3"/>

  <!-- 3. Forged Carbon & NATO Emerald Hull Chassis -->
  <polygon id="part-hull-chassis" points="22,11 42,11 47,18 47,48 41,54 23,54 17,48 17,18" fill="url(#ic-hull)" stroke="#09090b" stroke-width="1.5"/>

  <!-- 4. Heat-Blued Purple-Gold Smoothbore Gun Barrel -->
  <g id="part-barrel-main">
    <rect x="29" y="2" width="6" height="24" rx="1.2" fill="url(#ic-barrel)" stroke="#09090b" stroke-width="1.2"/>
    <rect x="28" y="2" width="8" height="4" rx="1" fill="#fde047" stroke="#09090b" stroke-width="0.8"/>
  </g>

  <!-- 5. Radial Multi-Faceted Stealth Turret -->
  <g id="part-turret-body">
    <polygon points="32,16 44,23 42,39 32,45 22,39 20,23" fill="url(#ic-turret)" stroke="#09090b" stroke-width="1.5"/>
    <polygon points="32,16 44,23 32,30" fill="#dcfce7" opacity="0.35"/>
    <polygon points="20,23 22,39 32,30" fill="#052e16" opacity="0.55"/>
    <polygon points="44,23 42,39 32,30" fill="#311042" opacity="0.48"/>
  </g>

  <!-- 6. Specular Rim & Commander Optic Corona -->
  <path id="part-light-rim-hull" d="M20,23 L32,16 L44,23" fill="none" stroke="#fef9c3" stroke-width="1.4" stroke-linecap="round"/>
  <circle id="part-aura-corona-top" cx="32" cy="30" r="2.8" fill="#fde047" stroke="#09090b" stroke-width="1"/>
</svg>

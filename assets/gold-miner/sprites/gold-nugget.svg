  <g id="part-aura-corona-top" data-pivot="64,62" data-parent="root" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <path d="M56 26 L56 38 M50 32 L62 32" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <path d="M88 42 L88 50 M84 46 L92 46" stroke="#fef08a" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="34" cy="40" r="2.0" fill="#fde047" />
    <circle cx="96" cy="76" r="1.8" fill="#ffffff" />
    <circle cx="48" cy="24" r="1.6" fill="#f59e0b" />
    <circle cx="80" cy="26" r="1.6" fill="#ffffff" />
    <circle cx="28" cy="84" r="1.5" fill="#fbbf24" />
    <circle cx="102" cy="54" r="1.5" fill="#fef08a" />

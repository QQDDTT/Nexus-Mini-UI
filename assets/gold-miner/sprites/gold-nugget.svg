      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="gn-gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gn-rim" x1="0%" y1="0%" x2="100%" y2="100%">

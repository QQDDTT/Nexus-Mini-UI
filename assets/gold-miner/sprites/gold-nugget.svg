    <polygon points="76,52 94,48 102,64 86,70" fill="url(#gn-gold-bright)" stroke="#ffffff" stroke-width="0.9" />
    <path d="M96,44 L86,70 L96,88 M108,66 L86,70" stroke="#fef08a" stroke-width="0.7" stroke-opacity="0.75" />
  </g>

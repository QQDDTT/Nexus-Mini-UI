    <ellipse cx="64" cy="64" rx="58.3" ry="51.3" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-opacity="0.72" />
    <ellipse cx="64" cy="64" rx="52.7" ry="46.38" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.55" />
    <polygon points="122.3,60 126.3,64 122.3,68 118.3,64" fill="#fbbf24" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="105.2" cy="105.2" r="2.0" fill="#fef08a" />
    <polygon points="64,118.3 68,122.3 64,126.3 60,122.3" fill="#fbbf24" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="22.8" cy="105.2" r="2.0" fill="#fef08a" />
    <polygon points="5.7,60 9.7,64 5.7,68 1.7,64" fill="#fbbf24" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="22.8" cy="22.8" r="2.0" fill="#fef08a" />
    <polygon points="64,1.7 68,5.7 64,9.7 60,5.7" fill="#fbbf24" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="105.2" cy="22.8" r="2.0" fill="#fef08a" />
  </g>

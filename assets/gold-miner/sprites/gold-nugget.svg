<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="gold-nugget-rig" data-root-anchor="64,68" data-has-aura="true">
  <defs>
    <radialGradient id="gn-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181009" stop-opacity="0.72" />
      <stop offset="65%" stop-color="#1c1209" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gn-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gn-base-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="55%" stop-color="#3f2e1e" />
      <stop offset="100%" stop-color="#120c06" />
    </linearGradient>
    <linearGradient id="gn-gold-main" x1="0%" y1="0%" x2="100%" y2="100%">

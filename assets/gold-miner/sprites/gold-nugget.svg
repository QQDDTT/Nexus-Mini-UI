  <g id="part-nugget-lobe-left" data-pivot="42,66" data-parent="part-bedrock-matrix" data-z-index="24" data-blend="normal">
    <circle cx="42" cy="66" r="8" fill="#451a03" stroke="#fbbf24" stroke-width="1.4" />
    <polygon points="20,66 32,42 54,46 58,72 36,86" fill="url(#gn-gold-main)" stroke="#fde047" stroke-width="2.0" stroke-linejoin="round" />
    <polygon points="26,62 34,46 50,50 44,68" fill="url(#gn-gold-bright)" stroke="#ffffff" stroke-width="0.9" />

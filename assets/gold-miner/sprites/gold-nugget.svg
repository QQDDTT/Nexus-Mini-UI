  <g id="part-nugget-core" data-pivot="64,62" data-parent="part-bedrock-matrix" data-z-index="34" data-blend="normal">
    <polygon points="40,56 54,30 78,32 90,58 78,86 48,84" fill="url(#gn-gold-main)" stroke="#fef08a" stroke-width="2.4" stroke-linejoin="round" />
    <polygon points="48,54 56,36 74,38 82,56 66,68" fill="url(#gn-gold-bright)" stroke="#ffffff" stroke-width="1.2" />
    <path d="M54 30 L66 68 L78 86 M40 56 L66 68 L90 58 M48 84 L66 68" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.8" />
    <circle cx="62" cy="48" r="2.5" fill="#ffffff" />

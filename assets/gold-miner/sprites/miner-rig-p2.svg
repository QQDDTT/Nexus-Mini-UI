<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="miner-rig-p2-rig" data-root-anchor="64,108" data-has-aura="true">
  <defs>
    <!-- 1. 环境接触软阴影 -->
    <radialGradient id="mp2-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181009" stop-opacity="0.72" />
      <stop offset="65%" stop-color="#1c1209" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <!-- 2. 战功金作业力场光环 -->
    <radialGradient id="mp2-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <!-- 3. 探照灯体积光锥 -->
    <linearGradient id="mp2-light-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#fbbf24" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <!-- 4. STYLE-21 锻造黄铜与玄武岩重型基座 -->
    <linearGradient id="mp2-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f2e1e" />
      <stop offset="50%" stop-color="#271a0c" />
      <stop offset="100%" stop-color="#120c06" />
    </linearGradient>
    <!-- 5. 战功金装甲分件材质 -->
    <linearGradient id="mp2-gold-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <!-- 6. 液压钢与滚筒合金材质 -->
    <linearGradient id="mp2-steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#271a0c" />
    </linearGradient>
    <!-- 7. 受光边缘高光映射材质 -->
    <linearGradient id="mp2-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>
    <!-- 8. 关节轴承核心发光 -->
    <radialGradient id="mp2-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <pattern id="hazard-stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#1c1917" />
      <rect width="5" height="10" fill="#f59e0b" />
    </pattern>
  </defs>
  <!-- [光影层 1] 底层环境接触软阴影贴图 (z=1, multiply) -->
  <!-- [光影层 2A] 底层战功金作业力场外环：顺时针自转刻度环 (z=4, screen) -->

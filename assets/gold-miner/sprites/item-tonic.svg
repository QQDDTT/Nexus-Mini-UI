    <polygon points="107.2,63.4 109.8,66 107.2,68.6 104.6,66" fill="#fef08a" />
    <polygon points="85.6,100.8 88.2,103.4 85.6,106 83,103.4" fill="#fef08a" />
    <polygon points="42.4,100.8 45,103.4 42.4,106 39.8,103.4" fill="#fef08a" />
    <polygon points="20.8,63.4 23.4,66 20.8,68.6 18.2,66" fill="#fef08a" />
    <polygon points="42.4,26 45,28.6 42.4,31.2 39.8,28.6" fill="#fef08a" />

  <g id="part-aura-corona-top" data-pivot="64,66" data-parent="root" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <path d="M26 52 L34 44 L30 36 L40 28 M102 52 L94 44 L98 36 L88 28" stroke="#34d399" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="40" cy="26" r="2.2" fill="#ffffff" />
    <circle cx="88" cy="26" r="2.2" fill="#ffffff" />
    <circle cx="64" cy="12" r="2.5" fill="#6ee7b7" />
    <circle cx="44" cy="72" r="1.8" fill="#ffffff" />
    <circle cx="84" cy="72" r="1.8" fill="#ffffff" />
    <circle cx="56" cy="56" r="1.6" fill="#34d399" />
    <circle cx="72" cy="56" r="1.6" fill="#34d399" />
    <circle cx="36" cy="92" r="1.6" fill="#fbbf24" />
    <circle cx="92" cy="92" r="1.6" fill="#fbbf24" />
    <circle cx="64" cy="98" r="1.8" fill="#ffffff" />
  </g>

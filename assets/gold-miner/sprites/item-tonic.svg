    <rect x="52" y="16" width="24" height="12" rx="4" fill="url(#it-obsidian)" stroke="#34d399" stroke-width="1.8" />
    <circle cx="64" cy="22" r="3.5" fill="#34d399" />
  </g>
  <!-- [骨骼部件 4] 中央高能闪电增幅徽章 (z=38) -->
  <g id="part-power-bolt" data-pivot="64,68" data-parent="part-flask-chassis" data-z-index="38" data-blend="normal" data-motion="pulse-breathe">
    <polygon points="68,46 50,68 62,68 58,90 78,64 66,64" fill="#fde047" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
  </g>
  <!-- [光影层 3] 烧瓶玻璃壁受光高光贴图 (z=45, plus-lighter) -->
  <g id="part-light-rim-flask" data-pivot="64,72" data-parent="part-flask-chassis" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M48 36 L46 48 L30 76 C28 84 32 92 40 94" stroke="url(#it-rim)" stroke-width="2.8" stroke-linecap="round" />
    <path d="M80 36 L82 48 L98 76" stroke="url(#it-rim)" stroke-width="2.0" stroke-linecap="round" />
  </g>

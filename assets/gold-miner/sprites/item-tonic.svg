  <!-- [骨骼部件 1] 装甲烧瓶底座与外壁护架 (z=18) -->
  <g id="part-flask-chassis" data-pivot="64,72" data-parent="root" data-z-index="18" data-blend="normal">
    <path d="M48 34 L80 34 L82 48 L100 76 C104 88 96 100 82 100 L46 100 C32 100 24 88 28 76 L46 48 Z" fill="url(#it-obsidian)" stroke="#34d399" stroke-width="2.2" stroke-linejoin="round" />

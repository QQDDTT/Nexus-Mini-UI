    <path d="M32 88 L96 88 L90 102 L38 102 Z" fill="url(#it-gold)" stroke="#fef08a" stroke-width="1.2" />
  </g>
  <!-- [骨骼部件 2] 内部晃动的高能生力荧光药液层 (z=26) -->
  <g id="part-liquid-core" data-pivot="64,78" data-parent="part-flask-chassis" data-z-index="26" data-blend="normal" data-motion="rotate-swing">
    <path d="M38 68 C50 62 78 72 90 66 L94 78 C96 86 90 94 80 94 L48 94 C38 94 32 86 34 78 Z" fill="url(#it-plasma)" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="52" cy="82" r="3.5" fill="#ffffff" fill-opacity="0.85" />
    <circle cx="74" cy="78" r="2.5" fill="#ffffff" fill-opacity="0.85" />
    <circle cx="64" cy="86" r="4.0" fill="#fef08a" fill-opacity="0.9" />
  </g>

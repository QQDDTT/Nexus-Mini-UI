<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="item-tonic-rig" data-root-anchor="64,84" data-has-aura="true">
  <defs>
    <radialGradient id="it-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181009" stop-opacity="0.72" />
      <stop offset="65%" stop-color="#1c1209" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="it-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="it-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f2e1e" />
      <stop offset="55%" stop-color="#271a0c" />
      <stop offset="100%" stop-color="#120c06" />
    </linearGradient>
    <linearGradient id="it-plasma" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#6ee7b7" />
      <stop offset="65%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="it-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="it-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- [光影层 1] 底层接触软阴影贴图 (z=1, multiply) -->
  <g id="part-shadow-cast" data-pivot="64,104" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="104" rx="44" ry="16" fill="url(#it-shadow)" />
  </g>
  <!-- [光影层 2A] 底层超频生物电外光环 (z=4, screen) -->
  <g id="part-aura-ring-outer" data-pivot="64,66" data-parent="root" data-z-index="4" data-blend="screen" data-motion="spin-cw" style="mix-blend-mode: screen">
    <circle cx="64" cy="66" r="60" fill="url(#it-aura)" />
    <ellipse cx="64" cy="66" rx="56.4" ry="49.63" fill="none" stroke="#34d399" stroke-width="1.4" stroke-opacity="0.72" />
    <ellipse cx="64" cy="66" rx="51" ry="44.88" fill="none" stroke="#fbbf24" stroke-width="0.75" stroke-opacity="0.55" />
    <polygon points="120.4,62 124.4,66 120.4,70 116.4,66" fill="#34d399" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="103.9" cy="105.9" r="2.0" fill="#fef08a" />
    <polygon points="64,118.4 68,122.4 64,126.4 60,122.4" fill="#34d399" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="24.1" cy="105.9" r="2.0" fill="#fef08a" />
    <polygon points="7.6,62 11.6,66 7.6,70 3.6,66" fill="#34d399" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="24.1" cy="26.1" r="2.0" fill="#fef08a" />
    <polygon points="64,5.6 68,9.6 64,13.6 60,9.6" fill="#34d399" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="103.9" cy="26.1" r="2.0" fill="#fef08a" />
  </g>
  <!-- [光影层 2B] 底层逆时针能量涡流内环 (z=5, screen) -->
  <g id="part-aura-ring-inner" data-pivot="64,66" data-parent="root" data-z-index="5" data-blend="screen" data-motion="spin-ccw" style="mix-blend-mode: screen">

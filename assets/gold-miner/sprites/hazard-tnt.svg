<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="hazard-tnt-rig" data-root-anchor="64,84" data-has-aura="true">
  <defs>
    <radialGradient id="ht-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181009" stop-opacity="0.75" />
      <stop offset="65%" stop-color="#1c1209" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ht-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ht-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="55%" stop-color="#271a0c" />
      <stop offset="100%" stop-color="#120c06" />
    </linearGradient>
    <linearGradient id="ht-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="45%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="ht-hoop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="ht-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
    <pattern id="hazard-stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#1c1917" />
      <rect width="5" height="10" fill="#f59e0b" />
    </pattern>
  </defs>
  <!-- [光影层 1] 底层接触软阴影贴图 (z=1, multiply) -->
  <g id="part-shadow-cast" data-pivot="64,104" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="104" rx="46" ry="18" fill="url(#ht-shadow)" />
  </g>
  <!-- [光影层 2A] 底层高危爆炸预警外环 (z=4, screen) -->
  <g id="part-aura-ring-outer" data-pivot="64,66" data-parent="root" data-z-index="4" data-blend="screen" data-motion="spin-cw" style="mix-blend-mode: screen">
    <circle cx="64" cy="66" r="60" fill="url(#ht-aura)" />
    <ellipse cx="64" cy="66" rx="56.4" ry="49.63" fill="none" stroke="#ef4444" stroke-width="1.4" stroke-opacity="0.72" />
    <ellipse cx="64" cy="66" rx="51" ry="44.88" fill="none" stroke="#f97316" stroke-width="0.75" stroke-opacity="0.55" />
    <polygon points="120.4,62 124.4,66 120.4,70 116.4,66" fill="#ef4444" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="103.9" cy="105.9" r="2.0" fill="#fbbf24" />
    <polygon points="64,118.4 68,122.4 64,126.4 60,122.4" fill="#ef4444" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="24.1" cy="105.9" r="2.0" fill="#fbbf24" />
    <polygon points="7.6,62 11.6,66 7.6,70 3.6,66" fill="#ef4444" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="24.1" cy="26.1" r="2.0" fill="#fbbf24" />
    <polygon points="64,5.6 68,9.6 64,13.6 60,9.6" fill="#ef4444" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="103.9" cy="26.1" r="2.0" fill="#fbbf24" />
  </g>
  <!-- [光影层 2B] 底层冲击波脉冲内环 (z=5, screen) -->
  <g id="part-aura-ring-inner" data-pivot="64,66" data-parent="root" data-z-index="5" data-blend="screen" data-motion="spin-ccw" style="mix-blend-mode: screen">
    <ellipse cx="64" cy="66" rx="43.2" ry="38.02" fill="none" stroke="#fbbf24" stroke-width="1.0" stroke-opacity="0.68" />
    <polygon points="107.2,63.4 109.8,66 107.2,68.6 104.6,66" fill="#fef08a" />
    <polygon points="85.6,100.8 88.2,103.4 85.6,106 83,103.4" fill="#fef08a" />
    <polygon points="42.4,100.8 45,103.4 42.4,106 39.8,103.4" fill="#fef08a" />
    <polygon points="20.8,63.4 23.4,66 20.8,68.6 18.2,66" fill="#fef08a" />
    <polygon points="42.4,26 45,28.6 42.4,31.2 39.8,28.6" fill="#fef08a" />
    <polygon points="85.6,26 88.2,28.6 85.6,31.2 83,28.6" fill="#fef08a" />
  </g>
  <!-- [骨骼部件 1] 顶部高压引信导火索与火花头 (z=18) -->
  <g id="part-fuse-igniter" data-pivot="64,30" data-parent="part-barrel-hull" data-z-index="18" data-blend="normal" data-motion="rotate-swing">
    <circle cx="64" cy="30" r="6" fill="#1c130b" stroke="#fbbf24" stroke-width="1.6" />
    <path d="M64 30 C64 18 78 14 88 20" stroke="#fde047" stroke-width="3.0" stroke-linecap="round" />
    <circle cx="88" cy="20" r="5.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.4" />
    <circle cx="88" cy="20" r="2.5" fill="#ffffff" />
  </g>
  <!-- [骨骼部件 2] 烈性炸药桶装甲主圆柱体 (z=25) -->
  <g id="part-barrel-hull" data-pivot="64,66" data-parent="root" data-z-index="25" data-blend="normal">
    <circle cx="64" cy="66" r="4.0" fill="#120c06" stroke="#f97316" stroke-width="1.1" />
    <path d="M36 32 C48 26 80 26 92 32 L96 96 C80 104 48 104 32 96 Z" fill="url(#ht-obsidian)" stroke="#ef4444" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M40 36 L88 36 L90 92 L38 92 Z" fill="url(#ht-crimson)" stroke="#fca5a5" stroke-width="1.1" />
    <!-- 竖向加强筋与工程微刻线 -->
    <path d="M52 34 L50 94 M76 34 L78 94 M42 64 L86 64" stroke="#450a0a" stroke-width="1.2" />
    <path d="M44 48 L84 48 M44 80 L84 80" stroke="#fef08a" stroke-width="0.7" stroke-opacity="0.75" />
    <circle cx="64" cy="66" r="1.6" fill="#fbbf24" />
    <polygon points="64,59 69,66 64,73 59,66" fill="none" stroke="#fef08a" stroke-width="0.75" stroke-opacity="0.8" />
    <circle cx="64" cy="66" r="1.8" fill="#ffffff" />
  </g>
  <!-- [骨骼部件 3] 上下双道防爆合金箍环 (z=32) -->
  <g id="part-containment-hoops" data-pivot="64,66" data-parent="part-barrel-hull" data-z-index="32" data-blend="normal">
    <rect x="32" y="40" width="64" height="8" rx="3" fill="url(#ht-hoop)" stroke="#ffffff" stroke-width="1.1" />
    <rect x="30" y="82" width="68" height="8" rx="3" fill="url(#ht-hoop)" stroke="#ffffff" stroke-width="1.1" />
    <circle cx="42" cy="44" r="1.8" fill="#120c06" />
    <circle cx="86" cy="44" r="1.8" fill="#120c06" />
    <circle cx="40" cy="86" r="1.8" fill="#120c06" />
    <circle cx="88" cy="86" r="1.8" fill="#120c06" />
    <rect x="44" y="86" width="40" height="5" rx="1.5" fill="url(#hazard-stripes)" stroke="#fbbf24" stroke-width="0.7" />
  </g>
  <!-- [骨骼部件 4] 中央高危爆裂几何核心徽标 (无文字纯图形) (z=38) -->
  <g id="part-hazard-core" data-pivot="64,64" data-parent="part-barrel-hull" data-z-index="38" data-blend="normal" data-motion="pulse-breathe">
    <polygon points="64,46 82,76 46,76" fill="#120c06" stroke="#fbbf24" stroke-width="2.0" stroke-linejoin="round" />
    <!-- 内部爆裂八芒星图形 -->
    <polygon points="64,54 67,62 75,64 67,66 64,74 61,66 53,64 61,62" fill="#ef4444" stroke="#fef08a" stroke-width="0.9" />
    <circle cx="64" cy="64" r="2.5" fill="#ffffff" />
  </g>
  <!-- [光影层 3] 桶身受光边缘高光映射贴图 (z=45, plus-lighter) -->
  <g id="part-light-rim-barrel" data-pivot="64,66" data-parent="part-barrel-hull" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M36 32 L32 96" stroke="url(#ht-rim)" stroke-width="2.8" stroke-linecap="round" />
    <path d="M92 32 L96 96" stroke="url(#ht-rim)" stroke-width="2.2" stroke-linecap="round" />
  </g>
  <!-- [光影层 4] 顶层飞溅火星与高热电弧贴图 (z=65, screen) -->
  <g id="part-aura-corona-top" data-pivot="88,20" data-parent="root" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <path d="M88 10 L88 30 M78 20 L98 20 M81 13 L95 27 M95 13 L81 27" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="74" cy="14" r="2.0" fill="#ef4444" />
    <circle cx="98" cy="12" r="2.2" fill="#ffffff" />
    <circle cx="94" cy="30" r="1.8" fill="#fbbf24" />
  </g>
</svg>
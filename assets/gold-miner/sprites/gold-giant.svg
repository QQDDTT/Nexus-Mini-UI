  <g id="part-light-rim-monolith" data-pivot="64,60" data-parent="part-gold-monolith-center" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M24 32 L50 16 L78 16 L104 32" stroke="url(#gg-rim)" stroke-width="3.2" stroke-linecap="round" />
    <path d="M44 54 L64 74 L84 54" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  </g>
  <!-- [光影层 4] 顶层耀眼星芒与黄金粒子冕 (z=65, screen) -->
  <g id="part-aura-corona-top" data-pivot="64,54" data-parent="root" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <path d="M64 8 L64 24 M56 16 L72 16" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
    <path d="M26 24 L26 36 M20 30 L32 30 M102 24 L102 36 M96 30 L108 30" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="40" cy="18" r="2.2" fill="#ffffff" />
    <circle cx="88" cy="18" r="2.2" fill="#ffffff" />
    <circle cx="64" cy="40" r="2.8" fill="#ffffff" />
  </g>
</svg>
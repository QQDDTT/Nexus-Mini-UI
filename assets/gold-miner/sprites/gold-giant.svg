    <polygon points="108.6,61.4 111.2,64 108.6,66.6 106,64" fill="#fef08a" />
    <polygon points="86.3,100 88.9,102.6 86.3,105.2 83.7,102.6" fill="#fef08a" />
    <polygon points="41.7,100 44.3,102.6 41.7,105.2 39.1,102.6" fill="#fef08a" />
    <polygon points="19.4,61.4 22,64 19.4,66.6 16.8,64" fill="#fef08a" />
    <polygon points="41.7,22.8 44.3,25.4 41.7,28 39.1,25.4" fill="#fef08a" />
    <polygon points="86.3,22.8 88.9,25.4 86.3,28 83.7,25.4" fill="#fef08a" />
  </g>
  <!-- [骨骼部件 1] 深层玄武金矿脉基座 (z=14) -->
  <g id="part-vein-pedestal" data-pivot="64,84" data-parent="root" data-z-index="14" data-blend="normal">
    <polygon points="10,82 24,54 104,54 118,82 102,108 26,108" fill="url(#gg-obsidian)" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" />
    <path d="M22 82 L64 96 L106 82 M36 96 L92 96" stroke="#fbbf24" stroke-width="1.0" stroke-opacity="0.7" />
  </g>
  <!-- [骨骼部件 2] 左翼巨型金矿山棱柱 (z=22) -->
  <g id="part-gold-wing-left" data-pivot="34,66" data-parent="part-vein-pedestal" data-z-index="22" data-blend="normal">
    <circle cx="34" cy="66" r="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.5" />
    <polygon points="12,68 24,32 52,40 54,84 22,94" fill="url(#gg-gold-deep)" stroke="#fde047" stroke-width="2.2" stroke-linejoin="round" />
    <polygon points="18,64 26,38 46,44 40,70" fill="url(#gg-gold-crown)" stroke="#ffffff" stroke-width="1.0" />
    <path d="M24 32 L40 70 L22 94 M12 68 L40 70" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.75" />
  </g>
  <!-- [骨骼部件 3] 右翼巨型金矿山棱柱 (z=24) -->
  <g id="part-gold-wing-right" data-pivot="94,66" data-parent="part-vein-pedestal" data-z-index="24" data-blend="normal">
    <circle cx="94" cy="66" r="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.5" />
    <polygon points="76,40 104,32 116,68 106,94 74,84" fill="url(#gg-gold-deep)" stroke="#fde047" stroke-width="2.2" stroke-linejoin="round" />
    <polygon points="82,44 102,38 110,64 88,70" fill="url(#gg-gold-crown)" stroke="#ffffff" stroke-width="1.0" />
    <path d="M104 32 L88 70 L106 94 M116 68 L88 70" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.75" />
  </g>
  <!-- [骨骼部件 4] 中央帝王富矿主峰 (z=32) -->
  <g id="part-gold-monolith-center" data-pivot="64,60" data-parent="part-vein-pedestal" data-z-index="32" data-blend="normal">
    <polygon points="34,58 50,16 78,16 94,58 82,98 46,98" fill="url(#gg-gold-deep)" stroke="#fef08a" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="44,54 54,22 74,22 84,54 64,74" fill="url(#gg-gold-crown)" stroke="#ffffff" stroke-width="1.3" />
    <!-- 内部晶格脉络与探照灯琥珀金伴生晶脉 -->
    <path d="M50 16 L64 74 L78 16 M34 58 L64 74 L94 58 M64 74 L64 98" stroke="#ffffff" stroke-width="0.85" stroke-opacity="0.85" />
    <path d="M48 82 L64 74 L80 82" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.8" />
  </g>
  <!-- [骨骼部件 5] 前景伴生高纯度金晶簇 (z=38) -->
  <g id="part-gold-front-cluster" data-pivot="64,88" data-parent="part-gold-monolith-center" data-z-index="38" data-blend="normal">
    <polygon points="42,88 54,70 74,70 86,88 76,104 52,104" fill="url(#gg-gold-crown)" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />
    <circle cx="64" cy="86" r="3.5" fill="#f59e0b" />
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="gold-giant-rig" data-root-anchor="64,72" data-has-aura="true">
  <defs>
    <radialGradient id="gg-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181009" stop-opacity="0.78" />
      <stop offset="65%" stop-color="#1c1209" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gg-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gg-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#3f2e1e" />
      <stop offset="100%" stop-color="#120c06" />
    </linearGradient>
    <linearGradient id="gg-gold-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="gg-gold-crown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gg-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="45%" stop-color="#fde047" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- [光影层 1] 底层巨型软阴影贴图 (z=1, multiply) -->
  <g id="part-shadow-cast" data-pivot="64,96" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="96" rx="58" ry="26" fill="url(#gg-shadow)" />
  </g>
  <!-- [光影层 2A] 底层富矿皇冠级外光环 (z=4, screen) -->
  <g id="part-aura-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="4" data-blend="screen" data-motion="spin-cw" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="62" fill="url(#gg-aura)" />
    <ellipse cx="64" cy="64" rx="58.3" ry="51.3" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-opacity="0.72" />
    <ellipse cx="64" cy="64" rx="52.7" ry="46.38" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.55" />
    <polygon points="122.3,60 126.3,64 122.3,68 118.3,64" fill="#fbbf24" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="105.2" cy="105.2" r="2.0" fill="#fef08a" />
    <polygon points="64,118.3 68,122.3 64,126.3 60,122.3" fill="#fbbf24" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="22.8" cy="105.2" r="2.0" fill="#fef08a" />
    <polygon points="5.7,60 9.7,64 5.7,68 1.7,64" fill="#fbbf24" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="22.8" cy="22.8" r="2.0" fill="#fef08a" />
    <polygon points="64,1.7 68,5.7 64,9.7 60,5.7" fill="#fbbf24" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="105.2" cy="22.8" r="2.0" fill="#fef08a" />
  </g>
  <!-- [光影层 2B] 底层逆时针能量晶格内环 (z=5, screen) -->
  <g id="part-aura-ring-inner" data-pivot="64,64" data-parent="root" data-z-index="5" data-blend="screen" data-motion="spin-ccw" style="mix-blend-mode: screen">

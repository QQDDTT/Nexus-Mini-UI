<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="mystery-bag-rig" data-root-anchor="64,84" data-has-aura="true">
  <defs>
    <radialGradient id="mb-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181009" stop-opacity="0.72" />
      <stop offset="65%" stop-color="#1c1209" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mb-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mb-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="55%" stop-color="#1e1b4b" />

    <path d="M46 38 L82 38 C102 52 108 82 92 98 C78 108 50 108 36 98 C20 82 26 52 46 38 Z" fill="url(#mb-obsidian)" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" />

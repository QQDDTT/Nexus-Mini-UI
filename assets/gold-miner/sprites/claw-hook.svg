    <polygon points="46,38 82,38 86,46 76,54 52,54 42,46" fill="url(#ch-gold)" stroke="#fef08a" stroke-width="1.1" />
    <path d="M50 42 L78 42 M54 49 L74 49" stroke="#120c06" stroke-width="0.8" />
    <circle cx="64" cy="46" r="6" fill="#120c06" stroke="#f59e0b" stroke-width="1.6" />
    <circle cx="64" cy="46" r="3" fill="url(#ch-joint)" />
    <rect x="44" y="86" width="40" height="5" rx="1.5" fill="url(#hazard-stripes)" stroke="#fbbf24" stroke-width="0.7" />
  </g>
  <g id="part-light-rim-right" data-pivot="84,48" data-parent="part-claw-right" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M92 50 C110 58 112 82 102 102 L84 116" stroke="url(#ch-rim)" stroke-width="2.6" stroke-linecap="round" />
  </g>
  <g id="part-light-rim-left" data-pivot="44,48" data-parent="part-claw-left" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M36 50 C18 58 16 82 26 102 L44 116" stroke="url(#ch-rim)" stroke-width="2.6" stroke-linecap="round" />
  </g>
  <g id="part-aura-corona-top" data-pivot="64,88" data-parent="root" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <path d="M46 112 L56 104 L54 96 L64 90 L74 96 L72 104 L82 112" stroke="#f59e0b" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="46" cy="114" r="2.2" fill="#ffffff" />
    <circle cx="82" cy="114" r="2.2" fill="#ffffff" />
    <circle cx="64" cy="90" r="2.5" fill="#fef08a" />
  </g>
</svg>
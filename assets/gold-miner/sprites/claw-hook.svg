    <rect x="56" y="24" width="16" height="10" rx="3" fill="url(#ch-obsidian)" stroke="#f59e0b" stroke-width="1.8" />
    <circle cx="64" cy="29" r="2.5" fill="#f59e0b" />
  </g>
  <g id="part-center-probe" data-pivot="64,54" data-parent="part-claw-hub" data-z-index="22" data-blend="normal" data-motion="translate-y">
    <path d="M58 54 L70 54 L68 78 L64 88 L60 78 Z" fill="url(#ch-obsidian)" stroke="#f59e0b" stroke-width="1.8" />
    <polygon points="64,86 67,72 64,60 61,72" fill="#f59e0b" fill-opacity="0.85" />
    <path d="M60 62 L68 62 M61 68 L67 68" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="64" cy="88" r="3.5" fill="url(#ch-joint)" />

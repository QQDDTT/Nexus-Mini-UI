    <path d="M44 48 C20 52 12 78 24 104 L46 118 L40 104 L30 92 C24 78 28 64 44 58 Z" fill="url(#ch-obsidian)" stroke="#fbbf24" stroke-width="2.2" stroke-linejoin="round" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="claw-hook-rig" data-root-anchor="64,20" data-has-aura="true">
  <defs>
    <!-- 1. 抓钩底层投射软阴影 -->
    <radialGradient id="ch-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181009" stop-opacity="0.68" />
      <stop offset="65%" stop-color="#1c1209" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <!-- 2. 等离子磁力锁定光环 -->
    <radialGradient id="ch-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#1c1209" stop-opacity="0" />
    </radialGradient>
    <!-- 3. 黑曜重金属基底 -->
    <linearGradient id="ch-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f2e1e" />
      <stop offset="55%" stop-color="#271a0c" />
      <stop offset="100%" stop-color="#120c06" />
    </linearGradient>
    <!-- 4. 钛合金爪刃分件材质 -->
    <linearGradient id="ch-blade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#4e342e" />
      <stop offset="100%" stop-color="#271a0c" />
    </linearGradient>
    <!-- 5. 液压金护套材质 -->
    <linearGradient id="ch-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <!-- 6. 爪指受光边缘高光 -->
    <linearGradient id="ch-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <!-- 7. 关节轴承核心高光 -->
    <radialGradient id="ch-joint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="hazard-stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#1c1917" />
      <rect width="5" height="10" fill="#f59e0b" />
    </pattern>
  </defs>
  <!-- [光影层 1] 底层环境接触软阴影贴图 (z=1, multiply) -->
  <!-- [光影层 2A] 底层锁定光环外环：顺时针自转瞄准刻度 (z=4, screen) -->
  <!-- [光影层 2B] 底层锁定光环内环：逆时针自转磁力环 (z=5, screen) -->
  <!-- [骨骼部件 1] 顶部万向旋转吊环 (z=15) -->
  <!-- [骨骼部件 2] 中心伸缩等离子吸附探针 (z=22) -->
  <!-- [骨骼部件 3] 左独立旋转机械爪指 (pivot 44,48) (z=30) -->
  <!-- [骨骼部件 4] 右独立旋转机械爪指 (pivot 84,48) (z=30) -->
  <!-- [骨骼部件 5] 中央液压铰链座 (z=36) -->
  <!-- [光影层 3] 随爪指联动的受光边缘高光映射贴图 (z=45, plus-lighter) -->
  <!-- [光影层 4] 顶层等离子电火花与体积辉光冕贴图 (z=65, screen) -->
  <g id="part-shadow-cast" data-pivot="64,68" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="70" rx="50" ry="44" fill="url(#ch-shadow)" />
  </g>
  <g id="part-aura-ring-outer" data-pivot="64,68" data-parent="root" data-z-index="4" data-blend="screen" data-motion="spin-cw" style="mix-blend-mode: screen">
    <circle cx="64" cy="68" r="58" fill="url(#ch-aura)" />
    <ellipse cx="64" cy="68" rx="54.5" ry="47.96" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-opacity="0.72" />
    <ellipse cx="64" cy="68" rx="49.3" ry="43.38" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.55" />
    <polygon points="118.5,64 122.5,68 118.5,72 114.5,68" fill="#fbbf24" stroke="#ffffff" stroke-width="0.65" />

    <polygon points="84.9,29.2 87.5,31.8 84.9,34.4 82.3,31.8" fill="#fef08a" />
  </g>
  <g id="part-swivel-ring" data-pivot="64,20" data-parent="root" data-z-index="15" data-blend="normal">

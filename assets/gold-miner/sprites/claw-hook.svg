    <circle cx="25.5" cy="106.5" r="2.0" fill="#fef08a" />
    <polygon points="9.5,64 13.5,68 9.5,72 5.5,68" fill="#fbbf24" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="25.5" cy="29.5" r="2.0" fill="#fef08a" />
    <polygon points="64,9.5 68,13.5 64,17.5 60,13.5" fill="#fbbf24" stroke="#ffffff" stroke-width="0.65" />
    <circle cx="102.5" cy="29.5" r="2.0" fill="#fef08a" />
  </g>
  <g id="part-aura-ring-inner" data-pivot="64,68" data-parent="root" data-z-index="5" data-blend="screen" data-motion="spin-ccw" style="mix-blend-mode: screen">
    <ellipse cx="64" cy="68" rx="41.8" ry="36.78" fill="none" stroke="#fef08a" stroke-width="1.0" stroke-opacity="0.68" />
    <polygon points="105.8,65.4 108.4,68 105.8,70.6 103.2,68" fill="#fef08a" />
    <polygon points="84.9,101.6 87.5,104.2 84.9,106.8 82.3,104.2" fill="#fef08a" />

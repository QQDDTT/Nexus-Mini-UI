<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="hull-delta-glacies-rig" data-root-anchor="64,64" data-faction="glacies" data-has-aura="true">
  <defs>
    <!-- 1. 格拉基斯极寒凝霜冰灰复合装甲 (Frosted Slate-Blue & Ice-Rime Armor - 1:1 还原 preview.png 下左舰体主色) -->
    <linearGradient id="hdg-frost-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="28%" stop-color="#cbd5e1"/>
      <stop offset="62%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- 2. 凝霜装甲侧斜面中灰蓝渐变 -->
    <linearGradient id="hdg-slate-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- 3. 暗部 2x2 斜纹碳纤维深蓝黑底甲 (舰首锥与内凹槽) -->
    <linearGradient id="hdg-carbon-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- 4. 蓝宝石玻璃超导冷舱深海切伦科夫辉光内衬 (1:1 还原 preview.png 蓝宝石超导舱底色) -->
    <radialGradient id="hdg-sapphire-chamber" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="42%" stop-color="#0284c7"/>
      <stop offset="78%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020b18"/>
    </radialGradient>
    <!-- 5. 切伦科夫超导螺旋线圈炽白青蓝渐变 -->
    <linearGradient id="hdg-coil-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- 6. 液氦超低温蓝白等离子尾焰 -->
    <linearGradient id="hdg-cryo-plume" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#a5f3fc"/>
      <stop offset="68%" stop-color="#0284c7" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </linearGradient>
    <!-- 7. 切伦科夫径向电光晕 -->
    <radialGradient id="hdg-cryo-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </radialGradient>
    <!-- 8. 底部投影 -->
    <radialGradient id="hdg-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.9"/>
      <stop offset="68%" stop-color="#020617" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <!-- 9. Pattern A: 2x2 斜纹碳纤维微观编织网格 -->
    <pattern id="hdg-carbon-weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#0f172a"/>
      <polygon points="0,0 3,0 6,3 6,6 3,6 0,3" fill="#1e293b"/>
      <polygon points="3,0 6,0 6,3" fill="#334155"/>
      <polygon points="0,3 3,6 0,6" fill="#090e17"/>
    </pattern>
    <!-- 10. Pattern B: 极寒表面微凝霜颗粒与冰裂纹肌理 -->
    <pattern id="hdg-frost-rime" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,5 L4,2 L8,5 L5,9 Z M4,2 L6,0 M8,5 L10,4" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.48"/>
      <circle cx="2" cy="3" r="0.6" fill="#ffffff" opacity="0.6"/>
      <circle cx="7" cy="8" r="0.5" fill="#e0f2fe" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- 1. 底部投影 (z=1, <=3 nodes) -->
  <g id="part-shadow-cast" data-pivot="64,68" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="70" rx="48" ry="54" fill="url(#hdg-shadow-grad)"/>
    <polygon points="54,6 74,6 82,16 82,42 94,54 94,94 82,106 46,106 34,94 34,54 46,42 46,16" fill="#020617" opacity="0.48"/>
  </g>

  <!-- 2. 外圈超导冷雾校准环 (z=4) -->
  <g id="part-aura-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="4" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="56" fill="none" stroke="#67e8f9" stroke-width="0.75" opacity="0.3"/>
    <path d="M64,6 V10 M122,64 H118 M64,122 V118 M6,64 H10" stroke="#e0f2fe" stroke-width="1.1" opacity="0.65"/>
  </g>

  <!-- 3. 内圈低温校准环 (z=5) -->
  <g id="part-aura-ring-inner" data-pivot="64,64" data-parent="root" data-z-index="5" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="45" fill="none" stroke="#38bdf8" stroke-width="0.55" opacity="0.25"/>
  </g>

  <!-- 4. 双联超低温液氦离子推进尾焰 (z=10 · 原生高频喷射动画) -->
  <g id="part-plume-boost" data-pivot="64,106" data-parent="part-hull-main-body" data-z-index="10" data-blend="screen" style="mix-blend-mode: screen">
    <g transform="translate(48,105)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,0.58; 1.08,1.18; 0.94,0.7; 1.06,1.14; 1,0.58" dur="0.22s" repeatCount="indefinite"/>
        <polygon points="-7,0 7,0 3,20 0,23 -3,20" fill="url(#hdg-cryo-plume)"/>
        <ellipse cx="0" cy="5" rx="4.2" ry="1.5" fill="#ffffff"/>
        <ellipse cx="0" cy="5" rx="3.0" ry="1.1" fill="#67e8f9">
          <animate attributeName="cy" values="4;19" dur="0.16s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.95;0" dur="0.16s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>
    <g transform="translate(80,105)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,0.62; 1.1,1.16; 0.92,0.68; 1.08,1.2; 1,0.62" dur="0.24s" repeatCount="indefinite"/>
        <polygon points="-7,0 7,0 3,20 0,23 -3,20" fill="url(#hdg-cryo-plume)"/>
        <ellipse cx="0" cy="5" rx="4.2" ry="1.5" fill="#ffffff"/>
        <ellipse cx="0" cy="5" rx="3.0" ry="1.1" fill="#67e8f9">
          <animate attributeName="cy" values="4;19" dur="0.18s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.95;0" dur="0.18s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>
  </g>

  <!-- 5. 左舷阶梯式凝霜冷却推进喷管 (z=15, 1:1 还原 preview.png 下左舰体左尾喷管) -->
  <g id="part-thruster-pod-L" data-pivot="48,98" data-parent="part-hull-main-body" data-z-index="15" data-blend="normal">
    <polygon points="39,92 57,92 55,100 41,100" fill="url(#hdg-frost-armor)" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="41,100 55,100 53,106 43,106" fill="url(#hdg-carbon-dark)" stroke="#0f172a" stroke-width="1.4"/>
    <line x1="45" y1="92" x2="45" y2="105" stroke="#475569" stroke-width="0.9"/>
    <line x1="51" y1="92" x2="51" y2="105" stroke="#475569" stroke-width="0.9"/>
    <rect x="42" y="99" width="12" height="1.8" fill="#e0f2fe"/>
  </g>

  <!-- 6. 右舷阶梯式凝霜冷却推进喷管 (z=15, 1:1 还原 preview.png 下左舰体右尾喷管) -->
  <g id="part-thruster-pod-R" data-pivot="80,98" data-parent="part-hull-main-body" data-z-index="15" data-blend="normal">
    <polygon points="71,92 89,92 87,100 73,100" fill="url(#hdg-frost-armor)" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="73,100 87,100 85,106 75,106" fill="url(#hdg-carbon-dark)" stroke="#0f172a" stroke-width="1.4"/>
    <line x1="77" y1="92" x2="77" y2="105" stroke="#475569" stroke-width="0.9"/>
    <line x1="83" y1="92" x2="83" y2="105" stroke="#475569" stroke-width="0.9"/>
    <rect x="74" y="99" width="12" height="1.8" fill="#e0f2fe"/>
  </g>

  <!-- 7. 左舷折角切面凝霜肩翼甲 (z=20, 1:1 还原 preview.png 下左舰体宽厚切角侧护肩) -->
  <g id="part-wing-port-L" data-pivot="40,70" data-parent="part-hull-main-body" data-z-index="20" data-blend="normal">
    <polygon points="46,42 32,54 32,88 38,94 48,94 48,42" fill="url(#hdg-frost-armor)" stroke="#0f172a" stroke-width="1.9" stroke-linejoin="round"/>
    <polygon points="46,42 32,54 32,88 38,94 48,94 48,42" fill="url(#hdg-frost-rime)"/>
    <!-- 侧翼折面立体斜切受光板 -->
    <polygon points="46,44 34,55 39,60 47,50" fill="#ffffff" opacity="0.78"/>
    <polygon points="34,55 34,86 39,82 39,60" fill="url(#hdg-slate-bevel)" stroke="#475569" stroke-width="0.8"/>
    <line x1="32" y1="71" x2="47" y2="71" stroke="#1e293b" stroke-width="1.1"/>
  </g>

  <!-- 8. 右舷折角切面凝霜肩翼甲 (z=20, 1:1 还原 preview.png 下左舰体宽厚切角侧护肩) -->
  <g id="part-wing-starboard-R" data-pivot="88,70" data-parent="part-hull-main-body" data-z-index="20" data-blend="normal">
    <polygon points="82,42 96,54 96,88 90,94 80,94 80,42" fill="url(#hdg-frost-armor)" stroke="#0f172a" stroke-width="1.9" stroke-linejoin="round"/>
    <polygon points="82,42 96,54 96,88 90,94 80,94 80,42" fill="url(#hdg-frost-rime)"/>
    <!-- 侧翼折面立体斜切受光板 -->
    <polygon points="82,44 94,55 89,60 81,50" fill="#e2e8f0" opacity="0.72"/>
    <polygon points="94,55 94,86 89,82 89,60" fill="url(#hdg-slate-bevel)" stroke="#475569" stroke-width="0.8"/>
    <line x1="96" y1="71" x2="81" y2="71" stroke="#1e293b" stroke-width="1.1"/>
  </g>

  <!-- 9. 格拉基斯切角凝霜主舰体、中央巨型六角蓝宝石螺旋超导线圈舱与前部双透镜光学槽 (z=30, 1:1 像素级还原 preview.png 下左战舰) -->
  <g id="part-hull-main-body" data-pivot="64,64" data-parent="root" data-z-index="30" data-blend="normal">
    <!-- 舰首深灰黑多面体破冰锥头 (Dark Faceted Nose Cone - 还原 preview.png 最前端深黑锥头) -->
    <polygon points="55,6 73,6 80,15 80,22 48,22 48,15" fill="url(#hdg-carbon-dark)" stroke="#090d16" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="55,6 73,6 70,13 58,13" fill="#475569" opacity="0.7"/>
    <!-- 凝霜冰灰阶梯形主舰身外甲 (收腰颈部 + 宽厚后舱) -->
    <polygon points="48,15 56,10 72,10 80,15 80,42 88,52 88,92 78,96 50,96 40,92 40,52 48,42" fill="url(#hdg-frost-armor)" stroke="#0f172a" stroke-width="2.1" stroke-linejoin="round"/>
    <polygon points="48,15 56,10 72,10 80,15 80,42 88,52 88,92 78,96 50,96 40,92 40,52 48,42" fill="url(#hdg-frost-rime)"/>
    <!-- 舰身凝霜立体倒角装甲板接缝线 -->
    <path d="M48,15 L54,20 H74 L80,15 M48,42 L53,46 M80,42 L75,46 M40,52 L47,56 M88,52 L81,56 M40,86 L48,82 H80 L88,86" fill="none" stroke="#334155" stroke-width="1.15"/>
    <!-- 舰首两侧 2x2 碳纤维斜切装甲块 -->
    <polygon points="49,19 54,22 54,40 49,38" fill="url(#hdg-carbon-weave)" stroke="#1e293b" stroke-width="0.8"/>
    <polygon points="79,19 74,22 74,40 79,38" fill="url(#hdg-carbon-weave)" stroke="#1e293b" stroke-width="0.8"/>

    <!-- 前部中央内凹八角形光学/超导传感器舱 (1:1 还原 preview.png 舰首双蓝光圆透镜槽) -->
    <polygon points="55,18 73,18 75,22 75,44 72,47 56,47 53,44 53,22" fill="url(#hdg-carbon-dark)" stroke="#94a3b8" stroke-width="1.3" stroke-linejoin="round"/>
    <rect x="56" y="20" width="16" height="25" rx="2" fill="#071526" stroke="#38bdf8" stroke-width="0.85"/>
    <!-- 前小后大 2 枚切伦科夫蓝光圆透镜端口 (精准还原 preview.png 舰首双圆孔) -->
    <circle cx="64" cy="26" r="3.6" fill="#041326" stroke="#67e8f9" stroke-width="1.2"/>
    <circle cx="64" cy="26" r="1.8" fill="#38bdf8"/>
    <circle cx="63.2" cy="25.2" r="0.7" fill="#ffffff"/>
    <circle cx="64" cy="35.5" r="4.4" fill="#041326" stroke="#67e8f9" stroke-width="1.35"/>
    <circle cx="64" cy="35.5" r="2.3" fill="#38bdf8"/>
    <circle cx="63" cy="34.5" r="0.9" fill="#ffffff"/>
    <!-- 连接前传感器槽与后超导冷舱的液氦超导波导颈管 -->
    <rect x="58" y="42" width="12" height="11" fill="#0c2540" stroke="#67e8f9" stroke-width="1.1"/>
    <line x1="61" y1="42" x2="61" y2="53" stroke="#e0f2fe" stroke-width="1.0"/>
    <line x1="67" y1="42" x2="67" y2="53" stroke="#38bdf8" stroke-width="1.0"/>

    <!-- 中后部巨型六角切面防爆蓝宝石玻璃超导冷舱 (1:1 还原 preview.png 标志性大蓝窗与发光螺旋弹簧线圈) -->
    <polygon points="51,51 77,51 82,56 82,81 77,86 51,86 46,81 46,56" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="53,53 75,53 79,57 79,79 75,83 53,83 49,79 49,57" fill="url(#hdg-sapphire-chamber)" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- 蓝宝石舱内上下导轨与左右电极座 -->
    <rect x="49" y="62" width="4" height="12" fill="#0f172a" stroke="#67e8f9" stroke-width="0.8"/>
    <rect x="75" y="62" width="4" height="12" fill="#0f172a" stroke="#67e8f9" stroke-width="0.8"/>
    <line x1="51" y1="57" x2="77" y2="57" stroke="#0284c7" stroke-width="1.0"/>
    <line x1="51" y1="79" x2="77" y2="79" stroke="#0284c7" stroke-width="1.0"/>
    <!-- 舱内高能切伦科夫青白发光螺旋超导弹簧线圈 (4匝粗螺旋，1:1 还原 preview.png 视觉重心) -->
    <ellipse cx="64" cy="68" rx="14" ry="10" fill="url(#hdg-cryo-aura)" opacity="0.75"/>
    <path d="M53,73 C54,59 57,59 58,73 C59,59 62,59 63,73 C64,59 67,59 68,73 C69,59 72,59 73,73 C74,62 75,62 76,68" fill="none" stroke="#38bdf8" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M53,73 C54,59 57,59 58,73 C59,59 62,59 63,73 C64,59 67,59 68,73 C69,59 72,59 73,73 C74,62 75,62 76,68" fill="none" stroke="url(#hdg-coil-glow)" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 舰尾 3 枚高精度圆形低温压力与温控表盘 (还原 preview.png 三联圆表盘) -->
    <circle cx="55" cy="90.5" r="3.4" fill="#041326" stroke="#cbd5e1" stroke-width="0.9"/>
    <line x1="55" y1="90.5" x2="57" y2="88.8" stroke="#67e8f9" stroke-width="0.8"/>
    <circle cx="64" cy="90.5" r="3.4" fill="#041326" stroke="#cbd5e1" stroke-width="0.9"/>
    <line x1="64" y1="90.5" x2="64" y2="88" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="73" cy="90.5" r="3.4" fill="#041326" stroke="#cbd5e1" stroke-width="0.9"/>
    <line x1="73" y1="90.5" x2="75" y2="90.5" stroke="#ef4444" stroke-width="0.8"/>
  </g>

  <!-- 10. 左联内嵌超导磁轨炮管 (z=38) -->
  <g id="part-barrel-tube-L" data-pivot="54,26" data-parent="part-turret-housing" data-z-index="38" data-blend="normal">
    <rect x="49.5" y="10" width="3.2" height="16" rx="0.8" fill="url(#hdg-carbon-dark)" stroke="#67e8f9" stroke-width="0.75"/>
    <line x1="51.1" y1="11" x2="51.1" y2="25" stroke="#e0f2fe" stroke-width="0.9"/>
  </g>

  <!-- 11. 右联内嵌超导磁轨炮管 (z=38) -->
  <g id="part-barrel-tube-R" data-pivot="74,26" data-parent="part-turret-housing" data-z-index="38" data-blend="normal">
    <rect x="75.3" y="10" width="3.2" height="16" rx="0.8" fill="url(#hdg-carbon-dark)" stroke="#67e8f9" stroke-width="0.75"/>
    <line x1="76.9" y1="11" x2="76.9" y2="25" stroke="#e0f2fe" stroke-width="0.9"/>
  </g>

  <!-- 12. 超导波导锁紧桥座 (z=40) -->
  <g id="part-turret-housing" data-pivot="64,47" data-parent="part-hull-main-body" data-z-index="40" data-blend="normal">
    <rect x="55" y="44" width="18" height="6" rx="1" fill="url(#hdg-frost-armor)" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="58" y="45.5" width="12" height="3" fill="#0284c7" stroke="#e0f2fe" stroke-width="0.6"/>
  </g>

  <!-- 13. 顶置凝霜冰晶倒角高光反射 (z=45) -->
  <g id="part-light-rim-hull" data-pivot="64,64" data-parent="part-hull-main-body" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M56,10 L48,15 V42 L32,54 V88 M72,10 L80,15 V42 L96,54" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.88"/>
    <path d="M51,51 H77 L82,56 M46,81 L51,86 H77" fill="none" stroke="#a5f3fc" stroke-width="1.15" opacity="0.85"/>
  </g>

  <!-- 14. 顶层切伦科夫超导日冕 (z=65) -->
  <g id="part-aura-corona-top" data-pivot="64,64" data-parent="root" data-z-index="65" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="68" r="15" fill="url(#hdg-cryo-aura)" opacity="0.55"/>
  </g>
</svg>
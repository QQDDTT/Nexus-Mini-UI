<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Glossy Crimson-Violet Chitin Carapace (Matches zerg_enemy_roster_showcase ENEMY-01) -->
    <linearGradient id="esw-chitin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="32%" stop-color="#be123c"/>
      <stop offset="68%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1a0315"/>
    </linearGradient>
    <linearGradient id="esw-chitin-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="55%" stop-color="#3b0726"/>
      <stop offset="100%" stop-color="#0f0208"/>
    </linearGradient>
    <!-- Glowing Neon-Lime Acid Abdomen & Wing Membrane -->
    <radialGradient id="esw-acid-sac" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#a3e635"/>
      <stop offset="72%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </radialGradient>
    <linearGradient id="esw-wing-membrane" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9f99d" stop-opacity="0.88"/>
      <stop offset="45%" stop-color="#84cc16" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#365314" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Amber Compound Eye Gradient -->
    <radialGradient id="esw-amber-eye" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="esw-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#be123c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f0208" stop-opacity="0"/>
    </radialGradient>
    <!-- Comic Ink Hatching & Bio-Cell Pattern -->
    <pattern id="esw-manga-hatch" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 0 5 L 5 0 M -1 1 L 1 -1" stroke="#0f0208" stroke-width="0.65" opacity="0.48"/>
    </pattern>
    <pattern id="esw-bio-honeycomb" width="6" height="6" patternUnits="userSpaceOnUse">
      <polygon points="3,0 6,1.7 6,4.3 3,6 0,4.3 0,1.7" fill="none" stroke="#365314" stroke-width="0.55" opacity="0.45"/>
      <circle cx="3" cy="3" r="0.7" fill="#ecfccb" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- 1. Ground Shadow -->
  <g id="part-shadow-cast" data-pivot="64 68" data-parent="root" data-z-index="1" data-blend="multiply">
    <ellipse cx="64" cy="70" rx="50" ry="44" fill="#090106" opacity="0.58"/>
  </g>

  <!-- 2. Outer Bio-Hazard Aura Ring -->
  <g id="part-aura-ring-outer" data-pivot="64 64" data-parent="root" data-z-index="4" data-blend="screen">
    <circle cx="64" cy="64" r="58" fill="url(#esw-aura)"/>
    <circle cx="64" cy="64" r="55" fill="none" stroke="#84cc16" stroke-width="0.7" opacity="0.35"/>
  </g>

  <!-- 3. Inner Bio-Hazard Aura Ring -->
  <g id="part-aura-ring-inner" data-pivot="64 64" data-parent="root" data-z-index="5" data-blend="screen">
    <circle cx="64" cy="64" r="42" fill="none" stroke="#f43f5e" stroke-width="0.6" opacity="0.28"/>
  </g>

  <!-- 4. Upper-Left Translucent Neon-Lime Hornet Forewing (part-wing-outer-L) -->
  <g id="part-wing-outer-L" data-pivot="50 52" data-parent="part-torso-thorax" data-z-index="15" data-blend="normal">
    <path d="M 50 48 C 32 34, 10 22, 4 28 C 0 34, 14 54, 48 56 Z" fill="url(#esw-wing-membrane)" stroke="#0f0208" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Crimson Leading-Edge Wing Strut -->
    <path d="M 50 48 C 32 34, 12 24, 4 28 C 12 28, 30 38, 49 51 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.1"/>
    <!-- Branching Wasp Wing Veins -->
    <path d="M 46 51 C 30 42, 16 34, 6 31 M 34 44 L 24 50 M 22 37 L 14 44 M 38 47 L 34 54" fill="none" stroke="#1a2e05" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M 44 50 C 28 41, 16 33, 8 30" fill="none" stroke="#ecfccb" stroke-width="0.7" opacity="0.8"/>
  </g>

  <!-- 5. Upper-Right Translucent Neon-Lime Hornet Forewing (part-wing-outer-R) -->
  <g id="part-wing-outer-R" data-pivot="78 52" data-parent="part-torso-thorax" data-z-index="15" data-blend="normal">
    <path d="M 78 48 C 96 34, 118 22, 124 28 C 128 34, 114 54, 80 56 Z" fill="url(#esw-wing-membrane)" stroke="#0f0208" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Crimson Leading-Edge Wing Strut -->
    <path d="M 78 48 C 96 34, 116 24, 124 28 C 116 28, 98 38, 79 51 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.1"/>
    <!-- Branching Wasp Wing Veins -->
    <path d="M 82 51 C 98 42, 112 34, 122 31 M 94 44 L 104 50 M 106 37 L 114 44 M 90 47 L 94 54" fill="none" stroke="#1a2e05" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M 84 50 C 100 41, 112 33, 120 30" fill="none" stroke="#ecfccb" stroke-width="0.7" opacity="0.8"/>
  </g>

  <!-- 6. Lower-Left Translucent Neon-Lime Hornet Hindwing (part-wing-inner-L) -->
  <g id="part-wing-inner-L" data-pivot="52 62" data-parent="part-torso-thorax" data-z-index="18" data-blend="normal">
    <path d="M 50 58 C 30 58, 8 64, 6 72 C 5 79, 24 78, 50 66 Z" fill="url(#esw-wing-membrane)" stroke="#0f0208" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 48 61 C 32 62, 16 67, 8 72 M 34 63 L 24 73 M 22 66 L 14 75" fill="none" stroke="#1a2e05" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 7. Lower-Right Translucent Neon-Lime Hornet Hindwing (part-wing-inner-R) -->
  <g id="part-wing-inner-R" data-pivot="76 62" data-parent="part-torso-thorax" data-z-index="18" data-blend="normal">
    <path d="M 78 58 C 98 58, 120 64, 122 72 C 123 79, 104 78, 78 66 Z" fill="url(#esw-wing-membrane)" stroke="#0f0208" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 80 61 C 96 62, 112 67, 120 72 M 94 63 L 104 73 M 106 66 L 114 75" fill="none" stroke="#1a2e05" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 8. Swollen Glowing Neon-Lime Hornet Abdomen Sac & Needle Stinger (part-torso-abdomen) -->
  <g id="part-torso-abdomen" data-pivot="64 72" data-parent="part-torso-thorax" data-z-index="24" data-blend="normal">
    <!-- Bulbous Glowing Neon-Lime Wasp Abdomen Sac -->
    <path d="M 54 68 C 40 74, 40 98, 56 108 C 60 111, 68 111, 72 108 C 88 98, 88 74, 74 68 Z" fill="url(#esw-acid-sac)" stroke="#0f0208" stroke-width="2"/>
    <path d="M 54 68 C 40 74, 40 98, 56 108 C 60 111, 68 111, 72 108 C 88 98, 88 74, 74 68 Z" fill="url(#esw-bio-honeycomb)"/>
    <!-- Internal Acid Bubbles & Glowing Dorsal Vein -->
    <ellipse cx="64" cy="86" rx="11" ry="15" fill="#fef08a" opacity="0.45"/>
    <circle cx="57" cy="82" r="3" fill="#ecfccb" opacity="0.75"/>
    <circle cx="71" cy="85" r="2.5" fill="#ecfccb" opacity="0.7"/>
    <circle cx="60" cy="94" r="2.2" fill="#ecfccb" opacity="0.65"/>
    <!-- 4 Pairs of Curved Crimson-Violet Lateral Chitin Abdomen Ribs (Matching Showcase ENEMY-01) -->
    <path d="M 52 70 C 44 73, 43 79, 54 78 C 46 75, 48 72, 55 71 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.3"/>
    <path d="M 76 70 C 84 73, 85 79, 74 78 C 82 75, 80 72, 73 71 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.3"/>
    <path d="M 48 79 C 41 83, 42 89, 55 87 C 46 85, 46 81, 52 80 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.3"/>
    <path d="M 80 79 C 87 83, 86 89, 73 87 C 82 85, 82 81, 76 80 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.3"/>
    <path d="M 48 89 C 43 93, 45 99, 57 96 C 49 94, 48 91, 53 90 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.3"/>
    <path d="M 80 89 C 85 93, 83 99, 71 96 C 79 94, 80 91, 75 90 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.3"/>
    <path d="M 52 99 C 49 103, 52 108, 60 105 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.2"/>
    <path d="M 76 99 C 79 103, 76 108, 68 105 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.2"/>
    <!-- Razor-Sharp Venomous Needle Stinger at Tail Tip -->
    <path d="M 58 107 L 64 125 L 70 107 C 66 109, 62 109, 58 107 Z" fill="url(#esw-chitin-dark)" stroke="#0f0208" stroke-width="1.6"/>
    <polygon points="62.5,112 64,124 65.5,112" fill="#a3e635"/>
  </g>

  <!-- 9. Layered Crimson-Violet Hornet Thorax & 6 Articulated Insectoid Legs (part-torso-thorax) -->
  <g id="part-torso-thorax" data-pivot="64 56" data-parent="root" data-z-index="30" data-blend="normal">
    <!-- 6 Articulated Insectoid Legs (3 Left, 3 Right) -->
    <path d="M 50 45 L 34 36 L 26 24" fill="none" stroke="#0f0208" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 50 45 L 34 36 L 26 24" fill="none" stroke="#be123c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 78 45 L 94 36 L 102 24" fill="none" stroke="#0f0208" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 78 45 L 94 36 L 102 24" fill="none" stroke="#be123c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 48 55 L 30 54 L 18 62" fill="none" stroke="#0f0208" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 48 55 L 30 54 L 18 62" fill="none" stroke="#be123c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 80 55 L 98 54 L 110 62" fill="none" stroke="#0f0208" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 80 55 L 98 54 L 110 62" fill="none" stroke="#be123c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 50 64 L 32 76 L 24 92" fill="none" stroke="#0f0208" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 50 64 L 32 76 L 24 92" fill="none" stroke="#be123c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 78 64 L 96 76 L 104 92" fill="none" stroke="#0f0208" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 78 64 L 96 76 L 104 92" fill="none" stroke="#be123c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Layered Curved Crimson-Violet Thorax Carapace Plates -->
    <path d="M 48 42 C 42 50, 44 64, 54 70 C 60 72, 68 72, 74 70 C 84 64, 86 50, 80 42 C 72 38, 56 38, 48 42 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="2"/>
    <path d="M 48 42 C 42 50, 44 64, 54 70 C 60 72, 68 72, 74 70 C 84 64, 86 50, 80 42 Z" fill="url(#esw-manga-hatch)"/>
    <!-- Overlapping Thorax Somite Plates -->
    <path d="M 47 49 C 56 44, 72 44, 81 49 C 79 56, 74 59, 64 59 C 54 59, 49 56, 47 49 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.5"/>
    <path d="M 50 58 C 58 55, 70 55, 78 58 C 76 64, 71 67, 64 67 C 57 67, 52 64, 50 58 Z" fill="url(#esw-chitin-dark)" stroke="#0f0208" stroke-width="1.4"/>
    <!-- Dorsal Neon-Lime Neural Node -->
    <ellipse cx="64" cy="52" rx="4" ry="6" fill="url(#esw-acid-sac)" stroke="#0f0208" stroke-width="1.1"/>
  </g>

  <!-- 10. Left Curved Serrated Pincer Mandible (part-mandible-L) -->
  <g id="part-mandible-L" data-pivot="55 30" data-parent="part-torso-head" data-z-index="35" data-blend="normal">
    <path d="M 55 32 C 44 26, 42 12, 54 5 C 49 12, 50 18, 56 20 L 53 23 L 57 25 L 54 28 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.7" stroke-linejoin="round"/>
    <!-- Razor White Inner Saw-Teeth -->
    <polygon points="54,14 58,17 55,19" fill="#fef2f2" stroke="#0f0208" stroke-width="0.7"/>
    <polygon points="53,21 57,23 54,25" fill="#fef2f2" stroke="#0f0208" stroke-width="0.7"/>
  </g>

  <!-- 11. Right Curved Serrated Pincer Mandible (part-mandible-R) -->
  <g id="part-mandible-R" data-pivot="73 30" data-parent="part-torso-head" data-z-index="35" data-blend="normal">
    <path d="M 73 32 C 84 26, 86 12, 74 5 C 79 12, 78 18, 72 20 L 75 23 L 71 25 L 74 28 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.7" stroke-linejoin="round"/>
    <!-- Razor White Inner Saw-Teeth -->
    <polygon points="74,14 70,17 73,19" fill="#fef2f2" stroke="#0f0208" stroke-width="0.7"/>
    <polygon points="75,21 71,23 74,25" fill="#fef2f2" stroke="#0f0208" stroke-width="0.7"/>
  </g>

  <!-- 12. Hornet Armored Head & Curved Segmented Antennae (part-torso-head) -->
  <g id="part-torso-head" data-pivot="64 42" data-parent="part-torso-thorax" data-z-index="38" data-blend="normal">
    <!-- Twin Sweeping Segmented Hornet Antennae -->
    <path d="M 57 28 C 50 18, 38 10, 26 8" fill="none" stroke="#0f0208" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 57 28 C 50 18, 38 10, 26 8" fill="none" stroke="#f43f5e" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 71 28 C 78 18, 90 10, 102 8" fill="none" stroke="#0f0208" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 71 28 C 78 18, 90 10, 102 8" fill="none" stroke="#f43f5e" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Rounded-Triangular Crimson Hornet Head -->
    <path d="M 50 34 C 50 25, 78 25, 78 34 C 80 41, 73 45, 64 45 C 55 45, 48 41, 50 34 Z" fill="url(#esw-chitin)" stroke="#0f0208" stroke-width="1.9"/>
    <path d="M 58 28 L 64 38 L 70 28" fill="none" stroke="#fda4af" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- 13. Twin Large Oval Amber-Gold Compound Eyes (part-eye-pupils) -->
  <g id="part-eye-pupils" data-pivot="64 36" data-parent="part-torso-head" data-z-index="42" data-blend="normal">
    <ellipse cx="53" cy="34" rx="5.2" ry="3.6" transform="rotate(-25 53 34)" fill="url(#esw-amber-eye)" stroke="#0f0208" stroke-width="1.3"/>
    <ellipse cx="75" cy="34" rx="5.2" ry="3.6" transform="rotate(25 75 34)" fill="url(#esw-amber-eye)" stroke="#0f0208" stroke-width="1.3"/>
    <circle cx="52" cy="33" r="1.3" fill="#ffffff"/>
    <circle cx="74" cy="33" r="1.3" fill="#ffffff"/>
    <!-- Compound Eye Ommatidia Facet Lines & Ocelli Sensory Nodes -->
    <line x1="49" y1="33" x2="57" y2="35" stroke="#78350f" stroke-width="0.6" opacity="0.7"/>
    <line x1="51" y1="31" x2="55" y2="37" stroke="#78350f" stroke-width="0.6" opacity="0.7"/>
    <line x1="71" y1="35" x2="79" y2="33" stroke="#78350f" stroke-width="0.6" opacity="0.7"/>
    <line x1="73" y1="37" x2="77" y2="31" stroke="#78350f" stroke-width="0.6" opacity="0.7"/>
    <circle cx="61" cy="32" r="1" fill="#f59e0b" stroke="#0f0208" stroke-width="0.5"/>
    <circle cx="67" cy="32" r="1" fill="#f59e0b" stroke="#0f0208" stroke-width="0.5"/>
    <circle cx="64" cy="29" r="1.1" fill="#fef08a" stroke="#0f0208" stroke-width="0.5"/>
    <!-- Chitin Sensory Bristles & Acid Blisters -->
    <circle cx="54" cy="48" r="1.2" fill="#a3e635" stroke="#0f0208" stroke-width="0.5"/>
    <circle cx="74" cy="48" r="1.2" fill="#a3e635" stroke="#0f0208" stroke-width="0.5"/>
    <circle cx="56" cy="60" r="1.1" fill="#a3e635" stroke="#0f0208" stroke-width="0.5"/>
    <circle cx="72" cy="60" r="1.1" fill="#a3e635" stroke="#0f0208" stroke-width="0.5"/>
    <circle cx="64" cy="76" r="1.8" fill="#fef08a" opacity="0.8"/>
    <circle cx="68" cy="96" r="1.6" fill="#fef08a" opacity="0.75"/>
    <circle cx="59" cy="101" r="1.4" fill="#ecfccb" opacity="0.75"/>
    <line x1="64" y1="68" x2="64" y2="108" stroke="#365314" stroke-width="1" opacity="0.65"/>
  </g>

  <!-- 14. Cel-Shaded Rim Highlights -->
  <g id="part-light-rim-swarm" data-pivot="64 64" data-parent="part-torso-thorax" data-z-index="45" data-blend="plus-lighter">
    <path d="M 50 43 C 58 40, 70 40, 78 43" fill="none" stroke="#fda4af" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 55 72 C 47 80, 48 94, 57 103" fill="none" stroke="#ecfccb" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- 15. Top Bio-Luminescent Glare -->
  <g id="part-aura-corona-top" data-pivot="64 64" data-parent="root" data-z-index="65" data-blend="screen">
    <circle cx="64" cy="86" r="16" fill="#a3e635" opacity="0.24"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" preserveAspectRatio="none">
  <defs>
    <!-- 3D Brushed 24K Gold Outer Frame -->
    <linearGradient id="stageGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c7"/>
      <stop offset="22%" stop-color="#e3bb63"/>
      <stop offset="48%" stop-color="#9b6e1d"/>
      <stop offset="76%" stop-color="#ebd18b"/>
      <stop offset="100%" stop-color="#593b08"/>
    </linearGradient>
    <!-- Deep Grand Feu Obsidian Black Enamel Interior -->
    <radialGradient id="grandFeuEnamel" cx="42%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#101829"/>
      <stop offset="55%" stop-color="#080c15"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>
    <!-- Iridescent Mother-of-Pearl (Raden) Gradient -->
    <linearGradient id="radenPearl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="35%" stop-color="#f472b6"/>
      <stop offset="70%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <!-- Blued Steel Gradient for Tourbillon Bridge -->
    <linearGradient id="bluedSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="gearShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- 1. Stepped 3D 24K Brushed Gold Outer Casing (Matches Right Bay of r3_menu_mat_d) -->
  <path d="M 18,8 L 410,8 L 424,22 L 520,22 L 534,36 L 534,254 L 440,254 A 56,56 0 0,0 388,308 L 388,352 L 18,352 L 6,340 L 6,20 Z"
        fill="url(#stageGold)" stroke="#2b1b02" stroke-width="2"/>
  <!-- Inner Recessed Gold Lip -->
  <path d="M 22,14 L 406,14 L 420,28 L 514,28 L 526,40 L 526,246 L 436,246 A 62,62 0 0,0 380,304 L 380,344 L 22,344 L 12,334 L 12,24 Z"
        fill="url(#grandFeuEnamel)" stroke="#fde68a" stroke-width="1"/>

  <!-- Inner 3D Bevel Cast Shadow -->
  <path d="M 22,14 L 406,14 L 420,28 L 514,28 L 526,40 L 526,48 L 12,48 L 12,24 Z" fill="#000000" opacity="0.45"/>

  <!-- Corner 24K Gold Hex Bolts -->
  <g fill="url(#stageGold)" stroke="#3b2604" stroke-width="1">
    <circle cx="20" cy="24" r="4"/>
    <circle cx="402" cy="22" r="3.5"/>
    <circle cx="516" cy="38" r="4"/>
    <circle cx="20" cy="334" r="4"/>
    <circle cx="368" cy="334" r="4"/>
  </g>

  <!-- 2. Upper-Right 1-O'Clock Recessed Mechanical Escapement Gear (Behind Top Vacuum Tube) -->
  <g transform="translate(432, 74)" filter="url(#gearShadow)">
    <circle cx="0" cy="0" r="38" fill="#05080f" stroke="url(#stageGold)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="33" fill="none" stroke="#fde047" stroke-width="2.2" stroke-dasharray="3 2.5"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#stageGold)" stroke-width="2"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="url(#stageGold)" stroke-width="2.5"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="url(#stageGold)" stroke-width="2.5"/>
    <line x1="-18" y1="-18" x2="18" y2="18" stroke="url(#stageGold)" stroke-width="1.8"/>
    <line x1="18" y1="-18" x2="-18" y2="18" stroke="url(#stageGold)" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="7" fill="url(#stageGold)" stroke="#3b2604" stroke-width="1.2"/>
  </g>

  <!-- 3. Iridescent Mother-of-Pearl (Raden) Constellation Star-Charts around Astrolabe -->
  <g stroke="url(#radenPearl)" stroke-width="0.9" opacity="0.88">
    <!-- Top-Left Raden Constellation -->
    <polyline points="42,72 64,54 88,60 112,42 138,48" fill="none"/>
    <polyline points="64,54 72,82 48,104 36,134" fill="none"/>
    <!-- Bottom-Right Raden Constellation -->
    <polyline points="205,318 232,302 256,314 282,296 310,308 326,284" fill="none"/>
    <polyline points="256,314 264,332 292,334" fill="none"/>
    <!-- Left Arc Star Nodes -->
    <polyline points="34,178 46,204 38,228" fill="none"/>
  </g>
  <!-- Glowing Mother-of-Pearl 4-Point & 8-Point Star Inlays -->
  <g fill="url(#radenPearl)">
    <polygon points="64,49 65.5,52.5 69,54 65.5,55.5 64,59 62.5,55.5 59,54 62.5,52.5"/>
    <polygon points="112,37 113.5,40.5 117,42 113.5,43.5 112,47 110.5,43.5 107,42 110.5,40.5"/>
    <polygon points="48,99 49.5,102.5 53,104 49.5,105.5 48,109 46.5,105.5 43,104 46.5,102.5"/>
    <polygon points="232,297 233.5,300.5 237,302 233.5,303.5 232,307 230.5,303.5 227,302 230.5,300.5"/>
    <polygon points="282,291 283.5,294.5 287,296 283.5,297.5 282,301 280.5,297.5 277,296 280.5,294.5"/>
    <polygon points="310,303 311.5,306.5 315,308 311.5,309.5 310,313 308.5,309.5 305,308 308.5,306.5"/>
    <circle cx="42" cy="72" r="2" fill="#5eead4"/>
    <circle cx="88" cy="60" r="2.2" fill="#f472b6"/>
    <circle cx="138" cy="48" r="1.8" fill="#fde047"/>
    <circle cx="36" cy="134" r="2" fill="#a78bfa"/>
    <circle cx="205" cy="318" r="2" fill="#5eead4"/>
    <circle cx="256" cy="314" r="2.4" fill="#f472b6"/>
    <circle cx="326" cy="284" r="2" fill="#fde047"/>
  </g>

  <!-- 4. Central 24K Gold Graduated Astrolabe Cutaway Ring (cx=206, cy=178, r=136) -->
  <g transform="translate(206, 178)">
    <!-- Outer Fine Vernier Ring -->
    <circle cx="0" cy="0" r="138" fill="none" stroke="url(#stageGold)" stroke-width="1" opacity="0.55"/>
    <!-- Main Heavy 24K Gold Astrolabe Bezel Ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#stageGold)" stroke-width="6" filter="url(#gearShadow)"/>
    <!-- Engraved Degree Ticks around the Gold Ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#2b1b02" stroke-width="4" stroke-dasharray="1.5 4.5"/>
    <!-- Inner Stepped Gold Ring -->
    <circle cx="0" cy="0" r="122" fill="none" stroke="#fde68a" stroke-width="1" opacity="0.7"/>
    <circle cx="0" cy="0" r="96" fill="none" stroke="url(#stageGold)" stroke-width="0.8" stroke-dasharray="5 4" opacity="0.45"/>

    <!-- Crosshair Telemetry Axes -->
    <line x1="-122" y1="0" x2="122" y2="0" stroke="#fde047" stroke-width="0.6" opacity="0.3"/>
    <line x1="0" y1="-122" x2="0" y2="122" stroke="#fde047" stroke-width="0.6" opacity="0.3"/>

    <!-- Subtle Gold Wireframe Ship Cutaway Schematic Background (Matches concept art!) -->
    <g stroke="#e2ba62" stroke-width="0.85" fill="none" opacity="0.38">
      <polygon points="-92,0 -48,-18 -18,-78 12,-78 8,-22 64,-26 78,-14 78,14 64,26 8,22 12,78 -18,78 -48,18"/>
      <polygon points="-68,0 -32,-12 -8,-58 4,-58 0,-14 48,-16 48,16 0,14 4,58 -8,58 -32,12"/>
      <rect x="-12" y="-12" width="38" height="24" rx="4"/>
      <circle cx="8" cy="0" r="8"/>
    </g>
  </g>

  <!-- 5. Lower-Left 7-O'Clock 3D Mechanical Tourbillon Balance Cage (Exact match to concept art!) -->
  <g transform="translate(106, 266)" filter="url(#gearShadow)">
    <!-- Outer Knurled Gold Gear Bezel -->
    <circle cx="0" cy="0" r="46" fill="#070b14" stroke="url(#stageGold)" stroke-width="4"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#3b2604" stroke-width="3" stroke-dasharray="2 3"/>
    <!-- Inner Gold Gear Ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#stageGold)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="2.5 2.5"/>
    <!-- Inner Escapement Mechanism -->
    <circle cx="0" cy="0" r="24" fill="#0d1526" stroke="url(#stageGold)" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4 2"/>
    <!-- 3-Arm Blued-Steel & Gold Tourbillon Bridge -->
    <g stroke="url(#bluedSteel)" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-36"/>
      <line x1="0" y1="0" x2="31" y2="18"/>
      <line x1="0" y1="0" x2="-31" y2="18"/>
    </g>
    <g stroke="#93c5fd" stroke-width="1" opacity="0.8">
      <line x1="0" y1="0" x2="0" y2="-34"/>
      <line x1="0" y1="0" x2="29" y2="17"/>
      <line x1="0" y1="0" x2="-29" y2="17"/>
    </g>
    <!-- Central Gold & Ruby Pivot Cap -->
    <circle cx="0" cy="0" r="8" fill="url(#stageGold)" stroke="#2b1b02" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3.5" fill="#e11d48" stroke="#fecdd3" stroke-width="0.7"/>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="asteroid-iron-rig" data-root-anchor="64,64">
  <defs>
    <!-- 富镍铁陨石冷灰金属玄武岩渐变 -->
    <linearGradient id="ai-basalt-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="68%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- 魏德曼花纹金属矿脉高光面 -->
    <linearGradient id="ai-nickel-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- 内部熔融地幔金红脉动裂隙 -->
    <radialGradient id="ai-magma-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="32%" stop-color="#fde047"/>
      <stop offset="68%" stop-color="#f97316" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>
    <!-- 底部投影 -->
    <radialGradient id="ai-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.86"/>
      <stop offset="68%" stop-color="#020617" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. 底部投影 (z=1, <=3 nodes) -->
  <g id="part-shadow-cast" data-pivot="64,68" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="70" rx="52" ry="48" fill="url(#ai-shadow-grad)"/>
    <polygon points="42,18 88,20 112,52 102,96 66,114 24,98 14,56" fill="#020617" opacity="0.45"/>
  </g>

  <!-- 2. 外圈矿物重力场遥测环 (z=4) -->
  <g id="part-aura-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="4" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="54" fill="none" stroke="#f59e0b" stroke-width="0.95" opacity="0.32"/>
    <path d="M64,8 L64,13 M120,64 L115,64 M64,120 L64,115 M8,64 L13,64" stroke="#fde047" stroke-width="1.2" opacity="0.62"/>
  </g>

  <!-- 3. 内圈矿脉扫描环 (z=5) -->
  <g id="part-aura-ring-inner" data-pivot="64,64" data-parent="root" data-z-index="5" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="44" fill="none" stroke="#fbbf24" stroke-width="0.65" opacity="0.28"/>
  </g>

  <!-- 4. 主体多面体富镍铁陨石核心与陨石坑 (z=15) -->
  <g id="part-iron-core-main" data-pivot="64,64" data-parent="root" data-z-index="15" data-blend="normal">
    <polygon points="44,14 86,18 112,48 106,88 74,112 32,104 14,72 20,34" fill="url(#ai-basalt-base)" stroke="#070a12" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 多重几何切面分面明暗 -->
    <polygon points="44,14 86,18 76,48 48,44 20,34" fill="url(#ai-nickel-facet)" stroke="#1e293b" stroke-width="1.0"/>
    <polygon points="86,18 112,48 92,68 76,48" fill="#334155" stroke="#0f172a" stroke-width="0.95"/>
    <polygon points="14,72 48,66 64,92 32,104" fill="#1e293b" stroke="#090d16" stroke-width="0.95"/>
    <!-- 环形撞击坑群 (Craters) -->
    <ellipse cx="56" cy="52" rx="10" ry="7.5" fill="#0f172a" stroke="#64748b" stroke-width="1.1"/>
    <ellipse cx="55" cy="53" rx="6" ry="4.5" fill="#070a12"/>
    <ellipse cx="82" cy="74" rx="8" ry="6" fill="#0f172a" stroke="#475569" stroke-width="1.0"/>
  </g>

  <!-- 5. 熔融铁镍矿脉裂隙网络 (z=22) -->
  <g id="part-magma-fissures" data-pivot="64,64" data-parent="part-iron-core-main" data-z-index="22" data-blend="normal">
    <circle cx="64" cy="64" r="16" fill="url(#ai-magma-glow)"/>
    <path d="M36,36 L58,56 L86,44 M58,56 L64,88 L42,96 M58,56 L30,68 M68,62 L96,76" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38,38 L58,56 L84,45 M58,56 L64,86 M68,62 L94,75" fill="none" stroke="#fef08a" stroke-width="1.0" stroke-linecap="round"/>
  </g>

  <!-- 6. 西北侧高反光镍铁矿壳岩块 (z=30) -->
  <g id="part-crust-chunk-NW" data-pivot="42,42" data-parent="part-iron-core-main" data-z-index="30" data-blend="normal">
    <polygon points="24,28 54,22 58,46 38,54 20,44" fill="url(#ai-nickel-facet)" stroke="#070a12" stroke-width="1.75" stroke-linejoin="round"/>
    <path d="M26,32 L48,28 L52,42" fill="none" stroke="#f8fafc" stroke-width="0.85"/>
    <!-- 裸露黄金铂族金属矿点 -->
    <polygon points="36,34 44,32 46,40 38,42" fill="#fbbf24" stroke="#78350f" stroke-width="0.65"/>
  </g>

  <!-- 7. 东北侧棱角玄武岩矿壳块 (z=32) -->
  <g id="part-crust-chunk-NE" data-pivot="84,48" data-parent="part-iron-core-main" data-z-index="32" data-blend="normal">
    <polygon points="72,26 102,36 104,62 78,64 68,44" fill="url(#ai-basalt-base)" stroke="#070a12" stroke-width="1.75" stroke-linejoin="round"/>
    <polygon points="76,32 96,40 90,54 74,48" fill="url(#ai-nickel-facet)" stroke="#1e293b" stroke-width="0.85"/>
    <polygon points="82,40 90,42 88,50 80,48" fill="#fbbf24" stroke="#78350f" stroke-width="0.65"/>
  </g>

  <!-- 8. 南侧重型磁铁矿母岩块 (z=34) -->
  <g id="part-crust-chunk-S" data-pivot="64,88" data-parent="part-iron-core-main" data-z-index="34" data-blend="normal">
    <polygon points="42,74 86,72 94,94 68,108 36,96" fill="url(#ai-basalt-base)" stroke="#070a12" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="48,78 78,76 82,90 54,94" fill="#334155" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="66" cy="86" r="3.5" fill="#f97316" stroke="#fef08a" stroke-width="0.7"/>
  </g>

  <!-- 9. 顶置矿石棱线高光反射 (z=45) -->
  <g id="part-light-rim-asteroid" data-pivot="64,64" data-parent="part-iron-core-main" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M20,34 L44,14 L86,18 L112,48" fill="none" stroke="#f8fafc" stroke-width="1.65" stroke-linecap="round" opacity="0.85"/>
    <path d="M24,28 L54,22 L58,46" fill="none" stroke="#fde047" stroke-width="1.0" opacity="0.8"/>
  </g>

  <!-- 10. 顶层地幔热辐射辉光 (z=65) -->
  <g id="part-aura-corona-top" data-pivot="64,64" data-parent="root" data-z-index="65" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="58" cy="56" r="14" fill="url(#ai-magma-glow)" opacity="0.62"/>
    <path d="M58,46 L58,66 M48,56 L68,56" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>

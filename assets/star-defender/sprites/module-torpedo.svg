<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="module-torpedo-rig" data-root-anchor="64,74" data-faction="helios" data-slot-zone="weapon" data-slot-size="L-2x2">
  <defs>
    <!-- 1. 核辐射/反物质黄黑防爆斜纹警示涂装 -->
    <pattern id="mtor-hazard-stripe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="6" fill="#f59e0b"/>
      <rect x="3" width="3" height="6" fill="#090d16"/>
    </pattern>
    <!-- 2. 6阶 Gooch 重型无畏舰拉丝钛合金装甲渐变 -->
    <linearGradient id="mtor-ti-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="20%" stop-color="#64748b"/>
      <stop offset="48%" stop-color="#334155"/>
      <stop offset="76%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <!-- 3. NASA 极白氧化铝防热陶瓷重装甲渐变 -->
    <linearGradient id="mtor-ceramic-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- 4. 哑光碳化硅黑鱼雷发射筒内胆渐变 -->
    <linearGradient id="mtor-sic-black" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <!-- 5. 24K Kapton 聚酰亚胺多切面褶皱金箔热控层 -->
    <linearGradient id="mtor-kapton-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="24%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="76%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <!-- 6. 反物质磁约束战斗部赤金/琥珀辐射辉光 -->
    <radialGradient id="mtor-antimatter-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="32%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="88%" stop-color="#dc2626" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mtor-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.94"/>
      <stop offset="68%" stop-color="#020617" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- [骨骼部件 1] L级重型鱼雷炮塔接触软阴影 -->
  <g id="part-shadow-cast" data-pivot="64,74" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="76" rx="56" ry="50" fill="url(#mtor-shadow-grad)"/>
    <polygon points="36,28 92,28 110,46 110,96 92,114 36,114 18,96 18,46" fill="#020617" opacity="0.54"/>
  </g>

  <!-- [骨骼部件 2] 重型攻城鱼雷实心游标测距外环 (零虚线环) -->
  <g id="part-aura-ring-outer" data-pivot="64,72" data-parent="root" data-z-index="4" data-blend="screen" data-motion="spin-cw" style="mix-blend-mode: screen">
    <path d="M40,20 A54,54 0 0,1 88,20 M116,48 A54,54 0 0,1 116,96 M88,124 A54,54 0 0,1 40,124 M12,96 A54,54 0 0,1 12,48" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="square" opacity="0.72"/>
    <path d="M64,16 L64,22 M120,72 L114,72 M64,128 L64,122 M8,72 L14,72" stroke="#ef4444" stroke-width="1.65" opacity="0.88"/>
  </g>

  <!-- [骨骼部件 3] 逆时针反物质磁约束警告内环 -->
  <g id="part-aura-ring-inner" data-pivot="64,72" data-parent="root" data-z-index="5" data-blend="screen" data-motion="spin-ccw" style="mix-blend-mode: screen">
    <path d="M32,40 A44,44 0 0,1 96,40 M96,104 A44,44 0 0,1 32,104" fill="none" stroke="#ef4444" stroke-width="1.0" opacity="0.56"/>
    <circle cx="32" cy="40" r="1.6" fill="#fde047"/>
    <circle cx="96" cy="40" r="1.6" fill="#fde047"/>
    <circle cx="32" cy="104" r="1.6" fill="#fde047"/>
    <circle cx="96" cy="104" r="1.6" fill="#fde047"/>
  </g>

  <!-- [骨骼部件 4] L级(2x2)重装八角鱼雷发射井基座、液压缓冲桩与蓝图红槽标识 -->
  <g id="part-pedestal-base" data-pivot="64,72" data-parent="root" data-z-index="15" data-blend="normal">
    <polygon points="36,28 92,28 110,46 110,96 92,114 36,114 18,96 18,46" fill="url(#mtor-ti-armor)" stroke="#050811" stroke-width="2.3" stroke-linejoin="round"/>
    <!-- 24K Kapton 金箔防辐射内衬底盘 -->
    <polygon points="40,33 88,33 104,49 104,93 88,109 40,109 24,93 24,49" fill="url(#mtor-kapton-gold)" stroke="#451a03" stroke-width="1.1"/>
    <path d="M40,33 L88,109 M88,33 L40,109 M24,71 L104,71" stroke="#78350f" stroke-width="0.85"/>
    <!-- 尾部 4 组 L 级重武器槽绯红锁定卡扣与黄黑警示带 -->
    <rect x="38" y="102" width="52" height="5.5" rx="1" fill="url(#mtor-hazard-stripe)" stroke="#050811" stroke-width="0.85"/>
    <rect x="20" y="58" width="6.5" height="26" rx="1" fill="#ef4444" stroke="#fca5a5" stroke-width="0.8"/>
    <rect x="101.5" y="58" width="6.5" height="26" rx="1" fill="#ef4444" stroke="#fca5a5" stroke-width="0.8"/>
    <!-- 四角重型防爆法兰锚栓 -->
    <circle cx="36" cy="42" r="3.0" fill="#cbd5e1" stroke="#050811" stroke-width="0.95"/>
    <circle cx="92" cy="42" r="3.0" fill="#cbd5e1" stroke="#050811" stroke-width="0.95"/>
    <circle cx="36" cy="100" r="3.0" fill="#cbd5e1" stroke="#050811" stroke-width="0.95"/>
    <circle cx="92" cy="100" r="3.0" fill="#cbd5e1" stroke="#050811" stroke-width="0.95"/>
  </g>

  <!-- [骨骼部件 5] 重型反物质磁悬浮装填转盘环 -->
  <g id="part-energy-coil-ring" data-pivot="64,72" data-parent="part-pedestal-base" data-z-index="22" data-blend="normal" data-motion="spin-cw">
    <circle cx="64" cy="72" r="33" fill="#090d16" stroke="#fbbf24" stroke-width="2.0"/>
    <circle cx="64" cy="72" r="27" fill="#180909" stroke="#ef4444" stroke-width="1.35"/>
    <path d="M64,39 L64,45 M64,99 L64,105 M31,72 L37,72 M91,72 L97,72" stroke="#fde047" stroke-width="2.0"/>
  </g>

  <!-- [骨骼部件 6] 右联重型反物质鱼雷发射管、龙门导轨与裸露反物质弹头 -->
  <g id="part-barrel-tube-R" data-pivot="72,48" data-parent="part-turret-housing" data-z-index="28" data-blend="normal" data-motion="recoil-y">
    <!-- 重型发射管圆筒与龙门导轨外框 -->
    <rect x="65" y="6" width="18" height="48" rx="3" fill="url(#mtor-sic-black)" stroke="#050811" stroke-width="1.8"/>
    <!-- 极白 NASA 防热陶瓦半包覆外甲 -->
    <rect x="66.5" y="20" width="15" height="30" rx="1.5" fill="url(#mtor-ceramic-white)" stroke="#1e293b" stroke-width="0.95"/>
    <path d="M66.5,29 L81.5,29 M66.5,38 L81.5,38" stroke="#475569" stroke-width="0.8"/>
    <!-- 管口裸露的重型反物质破甲鱼雷战斗部 (带发光磁约束核与黄黑警示箍) -->
    <path d="M67,18 L69,7 C71,4 77,4 79,7 L81,18 Z" fill="#b91c1c" stroke="#fca5a5" stroke-width="0.85"/>
    <circle cx="74" cy="13" r="4.8" fill="url(#mtor-antimatter-glow)" stroke="#ffffff" stroke-width="0.85"/>
    <rect x="67" y="18" width="14" height="3.2" fill="url(#mtor-hazard-stripe)"/>
    <!-- 电磁弹射助推线圈箍 -->
    <rect x="64.5" y="32" width="19" height="3.5" rx="0.8" fill="url(#mtor-kapton-gold)" stroke="#050811" stroke-width="0.7"/>
    <rect x="64.5" y="42" width="19" height="3.5" rx="0.8" fill="url(#mtor-kapton-gold)" stroke="#050811" stroke-width="0.7"/>
  </g>

  <!-- [骨骼部件 7] 左联重型反物质鱼雷发射管、龙门导轨与裸露反物质弹头 -->
  <g id="part-barrel-tube-L" data-pivot="56,48" data-parent="part-turret-housing" data-z-index="28" data-blend="normal" data-motion="recoil-y">
    <!-- 重型发射管圆筒与龙门导轨外框 -->
    <rect x="45" y="6" width="18" height="48" rx="3" fill="url(#mtor-sic-black)" stroke="#050811" stroke-width="1.8"/>
    <!-- 极白 NASA 防热陶瓦半包覆外甲 -->
    <rect x="46.5" y="20" width="15" height="30" rx="1.5" fill="url(#mtor-ceramic-white)" stroke="#1e293b" stroke-width="0.95"/>
    <path d="M46.5,29 L61.5,29 M46.5,38 L61.5,38" stroke="#475569" stroke-width="0.8"/>
    <!-- 管口裸露的重型反物质破甲鱼雷战斗部 -->
    <path d="M47,18 L49,7 C51,4 57,4 59,7 L61,18 Z" fill="#b91c1c" stroke="#fca5a5" stroke-width="0.85"/>
    <circle cx="54" cy="13" r="4.8" fill="url(#mtor-antimatter-glow)" stroke="#ffffff" stroke-width="0.85"/>
    <rect x="47" y="18" width="14" height="3.2" fill="url(#mtor-hazard-stripe)"/>
    <!-- 电磁弹射助推线圈箍 -->
    <rect x="44.5" y="32" width="19" height="3.5" rx="0.8" fill="url(#mtor-kapton-gold)" stroke="#050811" stroke-width="0.7"/>
    <rect x="44.5" y="42" width="19" height="3.5" rx="0.8" fill="url(#mtor-kapton-gold)" stroke="#050811" stroke-width="0.7"/>
  </g>

  <!-- [骨骼部件 8] 右侧重型液压龙门装填护臂颚 -->
  <g id="part-rail-jaw-R" data-pivot="88,52" data-parent="part-turret-housing" data-z-index="34" data-blend="normal" data-motion="rotate-jaw-right">
    <polygon points="85,14 102,24 104,62 86,64" fill="url(#mtor-ceramic-white)" stroke="#050811" stroke-width="1.75" stroke-linejoin="round"/>
    <polygon points="87,22 98,29 99,54 87,56" fill="url(#mtor-kapton-gold)" stroke="#78350f" stroke-width="0.85"/>
    <rect x="90" y="34" width="6" height="14" rx="1" fill="#ef4444" stroke="#fde047" stroke-width="0.7"/>
    <circle cx="88" cy="52" r="2.8" fill="#1e293b" stroke="#fde047" stroke-width="0.9"/>
  </g>

  <!-- [骨骼部件 9] 左侧重型液压龙门装填护臂颚 -->
  <g id="part-rail-jaw-L" data-pivot="40,52" data-parent="part-turret-housing" data-z-index="34" data-blend="normal" data-motion="rotate-jaw-left">
    <polygon points="43,14 26,24 24,62 42,64" fill="url(#mtor-ceramic-white)" stroke="#050811" stroke-width="1.75" stroke-linejoin="round"/>
    <polygon points="41,22 30,29 29,54 41,56" fill="url(#mtor-kapton-gold)" stroke="#78350f" stroke-width="0.85"/>
    <rect x="32" y="34" width="6" height="14" rx="1" fill="#ef4444" stroke="#fde047" stroke-width="0.7"/>
    <circle cx="40" cy="52" r="2.8" fill="#1e293b" stroke="#fde047" stroke-width="0.9"/>
  </g>

  <!-- [骨骼部件 10] L级反物质鱼雷重装主炮塔、磁约束阱天窗与辐射三叶徽记 -->
  <g id="part-turret-housing" data-pivot="64,72" data-parent="part-pedestal-base" data-z-index="40" data-blend="normal" data-motion="aim-rotate-360">
    <polygon points="34,48 94,48 100,66 96,94 82,102 46,102 32,94 28,66" fill="url(#mtor-ti-armor)" stroke="#050811" stroke-width="2.3" stroke-linejoin="round"/>
    <!-- 左右 NASA 极白防热陶瓦肩部装甲板 -->
    <polygon points="36,51 50,51 49,84 34,80 31,66" fill="url(#mtor-ceramic-white)" stroke="#1e293b" stroke-width="1.05"/>
    <polygon points="78,51 92,51 97,66 94,80 79,84" fill="url(#mtor-ceramic-white)" stroke="#1e293b" stroke-width="1.05"/>
    <path d="M33,66 L49,66 M79,66 L95,66" stroke="#475569" stroke-width="0.8"/>
    <!-- 中央反物质磁约束反应釜视窗與三叶辐射警示环 -->
    <circle cx="64" cy="69" r="14" fill="#1c0707" stroke="#f8fafc" stroke-width="1.6"/>
    <circle cx="64" cy="69" r="10.5" fill="url(#mtor-antimatter-glow)"/>
    <polygon points="64,69 58,60 70,60" fill="#090d16" opacity="0.82"/>
    <polygon points="64,69 73,74 67,80" fill="#090d16" opacity="0.82"/>
    <polygon points="64,69 55,74 61,80" fill="#090d16" opacity="0.82"/>
    <circle cx="64" cy="69" r="3.5" fill="#ffffff" stroke="#090d16" stroke-width="0.8"/>
    <!-- 尾部 24K Kapton 金箔防爆隔舱与黄黑警示带 -->
    <rect x="44" y="86" width="40" height="11" rx="1.5" fill="url(#mtor-kapton-gold)" stroke="#451a03" stroke-width="1.05"/>
    <rect x="48" y="89" width="32" height="5" fill="url(#mtor-hazard-stripe)"/>
  </g>

  <!-- [骨骼部件 11] 顶层硬表面倒角高光与磨损掉漆亮线 (Plus-Lighter) -->
  <g id="part-light-rim-turret" data-pivot="64,72" data-parent="part-turret-housing" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M28,66 L34,48 L94,48 L100,66" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" opacity="0.94"/>
    <path d="M44,86 L84,86" fill="none" stroke="#fef08a" stroke-width="1.3" opacity="0.88"/>
  </g>

  <!-- [骨骼部件 12] 顶层反物质弹头与核心辉光耀斑 (Screen) -->
  <g id="part-aura-corona-top" data-pivot="64,72" data-parent="part-turret-housing" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <circle cx="64" cy="69" r="15" fill="url(#mtor-antimatter-glow)" opacity="0.65"/>
    <circle cx="54" cy="13" r="6" fill="url(#mtor-antimatter-glow)" opacity="0.85"/>
    <circle cx="74" cy="13" r="6" fill="url(#mtor-antimatter-glow)" opacity="0.85"/>
    <path d="M64,54 L64,84 M49,69 L79,69" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
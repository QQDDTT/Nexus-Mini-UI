    <rect x="32" y="36" width="64" height="68" rx="4" fill="url(#mh-kapton-gold)" stroke="#451a03" stroke-width="1.15"/>
    <path d="M32,52 L96,52 M32,70 L96,70 M32,88 L96,88 M64,36 L64,104" stroke="#78350f" stroke-width="0.85"/>

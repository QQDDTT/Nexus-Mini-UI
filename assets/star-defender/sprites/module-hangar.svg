<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="module-hangar-rig" data-root-anchor="64,74" data-faction="helios" data-slot-zone="weapon" data-slot-size="L-2x2">
  <defs>
    <pattern id="mh-nasa-tile" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e2e8f0"/>

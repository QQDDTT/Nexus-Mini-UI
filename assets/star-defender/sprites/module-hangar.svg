    <rect x="87" y="18" width="7" height="7" rx="1" fill="#fbbf24" stroke="#451a03" stroke-width="0.65"/>
    <rect x="87" y="48" width="7" height="10" rx="1" fill="#ef4444" stroke="#fca5a5" stroke-width="0.65"/>

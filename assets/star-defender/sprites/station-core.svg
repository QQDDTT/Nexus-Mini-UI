  <g id="part-defense-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="15" data-blend="normal" data-motion="spin-cw">
    <polygon points="44.5,13 83.5,13 115,44.5 115,83.5 83.5,115 44.5,115 13,83.5 13,44.5" fill="url(#sc-obsidian)" stroke="#00f0ff" stroke-width="2.2" stroke-linejoin="miter" stroke-miterlimit="3" />
    <polygon points="44.5,13 83.5,13 115,44.5 115,83.5 83.5,115 44.5,115 13,83.5 13,44.5" fill="url(#sc-ceramic-tiles)" />
    <polygon points="48,22 80,22 106,48 106,80 80,106 48,106 22,80 22,48" fill="#030712" stroke="#38bdf8" stroke-width="1.2" />

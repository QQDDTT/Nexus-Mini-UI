      <stop offset="22%" stop-color="#38bdf8" />
      <stop offset="52%" stop-color="#1e3a8a" />
      <stop offset="85%" stop-color="#091326" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="sc-kapton-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="32%" stop-color="#fbbf24" />
      <stop offset="72%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <radialGradient id="sc-core-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#6ee7b7" />
      <stop offset="56%" stop-color="#10b981" />
      <stop offset="82%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sc-rim-light" x1="0%" y1="0%" x2="100%" y2="100%">

  <g id="part-aura-corona-top" data-pivot="64,64" data-parent="root" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <path d="M30 30 L40 24 L36 16 M98 30 L88 24 L92 16 M30 98 L40 104 L36 112 M98 98 L88 104 L92 112" stroke="#10b981" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="44.5" cy="13" r="2.3" fill="#ffffff" />
    <circle cx="83.5" cy="13" r="2.3" fill="#ffffff" />

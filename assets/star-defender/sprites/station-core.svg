<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="station-core-rig" data-root-anchor="64,64" data-has-aura="true" data-faction="helios">
  <defs>
    <radialGradient id="sc-cast-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.88" />
      <stop offset="65%" stop-color="#030712" stop-opacity="0.46" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sc-aura-field" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="48%" stop-color="#00f0ff" stop-opacity="0.18" />
      <stop offset="82%" stop-color="#fbbf24" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sc-obsidian" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="22%" stop-color="#334155" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="88%" stop-color="#050914" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="sc-ring-plate" x1="0%" y1="0%" x2="100%" y2="100%">

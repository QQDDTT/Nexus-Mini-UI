      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.88" />
      <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <pattern id="sc-ceramic-tiles" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M4 0 L8 2 L8 6 L4 8 L0 6 L0 2 Z" fill="none" stroke="#94a3b8" stroke-width="0.35" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- [光影层 1] 空间站母核底层深空接触阴影 (z=1, multiply) -->
  <g id="part-shadow-cast" data-pivot="64,66" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">

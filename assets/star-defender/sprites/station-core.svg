    <rect x="112" y="60.8" width="11" height="2.4" rx="0.8" fill="#00f0ff" />
    <rect x="112" y="64.8" width="11" height="2.4" rx="0.8" fill="#00f0ff" />
    <circle cx="110" cy="64" r="6.2" fill="#0f172a" stroke="url(#sc-kapton-gold)" stroke-width="1.8" />
    <circle cx="110" cy="64" r="2.6" fill="#00f0ff" />
  </g>
  <g id="part-ciws-turret-W" data-pivot="18,64" data-parent="part-defense-ring-outer" data-z-index="40" data-blend="normal" data-motion="aim-rotate-360">
    <rect x="5" y="60.8" width="11" height="2.4" rx="0.8" fill="#00f0ff" />
    <rect x="5" y="64.8" width="11" height="2.4" rx="0.8" fill="#00f0ff" />
    <circle cx="18" cy="64" r="6.2" fill="#0f172a" stroke="url(#sc-kapton-gold)" stroke-width="1.8" />
    <circle cx="18" cy="64" r="2.6" fill="#00f0ff" />
  </g>
  <g id="part-ciws-turret-S" data-pivot="64,110" data-parent="part-defense-ring-outer" data-z-index="40" data-blend="normal" data-motion="aim-rotate-360">

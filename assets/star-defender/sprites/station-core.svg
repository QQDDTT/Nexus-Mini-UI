    <rect x="64.8" y="112" width="2.4" height="11" rx="0.8" fill="#00f0ff" />
    <circle cx="64" cy="110" r="6.2" fill="#0f172a" stroke="url(#sc-kapton-gold)" stroke-width="1.8" />
    <circle cx="64" cy="110" r="2.6" fill="#00f0ff" />
  </g>
  <g id="part-ciws-turret-N" data-pivot="64,18" data-parent="part-defense-ring-outer" data-z-index="40" data-blend="normal" data-motion="aim-rotate-360">
    <rect x="60.8" y="5" width="2.4" height="11" rx="0.8" fill="#00f0ff" />
    <rect x="64.8" y="5" width="2.4" height="11" rx="0.8" fill="#00f0ff" />
    <circle cx="64" cy="18" r="6.2" fill="#0f172a" stroke="url(#sc-kapton-gold)" stroke-width="1.8" />
    <circle cx="64" cy="18" r="2.6" fill="#00f0ff" />

    <path fill="none" stroke="#fbbf24" stroke-width="0.95" stroke-opacity="0.72" d="M106.42,77.78 A44.6,44.6 0 0,1 67.11,108.49 M30.86,93.84 A44.6,44.6 0 0,1 23.91,44.45 M54.73,20.37 A44.6,44.6 0 0,1 100.98,39.06" stroke-linecap="square" />
    <rect x="107" y="62.4" width="3.2" height="3.2" fill="#10b981" />
    <rect x="84.7" y="101" width="3.2" height="3.2" fill="#00f0ff" />
    <rect x="40.1" y="101" width="3.2" height="3.2" fill="#10b981" />
    <rect x="17.8" y="62.4" width="3.2" height="3.2" fill="#00f0ff" />

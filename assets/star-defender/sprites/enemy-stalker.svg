<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Glossy Crimson-Violet Mantis Chitin & Reaper Scythes (Matches Showcase ENEMY-04) -->
    <linearGradient id="est-chitin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#be123c"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1a0315"/>
    </linearGradient>
    <linearGradient id="est-scythe-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="30%" stop-color="#e11d48"/>
      <stop offset="70%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#1f0312"/>
    </linearGradient>
    <!-- Glowing Neon-Lime Spinal Nerve Nodes & Venom Barb -->
    <radialGradient id="est-nerve-lime" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#a3e635"/>
      <stop offset="80%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </radialGradient>
    <!-- Amber Compound Eye -->
    <radialGradient id="est-amber-eye" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="est-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#be123c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f0208" stop-opacity="0"/>
    </radialGradient>
    <pattern id="est-manga-hatch" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 0 5 L 5 0 M -1 1 L 1 -1" stroke="#0f0208" stroke-width="0.65" opacity="0.48"/>
    </pattern>
  </defs>

  <!-- 1. Ground Shadow -->
  <g id="part-shadow-cast" data-pivot="64 68" data-parent="root" data-z-index="1" data-blend="multiply">
    <ellipse cx="64" cy="68" rx="54" ry="48" fill="#090106" opacity="0.6"/>
  </g>

  <!-- 2. Outer Bio-Hazard Aura Ring -->
  <g id="part-aura-ring-outer" data-pivot="64 64" data-parent="root" data-z-index="4" data-blend="screen">
    <circle cx="64" cy="64" r="58" fill="url(#est-aura)"/>
    <circle cx="64" cy="64" r="55" fill="none" stroke="#84cc16" stroke-width="0.7" opacity="0.34"/>
  </g>

  <!-- 3. Inner Bio-Hazard Aura Ring -->
  <g id="part-aura-ring-inner" data-pivot="64 64" data-parent="root" data-z-index="5" data-blend="screen">
    <circle cx="64" cy="64" r="42" fill="none" stroke="#f43f5e" stroke-width="0.6" opacity="0.28"/>
  </g>

  <!-- 4 & 5. Two Pairs of Bent Insectoid Mantis Walking Legs (part-manta-fin-L / part-manta-fin-R) -->
  <g id="part-manta-fin-L" data-pivot="46 60" data-parent="part-stalker-carapace" data-z-index="14" data-blend="normal">
    <!-- Upper-Left & Lower-Left Articulated Mantis Legs -->
    <path d="M 52 60 L 34 68 L 28 88 L 22 94" fill="none" stroke="#0f0208" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 52 60 L 34 68 L 28 88 L 22 94" fill="none" stroke="#be123c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 54 74 L 38 86 L 34 108 L 28 114" fill="none" stroke="#0f0208" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 54 74 L 38 86 L 34 108 L 28 114" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="part-manta-fin-R" data-pivot="82 60" data-parent="part-stalker-carapace" data-z-index="15" data-blend="normal">
    <!-- Upper-Right & Lower-Right Articulated Mantis Legs -->
    <path d="M 76 60 L 94 68 L 100 88 L 106 94" fill="none" stroke="#0f0208" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 76 60 L 94 68 L 100 88 L 106 94" fill="none" stroke="#be123c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 74 74 L 90 86 L 94 108 L 100 114" fill="none" stroke="#0f0208" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 74 74 L 90 86 L 94 108 L 100 114" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 6 & 7. Multi-Segmented Coiling Scorpion Stinger Tail (part-tail-segment + part-tail-stinger) -->
  <g id="part-tail-segment" data-pivot="64 82" data-parent="part-stalker-carapace" data-z-index="18" data-blend="normal">
    <path d="M 56 80 L 72 80 L 70 90 L 58 90 Z" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="1.6"/>
    <path d="M 58 90 L 70 90 L 68 99 L 59 99 Z" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="1.6"/>
    <path d="M 59 99 L 68 99 L 65 108 L 57 107 Z" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="1.5"/>
  </g>
  <g id="part-tail-stinger" data-pivot="64 102" data-parent="part-tail-segment" data-z-index="20" data-blend="normal">
    <!-- Curved Scorpion Tail Hook & Glowing Neon-Lime Venom Barb (Matching Showcase ENEMY-04 tail) -->
    <path d="M 57 106 C 54 114, 58 123, 68 123 C 75 123, 79 117, 74 111 C 72 115, 67 117, 64 114 C 62 112, 63 108, 65 107 Z" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="1.6"/>
    <path d="M 72 115 L 82 108 L 74 121 Z" fill="url(#est-nerve-lime)" stroke="#0f0208" stroke-width="1.2"/>
  </g>

  <!-- 8 & 9. Mantis Raptorial Shoulder Arms (part-scythe-arm-L / part-scythe-arm-R) -->
  <g id="part-scythe-arm-L" data-pivot="44 44" data-parent="part-stalker-carapace" data-z-index="24" data-blend="normal">
    <path d="M 50 38 C 36 28, 22 22, 14 28 C 18 35, 32 40, 48 46 Z" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="1.9"/>
    <circle cx="20" cy="29" r="3" fill="url(#est-nerve-lime)" stroke="#0f0208" stroke-width="1"/>
  </g>
  <g id="part-scythe-arm-R" data-pivot="84 44" data-parent="part-stalker-carapace" data-z-index="25" data-blend="normal">
    <path d="M 78 38 C 92 28, 106 22, 114 28 C 110 35, 96 40, 80 46 Z" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="1.9"/>
    <circle cx="108" cy="29" r="3" fill="url(#est-nerve-lime)" stroke="#0f0208" stroke-width="1"/>
  </g>

  <!-- 10. Left Massive Curved Serrated Mantis Reaper Scythe Blade (part-scythe-blade-L, Matching Showcase ENEMY-04) -->
  <g id="part-scythe-blade-L" data-pivot="16 31" data-parent="part-scythe-arm-L" data-z-index="26" data-blend="normal">
    <!-- White Razor Inner Saw-Teeth Along Scythe Curve -->
    <polygon points="18,36 26,40 20,44 27,48 21,53 28,57 22,62 29,67 24,72 31,77 26,82" fill="#fef2f2" stroke="#0f0208" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Massive Sweeping Crimson-Violet Crescent Scythe Blade -->
    <path d="M 18 22 C 2 32, 2 68, 28 94 C 22 76, 18 52, 24 34 Z" fill="url(#est-scythe-grad)" stroke="#0f0208" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M 18 22 C 2 32, 2 68, 28 94 C 22 76, 18 52, 24 34 Z" fill="url(#est-manga-hatch)"/>
    <!-- Glowing Neon-Lime Bio-Plasma Vein Inside Blade -->
    <path d="M 16 28 C 8 42, 10 66, 24 86" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 12 32 C 5 46, 7 68, 20 86" fill="none" stroke="#fda4af" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 11. Right Massive Curved Serrated Mantis Reaper Scythe Blade (part-scythe-blade-R, Matching Showcase ENEMY-04) -->
  <g id="part-scythe-blade-R" data-pivot="112 31" data-parent="part-scythe-arm-R" data-z-index="27" data-blend="normal">
    <!-- White Razor Inner Saw-Teeth Along Scythe Curve -->
    <polygon points="110,36 102,40 108,44 101,48 107,53 100,57 106,62 99,67 104,72 97,77 102,82" fill="#fef2f2" stroke="#0f0208" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Massive Sweeping Crimson-Violet Crescent Scythe Blade -->
    <path d="M 110 22 C 126 32, 126 68, 100 94 C 106 76, 110 52, 104 34 Z" fill="url(#est-scythe-grad)" stroke="#0f0208" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M 110 22 C 126 32, 126 68, 100 94 C 106 76, 110 52, 104 34 Z" fill="url(#est-manga-hatch)"/>
    <!-- Glowing Neon-Lime Bio-Plasma Vein Inside Blade -->
    <path d="M 112 28 C 120 42, 118 66, 104 86" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 116 32 C 123 46, 121 68, 108 86" fill="none" stroke="#fda4af" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 12. Slender V-Shaped Armored Mantis Torso & 3 Glowing Neon-Lime Spinal Nerve Nodes (part-stalker-carapace) -->
  <g id="part-stalker-carapace" data-pivot="64 58" data-parent="root" data-z-index="32" data-blend="normal">
    <!-- Shoulder Spikes -->
    <polygon points="44,36 32,26 48,44" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="1.5"/>
    <polygon points="84,36 96,26 80,44" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="1.5"/>
    <!-- V-Tapered Mantis Thorax Carapace -->
    <path d="M 44 36 C 54 32, 74 32, 84 36 L 74 82 L 54 82 Z" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 44 36 C 54 32, 74 32, 84 36 L 74 82 L 54 82 Z" fill="url(#est-manga-hatch)"/>
    <!-- Overlapping Ribbed Thorax Somites -->
    <path d="M 46 46 C 56 42, 72 42, 82 46 L 79 56 C 70 52, 58 52, 49 56 Z" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="1.4"/>
    <path d="M 49 58 C 58 54, 70 54, 79 58 L 76 68 C 68 65, 60 65, 52 68 Z" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="1.4"/>
    <!-- Glowing Neon-Lime Dorsal Neural Cord & 3 Spinal Nerve Ganglia (Matching Showcase ENEMY-04 spine) -->
    <line x1="64" y1="36" x2="64" y2="80" stroke="#a3e635" stroke-width="2.4"/>
    <ellipse cx="64" cy="44" rx="5.5" ry="4" fill="url(#est-nerve-lime)" stroke="#0f0208" stroke-width="1.2"/>
    <ellipse cx="64" cy="57" rx="5" ry="3.8" fill="url(#est-nerve-lime)" stroke="#0f0208" stroke-width="1.2"/>
    <ellipse cx="64" cy="70" rx="4.2" ry="3.2" fill="url(#est-nerve-lime)" stroke="#0f0208" stroke-width="1.2"/>
  </g>

  <!-- 13. Triangular Mantis Assassin Head & Long Sweeping Antennae (part-stalker-head) -->
  <g id="part-stalker-head" data-pivot="64 34" data-parent="part-stalker-carapace" data-z-index="38" data-blend="normal">
    <!-- Twin Long Sweeping Mantis Antennae -->
    <path d="M 56 18 C 46 8, 30 4, 14 6" fill="none" stroke="#0f0208" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 56 18 C 46 8, 30 4, 14 6" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 72 18 C 82 8, 98 4, 114 6" fill="none" stroke="#0f0208" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 72 18 C 82 8, 98 4, 114 6" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Sharp Triangular Mantis Head & Front Fangs -->
    <polygon points="56,16 52,8 60,14" fill="#fef2f2" stroke="#0f0208" stroke-width="1.1"/>
    <polygon points="72,16 76,8 68,14" fill="#fef2f2" stroke="#0f0208" stroke-width="1.1"/>
    <path d="M 46 22 C 56 16, 72 16, 82 22 L 64 40 Z" fill="url(#est-chitin)" stroke="#0f0208" stroke-width="1.9" stroke-linejoin="round"/>
    <circle cx="64" cy="24" r="3" fill="url(#est-nerve-lime)" stroke="#0f0208" stroke-width="1"/>
  </g>

  <!-- 14. Twin Large Angled Amber-Gold Mantis Compound Eyes (part-stalker-eyes) -->
  <g id="part-stalker-eyes" data-pivot="64 30" data-parent="part-stalker-head" data-z-index="42" data-blend="normal">
    <ellipse cx="51" cy="24" rx="6" ry="3.4" transform="rotate(28 51 24)" fill="url(#est-amber-eye)" stroke="#0f0208" stroke-width="1.3"/>
    <ellipse cx="77" cy="24" rx="6" ry="3.4" transform="rotate(-28 77 24)" fill="url(#est-amber-eye)" stroke="#0f0208" stroke-width="1.3"/>
    <circle cx="49" cy="23" r="1.2" fill="#ffffff"/>
    <circle cx="75" cy="23" r="1.2" fill="#ffffff"/>
    <!-- Compound Eye Ommatidia Facets & Mantis Forelimb Spines -->
    <line x1="46" y1="22" x2="56" y2="26" stroke="#78350f" stroke-width="0.7" opacity="0.7"/>
    <line x1="49" y1="20" x2="53" y2="27" stroke="#78350f" stroke-width="0.7" opacity="0.7"/>
    <line x1="72" y1="26" x2="82" y2="22" stroke="#78350f" stroke-width="0.7" opacity="0.7"/>
    <line x1="75" y1="27" x2="79" y2="20" stroke="#78350f" stroke-width="0.7" opacity="0.7"/>
    <!-- Additional Serrated Inner Scythe Spines & Neural Ganglia Nodes -->
    <circle cx="34" cy="68" r="1.8" fill="#a3e635" stroke="#0f0208" stroke-width="0.7"/>
    <circle cx="94" cy="68" r="1.8" fill="#a3e635" stroke="#0f0208" stroke-width="0.7"/>
    <circle cx="38" cy="86" r="1.6" fill="#a3e635" stroke="#0f0208" stroke-width="0.7"/>
    <circle cx="90" cy="86" r="1.6" fill="#a3e635" stroke="#0f0208" stroke-width="0.7"/>
    <circle cx="64" cy="85" r="2.2" fill="#a3e635" stroke="#0f0208" stroke-width="0.8"/>
    <circle cx="64" cy="94" r="2" fill="#a3e635" stroke="#0f0208" stroke-width="0.8"/>
    <circle cx="63" cy="103" r="1.8" fill="#a3e635" stroke="#0f0208" stroke-width="0.8"/>
    <!-- Scythe Energy Conduits & Carapace Rib Lines -->
    <line x1="50" y1="40" x2="60" y2="44" stroke="#fda4af" stroke-width="0.9"/>
    <line x1="78" y1="40" x2="68" y2="44" stroke="#fda4af" stroke-width="0.9"/>
    <line x1="52" y1="52" x2="60" y2="56" stroke="#fda4af" stroke-width="0.9"/>
    <line x1="76" y1="52" x2="68" y2="56" stroke="#fda4af" stroke-width="0.9"/>
    <line x1="54" y1="64" x2="60" y2="68" stroke="#fda4af" stroke-width="0.9"/>
    <line x1="74" y1="64" x2="68" y2="68" stroke="#fda4af" stroke-width="0.9"/>
    <circle cx="14" cy="48" r="1.4" fill="#fef08a"/>
    <circle cx="16" cy="64" r="1.4" fill="#fef08a"/>
    <circle cx="114" cy="48" r="1.4" fill="#fef08a"/>
    <circle cx="112" cy="64" r="1.4" fill="#fef08a"/>
  </g>

  <!-- 15. Cel-Shaded Specular Rim Highlights -->
  <g id="part-light-rim-stalker" data-pivot="64 58" data-parent="part-stalker-carapace" data-z-index="45" data-blend="plus-lighter">
    <path d="M 48 37 L 64 34 L 80 37" fill="none" stroke="#fda4af" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 16. Top Bio-Luminescent Glare -->
  <g id="part-aura-corona-top" data-pivot="64 64" data-parent="root" data-z-index="65" data-blend="screen">
    <circle cx="64" cy="56" r="16" fill="#a3e635" opacity="0.22"/>
  </g>
</svg>

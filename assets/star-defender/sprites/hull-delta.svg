<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="hull-delta-rig" data-root-anchor="64,64" data-has-aura="true">
  <defs>
    <!-- 1. 环境接触软阴影材质 -->
    <radialGradient id="hd-cast-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.72" />
      <stop offset="55%" stop-color="#030712" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <!-- 2. 护盾与引力能量场渐变 -->
    <radialGradient id="hd-aura-field" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.28" />
      <stop offset="58%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <!-- 3. 暗部黑曜蓝舰体基底 (50% 暗部体积) -->
    <linearGradient id="hd-obsidian-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050b18" />
    </linearGradient>
    <!-- 4. 中层复合装甲切面 (30% 结构分件) -->
    <linearGradient id="hd-armor-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <!-- 5. 推进尾焰高能渐变 (10% 焦点高光) -->
    <linearGradient id="hd-plume-jet" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f0ff" />
      <stop offset="65%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
    <!-- 6. 轴承球头与核心发光渐变 -->
    <radialGradient id="hd-joint-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <!-- 7. 舰体受光边缘高光映射贴图 -->
    <linearGradient id="hd-rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- [光影层 1] 环境接触软阴影贴图 (z=1, multiply) -->
  <!-- [光影层 2A] 护盾顺时针自转外环贴图 (z=4, screen) -->
  <!-- [光影层 2B] 护盾逆时针自转相位叶轮内环贴图 (z=5, screen) -->
  <!-- [骨骼部件 1] 多档位过载尾焰层 (z=10) -->
  <!-- [骨骼部件 2] 左矢量推进喷管 (z=15) -->
  <!-- [骨骼部件 3] 右矢量推进喷管 (z=15) -->

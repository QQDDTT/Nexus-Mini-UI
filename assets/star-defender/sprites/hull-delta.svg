<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="hull-delta-rig" data-root-anchor="64,64" data-faction="helios" data-has-aura="true">
  <defs>
    <!-- 1. 赫利俄斯阳极氧化暗黑钛合金骨架 (Anodized Brushed Dark Titanium) -->
    <linearGradient id="hd-titanium-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- 2. NASA 航天飞机级哑光黑碳硅防热瓦 (Matte-Black Carbon-Silicon Tiles) -->
    <linearGradient id="hd-black-tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27303f"/>
      <stop offset="50%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <!-- 3. NASA 航天飞机级高反射极白陶瓷隔热瓦 (High-Reflectance White Ceramic Tiles) -->
    <linearGradient id="hd-white-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="82%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- 4. 24K 聚酰亚胺多面体褶皱金箔 (Crinkled 24K Gold Kapton Thermal Foil) -->
    <linearGradient id="hd-kapton-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="22%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="78%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <!-- 5. 电磁导轨炮内腔紫铜加速块渐变 -->
    <linearGradient id="hd-rail-copper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#290f02"/>
    </linearGradient>
    <!-- 6. 聚变主推进器高热琥珀尾焰 -->
    <linearGradient id="hd-plume-amber" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f97316" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </linearGradient>
    <!-- 7. 核心琥珀金辉光 -->
    <radialGradient id="hd-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#431407" stop-opacity="0"/>
    </radialGradient>
    <!-- 8. 底部深空接触投影 -->
    <radialGradient id="hd-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.9"/>
      <stop offset="68%" stop-color="#020617" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <!-- 9. Pattern A: NASA 陶瓷瓦微接缝网格 -->
    <pattern id="hd-tile-grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none" stroke="#475569" stroke-width="0.45" opacity="0.55"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#64748b" stroke-width="0.35" opacity="0.45"/>
    </pattern>
    <!-- 10. Pattern B: 24K Kapton 金箔立体折痕微肌理 -->
    <pattern id="hd-kapton-crinkle" width="8" height="8" patternUnits="userSpaceOnUse">
      <polygon points="0,0 5,0 3,4" fill="#fef08a" opacity="0.55"/>
      <polygon points="5,0 8,0 8,5 3,4" fill="#ca8a04" opacity="0.5"/>
      <polygon points="0,0 3,4 0,8" fill="#a16207" opacity="0.55"/>
      <polygon points="3,4 8,5 5,8 0,8" fill="#eab308" opacity="0.45"/>
      <polygon points="8,5 8,8 5,8" fill="#713f12" opacity="0.65"/>
      <path d="M0,0 L3,4 L8,5 M5,0 L3,4 L0,8 M3,4 L5,8" fill="none" stroke="#fef9c3" stroke-width="0.4" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- 1. 底部投影 (z=1, <=3 nodes) -->
  <g id="part-shadow-cast" data-pivot="64,68" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="70" rx="54" ry="52" fill="url(#hd-shadow-grad)"/>
    <polygon points="50,6 78,6 82,48 112,72 104,104 24,104 16,72 46,48" fill="#020617" opacity="0.48"/>
  </g>

  <!-- 2. 外圈航宇蓝图工程校准环 (z=4) -->
  <g id="part-aura-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="4" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="57" fill="none" stroke="#f59e0b" stroke-width="0.75" opacity="0.32"/>
    <path d="M64,5 L64,9 M123,64 L119,64 M64,123 L64,119 M5,64 L9,64" stroke="#fde047" stroke-width="1.1" opacity="0.65"/>
  </g>

  <!-- 3. 内圈火控校准环 (z=5) -->
  <g id="part-aura-ring-inner" data-pivot="64,64" data-parent="root" data-z-index="5" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="46" fill="none" stroke="#38bdf8" stroke-width="0.55" opacity="0.24"/>
  </g>

  <!-- 4. 尾部高热聚变激波尾焰 (z=10 · 原生高频喷射动画) -->
  <g id="part-plume-boost" data-pivot="64,104" data-parent="part-hull-main-body" data-z-index="10" data-blend="screen" style="mix-blend-mode: screen">
    <g transform="translate(44,104)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,0.58; 1.1,1.18; 0.92,0.72; 1.06,1.12; 1,0.58" dur="0.22s" repeatCount="indefinite"/>
        <polygon points="-8,0 8,0 4,21 0,24 -4,21" fill="url(#hd-plume-amber)"/>
        <ellipse cx="0" cy="5" rx="4.5" ry="1.6" fill="#ffffff"/>
        <ellipse cx="0" cy="5" rx="3.4" ry="1.2" fill="#fde047">
          <animate attributeName="cy" values="4;20" dur="0.16s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.95;0" dur="0.16s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>
    <g transform="translate(84,104)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,0.64; 1.08,1.15; 0.94,0.68; 1.1,1.2; 1,0.64" dur="0.24s" repeatCount="indefinite"/>
        <polygon points="-8,0 8,0 4,21 0,24 -4,21" fill="url(#hd-plume-amber)"/>
        <ellipse cx="0" cy="5" rx="4.5" ry="1.6" fill="#ffffff"/>
        <ellipse cx="0" cy="5" rx="3.4" ry="1.2" fill="#fde047">
          <animate attributeName="cy" values="4;20" dur="0.18s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.95;0" dur="0.18s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>
  </g>

  <!-- 5. 左舷 24K 褶皱金箔包裹重型圆筒推进器 (z=15, 1:1 还原 preview.png 尾部左金箔喷筒) -->
  <g id="part-thruster-pod-L" data-pivot="44,96" data-parent="part-hull-main-body" data-z-index="15" data-blend="normal">
    <polygon points="35,88 53,88 51,105 37,105" fill="url(#hd-kapton-gold)" stroke="#090d16" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="35,88 53,88 51,105 37,105" fill="url(#hd-kapton-crinkle)"/>
    <!-- 金箔立体折面高光与暗影块 -->
    <polygon points="36,89 43,89 41,96 36,95" fill="#fef08a" opacity="0.75"/>
    <polygon points="43,89 52,89 50,97 44,95" fill="#a16207" opacity="0.65"/>
    <polygon points="37,96 44,95 42,104 37,104" fill="#ca8a04" opacity="0.7"/>
    <polygon points="44,95 50,97 50,104 42,104" fill="#fef9c3" opacity="0.65"/>
    <rect x="35" y="87" width="18" height="2.5" fill="url(#hd-titanium-dark)" stroke="#090d16" stroke-width="0.8"/>
    <rect x="37" y="103" width="14" height="2.2" fill="#1e293b" stroke="#090d16" stroke-width="0.7"/>
  </g>

  <!-- 6. 右舷 24K 褶皱金箔包裹重型圆筒推进器 (z=15, 1:1 还原 preview.png 尾部右金箔喷筒) -->
  <g id="part-thruster-pod-R" data-pivot="84,96" data-parent="part-hull-main-body" data-z-index="15" data-blend="normal">
    <polygon points="75,88 93,88 91,105 77,105" fill="url(#hd-kapton-gold)" stroke="#090d16" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="75,88 93,88 91,105 77,105" fill="url(#hd-kapton-crinkle)"/>
    <!-- 金箔立体折面高光与暗影块 -->
    <polygon points="76,89 83,89 81,96 76,95" fill="#fef08a" opacity="0.75"/>
    <polygon points="83,89 92,89 90,97 84,95" fill="#a16207" opacity="0.65"/>
    <polygon points="77,96 84,95 82,104 77,104" fill="#ca8a04" opacity="0.7"/>
    <polygon points="84,95 90,97 90,104 82,104" fill="#fef9c3" opacity="0.65"/>
    <rect x="75" y="87" width="18" height="2.5" fill="url(#hd-titanium-dark)" stroke="#090d16" stroke-width="0.8"/>
    <rect x="77" y="103" width="14" height="2.2" fill="#1e293b" stroke="#090d16" stroke-width="0.7"/>
  </g>

  <!-- 7. 左舷 NASA 黑白隔热陶瓷瓦梯形掠翼与翼根 24K 金箔凹舱 (z=20, 1:1 还原 preview.png 机翼) -->
  <g id="part-wing-port-L" data-pivot="46,74" data-parent="part-hull-main-body" data-z-index="20" data-blend="normal">
    <!-- 外围哑光黑碳硅防热瓦外框 -->
    <polygon points="50,50 18,68 14,94 52,94" fill="url(#hd-black-tile)" stroke="#090d16" stroke-width="2.0" stroke-linejoin="round"/>
    <!-- 翼根大面积三角形 24K Kapton 褶皱金箔热控凹舱 (还原 preview.png 翼根金箔区) -->
    <polygon points="50,52 34,62 40,78 52,78" fill="url(#hd-kapton-gold)" stroke="#090d16" stroke-width="1.1"/>
    <polygon points="50,52 34,62 40,78 52,78" fill="url(#hd-kapton-crinkle)"/>
    <polygon points="48,55 37,63 43,70" fill="#fef9c3" opacity="0.75"/>
    <polygon points="37,63 41,76 49,75 43,70" fill="#a16207" opacity="0.65"/>
    <!-- 机翼前缘斜向极白陶瓷隔热瓦阵列 (3 块大白瓦) -->
    <polygon points="33,61 19,69 24,77 38,69" fill="url(#hd-white-tile)" stroke="#0f172a" stroke-width="1.1"/>
    <line x1="28.5" y1="63.5" x2="33.5" y2="71.5" stroke="#0f172a" stroke-width="0.9"/>
    <line x1="23.5" y1="66.5" x2="28.5" y2="74.5" stroke="#0f172a" stroke-width="0.9"/>
    <!-- 机翼后部 2x3 极白陶瓷隔热瓦主矩阵 (还原 preview.png 标志性白瓷砖块) -->
    <rect x="20" y="78" width="30" height="12" fill="url(#hd-white-tile)" stroke="#0f172a" stroke-width="1.15"/>
    <rect x="20" y="78" width="30" height="12" fill="url(#hd-tile-grid)"/>
    <line x1="30" y1="78" x2="30" y2="90" stroke="#0f172a" stroke-width="1.0"/>
    <line x1="40" y1="78" x2="40" y2="90" stroke="#0f172a" stroke-width="1.0"/>
    <line x1="20" y1="84" x2="50" y2="84" stroke="#0f172a" stroke-width="0.95"/>
    <!-- 翼缘红色硬挂点色标块 ([Red Hardpoint] 还原 preview.png 机翼斜边红块) -->
    <polygon points="29,59 35,55 37,58 31,62" fill="#ef4444" stroke="#090d16" stroke-width="0.8"/>
  </g>

  <!-- 8. 右舷 NASA 黑白隔热陶瓷瓦梯形掠翼与翼根 24K 金箔凹舱 (z=20, 1:1 还原 preview.png 机翼) -->
  <g id="part-wing-starboard-R" data-pivot="82,74" data-parent="part-hull-main-body" data-z-index="20" data-blend="normal">
    <!-- 外围哑光黑碳硅防热瓦外框 -->
    <polygon points="78,50 110,68 114,94 76,94" fill="url(#hd-black-tile)" stroke="#090d16" stroke-width="2.0" stroke-linejoin="round"/>
    <!-- 翼根大面积三角形 24K Kapton 褶皱金箔热控凹舱 -->
    <polygon points="78,52 94,62 88,78 76,78" fill="url(#hd-kapton-gold)" stroke="#090d16" stroke-width="1.1"/>
    <polygon points="78,52 94,62 88,78 76,78" fill="url(#hd-kapton-crinkle)"/>
    <polygon points="80,55 91,63 85,70" fill="#fef9c3" opacity="0.75"/>
    <polygon points="91,63 87,76 79,75 85,70" fill="#a16207" opacity="0.65"/>
    <!-- 机翼前缘斜向极白陶瓷隔热瓦阵列 (3 块大白瓦) -->
    <polygon points="95,61 109,69 104,77 90,69" fill="url(#hd-white-tile)" stroke="#0f172a" stroke-width="1.1"/>
    <line x1="99.5" y1="63.5" x2="94.5" y2="71.5" stroke="#0f172a" stroke-width="0.9"/>
    <line x1="104.5" y1="66.5" x2="99.5" y2="74.5" stroke="#0f172a" stroke-width="0.9"/>
    <!-- 机翼后部 2x3 极白陶瓷隔热瓦主矩阵 -->
    <rect x="78" y="78" width="30" height="12" fill="url(#hd-white-tile)" stroke="#0f172a" stroke-width="1.15"/>
    <rect x="78" y="78" width="30" height="12" fill="url(#hd-tile-grid)"/>
    <line x1="88" y1="78" x2="88" y2="90" stroke="#0f172a" stroke-width="1.0"/>
    <line x1="98" y1="78" x2="98" y2="90" stroke="#0f172a" stroke-width="1.0"/>
    <line x1="78" y1="84" x2="108" y2="84" stroke="#0f172a" stroke-width="0.95"/>
    <!-- 翼缘红色硬挂点色标块 ([Red Hardpoint]) -->
    <polygon points="99,59 93,55 91,58 97,62" fill="#ef4444" stroke="#090d16" stroke-width="0.8"/>
  </g>

  <!-- 9. 中央重装钛合金舰脊与前伸双叉磁轨炮臂 (z=30, 1:1 还原 preview.png 舰身与长炮叉) -->
  <g id="part-hull-main-body" data-pivot="64,64" data-parent="root" data-z-index="30" data-blend="normal">
    <!-- 后部中央重型钛合金脊柱箱体 -->
    <rect x="52" y="54" width="24" height="42" rx="1.5" fill="url(#hd-titanium-dark)" stroke="#090d16" stroke-width="2.0"/>
    <rect x="55" y="58" width="18" height="34" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <line x1="52" y1="68" x2="76" y2="68" stroke="#090d16" stroke-width="1.4"/>
    <line x1="52" y1="84" x2="76" y2="84" stroke="#090d16" stroke-width="1.4"/>
    <!-- 尾部中轴辅助散热格栅 -->
    <rect x="58" y="96" width="12" height="7" fill="#0f172a" stroke="#090d16" stroke-width="1.2"/>
    <path d="M60,97 L60,102 M62.5,97 L62.5,102 M65.5,97 L65.5,102 M68,97 L68,102" stroke="#475569" stroke-width="0.8"/>

    <!-- 前伸双叉重装护臂 (Twin Forward Prongs) -->
    <!-- 左前叉臂 -->
    <polygon points="48,54 48,14 52,6 59,6 59,54" fill="url(#hd-titanium-dark)" stroke="#090d16" stroke-width="1.9" stroke-linejoin="round"/>
    <!-- 左叉臂前段极白陶瓷装甲板 + 24K 金箔内嵌条 (1:1 还原 preview.png 舰首白板夹金箔) -->
    <polygon points="49,34 49,15 52,8 58,8 58,34" fill="url(#hd-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <rect x="51.5" y="11" width="4" height="19" fill="url(#hd-kapton-gold)" stroke="#090d16" stroke-width="0.75"/>
    <rect x="51.5" y="11" width="4" height="19" fill="url(#hd-kapton-crinkle)"/>
    <!-- 左叉臂后段拉丝暗钛装甲与红/青/黄蓝图模块化色标块 (1:1 还原 preview.png 色标方块) -->
    <rect x="45.5" y="43" width="3.5" height="5.5" rx="0.6" fill="#ef4444" stroke="#090d16" stroke-width="0.75"/>
    <rect x="45.5" y="36" width="3.5" height="5.5" rx="0.6" fill="#06b6d4" stroke="#090d16" stroke-width="0.75"/>
    <rect x="46" y="21" width="2.8" height="4.5" rx="0.5" fill="#f59e0b" stroke="#090d16" stroke-width="0.7"/>

    <!-- 右前叉臂 -->
    <polygon points="80,54 80,14 76,6 69,6 69,54" fill="url(#hd-titanium-dark)" stroke="#090d16" stroke-width="1.9" stroke-linejoin="round"/>
    <!-- 右叉臂前段极白陶瓷装甲板 + 24K 金箔内嵌条 -->
    <polygon points="79,34 79,15 76,8 70,8 70,34" fill="url(#hd-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <rect x="72.5" y="11" width="4" height="19" fill="url(#hd-kapton-gold)" stroke="#090d16" stroke-width="0.75"/>
    <rect x="72.5" y="11" width="4" height="19" fill="url(#hd-kapton-crinkle)"/>
    <!-- 右叉臂后段红/青/黄蓝图模块化色标块 -->
    <rect x="79" y="43" width="3.5" height="5.5" rx="0.6" fill="#ef4444" stroke="#090d16" stroke-width="0.75"/>
    <rect x="79" y="36" width="3.5" height="5.5" rx="0.6" fill="#06b6d4" stroke="#090d16" stroke-width="0.75"/>
    <rect x="79.2" y="21" width="2.8" height="4.5" rx="0.5" fill="#f59e0b" stroke="#090d16" stroke-width="0.7"/>

    <!-- 双叉中央槽内精密机械底座 -->
    <rect x="59" y="14" width="10" height="40" fill="#090d16"/>
  </g>

  <!-- 10. 左联内嵌式模块化重型磁轨炮管 (z=38, 1:1 还原 preview.png 中央槽左导轨) -->
  <g id="part-barrel-tube-L" data-pivot="61.5,52" data-parent="part-turret-housing" data-z-index="38" data-blend="normal">
    <rect x="59.2" y="12" width="4.2" height="42" fill="url(#hd-titanium-dark)" stroke="#090d16" stroke-width="0.9"/>
    <!-- 机械导轨横向精密卡箍与紫铜线圈节 -->
    <rect x="59.6" y="16" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>
    <rect x="59.6" y="22" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>
    <rect x="59.6" y="28" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>
    <rect x="59.6" y="34" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>
    <rect x="59.6" y="40" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>
    <rect x="59.6" y="46" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>
    <line x1="61.3" y1="12" x2="61.3" y2="52" stroke="#94a3b8" stroke-width="0.65"/>
  </g>

  <!-- 11. 右联内嵌式模块化重型磁轨炮管 (z=38, 1:1 还原 preview.png 中央槽右导轨) -->
  <g id="part-barrel-tube-R" data-pivot="66.5,52" data-parent="part-turret-housing" data-z-index="38" data-blend="normal">
    <rect x="64.6" y="12" width="4.2" height="42" fill="url(#hd-titanium-dark)" stroke="#090d16" stroke-width="0.9"/>
    <!-- 机械导轨横向精密卡箍与紫铜线圈节 -->
    <rect x="65.0" y="16" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>
    <rect x="65.0" y="22" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>
    <rect x="65.0" y="28" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>
    <rect x="65.0" y="34" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>
    <rect x="65.0" y="40" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>
    <rect x="65.0" y="46" width="3.4" height="3.2" fill="url(#hd-rail-copper)"/>

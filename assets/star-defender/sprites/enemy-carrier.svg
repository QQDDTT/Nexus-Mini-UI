    <circle cx="61" cy="58" r="1.5" fill="#ffffff"/>
    <!-- Top Hexagon Cell -->
    <polygon points="64,31 73,36.5 73,47.5 64,53 55,47.5 55,36.5" fill="url(#ecr-honeycomb-cell)" stroke="#4c0519" stroke-width="2.2"/>
    <circle cx="64" cy="42" r="3.5" fill="#fef08a" opacity="0.7"/>
    <!-- Bottom Hexagon Cell -->
    <polygon points="64,67 73,72.5 73,83.5 64,89 55,83.5 55,72.5" fill="url(#ecr-honeycomb-cell)" stroke="#4c0519" stroke-width="2.2"/>
    <circle cx="64" cy="78" r="3.5" fill="#fef08a" opacity="0.7"/>
    <!-- Upper-Left Hexagon Cell -->
    <polygon points="47,40 56,45.5 56,56.5 47,62 38,56.5 38,45.5" fill="url(#ecr-honeycomb-cell)" stroke="#4c0519" stroke-width="2.2"/>
    <circle cx="47" cy="51" r="3.5" fill="#fef08a" opacity="0.7"/>
    <!-- Lower-Left Hexagon Cell -->
    <polygon points="47,58 56,63.5 56,74.5 47,80 38,74.5 38,63.5" fill="url(#ecr-honeycomb-cell)" stroke="#4c0519" stroke-width="2.2"/>
    <circle cx="47" cy="69" r="3.5" fill="#fef08a" opacity="0.7"/>
    <!-- Upper-Right Hexagon Cell -->
    <polygon points="81,40 90,45.5 90,56.5 81,62 72,56.5 72,45.5" fill="url(#ecr-honeycomb-cell)" stroke="#4c0519" stroke-width="2.2"/>
    <circle cx="81" cy="51" r="3.5" fill="#fef08a" opacity="0.7"/>
    <!-- Lower-Right Hexagon Cell -->
    <polygon points="81,58 90,63.5 90,74.5 81,80 72,74.5 72,63.5" fill="url(#ecr-honeycomb-cell)" stroke="#4c0519" stroke-width="2.2"/>
    <circle cx="81" cy="69" r="3.5" fill="#fef08a" opacity="0.7"/>
    <!-- Specular Highlights, Amniotic Bubbles & Larval Silhouettes Inside All 7 Hexagonal Brood Cells -->
    <circle cx="62" cy="39" r="1.4" fill="#ffffff" opacity="0.85"/>
    <circle cx="67" cy="45" r="1.1" fill="#ecfccb" opacity="0.75"/>
    <circle cx="62" cy="75" r="1.4" fill="#ffffff" opacity="0.85"/>
    <circle cx="67" cy="81" r="1.1" fill="#ecfccb" opacity="0.75"/>
    <circle cx="45" cy="48" r="1.4" fill="#ffffff" opacity="0.85"/>
    <circle cx="50" cy="54" r="1.1" fill="#ecfccb" opacity="0.75"/>
    <circle cx="45" cy="66" r="1.4" fill="#ffffff" opacity="0.85"/>
    <circle cx="50" cy="72" r="1.1" fill="#ecfccb" opacity="0.75"/>
    <circle cx="79" cy="48" r="1.4" fill="#ffffff" opacity="0.85"/>
    <circle cx="84" cy="54" r="1.1" fill="#ecfccb" opacity="0.75"/>
    <circle cx="79" cy="66" r="1.4" fill="#ffffff" opacity="0.85"/>
    <circle cx="84" cy="72" r="1.1" fill="#ecfccb" opacity="0.75"/>
    <!-- Outer Partial Honeycomb Rim Cells & Carapace Rivet Nodes -->
    <circle cx="34" cy="42" r="1.6" fill="#a3e635" stroke="#0f0208" stroke-width="0.6"/>
    <circle cx="94" cy="42" r="1.6" fill="#a3e635" stroke="#0f0208" stroke-width="0.6"/>
    <circle cx="34" cy="76" r="1.6" fill="#a3e635" stroke="#0f0208" stroke-width="0.6"/>
    <circle cx="94" cy="76" r="1.6" fill="#a3e635" stroke="#0f0208" stroke-width="0.6"/>
    <circle cx="26" cy="84" r="1.8" fill="#fda4af" stroke="#0f0208" stroke-width="0.6"/>
    <circle cx="102" cy="84" r="1.8" fill="#fda4af" stroke="#0f0208" stroke-width="0.6"/>
    <path d="M 32 76 C 24 82, 26 92, 36 96" fill="none" stroke="#fda4af" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 96 76 C 104 82, 102 92, 92 96" fill="none" stroke="#fda4af" stroke-width="1.2" stroke-linecap="round"/>

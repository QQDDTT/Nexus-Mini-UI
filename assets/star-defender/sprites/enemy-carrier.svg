    <path d="M 80 24 C 110 24, 122 52, 104 72 C 96 56, 90 40, 80 24 Z" fill="url(#ecr-manga-hatch)"/>
    <!-- Elytra Ridge Seam -->
    <path d="M 86 28 C 104 34, 112 50, 104 66" fill="none" stroke="#fda4af" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
  </g>


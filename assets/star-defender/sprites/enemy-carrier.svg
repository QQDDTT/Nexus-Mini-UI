    <polygon points="18,58 6,62 18,68" fill="url(#ecr-chitin)" stroke="#0f0208" stroke-width="1.4"/>
  </g>
  <g id="part-aux-stabilizer-5" data-pivot="44.2 44.2" data-parent="root" data-z-index="21" data-blend="normal">
    <polygon points="22,32 10,24 18,40" fill="url(#ecr-chitin)" stroke="#0f0208" stroke-width="1.4"/>
  </g>
  <g id="part-aux-stabilizer-6" data-pivot="64 36" data-parent="root" data-z-index="22" data-blend="normal">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Glossy Crimson-Violet Beetle Elytra Wing-Shells (Matches Showcase ENEMY-05) -->
    <linearGradient id="ecr-chitin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#be123c"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1a0315"/>
    </linearGradient>
    <linearGradient id="ecr-chitin-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="55%" stop-color="#3b0726"/>
      <stop offset="100%" stop-color="#0f0208"/>
    </linearGradient>
    <!-- Glowing Neon-Lime Hexagonal Honeycomb Brood-Egg Sacs -->
    <radialGradient id="ecr-honeycomb-cell" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="38%" stop-color="#a3e635"/>
      <stop offset="75%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </radialGradient>
    <!-- Amber Compound Eye -->
    <radialGradient id="ecr-amber-eye" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="ecr-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#be123c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0f0208" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ecr-manga-hatch" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 0 5 L 5 0 M -1 1 L 1 -1" stroke="#0f0208" stroke-width="0.65" opacity="0.48"/>
    </pattern>
  </defs>

  <!-- 1. Ground Shadow -->
  <g id="part-shadow-cast" data-pivot="64 68" data-parent="root" data-z-index="1" data-blend="multiply">
    <ellipse cx="64" cy="68" rx="54" ry="50" fill="#090106" opacity="0.62"/>
  </g>

  <!-- 2. Outer Bio-Hazard Aura Ring -->
  <g id="part-aura-ring-outer" data-pivot="64 64" data-parent="root" data-z-index="4" data-blend="screen">
    <circle cx="64" cy="64" r="59" fill="url(#ecr-aura)"/>
    <circle cx="64" cy="64" r="56" fill="none" stroke="#84cc16" stroke-width="0.7" opacity="0.35"/>
  </g>

  <!-- 3. Inner Bio-Hazard Aura Ring -->
  <g id="part-aura-ring-inner" data-pivot="64 64" data-parent="root" data-z-index="5" data-blend="screen">
    <circle cx="64" cy="60" r="44" fill="none" stroke="#f43f5e" stroke-width="0.6" opacity="0.28"/>
  </g>

  <!-- 4. Twin Blazing Neon-Lime Bio-Plasma Rear Thruster Plumes (part-bio-plasma-vent, Matching Showcase ENEMY-05) -->
  <g id="part-bio-plasma-vent" data-pivot="64 102" data-parent="part-mother-keel" data-z-index="12" data-blend="normal">
    <!-- Left & Right Crimson Bio-Thruster Nozzles -->
    <path d="M 44 96 L 58 96 L 55 106 L 47 106 Z" fill="url(#ecr-chitin-dark)" stroke="#0f0208" stroke-width="1.5"/>
    <path d="M 70 96 L 84 96 L 81 106 L 73 106 Z" fill="url(#ecr-chitin-dark)" stroke="#0f0208" stroke-width="1.5"/>
    <!-- Twin Blazing Neon-Lime Bio-Plasma Jet Plumes -->
    <path d="M 47 105 C 44 114, 48 125, 52 127 C 56 125, 58 114, 55 105 Z" fill="#84cc16" stroke="#365314" stroke-width="1"/>
    <path d="M 49 105 C 48 112, 50 120, 52 122 C 54 120, 55 112, 53 105 Z" fill="#fef08a"/>
    <path d="M 73 105 C 70 114, 74 125, 76 127 C 80 125, 84 114, 81 105 Z" fill="#84cc16" stroke="#365314" stroke-width="1"/>
    <path d="M 75 105 C 74 112, 75 120, 77 122 C 79 120, 80 112, 79 105 Z" fill="#fef08a"/>
  </g>

  <!-- 5~14. Lower Beetle Wing-Shells, Head Pincer Horns & Lateral Chitin Stabilizers -->
  <!-- Lower-Right Beetle Wing-Shell (part-aux-stabilizer-1) -->
  <g id="part-aux-stabilizer-1" data-pivot="83.8 83.8" data-parent="root" data-z-index="17" data-blend="normal">
    <path d="M 88 64 C 110 66, 118 88, 96 102 C 84 106, 76 96, 80 80 Z" fill="url(#ecr-chitin)" stroke="#0f0208" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 88 64 C 110 66, 118 88, 96 102 C 84 106, 76 96, 80 80 Z" fill="url(#ecr-manga-hatch)"/>
  </g>
  <!-- Rear Abdomen Carapace & Green Ganglion Node (part-aux-stabilizer-2) -->
  <g id="part-aux-stabilizer-2" data-pivot="64 92" data-parent="root" data-z-index="18" data-blend="normal">
    <path d="M 48 88 L 80 88 L 76 102 L 52 102 Z" fill="url(#ecr-chitin)" stroke="#0f0208" stroke-width="1.8"/>
    <ellipse cx="64" cy="95" rx="6" ry="4" fill="url(#ecr-honeycomb-cell)" stroke="#0f0208" stroke-width="1.2"/>
  </g>
  <!-- Top-Right Curved Beetle Pincer Horn & Antenna (part-feeler-right) -->
  <g id="part-feeler-right" data-pivot="78 24" data-parent="part-mother-keel" data-z-index="18" data-blend="normal">
    <path d="M 74 20 C 84 12, 96 8, 106 10" fill="none" stroke="#0f0208" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 74 20 C 84 12, 96 8, 106 10" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 68 20 C 78 12, 82 4, 70 3 C 73 9, 71 14, 65 17 Z" fill="url(#ecr-chitin)" stroke="#0f0208" stroke-width="1.6"/>
  </g>
  <!-- Top-Left Curved Beetle Pincer Horn & Antenna (part-feeler-left) -->
  <g id="part-feeler-left" data-pivot="50 24" data-parent="part-mother-keel" data-z-index="18" data-blend="normal">
    <path d="M 54 20 C 44 12, 32 8, 22 10" fill="none" stroke="#0f0208" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 54 20 C 44 12, 32 8, 22 10" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 60 20 C 50 12, 46 4, 58 3 C 55 9, 57 14, 63 17 Z" fill="url(#ecr-chitin)" stroke="#0f0208" stroke-width="1.6"/>
  </g>

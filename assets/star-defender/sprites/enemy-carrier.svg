    <path d="M 46 24 C 54 16, 74 16, 82 24 C 80 32, 72 34, 64 34 C 56 34, 48 32, 46 24 Z" fill="url(#ecr-chitin)" stroke="#0f0208" stroke-width="1.8"/>
    <ellipse cx="54" cy="24" rx="4.2" ry="2.6" transform="rotate(18 54 24)" fill="url(#ecr-amber-eye)" stroke="#0f0208" stroke-width="1.1"/>
    <ellipse cx="74" cy="24" rx="4.2" ry="2.6" transform="rotate(-18 74 24)" fill="url(#ecr-amber-eye)" stroke="#0f0208" stroke-width="1.1"/>
  </g>
  <g id="part-aux-stabilizer-7" data-pivot="83.8 44.2" data-parent="root" data-z-index="23" data-blend="normal">
    <polygon points="106,32 118,24 110,40" fill="url(#ecr-chitin)" stroke="#0f0208" stroke-width="1.4"/>
  </g>
  <g id="part-aux-stabilizer-8" data-pivot="92 64" data-parent="root" data-z-index="24" data-blend="normal">
    <polygon points="110,58 122,62 110,68" fill="url(#ecr-chitin)" stroke="#0f0208" stroke-width="1.4"/>
  </g>

  <!-- 15. Central Crimson-Violet Hive-Mother Keel & Honeycomb Frame (part-mother-keel) -->
  <g id="part-mother-keel" data-pivot="64 64" data-parent="root" data-z-index="24" data-blend="normal">
    <circle cx="64" cy="60" r="34" fill="url(#ecr-chitin-dark)" stroke="#0f0208" stroke-width="2.2"/>

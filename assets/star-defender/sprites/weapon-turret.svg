<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="weapon-turret-rig" data-root-anchor="64,74" data-has-aura="true" data-faction="helios">
  <defs>
    <radialGradient id="wt-cast-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.84" />
      <stop offset="65%" stop-color="#030712" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wt-aura-field" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.32" />
      <stop offset="52%" stop-color="#fbbf24" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wt-obsidian" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="22%" stop-color="#334155" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="88%" stop-color="#050914" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="wt-turret-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="20%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="85%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="wt-kapton-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="wt-heat-bluing" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="35%" stop-color="#7e22ce" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="wt-coil-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="38%" stop-color="#00f0ff" />
      <stop offset="78%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wt-rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.88" />
      <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- [光影层 1] 炮塔地基接触软阴影贴图 (z=1, multiply) -->
  <g id="part-shadow-cast" data-pivot="64,74" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="76" rx="55" ry="51" fill="url(#wt-cast-shadow)" />
  </g>

  <!-- [光影层 2A] 充能光环外环：顺时针旋转索敌雷达刻度环 (z=4, screen) -->
  <g id="part-aura-ring-outer" data-pivot="64,72" data-parent="root" data-z-index="4" data-blend="screen" data-motion="spin-cw" style="mix-blend-mode: screen">
    <circle cx="64" cy="72" r="54" fill="url(#wt-aura-field)" />
    <path fill="none" stroke="#00f0ff" stroke-width="1.35" stroke-opacity="0.76" d="M112.31,87.7 A50.8,50.8 0 0,1 79.7,120.31 M48.3,120.31 A50.8,50.8 0 0,1 15.69,87.7 M15.69,56.3 A50.8,50.8 0 0,1 48.3,23.69 M79.7,23.69 A50.8,50.8 0 0,1 112.31,56.3" stroke-linecap="square" />
    <path fill="none" stroke="#fbbf24" stroke-width="0.7" stroke-opacity="0.58" d="M107.65,86.18 A45.9,45.9 0 0,1 78.18,115.65 M49.82,115.65 A45.9,45.9 0 0,1 20.35,86.18 M20.35,57.82 A45.9,45.9 0 0,1 49.82,28.35 M78.18,28.35 A45.9,45.9 0 0,1 107.65,57.82" stroke-linecap="square" />
    <polygon points="64,18.2 68,25.2 60,25.2" fill="#00f0ff" fill-opacity="0.88" />
    <polygon points="64,125.8 68,118.8 60,118.8" fill="#00f0ff" fill-opacity="0.88" />
    <polygon points="10.2,72 17.2,76 17.2,68" fill="#fbbf24" fill-opacity="0.88" />
    <polygon points="117.8,72 110.8,76 110.8,68" fill="#fbbf24" fill-opacity="0.88" />
  </g>

  <!-- [光影层 2B] 充能光环内环：逆时针旋转电容脉冲环 (z=5, screen) -->
  <g id="part-aura-ring-inner" data-pivot="64,72" data-parent="root" data-z-index="5" data-blend="screen" data-motion="spin-ccw" style="mix-blend-mode: screen">
    <path fill="none" stroke="#fbbf24" stroke-width="0.95" stroke-opacity="0.72" d="M101,84.02 A38.9,38.9 0 0,1 66.71,110.81 M35.09,98.03 A38.9,38.9 0 0,1 29.04,54.95 M55.91,33.95 A38.9,38.9 0 0,1 96.25,50.25" stroke-linecap="square" />
    <rect x="101.3" y="70.4" width="3.2" height="3.2" fill="#00f0ff" />
    <rect x="81.8" y="104.1" width="3.2" height="3.2" fill="#fbbf24" />
    <rect x="43" y="104.1" width="3.2" height="3.2" fill="#00f0ff" />
    <rect x="23.5" y="70.4" width="3.2" height="3.2" fill="#fbbf24" />
  </g>

  <!-- [骨骼部件 1] 固定八角重装甲底座 (z=15 · [红 W] 火控回转法兰) -->
  <g id="part-pedestal-base" data-pivot="64,72" data-parent="root" data-z-index="15" data-blend="normal">
    <polygon points="45.5,29.5 82.5,29.5 106.5,53.5 106.5,90.5 82.5,114.5 45.5,114.5 21.5,90.5 21.5,53.5" fill="url(#wt-obsidian)" stroke="#ef4444" stroke-width="2.1" stroke-linejoin="miter" stroke-miterlimit="3" />
    <polygon points="50,36 78,36 98,56 98,88 78,108 50,108 30,88 30,56" fill="#091326" stroke="#38bdf8" stroke-width="1.2" />
    <!-- 底座四角 Kapton 金箔液压锚栓 -->
    <circle cx="48" cy="40" r="3.4" fill="url(#wt-kapton-gold)" stroke="#050914" stroke-width="0.7" />
    <circle cx="80" cy="40" r="3.4" fill="url(#wt-kapton-gold)" stroke="#050914" stroke-width="0.7" />
    <circle cx="48" cy="104" r="3.4" fill="url(#wt-kapton-gold)" stroke="#050914" stroke-width="0.7" />
    <circle cx="80" cy="104" r="3.4" fill="url(#wt-kapton-gold)" stroke="#050914" stroke-width="0.7" />
  </g>

  <!-- [骨骼部件 2] 自转超导充能线圈环 (z=22) -->
  <g id="part-energy-coil-ring" data-pivot="64,72" data-parent="part-pedestal-base" data-z-index="22" data-blend="normal" data-motion="spin-cw">
    <path fill="#030712" stroke="#00f0ff" stroke-width="2.2" stroke-opacity="0.78" d="M90.63,80.65 A28,28 0 0,1 72.65,98.63 M55.35,98.63 A28,28 0 0,1 37.37,80.65 M37.37,63.35 A28,28 0 0,1 55.35,45.37 M72.65,45.37 A28,28 0 0,1 90.63,63.35" stroke-linecap="square" />
    <path fill="none" stroke="url(#wt-kapton-gold)" stroke-width="1.4" d="M85.87,79.11 A23,23 0 0,1 71.11,93.87 M56.89,93.87 A23,23 0 0,1 42.13,79.11 M42.13,64.89 A23,23 0 0,1 56.89,50.13 M71.11,50.13 A23,23 0 0,1 85.87,64.89" stroke-linecap="square" />
  </g>

  <!-- [骨骼部件 3] 右独立后坐力伸缩高斯磁轨炮管 (z=28) -->
  <g id="part-barrel-tube-R" data-pivot="75,58" data-parent="part-turret-housing" data-z-index="28" data-blend="normal" data-motion="recoil-y">
    <rect x="70.5" y="11" width="9" height="47" rx="2" fill="url(#wt-heat-bluing)" stroke="#00f0ff" stroke-width="1.8" />
    <rect x="73.5" y="15" width="3" height="37" fill="#00f0ff" />
    <!-- 铜金超导加速线圈匝 -->
    <path d="M71 20 H79 M71 27 H79 M71 34 H79 M71 41 H79" stroke="#fef08a" stroke-width="0.9" />
    <line x1="75" y1="13" x2="75" y2="50" stroke="#ffffff" stroke-width="0.7" />
    <circle cx="75" cy="58" r="4.8" fill="#091326" stroke="url(#wt-kapton-gold)" stroke-width="1.3" />
  </g>

  <!-- [骨骼部件 4] 左独立后坐力伸缩高斯磁轨炮管 (z=28) -->
  <g id="part-barrel-tube-L" data-pivot="53,58" data-parent="part-turret-housing" data-z-index="28" data-blend="normal" data-motion="recoil-y">
    <rect x="48.5" y="11" width="9" height="47" rx="2" fill="url(#wt-heat-bluing)" stroke="#00f0ff" stroke-width="1.8" />
    <rect x="51.5" y="15" width="3" height="37" fill="#00f0ff" />
    <path d="M49 20 H57 M49 27 H57 M49 34 H57 M49 41 H57" stroke="#fef08a" stroke-width="0.9" />
    <line x1="53" y1="13" x2="53" y2="50" stroke="#ffffff" stroke-width="0.7" />
    <circle cx="53" cy="58" r="4.8" fill="#091326" stroke="url(#wt-kapton-gold)" stroke-width="1.3" />
  </g>

  <!-- [骨骼部件 5] 前端右开合电磁充能导轨片 (z=34) -->
  <g id="part-rail-jaw-R" data-pivot="83,48" data-parent="part-turret-housing" data-z-index="34" data-blend="normal" data-motion="rotate-jaw-right">
    <path d="M83 48 L93 17 L85 13 L80.5 42 Z" fill="url(#wt-turret-armor)" stroke="url(#wt-kapton-gold)" stroke-width="1.3" />
    <circle cx="83" cy="48" r="4.2" fill="#050b18" stroke="#00f0ff" stroke-width="1.2" />
  </g>

  <!-- [骨骼部件 6] 前端左开合电磁充能导轨片 (z=34) -->
  <g id="part-rail-jaw-L" data-pivot="45,48" data-parent="part-turret-housing" data-z-index="34" data-blend="normal" data-motion="rotate-jaw-left">
    <path d="M45 48 L35 17 L43 13 L47.5 42 Z" fill="url(#wt-turret-armor)" stroke="url(#wt-kapton-gold)" stroke-width="1.3" />
    <circle cx="45" cy="48" r="4.2" fill="#050b18" stroke="#00f0ff" stroke-width="1.2" />
  </g>

  <!-- [骨骼部件 7] 360° 独立旋转炮塔主装甲壳 (z=40) -->
  <g id="part-turret-housing" data-pivot="64,72" data-parent="part-pedestal-base" data-z-index="40" data-blend="normal" data-motion="aim-rotate-360">
    <path d="M43.5 51.5 L84.5 51.5 L90.5 78 L78.5 96.5 L49.5 96.5 L37.5 78 Z" fill="url(#wt-obsidian)" stroke="#00f0ff" stroke-width="2.2" stroke-linejoin="miter" stroke-miterlimit="3" />
    <polygon points="48,56 80,56 84,76 74,90 54,90 44,76" fill="url(#wt-turret-armor)" stroke="url(#wt-kapton-gold)" stroke-width="1.2" />
    <path d="M50 66 L78 66 M52 82 L76 82 M64 56 L64 90" stroke="#00f0ff" stroke-width="0.7" stroke-opacity="0.75" />
    <!-- 旋转轴承核心 -->
    <circle cx="64" cy="72" r="10.5" fill="url(#wt-coil-glow)" stroke="#ffffff" stroke-width="1.3" />
    <circle cx="64" cy="72" r="4.2" fill="#ffffff" />
  </g>

  <!-- [光影层 4] 炮塔主壳与双联炮管受光边缘高光映射贴图 (z=45, plus-lighter) -->
  <g id="part-light-rim-turret" data-pivot="64,72" data-parent="part-turret-housing" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M37.5 78 L43.5 51.5 L84.5 51.5 L90.5 78" stroke="url(#wt-rim-light)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="48.5" y1="11" x2="48.5" y2="48" stroke="#ffffff" stroke-width="1.2" />
    <line x1="79.5" y1="11" x2="79.5" y2="48" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- [光影层 5] 顶层炮口电弧与充能辉光冕贴图 (z=65, screen) -->
  <g id="part-aura-corona-top" data-pivot="64,72" data-parent="part-turret-housing" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <path d="M43 13 L53 7 L64 13 L75 7 L85 13" stroke="#00f0ff" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="53" cy="9" r="2.6" fill="#ffffff" />
    <circle cx="75" cy="9" r="2.6" fill="#ffffff" />
    <circle cx="64" cy="13" r="2.2" fill="#fbbf24" />
  </g>
</svg>

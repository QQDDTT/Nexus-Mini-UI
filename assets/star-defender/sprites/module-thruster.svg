<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="module-thruster-rig" data-root-anchor="64,64" data-faction="helios" data-slot-zone="engine" data-slot-size="P-2x1">
  <defs>
    <!-- 1. 6阶 Gooch 拉丝钛合金主装甲渐变 -->
    <linearGradient id="mt-ti-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="22%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="78%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <!-- 2. NASA 极白氧化铝防热陶瓷装甲渐变 -->
    <linearGradient id="mt-ceramic-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="78%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- 3. 24K Kapton 聚酰亚胺多切面褶皱金箔隔热罩 -->
    <linearGradient id="mt-kapton-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="52%" stop-color="#b45309"/>
      <stop offset="78%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <!-- 4. 钛合金矢量喷管高温回火蓝紫/金棕氧化色晕 (Heat-Blued Nozzle) -->
    <linearGradient id="mt-nozzle-temper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="25%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="82%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- 5. 超音速磁流体离子尾焰与马赫激波渐变 -->
    <linearGradient id="mt-plume-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.88"/>
      <stop offset="85%" stop-color="#4f46e5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mt-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#fde047"/>
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mt-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.92"/>
      <stop offset="66%" stop-color="#020617" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- [骨骼部件 1] 底层深空接触软阴影 -->
  <g id="part-shadow-cast" data-pivot="64,68" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="70" rx="52" ry="50" fill="url(#mt-shadow-grad)"/>
    <polygon points="36,24 92,24 106,44 106,88 90,104 38,104 22,88 22,44" fill="#020617" opacity="0.5"/>
  </g>

  <!-- [骨骼部件 2] 矢量推进遥测游标外环 (零虚线环) -->
  <g id="part-aura-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="4" data-blend="screen" data-motion="spin-cw" style="mix-blend-mode: screen">
    <path d="M42,16 A52,52 0 0,1 86,16 M114,44 A52,52 0 0,1 114,84 M86,112 A52,52 0 0,1 42,112 M14,84 A52,52 0 0,1 14,44" fill="none" stroke="#fbbf24" stroke-width="1.25" stroke-linecap="square" opacity="0.68"/>
    <path d="M64,12 L64,18 M118,64 L112,64 M10,64 L16,64" stroke="#67e8f9" stroke-width="1.5" opacity="0.85"/>
  </g>

  <!-- [骨骼部件 3] 逆时针涡轮磁流体相位内环 -->
  <g id="part-aura-ring-inner" data-pivot="64,64" data-parent="root" data-z-index="5" data-blend="screen" data-motion="spin-ccw" style="mix-blend-mode: screen">
    <path d="M34,36 A40,40 0 0,1 94,36 M94,92 A40,40 0 0,1 34,92" fill="none" stroke="#38bdf8" stroke-width="0.95" opacity="0.52"/>
  </g>

  <!-- [骨骼部件 4] 舰艉推进舱安装法兰底座、24K 金箔隔热层与蓝图引擎槽色标 -->
  <g id="part-pedestal-base" data-pivot="64,64" data-parent="root" data-z-index="15" data-blend="normal">
    <polygon points="36,22 92,22 106,42 106,86 88,102 40,102 22,86 22,42" fill="url(#mt-ti-armor)" stroke="#050811" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 顶部 NASA 极白防热陶瓦对接法兰板 -->
    <rect x="42" y="25" width="44" height="8" rx="1" fill="url(#mt-ceramic-white)" stroke="#1e293b" stroke-width="0.95"/>
    <!-- [琥珀金 E: 引擎槽] 蓝图标准挂载接口块 -->
    <rect x="46" y="27" width="14" height="4" rx="0.8" fill="#fbbf24" stroke="#78350f" stroke-width="0.6"/>
    <rect x="68" y="27" width="14" height="4" rx="0.8" fill="#fbbf24" stroke="#78350f" stroke-width="0.6"/>
    <!-- 左右高压液氢燃料输送歧管 -->
    <rect x="25" y="48" width="7" height="28" rx="1.5" fill="url(#mt-kapton-gold)" stroke="#451a03" stroke-width="0.85"/>
    <rect x="96" y="48" width="7" height="28" rx="1.5" fill="url(#mt-kapton-gold)" stroke="#451a03" stroke-width="0.85"/>
  </g>

  <!-- [骨骼部件 5] 涡轮泵超导励磁转子环 -->
  <g id="part-energy-coil-ring" data-pivot="64,64" data-parent="part-pedestal-base" data-z-index="22" data-blend="normal" data-motion="spin-cw">
    <circle cx="64" cy="58" r="28" fill="url(#mt-kapton-gold)" stroke="#050811" stroke-width="1.75"/>
    <circle cx="64" cy="58" r="22" fill="#081326" stroke="#38bdf8" stroke-width="1.4"/>
    <path d="M64,36 L64,80 M42,58 L86,58 M48,42 L80,74 M80,42 L48,74" stroke="#67e8f9" stroke-width="0.9"/>
  </g>

  <!-- [骨骼部件 6] 右联超音速等离子尾焰羽流与 3 级马赫激波菱形节 (Mach Diamonds R) -->
  <g id="part-barrel-tube-R" data-pivot="76,78" data-parent="part-turret-housing" data-z-index="28" data-blend="normal" data-motion="recoil-y">
    <polygon points="66,76 86,76 82,126 70,126" fill="url(#mt-plume-grad)"/>
    <polygon points="76,80 82,88 76,96 70,88" fill="#ffffff" opacity="0.95"/>
    <polygon points="76,95 80,102 76,109 72,102" fill="#e0f2fe" opacity="0.85"/>
    <polygon points="76,108 79,114 76,120 73,114" fill="#67e8f9" opacity="0.75"/>
  </g>

  <!-- [骨骼部件 7] 左联超音速等离子尾焰羽流与 3 级马赫激波菱形节 (Mach Diamonds L) -->
  <g id="part-barrel-tube-L" data-pivot="52,78" data-parent="part-turret-housing" data-z-index="28" data-blend="normal" data-motion="recoil-y">
    <polygon points="42,76 62,76 58,126 46,126" fill="url(#mt-plume-grad)"/>
    <polygon points="52,80 58,88 52,96 46,88" fill="#ffffff" opacity="0.95"/>
    <polygon points="52,95 56,102 52,109 48,102" fill="#e0f2fe" opacity="0.85"/>
    <polygon points="52,108 55,114 52,120 49,114" fill="#67e8f9" opacity="0.75"/>
  </g>

  <!-- [骨骼部件 8] 右侧可动回火钛合金矢量收敛扩散喷管叶片 (Variable Nozzle Petal R) -->
  <g id="part-rail-jaw-R" data-pivot="84,74" data-parent="part-turret-housing" data-z-index="34" data-blend="normal" data-motion="rotate-jaw-right">
    <polygon points="82,56 96,66 92,94 78,88" fill="url(#mt-nozzle-temper)" stroke="#050811" stroke-width="1.65" stroke-linejoin="round"/>
    <path d="M81,66 L93,71 M80,76 L92,81" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="84" cy="74" r="2.4" fill="#fbbf24" stroke="#050811" stroke-width="0.75"/>
  </g>

  <!-- [骨骼部件 9] 左侧可动回火钛合金矢量收敛扩散喷管叶片 (Variable Nozzle Petal L) -->
  <g id="part-rail-jaw-L" data-pivot="44,74" data-parent="part-turret-housing" data-z-index="34" data-blend="normal" data-motion="rotate-jaw-left">
    <polygon points="46,56 32,66 36,94 50,88" fill="url(#mt-nozzle-temper)" stroke="#050811" stroke-width="1.65" stroke-linejoin="round"/>
    <path d="M47,66 L35,71 M48,76 L36,81" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="44" cy="74" r="2.4" fill="#fbbf24" stroke="#050811" stroke-width="0.75"/>
  </g>

  <!-- [骨骼部件 10] 双联磁流体曲率涡轮机匣、24K 金箔热控包层与回火喷口环 -->
  <g id="part-turret-housing" data-pivot="64,64" data-parent="part-pedestal-base" data-z-index="40" data-blend="normal" data-motion="aim-rotate-360">
    <polygon points="36,36 92,36 96,68 88,82 40,82 32,68" fill="url(#mt-ti-armor)" stroke="#050811" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 左右 NASA 极白防热陶瓦机匣护板 -->
    <polygon points="38,39 58,39 58,58 35,58" fill="url(#mt-ceramic-white)" stroke="#1e293b" stroke-width="1.0"/>
    <polygon points="70,39 90,39 93,58 70,58" fill="url(#mt-ceramic-white)" stroke="#1e293b" stroke-width="1.0"/>
    <!-- 24K Kapton 褶皱金箔热控燃烧室包覆带 -->
    <rect x="38" y="60" width="52" height="16" rx="2" fill="url(#mt-kapton-gold)" stroke="#451a03" stroke-width="1.05"/>
    <path d="M38,68 L90,68 M52,60 L52,76 M76,60 L76,76" stroke="#78350f" stroke-width="0.8"/>
    <!-- 双联高温回火拉瓦尔喷管喉部 -->
    <polygon points="43,76 61,76 63,86 41,86" fill="url(#mt-nozzle-temper)" stroke="#050811" stroke-width="1.3"/>
    <polygon points="67,76 85,76 87,86 65,86" fill="url(#mt-nozzle-temper)" stroke="#050811" stroke-width="1.3"/>
    <!-- 中央聚变燃料预燃室观察窗 -->
    <circle cx="64" cy="52" r="7.5" fill="#271203" stroke="#ffffff" stroke-width="1.3"/>
    <circle cx="64" cy="52" r="5" fill="url(#mt-core-glow)"/>
  </g>

  <!-- [骨骼部件 11] 顶层硬表面倒角亮边 (Plus-Lighter) -->
  <g id="part-light-rim-turret" data-pivot="64,64" data-parent="part-turret-housing" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M32,68 L36,36 L92,36 L96,68" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.92"/>
    <path d="M38,60 L90,60" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.88"/>
  </g>

  <!-- [骨骼部件 12] 顶层喷口等离子耀斑 (Screen) -->
  <g id="part-aura-corona-top" data-pivot="64,64" data-parent="part-turret-housing" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <circle cx="52" cy="84" r="6" fill="#67e8f9" opacity="0.78"/>
    <circle cx="76" cy="84" r="6" fill="#67e8f9" opacity="0.78"/>
    <circle cx="64" cy="52" r="11" fill="url(#mt-core-glow)" opacity="0.65"/>
  </g>
</svg>
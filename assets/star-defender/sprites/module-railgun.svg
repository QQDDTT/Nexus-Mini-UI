<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="module-railgun-rig" data-root-anchor="64,74" data-faction="helios" data-slot-zone="weapon" data-slot-size="M-2x1">
  <defs>
    <!-- 1. 赫利俄斯 NASA 极白/炭黑六角隔热陶瓦微距阵列纹理 -->
    <pattern id="mr-nasa-tile" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e2e8f0"/>
      <path d="M0,0 L8,0 L8,8 L0,8 Z" fill="none" stroke="#475569" stroke-width="0.55"/>
      <rect x="0.8" y="0.8" width="6.4" height="6.4" fill="#f8fafc"/>
      <circle cx="1.8" cy="1.8" r="0.4" fill="#64748b"/>
      <circle cx="6.2" cy="6.2" r="0.4" fill="#64748b"/>
    </pattern>
    <!-- 2. 6阶 Gooch 冷暖非线性拉丝钛合金主装甲渐变 -->
    <linearGradient id="mr-ti-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="18%" stop-color="#64748b"/>
      <stop offset="45%" stop-color="#334155"/>
      <stop offset="72%" stop-color="#1e293b"/>
      <stop offset="90%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <!-- 3. 极白氧化铝防热陶瓷复合装甲渐变 -->
    <linearGradient id="mr-ceramic-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="88%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- 4. 哑光碳化硅黑防烧蚀重装甲渐变 -->
    <linearGradient id="mr-sic-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>
    <!-- 5. 24K Kapton 聚酰亚胺多切面褶皱金箔热控层 -->
    <linearGradient id="mr-kapton-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="22%" stop-color="#facc15"/>
      <stop offset="45%" stop-color="#b45309"/>
      <stop offset="68%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <!-- 6. 炮口高温回火钛合金蓝紫虹彩渐变 (Heat-Bluing) -->
    <linearGradient id="mr-heat-blue" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="28%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- 7. 无氧紫铜电磁感应加速线圈渐变 -->
    <linearGradient id="mr-copper-coil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="25%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <!-- 8. 高能电光青磁轨蓄能核心辉光 -->
    <radialGradient id="mr-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="32%" stop-color="#67e8f9"/>
      <stop offset="68%" stop-color="#0284c7" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mr-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.92"/>
      <stop offset="65%" stop-color="#020617" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- [骨骼部件 1] 底层接触软阴影 (Multiply) -->
  <g id="part-shadow-cast" data-pivot="64,74" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="76" rx="52" ry="46" fill="url(#mr-shadow-grad)"/>
    <polygon points="40,34 88,34 104,50 104,94 88,110 40,110 24,94 24,50" fill="#020617" opacity="0.52"/>
  </g>

  <!-- [骨骼部件 2] 航宇火控实心游标测距外环 (零虚线环) -->
  <g id="part-aura-ring-outer" data-pivot="64,72" data-parent="root" data-z-index="4" data-blend="screen" data-motion="spin-cw" style="mix-blend-mode: screen">
    <path d="M44,24 A50,50 0 0,1 84,24 M112,52 A50,50 0 0,1 112,92 M84,120 A50,50 0 0,1 44,120 M16,92 A50,50 0 0,1 16,52" fill="none" stroke="#38bdf8" stroke-width="1.25" stroke-linecap="square" opacity="0.68"/>
    <path d="M64,20 L64,26 M116,72 L110,72 M64,124 L64,118 M12,72 L18,72" stroke="#fbbf24" stroke-width="1.5" opacity="0.85"/>
    <polygon points="64,17 66.5,21 61.5,21" fill="#67e8f9" opacity="0.85"/>
  </g>

  <!-- [骨骼部件 3] 逆时针谐振相位内环 -->
  <g id="part-aura-ring-inner" data-pivot="64,72" data-parent="root" data-z-index="5" data-blend="screen" data-motion="spin-ccw" style="mix-blend-mode: screen">
    <path d="M34,42 A42,42 0 0,1 94,42 M94,102 A42,42 0 0,1 34,102" fill="none" stroke="#67e8f9" stroke-width="0.95" opacity="0.52"/>
    <circle cx="34" cy="42" r="1.4" fill="#fde047"/>
    <circle cx="94" cy="42" r="1.4" fill="#fde047"/>
    <circle cx="34" cy="102" r="1.4" fill="#fde047"/>
    <circle cx="94" cy="102" r="1.4" fill="#fde047"/>
  </g>

  <!-- [骨骼部件 4] 八角重装钛合金炮座地基、液压锚栓与蓝图挂载色标 -->
  <g id="part-pedestal-base" data-pivot="64,72" data-parent="root" data-z-index="15" data-blend="normal">
    <polygon points="42,34 86,34 104,52 104,92 86,110 42,110 24,92 24,52" fill="url(#mr-ti-armor)" stroke="#050811" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 内层下沉式八角机械井槽 -->
    <polygon points="45,38 83,38 99,54 99,90 83,106 45,106 29,90 29,54" fill="url(#mr-sic-black)" stroke="#475569" stroke-width="0.9"/>
    <!-- 前后 NASA 极白防热陶瓦装甲板 -->
    <rect x="45" y="36" width="38" height="7" rx="1" fill="url(#mr-nasa-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <rect x="45" y="101" width="38" height="7" rx="1" fill="url(#mr-nasa-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <!-- 左右 [红 W: M级武器槽] 蓝图标准工程卡扣 -->
    <rect x="26" y="62" width="6" height="20" rx="1" fill="#ef4444" stroke="#fca5a5" stroke-width="0.75"/>
    <path d="M26,67 L32,67 M26,72 L32,72 M26,77 L32,77" stroke="#450a0a" stroke-width="0.75"/>
    <rect x="96" y="62" width="6" height="20" rx="1" fill="#ef4444" stroke="#fca5a5" stroke-width="0.75"/>
    <path d="M96,67 L102,67 M96,72 L102,72 M96,77 L102,77" stroke="#450a0a" stroke-width="0.75"/>
    <!-- 四角重型六角法兰液压锚栓 -->
    <circle cx="40" cy="46" r="2.8" fill="#64748b" stroke="#090d16" stroke-width="0.9"/>
    <circle cx="88" cy="46" r="2.8" fill="#64748b" stroke="#090d16" stroke-width="0.9"/>
    <circle cx="40" cy="98" r="2.8" fill="#64748b" stroke="#090d16" stroke-width="0.9"/>
    <circle cx="88" cy="98" r="2.8" fill="#64748b" stroke="#090d16" stroke-width="0.9"/>
  </g>

  <!-- [骨骼部件 5] 24K Kapton 褶皱金箔热控电容环与旋转导电滑环 -->
  <g id="part-energy-coil-ring" data-pivot="64,72" data-parent="part-pedestal-base" data-z-index="22" data-blend="normal" data-motion="spin-cw">
    <circle cx="64" cy="72" r="31" fill="url(#mr-kapton-gold)" stroke="#090d16" stroke-width="1.8"/>
    <!-- 多切面金箔褶皱折光网格 -->
    <path d="M42,50 L86,94 M86,50 L42,94 M64,41 L64,103 M33,72 L95,72" stroke="#78350f" stroke-width="0.85"/>
    <polygon points="64,42 74,47 64,51 54,47" fill="#fef08a" opacity="0.55"/>
    <polygon points="64,102 74,97 64,93 54,97" fill="#92400e" opacity="0.65"/>
    <circle cx="64" cy="72" r="24" fill="#081120" stroke="#38bdf8" stroke-width="1.4"/>
    <!-- 8 枚高压脉冲放电刷触点 -->
    <path d="M64,48 L64,52 M64,92 L64,96 M40,72 L44,72 M84,72 L88,72 M47,55 L50,58 M81,55 L78,58 M47,89 L50,86 M81,89 L78,86" stroke="#67e8f9" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- [骨骼部件 6] 右联开口分叉高斯磁轨炮管、紫铜加速线圈与回火蓝紫制退器 -->
  <g id="part-barrel-tube-R" data-pivot="73,58" data-parent="part-turret-housing" data-z-index="28" data-blend="normal" data-motion="recoil-y">
    <!-- 液压驻退复进机活塞杆 -->
    <rect x="69.5" y="42" width="7" height="18" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.9"/>
    <!-- 哑光碳化硅外炮管护套 -->
    <rect x="67.5" y="6" width="11" height="46" rx="1.2" fill="url(#mr-sic-black)" stroke="#050811" stroke-width="1.6"/>
    <!-- 开口剖面裸露的双平行银钢导轨与中央电光青等离子加速槽 -->
    <rect x="69.2" y="4" width="2.2" height="46" fill="url(#mr-ceramic-white)"/>
    <rect x="74.6" y="4" width="2.2" height="46" fill="url(#mr-ceramic-white)"/>
    <rect x="71.6" y="6" width="2.8" height="44" fill="#38bdf8"/>
    <line x1="73" y1="6" x2="73" y2="50" stroke="#ffffff" stroke-width="0.9"/>
    <!-- 6 级精密紫铜电磁感应加速线圈箍 (Exposed Copper Coils) -->
    <rect x="66.8" y="13" width="12.4" height="3.2" rx="0.6" fill="url(#mr-copper-coil)" stroke="#090d16" stroke-width="0.65"/>
    <rect x="66.8" y="20" width="12.4" height="3.2" rx="0.6" fill="url(#mr-copper-coil)" stroke="#090d16" stroke-width="0.65"/>
    <rect x="66.8" y="27" width="12.4" height="3.2" rx="0.6" fill="url(#mr-copper-coil)" stroke="#090d16" stroke-width="0.65"/>
    <rect x="66.8" y="34" width="12.4" height="3.2" rx="0.6" fill="url(#mr-copper-coil)" stroke="#090d16" stroke-width="0.65"/>
    <rect x="66.8" y="41" width="12.4" height="3.2" rx="0.6" fill="url(#mr-copper-coil)" stroke="#090d16" stroke-width="0.65"/>
    <!-- 炮口高温钛合金回火蓝紫消焰制退器 (Heat-Blued Muzzle Brake) -->
    <polygon points="66,3 80,3 79,10 67,10" fill="url(#mr-heat-blue)" stroke="#050811" stroke-width="0.95"/>
    <circle cx="73" cy="5" r="2.1" fill="#ffffff"/>
  </g>

  <!-- [骨骼部件 7] 左联开口分叉高斯磁轨炮管、紫铜加速线圈与回火蓝紫制退器 -->
  <g id="part-barrel-tube-L" data-pivot="55,58" data-parent="part-turret-housing" data-z-index="28" data-blend="normal" data-motion="recoil-y">
    <!-- 液压驻退复进机活塞杆 -->
    <rect x="51.5" y="42" width="7" height="18" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.9"/>
    <!-- 哑光碳化硅外炮管护套 -->
    <rect x="49.5" y="6" width="11" height="46" rx="1.2" fill="url(#mr-sic-black)" stroke="#050811" stroke-width="1.6"/>
    <!-- 开口剖面裸露的双平行银钢导轨与中央电光青等离子加速槽 -->
    <rect x="51.2" y="4" width="2.2" height="46" fill="url(#mr-ceramic-white)"/>
    <rect x="56.6" y="4" width="2.2" height="46" fill="url(#mr-ceramic-white)"/>
    <rect x="53.6" y="6" width="2.8" height="44" fill="#38bdf8"/>
    <line x1="55" y1="6" x2="55" y2="50" stroke="#ffffff" stroke-width="0.9"/>
    <!-- 6 级精密紫铜电磁感应加速线圈箍 -->
    <rect x="48.8" y="13" width="12.4" height="3.2" rx="0.6" fill="url(#mr-copper-coil)" stroke="#090d16" stroke-width="0.65"/>
    <rect x="48.8" y="20" width="12.4" height="3.2" rx="0.6" fill="url(#mr-copper-coil)" stroke="#090d16" stroke-width="0.65"/>
    <rect x="48.8" y="27" width="12.4" height="3.2" rx="0.6" fill="url(#mr-copper-coil)" stroke="#090d16" stroke-width="0.65"/>
    <rect x="48.8" y="34" width="12.4" height="3.2" rx="0.6" fill="url(#mr-copper-coil)" stroke="#090d16" stroke-width="0.65"/>
    <rect x="48.8" y="41" width="12.4" height="3.2" rx="0.6" fill="url(#mr-copper-coil)" stroke="#090d16" stroke-width="0.65"/>
    <!-- 炮口高温钛合金回火蓝紫消焰制退器 -->
    <polygon points="48,3 62,3 61,10 49,10" fill="url(#mr-heat-blue)" stroke="#050811" stroke-width="0.95"/>
    <circle cx="55" cy="5" r="2.1" fill="#ffffff"/>
  </g>

  <!-- [骨骼部件 8] 右侧可动 NASA 白陶防热助推磁轨钳颚 -->
  <g id="part-rail-jaw-R" data-pivot="84,48" data-parent="part-turret-housing" data-z-index="34" data-blend="normal" data-motion="rotate-jaw-right">
    <polygon points="80,14 93,24 96,58 82,62 79,42" fill="url(#mr-ceramic-white)" stroke="#050811" stroke-width="1.65" stroke-linejoin="round"/>
    <!-- 内部 24K 金箔散热腮片 -->
    <polygon points="82,24 90,30 92,48 82,50" fill="url(#mr-kapton-gold)" stroke="#78350f" stroke-width="0.75"/>
    <path d="M80,32 L93,34 M80,40 L94,42 M80,48 L95,50" stroke="#1e293b" stroke-width="0.75"/>
    <!-- 武器槽红标散热阀与轴承盖 -->
    <rect x="84" y="51" width="7" height="5.5" rx="1" fill="#ef4444" stroke="#fca5a5" stroke-width="0.65"/>
    <circle cx="84" cy="48" r="2.6" fill="#334155" stroke="#e2e8f0" stroke-width="0.8"/>
  </g>

  <!-- [骨骼部件 9] 左侧可动 NASA 白陶防热助推磁轨钳颚 -->
  <g id="part-rail-jaw-L" data-pivot="44,48" data-parent="part-turret-housing" data-z-index="34" data-blend="normal" data-motion="rotate-jaw-left">
    <polygon points="48,14 35,24 32,58 46,62 49,42" fill="url(#mr-ceramic-white)" stroke="#050811" stroke-width="1.65" stroke-linejoin="round"/>
    <!-- 内部 24K 金箔散热腮片 -->
    <polygon points="46,24 38,30 36,48 46,50" fill="url(#mr-kapton-gold)" stroke="#78350f" stroke-width="0.75"/>
    <path d="M48,32 L35,34 M48,40 L34,42 M48,48 L33,50" stroke="#1e293b" stroke-width="0.75"/>
    <!-- 武器槽红标散热阀与轴承盖 -->
    <rect x="37" y="51" width="7" height="5.5" rx="1" fill="#ef4444" stroke="#fca5a5" stroke-width="0.65"/>
    <circle cx="44" cy="48" r="2.6" fill="#334155" stroke="#e2e8f0" stroke-width="0.8"/>
  </g>

  <!-- [骨骼部件 10] 赫利俄斯重型双叉开口炮塔主装甲壳、NASA 白/黑陶瓦与金箔电容尾舱 -->
  <g id="part-turret-housing" data-pivot="64,72" data-parent="part-pedestal-base" data-z-index="40" data-blend="normal" data-motion="aim-rotate-360">
    <!-- 主装甲底壳 (前部双叉开口露出内部炮尾与电磁导轨) -->
    <polygon points="44,46 58,46 60,58 68,58 70,46 84,46 92,62 88,94 76,102 52,102 40,94 36,62" fill="url(#mr-ti-armor)" stroke="#050811" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 左右对称极白 NASA 防热陶瓦披挂 -->
    <polygon points="45,49 57,49 57,82 42,78 39,62" fill="url(#mr-ceramic-white)" stroke="#1e293b" stroke-width="1.05"/>
    <polygon points="71,49 83,49 89,62 86,78 71,82" fill="url(#mr-ceramic-white)" stroke="#1e293b" stroke-width="1.05"/>
    <!-- 陶瓦分块接缝沟槽与微距铆钉 -->
    <path d="M42,60 L57,60 M41,70 L57,70 M71,60 L87,60 M71,70 L87,70" stroke="#475569" stroke-width="0.75"/>
    <!-- 哑光黑碳化硅前缘防弹装甲块 -->
    <polygon points="45,49 57,49 57,56 43,56" fill="url(#mr-sic-black)"/>
    <polygon points="71,49 83,49 85,56 71,56" fill="url(#mr-sic-black)"/>
    <!-- 尾部 24K Kapton 褶皱金箔热控电容室 -->
    <rect x="46" y="84" width="36" height="13" rx="2" fill="url(#mr-kapton-gold)" stroke="#451a03" stroke-width="1.1"/>
    <path d="M46,90.5 L82,90.5 M58,84 L58,97 M70,84 L70,97" stroke="#78350f" stroke-width="0.8"/>
    <!-- 蓝图三色状态模块指示块 (红武/青盾/黄电) -->
    <rect x="48.5" y="86" width="6.5" height="4.5" rx="0.8" fill="#ef4444" stroke="#fca5a5" stroke-width="0.55"/>
    <rect x="60.8" y="86" width="6.5" height="4.5" rx="0.8" fill="#fbbf24" stroke="#fef08a" stroke-width="0.55"/>
    <rect x="73" y="86" width="6.5" height="4.5" rx="0.8" fill="#06b6d4" stroke="#a5f3fc" stroke-width="0.55"/>
    <!-- 中央超导洛伦兹磁通压缩核心视窗 -->
    <polygon points="64,55 72,62 72,76 64,82 56,76 56,62" fill="#041326" stroke="#e2e8f0" stroke-width="1.35"/>
    <circle cx="64" cy="69" r="7" fill="url(#mr-core-glow)"/>
    <circle cx="64" cy="69" r="3.2" fill="#ffffff"/>
  </g>

  <!-- [骨骼部件 11] 顶层硬表面倒角亮边与磨损掉漆亮银线 (Plus-Lighter) -->
  <g id="part-light-rim-turret" data-pivot="64,72" data-parent="part-turret-housing" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M36,62 L44,46 L58,46 M70,46 L84,46 L92,62" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" opacity="0.92"/>
    <path d="M46,84 L82,84" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.88"/>
    <path d="M71.5,6 L71.5,44 M53.5,6 L53.5,44" fill="none" stroke="#e0f2fe" stroke-width="0.85" opacity="0.8"/>
  </g>

  <!-- [骨骼部件 12] 顶层磁轨电弧与炮口蓄能耀斑 (Screen) -->
  <g id="part-aura-corona-top" data-pivot="64,72" data-parent="part-turret-housing" data-z-index="65" data-blend="screen" data-motion="pulse-breathe" style="mix-blend-mode: screen">
    <circle cx="64" cy="69" r="13" fill="url(#mr-core-glow)" opacity="0.68"/>
    <circle cx="55" cy="5" r="4.5" fill="url(#mr-core-glow)" opacity="0.85"/>
    <circle cx="73" cy="5" r="4.5" fill="url(#mr-core-glow)" opacity="0.85"/>
    <path d="M64,56 L64,82 M52,69 L76,69" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
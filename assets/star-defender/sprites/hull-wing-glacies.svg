<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="hull-wing-glacies-rig" data-root-anchor="64,64" data-faction="glacies" data-has-aura="true">
  <defs>
    <!-- 1. 格拉基斯极寒凝霜冰灰复合装甲 (1:1 还原 preview.png 下左与下右战舰材质) -->
    <linearGradient id="hwg-frost-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="28%" stop-color="#cbd5e1"/>
      <stop offset="62%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- 2. 凝霜斜面灰蓝渐变 -->
    <linearGradient id="hwg-slate-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- 3. 暗部 2x2 斜纹碳纤维深蓝黑底甲 -->
    <linearGradient id="hwg-carbon-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- 4. 蓝宝石玻璃超导冷舱深海切伦科夫辉光内衬 -->
    <radialGradient id="hwg-sapphire-chamber" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="42%" stop-color="#0284c7"/>
      <stop offset="78%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020b18"/>
    </radialGradient>
    <!-- 5. 切伦科夫超导螺旋线圈炽白青蓝渐变 -->
    <linearGradient id="hwg-coil-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- 6. 液氦超低温蓝白尾焰 -->
    <linearGradient id="hwg-cryo-plume" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#a5f3fc"/>
      <stop offset="68%" stop-color="#0284c7" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </linearGradient>
    <!-- 7. 切伦科夫径向电光晕 -->
    <radialGradient id="hwg-cryo-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </radialGradient>
    <!-- 8. 底部投影 -->
    <radialGradient id="hwg-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.9"/>
      <stop offset="68%" stop-color="#020617" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <!-- 9. Pattern A: 2x2 斜纹碳纤维微观编织网格 -->
    <pattern id="hwg-carbon-weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#0f172a"/>
      <polygon points="0,0 3,0 6,3 6,6 3,6 0,3" fill="#1e293b"/>
      <polygon points="3,0 6,0 6,3" fill="#334155"/>
      <polygon points="0,3 3,6 0,6" fill="#090e17"/>
    </pattern>
    <!-- 10. Pattern B: 极寒表面微凝霜颗粒与冰裂纹肌理 -->
    <pattern id="hwg-frost-rime" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,5 L4,2 L8,5 L5,9 Z M4,2 L6,0 M8,5 L10,4" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.48"/>
      <circle cx="2" cy="3" r="0.6" fill="#ffffff" opacity="0.6"/>
      <circle cx="7" cy="8" r="0.5" fill="#e0f2fe" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- 1. 底部投影 (z=1, <=3 nodes) -->
  <g id="part-shadow-cast" data-pivot="64,68" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="70" rx="58" ry="52" fill="url(#hwg-shadow-grad)"/>
    <polygon points="54,6 74,6 82,16 82,42 122,56 116,94 84,104 44,104 12,94 6,56 46,42 46,16" fill="#020617" opacity="0.48"/>
  </g>

  <!-- 2. 外圈超导冷雾警戒环 (z=4) -->
  <g id="part-aura-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="4" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="57" fill="none" stroke="#67e8f9" stroke-width="0.75" opacity="0.3"/>
    <path d="M64,5 V9 M123,64 H119 M64,123 V119 M5,64 H9" stroke="#e0f2fe" stroke-width="1.1" opacity="0.65"/>
  </g>

  <!-- 3. 内圈低温谐振环 (z=5) -->
  <g id="part-aura-ring-inner" data-pivot="64,64" data-parent="root" data-z-index="5" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="46" fill="none" stroke="#38bdf8" stroke-width="0.55" opacity="0.25"/>
  </g>

  <!-- 4. 四联装阶梯式凝霜液氦冷却喷管组与激波尾焰 (z=10, 1:1 还原 preview.png 下左与下右战舰喷管) -->
  <g id="part-quad-thrusters" data-pivot="64,96" data-parent="part-hull-main-body" data-z-index="10" data-blend="normal">
    <polygon points="26,90 40,90 38,103 28,103" fill="url(#hwg-frost-armor)" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="43,92 58,92 56,106 45,106" fill="url(#hwg-frost-armor)" stroke="#0f172a" stroke-width="1.6"/>
    <polygon points="70,92 85,92 83,106 72,106" fill="url(#hwg-frost-armor)" stroke="#0f172a" stroke-width="1.6"/>
    <polygon points="88,90 102,90 100,103 90,103" fill="url(#hwg-frost-armor)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="28" y="99" width="10" height="2" fill="#e0f2fe"/>
    <rect x="45" y="101" width="11" height="2" fill="#e0f2fe"/>
    <rect x="72" y="101" width="11" height="2" fill="#e0f2fe"/>
    <rect x="90" y="99" width="10" height="2" fill="#e0f2fe"/>
    <!-- 蓝白液氦激光状离子高频喷射尾焰 -->
    <g transform="translate(33,103)"><g><animateTransform attributeName="transform" type="scale" values="1,0.58;1.08,1.16;0.94,0.7;1,0.58" dur="0.21s" repeatCount="indefinite"/><polygon points="-5,0 5,0 2,20 0,23 -2,20" fill="url(#hwg-cryo-plume)"/><ellipse cx="0" cy="5" rx="3.0" ry="1.2" fill="#ffffff"/></g></g>
    <g transform="translate(50.5,106)"><g><animateTransform attributeName="transform" type="scale" values="1,0.62;1.1,1.2;0.92,0.72;1,0.62" dur="0.19s" repeatCount="indefinite"/><polygon points="-5.5,0 5.5,0 2.5,20 0,22 -2.5,20" fill="url(#hwg-cryo-plume)"/><ellipse cx="0" cy="5" rx="3.8" ry="1.4" fill="#ffffff"/></g></g>
    <g transform="translate(77.5,106)"><g><animateTransform attributeName="transform" type="scale" values="1,0.65;1.08,1.18;0.94,0.68;1,0.65" dur="0.20s" repeatCount="indefinite"/><polygon points="-5.5,0 5.5,0 2.5,20 0,22 -2.5,20" fill="url(#hwg-cryo-plume)"/><ellipse cx="0" cy="5" rx="3.8" ry="1.4" fill="#ffffff"/></g></g>
    <g transform="translate(95,103)"><g><animateTransform attributeName="transform" type="scale" values="1,0.6;1.08,1.15;0.94,0.72;1,0.6" dur="0.23s" repeatCount="indefinite"/><polygon points="-5,0 5,0 2,20 0,23 -2,20" fill="url(#hwg-cryo-plume)"/><ellipse cx="0" cy="5" rx="3.0" ry="1.2" fill="#ffffff"/></g></g>
  </g>

  <!-- 5. 左舷折角切面凝霜掠翼 (z=20, 还原 preview.png 下右图冰晶星云中格拉基斯掠翼舰构型) -->
  <g id="part-heavy-wing-L" data-pivot="42,68" data-parent="part-hull-main-body" data-z-index="20" data-blend="normal">
    <polygon points="44,44 6,58 4,76 16,92 44,92" fill="url(#hwg-frost-armor)" stroke="#0f172a" stroke-width="2.0" stroke-linejoin="round"/>
    <polygon points="44,44 6,58 4,76 16,92 44,92" fill="url(#hwg-frost-rime)"/>
    <polygon points="44,46 8,59 12,67 44,55" fill="#ffffff" opacity="0.8"/>
    <polygon points="14,68 40,60 40,86 18,86" fill="url(#hwg-carbon-weave)" stroke="#334155" stroke-width="1.0"/>
    <line x1="6" y1="74" x2="44" y2="74" stroke="#334155" stroke-width="1.1"/>
    <!-- 左翼低温导流百叶与沉头铆钉 -->
    <line x1="10" y1="62" x2="38" y2="54" stroke="#64748b" stroke-width="0.9"/>
    <line x1="12" y1="88" x2="40" y2="88" stroke="#64748b" stroke-width="0.9"/>
    <circle cx="12" cy="60" r="0.9" fill="#0f172a" stroke="#e2e8f0" stroke-width="0.4"/>
    <circle cx="10" cy="74" r="0.9" fill="#0f172a" stroke="#e2e8f0" stroke-width="0.4"/>
    <circle cx="18" cy="89" r="0.9" fill="#0f172a" stroke="#e2e8f0" stroke-width="0.4"/>
    <circle cx="38" cy="89" r="0.9" fill="#0f172a" stroke="#e2e8f0" stroke-width="0.4"/>
    <circle cx="38" cy="52" r="0.9" fill="#0f172a" stroke="#e2e8f0" stroke-width="0.4"/>
    <rect x="10" y="70" width="5" height="3" rx="0.6" fill="#0284c7" stroke="#bae6fd" stroke-width="0.5"/>
    <rect x="10" y="76" width="5" height="3" rx="0.6" fill="#0284c7" stroke="#bae6fd" stroke-width="0.5"/>
  </g>

  <!-- 6. 右舷折角切面凝霜掠翼 (z=20) -->
  <g id="part-heavy-wing-R" data-pivot="86,68" data-parent="part-hull-main-body" data-z-index="20" data-blend="normal">
    <polygon points="84,44 122,58 124,76 112,92 84,92" fill="url(#hwg-frost-armor)" stroke="#0f172a" stroke-width="2.0" stroke-linejoin="round"/>
    <polygon points="84,44 122,58 124,76 112,92 84,92" fill="url(#hwg-frost-rime)"/>
    <polygon points="84,46 120,59 116,67 84,55" fill="#e2e8f0" opacity="0.75"/>
    <polygon points="114,68 88,60 88,86 110,86" fill="url(#hwg-carbon-weave)" stroke="#334155" stroke-width="1.0"/>
    <line x1="122" y1="74" x2="84" y2="74" stroke="#334155" stroke-width="1.1"/>
    <!-- 右翼低温导流百叶与沉头铆钉 -->
    <line x1="118" y1="62" x2="90" y2="54" stroke="#64748b" stroke-width="0.9"/>
    <line x1="116" y1="88" x2="88" y2="88" stroke="#64748b" stroke-width="0.9"/>
    <circle cx="116" cy="60" r="0.9" fill="#0f172a" stroke="#e2e8f0" stroke-width="0.4"/>
    <circle cx="118" cy="74" r="0.9" fill="#0f172a" stroke="#e2e8f0" stroke-width="0.4"/>
    <circle cx="110" cy="89" r="0.9" fill="#0f172a" stroke="#e2e8f0" stroke-width="0.4"/>
    <circle cx="90" cy="89" r="0.9" fill="#0f172a" stroke="#e2e8f0" stroke-width="0.4"/>
    <circle cx="90" cy="52" r="0.9" fill="#0f172a" stroke="#e2e8f0" stroke-width="0.4"/>
    <rect x="113" y="70" width="5" height="3" rx="0.6" fill="#0284c7" stroke="#bae6fd" stroke-width="0.5"/>
    <rect x="113" y="76" width="5" height="3" rx="0.6" fill="#0284c7" stroke="#bae6fd" stroke-width="0.5"/>
  </g>

  <!-- 7. 左翼蓝宝石超导急冻垂发舱 (z=25) -->
  <g id="part-missile-hatch-L" data-pivot="28,74" data-parent="part-heavy-wing-L" data-z-index="25" data-blend="normal">
    <rect x="19" y="64" width="18" height="20" rx="2" fill="url(#hwg-sapphire-chamber)" stroke="#e2e8f0" stroke-width="1.2"/>
    <path d="M22,68 C25,66 31,66 34,68 C31,71 25,71 22,74 C25,77 31,77 34,80" fill="none" stroke="url(#hwg-coil-glow)" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 8. 右翼蓝宝石超导急冻垂发舱 (z=25) -->
  <g id="part-missile-hatch-R" data-pivot="100,74" data-parent="part-heavy-wing-R" data-z-index="25" data-blend="normal">
    <rect x="91" y="64" width="18" height="20" rx="2" fill="url(#hwg-sapphire-chamber)" stroke="#e2e8f0" stroke-width="1.2"/>
    <path d="M94,68 C97,66 103,66 106,68 C103,71 97,71 94,74 C97,77 103,77 106,80" fill="none" stroke="url(#hwg-coil-glow)" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 9. 中央凝霜冰灰阶梯形主舰体、六角蓝宝石螺旋超导线圈舱、前部双蓝光圆透镜槽与三联压力表 (z=30, 1:1 还原 preview.png 下左战舰) -->
  <g id="part-hull-main-body" data-pivot="64,64" data-parent="root" data-z-index="30" data-blend="normal">
    <!-- 舰首深灰黑多面体破冰锥头 -->
    <polygon points="55,6 73,6 80,15 80,22 48,22 48,15" fill="url(#hwg-carbon-dark)" stroke="#090d16" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- 凝霜冰灰阶梯形主舰身 -->
    <polygon points="48,15 56,10 72,10 80,15 80,42 86,50 86,94 78,96 50,96 42,94 42,50 48,42" fill="url(#hwg-frost-armor)" stroke="#0f172a" stroke-width="2.1" stroke-linejoin="round"/>
    <polygon points="48,15 56,10 72,10 80,15 80,42 86,50 86,94 78,96 50,96 42,94 42,50 48,42" fill="url(#hwg-frost-rime)"/>
    <!-- 前部中央内凹八角形光学传感器槽 + 2 枚切伦科夫蓝光圆透镜端口 -->
    <polygon points="55,18 73,18 75,22 75,43 72,46 56,46 53,43 53,22" fill="url(#hwg-carbon-dark)" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="56" y="20" width="16" height="24" rx="2" fill="#071526" stroke="#38bdf8" stroke-width="0.85"/>
    <circle cx="64" cy="26" r="3.5" fill="#041326" stroke="#67e8f9" stroke-width="1.2"/>
    <circle cx="64" cy="26" r="1.7" fill="#38bdf8"/>
    <circle cx="64" cy="35" r="4.3" fill="#041326" stroke="#67e8f9" stroke-width="1.35"/>
    <circle cx="64" cy="35" r="2.2" fill="#38bdf8"/>
    <!-- 超导波导颈管 -->
    <rect x="58" y="42" width="12" height="10" fill="#0c2540" stroke="#67e8f9" stroke-width="1.1"/>
    <!-- 中后部巨型六角切面防爆蓝宝石玻璃超导冷舱 + 4匝发光螺旋超导弹簧线圈 -->
    <polygon points="50,50 78,50 82,55 82,81 78,86 50,86 46,81 46,55" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.6"/>
    <polygon points="52,52 76,52 79,56 79,79 76,83 52,83 49,79 49,56" fill="url(#hwg-sapphire-chamber)" stroke="#38bdf8" stroke-width="1.2"/>
    <ellipse cx="64" cy="67.5" rx="14" ry="10" fill="url(#hwg-cryo-aura)" opacity="0.75"/>
    <path d="M52,73 C53.5,58 56.5,58 58,73 C59.5,58 62.5,58 64,73 C65.5,58 68.5,58 70,73 C71.5,58 74.5,58 76,73" fill="none" stroke="#38bdf8" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M52,73 C53.5,58 56.5,58 58,73 C59.5,58 62.5,58 64,73 C65.5,58 68.5,58 70,73 C71.5,58 74.5,58 76,73" fill="none" stroke="url(#hwg-coil-glow)" stroke-width="2.0" stroke-linecap="round"/>
    <!-- 舰尾 3 枚圆形低温压力表盘 -->
    <circle cx="55" cy="90.5" r="3.4" fill="#041326" stroke="#cbd5e1" stroke-width="0.9"/>
    <line x1="55" y1="90.5" x2="57" y2="88.8" stroke="#67e8f9" stroke-width="0.8"/>
    <circle cx="64" cy="90.5" r="3.4" fill="#041326" stroke="#cbd5e1" stroke-width="0.9"/>
    <line x1="64" y1="90.5" x2="64" y2="88" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="73" cy="90.5" r="3.4" fill="#041326" stroke="#cbd5e1" stroke-width="0.9"/>
    <line x1="73" y1="90.5" x2="75" y2="90.5" stroke="#ef4444" stroke-width="0.8"/>
  </g>

  <!-- 10. 双联超导蓝白激光/磁轨主炮管 (z=38, 还原 preview.png 下右图舰首蓝白激光枪骑) -->
  <g id="part-main-cannon-barrels" data-pivot="64,26" data-parent="part-main-turret" data-z-index="38" data-blend="normal">
    <rect x="49" y="8" width="3.5" height="20" rx="0.8" fill="url(#hwg-carbon-dark)" stroke="#67e8f9" stroke-width="0.8"/>
    <rect x="75.5" y="8" width="3.5" height="20" rx="0.8" fill="url(#hwg-carbon-dark)" stroke="#67e8f9" stroke-width="0.8"/>
    <line x1="50.7" y1="9" x2="50.7" y2="27" stroke="#ffffff" stroke-width="1.0"/>
    <line x1="77.2" y1="9" x2="77.2" y2="27" stroke="#ffffff" stroke-width="1.0"/>
  </g>

  <!-- 11. 超导波导锁紧桥座 (z=40) -->
  <g id="part-main-turret" data-pivot="64,46" data-parent="part-hull-main-body" data-z-index="40" data-blend="normal">
    <rect x="54" y="43" width="20" height="6" rx="1" fill="url(#hwg-frost-armor)" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="57" y="44.5" width="14" height="3" fill="#0284c7" stroke="#e0f2fe" stroke-width="0.6"/>
  </g>

  <!-- 12. 顶层凝霜冰晶高光边缘 (z=45) -->
  <g id="part-light-rim-wings" data-pivot="64,64" data-parent="part-hull-main-body" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M44,44 L6,58 M84,44 L122,58 M50,50 H78" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.88"/>
  </g>

  <!-- 13. 顶层切伦科夫冷雾星芒 (z=65) -->
  <g id="part-aura-corona-top" data-pivot="64,64" data-parent="root" data-z-index="65" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="67.5" r="15" fill="url(#hwg-cryo-aura)" opacity="0.55"/>
  </g>
</svg>
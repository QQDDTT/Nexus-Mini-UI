<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="asteroid-crystal-rig" data-root-anchor="64,68">
  <defs>
    <!-- 深空玄武岩母岩基座 -->
    <linearGradient id="ac-basalt-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- 紫晶簇主棱面渐变 (还原 schematics.jpg 虚空晶簇色板) -->
    <linearGradient id="ac-amethyst-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#f5d0fe"/>
      <stop offset="52%" stop-color="#c084fc"/>
      <stop offset="82%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <!-- 切伦科夫青蓝次生晶簇渐变 -->
    <linearGradient id="ac-cyan-crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#a5f3fc"/>
      <stop offset="65%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <!-- 晶体能量色散辉光 -->
    <radialGradient id="ac-prism-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e879f9"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <!-- 底部投影 -->
    <radialGradient id="ac-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.86"/>
      <stop offset="68%" stop-color="#020617" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. 底部投影 (z=1, <=3 nodes) -->
  <g id="part-shadow-cast" data-pivot="64,72" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="74" rx="54" ry="46" fill="url(#ac-shadow-grad)"/>
    <polygon points="64,12 114,56 102,104 26,104 14,56" fill="#020617" opacity="0.45"/>
  </g>

  <!-- 2. 外圈谐振能量环 (z=4) -->
  <g id="part-aura-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="4" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="55" fill="none" stroke="#e879f9" stroke-width="0.95" opacity="0.36"/>
    <path d="M64,7 L64,12 M121,64 L116,64 M64,121 L64,116 M7,64 L12,64" stroke="#67e8f9" stroke-width="1.25" opacity="0.7"/>
  </g>

  <!-- 3. 内圈晶体折射环 (z=5) -->
  <g id="part-aura-ring-inner" data-pivot="64,64" data-parent="root" data-z-index="5" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="44" fill="none" stroke="#c084fc" stroke-width="0.65" opacity="0.32"/>
  </g>

  <!-- 4. 底部多孔玄武岩陨石母岩托盘 (z=15) -->
  <g id="part-basalt-matrix" data-pivot="64,76" data-parent="root" data-z-index="15" data-blend="normal">
    <polygon points="22,60 46,48 82,48 106,60 112,86 88,108 40,108 16,86" fill="url(#ac-basalt-base)" stroke="#070a12" stroke-width="2.1" stroke-linejoin="round"/>
    <polygon points="22,60 48,70 80,70 106,60 96,92 32,92" fill="#1e293b" stroke="#475569" stroke-width="0.95"/>
    <!-- 母岩表面发光紫青矿脉裂隙 -->
    <path d="M34,76 L56,84 L78,74 L94,86 M56,84 L64,102" fill="none" stroke="#67e8f9" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 5. 左侧斜生六方紫晶与青蓝晶柱群 (z=24) -->
  <g id="part-crystal-cluster-L" data-pivot="38,68" data-parent="part-basalt-matrix" data-z-index="24" data-blend="normal">
    <!-- 主紫晶斜柱 -->
    <polygon points="10,40 28,28 50,62 34,76 14,58" fill="url(#ac-amethyst-main)" stroke="#1e1b4b" stroke-width="1.7" stroke-linejoin="round"/>
    <!-- 晶体分面折射中脊线 -->
    <polyline points="10,40 30,52 50,62" fill="none" stroke="#ffffff" stroke-width="1.05"/>
    <line x1="28" y1="28" x2="30" y2="52" stroke="#f5d0fe" stroke-width="0.75"/>
    <!-- 伴生切伦科夫青蓝副晶 -->
    <polygon points="6,62 22,54 38,72 24,82 8,74" fill="url(#ac-cyan-crystal)" stroke="#083344" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="6" y1="62" x2="38" y2="72" stroke="#ffffff" stroke-width="0.75"/>
  </g>

  <!-- 6. 右侧斜生六方紫晶与青蓝晶柱群 (z=26) -->
  <g id="part-crystal-cluster-R" data-pivot="90,68" data-parent="part-basalt-matrix" data-z-index="26" data-blend="normal">
    <!-- 主紫晶斜柱 -->
    <polygon points="118,40 100,28 78,62 94,76 114,58" fill="url(#ac-amethyst-main)" stroke="#1e1b4b" stroke-width="1.7" stroke-linejoin="round"/>
    <!-- 晶体分面折射中脊线 -->
    <polyline points="118,40 98,52 78,62" fill="none" stroke="#ffffff" stroke-width="1.05"/>
    <line x1="100" y1="28" x2="98" y2="52" stroke="#f5d0fe" stroke-width="0.75"/>
    <!-- 伴生切伦科夫青蓝副晶 -->
    <polygon points="122,62 106,54 90,72 104,82 120,74" fill="url(#ac-cyan-crystal)" stroke="#083344" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="122" y1="62" x2="90" y2="72" stroke="#ffffff" stroke-width="0.75"/>
  </g>

  <!-- 7. 中央巨型高纯度主晶尖塔 (z=32) -->
  <g id="part-crystal-spire-center" data-pivot="64,62" data-parent="part-basalt-matrix" data-z-index="32" data-blend="normal">
    <polygon points="64,8 82,30 78,78 64,88 50,78 46,30" fill="url(#ac-amethyst-main)" stroke="#1e1b4b" stroke-width="2.0" stroke-linejoin="round"/>
    <!-- 左侧受光亮面 -->
    <polygon points="64,8 64,88 50,78 46,30" fill="#f5d0fe" opacity="0.45"/>
    <!-- 内部 Voronoi 晶体解理折射网 -->
    <path d="M64,8 L64,88 M46,30 L64,44 L82,30 M50,78 L64,64 L78,78 M48,54 L64,44 L80,54" fill="none" stroke="#ffffff" stroke-width="1.05"/>
    <!-- 核心切伦科夫能量包体 -->
    <polygon points="64,34 71,48 64,66 57,48" fill="url(#ac-cyan-crystal)" stroke="#ffffff" stroke-width="0.85"/>
  </g>

  <!-- 8. 前景底部高能次生晶簇群 (z=38) -->
  <g id="part-crystal-sub-bottom" data-pivot="64,86" data-parent="part-basalt-matrix" data-z-index="38" data-blend="normal">
    <polygon points="48,66 60,56 66,94 52,102 42,84" fill="url(#ac-cyan-crystal)" stroke="#083344" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="80,66 68,56 62,94 76,102 86,84" fill="url(#ac-amethyst-main)" stroke="#1e1b4b" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="64,64 74,78 64,112 54,78" fill="url(#ac-cyan-crystal)" stroke="#083344" stroke-width="1.7" stroke-linejoin="round"/>
    <line x1="64" y1="64" x2="64" y2="112" stroke="#ffffff" stroke-width="1.1"/>
  </g>

  <!-- 9. 顶置晶棱镜面高光与星芒点 (z=45) -->
  <g id="part-light-rim-crystal" data-pivot="64,68" data-parent="part-basalt-matrix" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M46,30 L64,8 L82,30 M10,40 L28,28 M118,40 L100,28" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" opacity="0.92"/>
    <circle cx="64" cy="24" r="1.4" fill="#ffffff"/>
    <circle cx="28" cy="42" r="1.2" fill="#ffffff"/>
    <circle cx="100" cy="42" r="1.2" fill="#ffffff"/>
  </g>

  <!-- 10. 顶层棱镜色散日冕 (z=65) -->
  <g id="part-aura-corona-top" data-pivot="64,64" data-parent="root" data-z-index="65" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="54" r="18" fill="url(#ac-prism-glow)" opacity="0.68"/>
    <path d="M64,36 L64,72 M46,54 L82,54" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round" opacity="0.92"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="module-hall-thruster-rig" data-root-anchor="64,64" data-faction="helios" data-slot-zone="engine" data-slot-size="P-2x2">
  <defs>
    <linearGradient id="mht-ti-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="28%" stop-color="#475569"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="mht-kapton-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="65%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="mht-hall-coil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="mht-plume-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#22d3ee"/>
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mht-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mht-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.92"/>
      <stop offset="70%" stop-color="#020617" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. 底层接触软阴影 -->
  <g id="part-shadow-cast" data-pivot="64,68" data-parent="root" data-z-index="1" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="70" rx="54" ry="50" fill="url(#mht-shadow-grad)"/>
  </g>

  <!-- 2. 外圈霍尔磁约束遥测游标环 -->
  <g id="part-aura-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="4" style="mix-blend-mode: screen">
    <path d="M40,14 A54,54 0 0,1 88,14 M114,42 A54,54 0 0,1 114,86 M88,114 A54,54 0 0,1 40,114 M14,86 A54,54 0 0,1 14,42" fill="none" stroke="#c084fc" stroke-width="1.35" opacity="0.72"/>
  </g>

  <!-- 3. 舰艉双联重型安装法兰底座 -->
  <g id="part-pedestal-base" data-pivot="64,64" data-parent="root" data-z-index="15">
    <polygon points="32,20 96,20 110,42 110,86 92,104 36,104 18,86 18,42" fill="url(#mht-ti-armor)" stroke="#050811" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="38" y="24" width="52" height="8" rx="1.5" fill="#e2e8f0" stroke="#1e293b" stroke-width="1"/>
    <rect x="44" y="26" width="16" height="4" rx="0.8" fill="#a855f7"/>
    <rect x="68" y="26" width="16" height="4" rx="0.8" fill="#a855f7"/>
    <rect x="22" y="46" width="8" height="32" rx="1.5" fill="url(#mht-kapton-gold)" stroke="#451a03" stroke-width="0.9"/>
    <rect x="98" y="46" width="8" height="32" rx="1.5" fill="url(#mht-kapton-gold)" stroke="#451a03" stroke-width="0.9"/>
  </g>

  <!-- 4. 同轴霍尔电离磁环 (Coaxial Hall Ionization Rings) -->
  <g id="part-energy-coil-ring" data-pivot="64,58" data-parent="part-pedestal-base" data-z-index="22">
    <circle cx="64" cy="56" r="30" fill="url(#mht-hall-coil)" stroke="#050811" stroke-width="1.8"/>
    <circle cx="64" cy="56" r="23" fill="#061024" stroke="#22d3ee" stroke-width="1.8"/>
    <circle cx="64" cy="56" r="15" fill="none" stroke="#e879f9" stroke-width="1.4"/>
  </g>

  <!-- 5. 左右双联霍尔磁流体等离子羽流 -->
  <g id="part-barrel-tube-L" data-pivot="48,78" data-parent="part-turret-housing" data-z-index="28">
    <polygon points="38,76 58,76 54,126 42,126" fill="url(#mht-plume-grad)"/>
    <polygon points="48,80 54,90 48,99 42,90" fill="#ffffff" opacity="0.95"/>
    <polygon points="48,98 52,107 48,116 44,107" fill="#67e8f9" opacity="0.85"/>
  </g>
  <g id="part-barrel-tube-R" data-pivot="80,78" data-parent="part-turret-housing" data-z-index="28">
    <polygon points="70,76 90,76 86,126 74,126" fill="url(#mht-plume-grad)"/>
    <polygon points="80,80 86,90 80,99 74,90" fill="#ffffff" opacity="0.95"/>
    <polygon points="80,98 84,107 80,116 76,107" fill="#67e8f9" opacity="0.85"/>
  </g>

  <!-- 6. 双联重型霍尔复合推进机匣与超导喷口环 -->
  <g id="part-turret-housing" data-pivot="64,64" data-parent="part-pedestal-base" data-z-index="40">
    <polygon points="32,36 96,36 100,70 92,84 36,84 28,70" fill="url(#mht-ti-armor)" stroke="#050811" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="36" y="58" width="56" height="16" rx="2" fill="url(#mht-kapton-gold)" stroke="#451a03" stroke-width="1.1"/>
    <polygon points="39,74 57,74 59,86 37,86" fill="url(#mht-hall-coil)" stroke="#22d3ee" stroke-width="1.3"/>
    <polygon points="71,74 89,74 91,86 69,86" fill="url(#mht-hall-coil)" stroke="#22d3ee" stroke-width="1.3"/>
    <circle cx="64" cy="50" r="8.5" fill="#090d16" stroke="#ffffff" stroke-width="1.4"/>
    <circle cx="64" cy="50" r="6" fill="url(#mht-core-glow)"/>
  </g>

  <!-- 7. 顶层高光与切伦科夫电离耀斑 -->
  <g id="part-aura-corona-top" data-pivot="64,64" data-parent="part-turret-housing" data-z-index="65" style="mix-blend-mode: screen">
    <circle cx="48" cy="84" r="6.5" fill="#22d3ee" opacity="0.82"/>
    <circle cx="80" cy="84" r="6.5" fill="#22d3ee" opacity="0.82"/>
    <circle cx="64" cy="50" r="12" fill="url(#mht-core-glow)" opacity="0.72"/>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" preserveAspectRatio="none">
  <defs>
    <!-- Brushed Bronze/Gold Vacuum End-Cap -->
    <linearGradient id="tubeBrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="22%" stop-color="#d4a84f"/>
      <stop offset="55%" stop-color="#6e4e14"/>
      <stop offset="82%" stop-color="#c99b3b"/>
      <stop offset="100%" stop-color="#382505"/>
    </linearGradient>
    <linearGradient id="tubeSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Cylindrical Borosilicate Sapphire Glass Body -->
    <linearGradient id="tubeGlassBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.55"/>
      <stop offset="16%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#031829" stop-opacity="0.68"/>
      <stop offset="85%" stop-color="#00f0ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="tubeGlow" x="-8%" y="-15%" width="116%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#tubeGlow)">
    <!-- Outer Glass Cylinder Tube -->
    <rect x="24" y="6" width="212" height="42" rx="18" fill="url(#tubeGlassBody)" stroke="#7dd3fc" stroke-width="1.2"/>

    <!-- Internal Metallic Filament Rail & Scale Ticks -->
    <line x1="42" y1="27" x2="218" y2="27" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
    <rect x="40" y="13" width="180" height="28" rx="10" fill="none" stroke="#0284c7" stroke-width="0.8" opacity="0.5"/>

    <!-- Left 3D Stepped Brushed-Brass & Gunmetal Vacuum End-Cap -->
    <path d="M 22,9 L 34,9 L 34,45 L 22,45 A 14,18 0 0,1 22,9 Z" fill="url(#tubeBrass)" stroke="#2b1b02" stroke-width="1.1"/>
    <rect x="31" y="5" width="9" height="44" rx="2.5" fill="url(#tubeBrass)" stroke="#2b1b02" stroke-width="1.1"/>
    <rect x="39" y="7" width="5" height="40" rx="1.5" fill="url(#tubeSteel)" stroke="#0f172a" stroke-width="0.9"/>

    <!-- Right 3D Stepped Brushed-Brass & Gunmetal Vacuum End-Cap -->
    <path d="M 238,9 L 226,9 L 226,45 L 238,45 A 14,18 0 0,0 238,9 Z" fill="url(#tubeBrass)" stroke="#2b1b02" stroke-width="1.1"/>
    <rect x="220" y="5" width="9" height="44" rx="2.5" fill="url(#tubeBrass)" stroke="#2b1b02" stroke-width="1.1"/>
    <rect x="216" y="7" width="5" height="40" rx="1.5" fill="url(#tubeSteel)" stroke="#0f172a" stroke-width="0.9"/>

    <!-- Top Cylindrical Glass Specular Highlight Strip (Creates 3D Glass Tube Illusion) -->
    <rect x="46" y="9.5" width="168" height="5.5" rx="2.75" fill="#ffffff" opacity="0.52"/>
    <!-- Bottom Cyan Caustic Reflection Line -->
    <rect x="50" y="41" width="160" height="2.5" rx="1.25" fill="#67e8f9" opacity="0.58"/>
  </g>
</svg>


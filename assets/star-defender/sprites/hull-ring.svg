<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="hull-ring-rig" data-root-anchor="64,64" data-faction="helios" data-has-aura="true">
  <defs>
    <!-- 1. 赫利俄斯阳极氧化暗黑钛合金骨架 -->
    <linearGradient id="hr-titanium-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- 2. NASA 哑光黑碳硅防热瓦 -->
    <linearGradient id="hr-black-tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27303f"/>
      <stop offset="50%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <!-- 3. NASA 高反射极白陶瓷隔热瓦 -->
    <linearGradient id="hr-white-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="82%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- 4. 24K 聚酰亚胺多面体褶皱金箔 -->
    <linearGradient id="hr-kapton-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="22%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="78%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <!-- 5. 电磁导轨紫铜加速块 -->
    <linearGradient id="hr-rail-copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="65%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#290f02"/>
    </linearGradient>
    <!-- 6. 中央母核辉光 -->
    <radialGradient id="hr-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </radialGradient>
    <!-- 7. 底部投影 -->
    <radialGradient id="hr-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.9"/>
      <stop offset="68%" stop-color="#020617" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <!-- 8. Pattern A: NASA 陶瓷瓦接缝网格 -->
    <pattern id="hr-tile-grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none" stroke="#475569" stroke-width="0.45" opacity="0.55"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#64748b" stroke-width="0.35" opacity="0.45"/>
    </pattern>
    <!-- 9. Pattern B: 24K Kapton 金箔立体折痕微肌理 -->
    <pattern id="hr-kapton-crinkle" width="8" height="8" patternUnits="userSpaceOnUse">
      <polygon points="0,0 5,0 3,4" fill="#fef08a" opacity="0.55"/>
      <polygon points="5,0 8,0 8,5 3,4" fill="#ca8a04" opacity="0.5"/>
      <polygon points="0,0 3,4 0,8" fill="#a16207" opacity="0.55"/>
      <polygon points="3,4 8,5 5,8 0,8" fill="#eab308" opacity="0.45"/>
      <path d="M0,0 L3,4 L8,5 M5,0 L3,4 L0,8" fill="none" stroke="#fef9c3" stroke-width="0.4" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- 1. 底部投影 (z=1, <=3 nodes) -->
  <g id="part-shadow-cast" data-pivot="64,66" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="68" rx="56" ry="54" fill="url(#hr-shadow-grad)"/>
    <polygon points="64,8 112,36 112,92 64,120 16,92 16,36" fill="#020617" opacity="0.48"/>
  </g>

  <!-- 2. 外圈航宇校准环 (z=4) -->
  <g id="part-aura-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="4" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="57" fill="none" stroke="#f59e0b" stroke-width="0.75" opacity="0.32"/>
    <path d="M64,5 L64,9 M123,64 L119,64 M64,123 L64,119 M5,64 L9,64" stroke="#fde047" stroke-width="1.1" opacity="0.65"/>
  </g>

  <!-- 3. 内圈火控校准环 (z=5) -->
  <g id="part-aura-ring-inner" data-pivot="64,64" data-parent="root" data-z-index="5" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="48" fill="none" stroke="#38bdf8" stroke-width="0.55" opacity="0.24"/>
  </g>

  <!-- 4. 外层顺时针自转正六边形星堡重装甲环 (z=15, 1:1 还原 preview.png 右上角 HEXONON CITADEL FORTRESS 六角陶瓷瓦与金箔构型) -->
  <g id="part-grav-ring-cw" data-pivot="64,64" data-parent="part-central-bridge" data-z-index="15" data-blend="normal">
    <!-- 正六边形重装暗黑钛合金与碳硅防热瓦外框 -->
    <path d="M64,8 L112,36 L112,92 L64,120 L16,92 L16,36 Z M64,24 L30,44 L30,84 L64,104 L98,84 L98,44 Z" fill="url(#hr-black-tile)" fill-rule="evenodd" stroke="#090d16" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 六扇区梯形高反射 NASA 极白陶瓷隔热瓦矩阵 (1:1 还原 preview.png 六边形要塞白瓷砖扇区) -->
    <polygon points="60,12 34,27 40,36 60,24" fill="url(#hr-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <polygon points="68,12 94,27 88,36 68,24" fill="url(#hr-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <polygon points="108,42 108,60 98,60 98,46" fill="url(#hr-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <polygon points="108,86 108,68 98,68 98,82" fill="url(#hr-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <polygon points="68,116 94,101 88,92 68,104" fill="url(#hr-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <polygon points="60,116 34,101 40,92 60,104" fill="url(#hr-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <polygon points="20,86 20,68 30,68 30,82" fill="url(#hr-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <polygon points="20,42 20,60 30,60 30,46" fill="url(#hr-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <!-- 六个顶点 24K 褶皱金箔热控凹舱与矢量喷嘴 -->
    <polygon points="60,9 68,9 68,22 60,22" fill="url(#hr-kapton-gold)" stroke="#090d16" stroke-width="0.9"/>
    <polygon points="60,106 68,106 68,119 60,119" fill="url(#hr-kapton-gold)" stroke="#090d16" stroke-width="0.9"/>
    <polygon points="100,32 111,38 101,44 94,38" fill="url(#hr-kapton-gold)" stroke="#090d16" stroke-width="0.9"/>
    <polygon points="100,96 111,90 101,84 94,90" fill="url(#hr-kapton-gold)" stroke="#090d16" stroke-width="0.9"/>
    <polygon points="28,32 17,38 27,44 34,38" fill="url(#hr-kapton-gold)" stroke="#090d16" stroke-width="0.9"/>
    <polygon points="28,96 17,90 27,84 34,90" fill="url(#hr-kapton-gold)" stroke="#090d16" stroke-width="0.9"/>
    <!-- 蓝图红/青/琥珀色标硬挂点方块 -->
    <rect x="44" y="16" width="4.5" height="3" fill="#ef4444" stroke="#090d16" stroke-width="0.6"/>
    <rect x="79.5" y="16" width="4.5" height="3" fill="#ef4444" stroke="#090d16" stroke-width="0.6"/>
    <rect x="44" y="109" width="4.5" height="3" fill="#06b6d4" stroke="#090d16" stroke-width="0.6"/>
    <rect x="79.5" y="109" width="4.5" height="3" fill="#06b6d4" stroke="#090d16" stroke-width="0.6"/>
    <rect x="15" y="61.5" width="3" height="5" fill="#f59e0b" stroke="#090d16" stroke-width="0.6"/>
    <rect x="110" y="61.5" width="3" height="5" fill="#f59e0b" stroke="#090d16" stroke-width="0.6"/>
    <!-- NASA 白瓷砖接缝网格线与 24K 金箔立体折痕 -->
    <line x1="47" y1="20" x2="50" y2="30" stroke="#475569" stroke-width="0.7"/>
    <line x1="81" y1="20" x2="78" y2="30" stroke="#475569" stroke-width="0.7"/>
    <line x1="98" y1="53" x2="108" y2="53" stroke="#475569" stroke-width="0.7"/>
    <line x1="98" y1="75" x2="108" y2="75" stroke="#475569" stroke-width="0.7"/>
    <line x1="81" y1="108" x2="78" y2="98" stroke="#475569" stroke-width="0.7"/>
    <line x1="47" y1="108" x2="50" y2="98" stroke="#475569" stroke-width="0.7"/>
    <line x1="20" y1="75" x2="30" y2="75" stroke="#475569" stroke-width="0.7"/>
    <line x1="20" y1="53" x2="30" y2="53" stroke="#475569" stroke-width="0.7"/>
    <polyline points="61,11 65,15 62,20" fill="none" stroke="#fef9c3" stroke-width="0.6"/>
    <polyline points="61,108 65,112 62,117" fill="none" stroke="#fef9c3" stroke-width="0.6"/>
    <polyline points="101,34 106,38 99,42" fill="none" stroke="#fef9c3" stroke-width="0.6"/>
    <polyline points="101,94 106,90 99,86" fill="none" stroke="#fef9c3" stroke-width="0.6"/>
    <polyline points="27,34 22,38 29,42" fill="none" stroke="#fef9c3" stroke-width="0.6"/>
    <polyline points="27,94 22,90 29,86" fill="none" stroke="#fef9c3" stroke-width="0.6"/>
    <!-- 航宇沉头铆钉阵列 -->
    <circle cx="38" cy="28" r="0.8" fill="#334155"/>
    <circle cx="56" cy="18" r="0.8" fill="#334155"/>
    <circle cx="72" cy="18" r="0.8" fill="#334155"/>
    <circle cx="90" cy="28" r="0.8" fill="#334155"/>
    <circle cx="104" cy="46" r="0.8" fill="#334155"/>
    <circle cx="104" cy="82" r="0.8" fill="#334155"/>
    <circle cx="90" cy="100" r="0.8" fill="#334155"/>
    <circle cx="72" cy="110" r="0.8" fill="#334155"/>
    <circle cx="56" cy="110" r="0.8" fill="#334155"/>
    <circle cx="38" cy="100" r="0.8" fill="#334155"/>
    <circle cx="24" cy="82" r="0.8" fill="#334155"/>
    <circle cx="24" cy="46" r="0.8" fill="#334155"/>
    <rect x="61.5" y="13" width="5" height="2" fill="#ea580c"/>
    <rect x="61.5" y="113" width="5" height="2" fill="#ea580c"/>
    <circle cx="64" cy="46" r="1.2" fill="#ef4444"/>
    <circle cx="64" cy="82" r="1.2" fill="#06b6d4"/>
    <circle cx="48" cy="64" r="1.2" fill="#f59e0b"/>
    <circle cx="80" cy="64" r="1.2" fill="#f59e0b"/>
  </g>

  <!-- 5. 内层逆时针自转紫铜加速线圈导轨环 (z=22) -->
  <g id="part-grav-ring-ccw" data-pivot="64,64" data-parent="part-central-bridge" data-z-index="22" data-blend="normal">
    <path d="M64,27 A37,37 0 1,1 63.9,27 Z M64,36 A28,28 0 1,0 64.1,36 Z" fill="url(#hr-titanium-dark)" fill-rule="evenodd" stroke="#090d16" stroke-width="1.6"/>
    <circle cx="64" cy="64" r="31.5" fill="none" stroke="url(#hr-rail-copper)" stroke-width="3.2"/>
    <path d="M64,27 V36 M101,64 H92 M64,101 V92 M27,64 H36 M90,38 L84,44 M90,90 L84,84 M38,90 L44,84 M38,38 L44,44" stroke="#cbd5e1" stroke-width="1.4"/>
  </g>

  <!-- 6~9. 四向白陶瓷与金箔复合辐射护盾翼 (z=28, 还原 preview.png 六角堡垒辐射翼) -->
  <g id="part-shield-vane-N" data-pivot="64,42" data-parent="part-central-bridge" data-z-index="28" data-blend="normal">
    <polygon points="56,42 59,20 69,20 72,42" fill="url(#hr-white-tile)" stroke="#090d16" stroke-width="1.5"/>
    <rect x="61" y="23" width="6" height="15" fill="url(#hr-kapton-gold)" stroke="#090d16" stroke-width="0.7"/>
  </g>
  <g id="part-shield-vane-S" data-pivot="64,86" data-parent="part-central-bridge" data-z-index="28" data-blend="normal">
    <polygon points="56,86 59,108 69,108 72,86" fill="url(#hr-white-tile)" stroke="#090d16" stroke-width="1.5"/>
    <rect x="61" y="90" width="6" height="15" fill="url(#hr-kapton-gold)" stroke="#090d16" stroke-width="0.7"/>
  </g>
  <g id="part-shield-vane-W" data-pivot="42,64" data-parent="part-central-bridge" data-z-index="28" data-blend="normal">
    <polygon points="42,56 20,59 20,69 42,72" fill="url(#hr-white-tile)" stroke="#090d16" stroke-width="1.5"/>
    <rect x="23" y="61" width="15" height="6" fill="url(#hr-kapton-gold)" stroke="#090d16" stroke-width="0.7"/>
  </g>
  <g id="part-shield-vane-E" data-pivot="86,64" data-parent="part-central-bridge" data-z-index="28" data-blend="normal">
    <polygon points="86,56 108,59 108,69 86,72" fill="url(#hr-white-tile)" stroke="#090d16" stroke-width="1.5"/>
    <rect x="90" y="61" width="15" height="6" fill="url(#hr-kapton-gold)" stroke="#090d16" stroke-width="0.7"/>
  </g>

  <!-- 10. 中央正六边形白陶瓷与暗钛指挥舰桥 (z=34) -->
  <g id="part-central-bridge" data-pivot="64,64" data-parent="root" data-z-index="34" data-blend="normal">
    <polygon points="64,38 86,51 86,77 64,90 42,77 42,51" fill="url(#hr-titanium-dark)" stroke="#090d16" stroke-width="2.0" stroke-linejoin="round"/>
    <polygon points="64,42 82,53 82,75 64,86 46,75 46,53" fill="url(#hr-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <polygon points="64,42 82,53 82,75 64,86 46,75 46,53" fill="url(#hr-tile-grid)"/>
    <path d="M64,38 V90 M42,51 L86,77 M86,51 L42,77" stroke="#0f172a" stroke-width="1.2"/>
  </g>

  <!-- 11. 中央聚变核心穹顶 (z=40, 1:1 还原 preview.png 六边形堡垒中央发光圆核) -->
  <g id="part-reactor-core" data-pivot="64,64" data-parent="part-central-bridge" data-z-index="40" data-blend="normal">
    <circle cx="64" cy="64" r="13" fill="url(#hr-titanium-dark)" stroke="#090d16" stroke-width="1.6"/>
    <circle cx="64" cy="64" r="9.5" fill="#082f49" stroke="#fde047" stroke-width="1.1"/>
    <circle cx="64" cy="64" r="6.5" fill="url(#hr-core-glow)"/>
    <circle cx="64" cy="64" r="3.0" fill="#ffffff"/>
  </g>

  <!-- 12. 顶层高光反射 (z=45) -->
  <g id="part-light-rim-ring" data-pivot="64,64" data-parent="part-grav-ring-cw" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M16,36 L64,8 L112,36" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- 13. 顶层日冕光斑 (z=65) -->
  <g id="part-aura-corona-top" data-pivot="64,64" data-parent="root" data-z-index="65" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="15" fill="url(#hr-core-glow)" opacity="0.55"/>
  </g>
</svg>
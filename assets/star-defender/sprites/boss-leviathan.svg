    <circle cx="218" cy="182" r="3.2" fill="#a3e635" stroke="#0f0208" stroke-width="1"/>
    <circle cx="228" cy="202" r="2.8" fill="#fef08a" stroke="#0f0208" stroke-width="1"/>
  </g>
  <g id="part-leg-L4" data-pivot="96 188" data-parent="part-spine-abdomen-3" data-z-index="17" data-blend="normal">

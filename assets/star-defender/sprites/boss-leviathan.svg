<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Glossy Crimson-Violet Kraken Carapace & Tentacles (Matches Showcase BOSS-01) -->
    <linearGradient id="blv-chitin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#be123c"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1a0315"/>
    </linearGradient>
    <linearGradient id="blv-chitin-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="55%" stop-color="#3b0726"/>
      <stop offset="100%" stop-color="#0f0208"/>
    </linearGradient>
    <!-- Colossal Bilobed Convoluted Neon-Lime Cerebral Cortex Brain -->
    <radialGradient id="blv-brain-lime" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#a3e635"/>
      <stop offset="72%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </radialGradient>
    <!-- Amber Compound Eye -->
    <radialGradient id="blv-amber-eye" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="blv-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#be123c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0f0208" stop-opacity="0"/>
    </radialGradient>
    <pattern id="blv-manga-hatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 6 L 6 0 M -1 1 L 1 -1" stroke="#0f0208" stroke-width="0.8" opacity="0.5"/>
    </pattern>
    <pattern id="blv-bio-honeycomb" width="8" height="8" patternUnits="userSpaceOnUse">
      <polygon points="4,0 8,2.3 8,5.7 4,8 0,5.7 0,2.3" fill="none" stroke="#365314" stroke-width="0.65" opacity="0.48"/>
      <circle cx="4" cy="4" r="1" fill="#ecfccb" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- 1. Ground Shadow -->
  <g id="part-shadow-cast" data-pivot="128 136" data-parent="root" data-z-index="1" data-blend="multiply">
    <ellipse cx="128" cy="136" rx="112" ry="104" fill="#090106" opacity="0.64"/>
  </g>

  <!-- 2. Outer Bio-Hazard Aura Ring -->
  <g id="part-aura-ring-outer" data-pivot="128 128" data-parent="root" data-z-index="4" data-blend="screen">
    <circle cx="128" cy="120" r="118" fill="url(#blv-aura)"/>
    <circle cx="128" cy="128" r="114" fill="none" stroke="#84cc16" stroke-width="1" opacity="0.36"/>
  </g>

  <!-- 3. Inner Bio-Hazard Aura Ring -->
  <g id="part-aura-ring-inner" data-pivot="128 128" data-parent="root" data-z-index="5" data-blend="screen">
    <circle cx="128" cy="112" r="92" fill="none" stroke="#f43f5e" stroke-width="0.9" opacity="0.3"/>
  </g>

  <!-- 4. Bio-Plasma Breath Cone (part-light-cone-breath) -->
  <g id="part-light-cone-breath" data-pivot="128 62" data-parent="part-void-breath-maw" data-z-index="9" data-blend="screen">
    <polygon points="128,148 96,246 160,246" fill="#a3e635" opacity="0.22"/>
  </g>

  <!-- 5~8. Four Upper/Lateral S-Curved Segmented Crimson Tentacles Tipped with Glowing Neon-Lime Bio-Laser Nozzles (Matching Showcase BOSS-01) -->
  <!-- Upper-Left Bio-Laser Tentacle (part-leg-L1) -->
  <g id="part-leg-L1" data-pivot="84 96" data-parent="part-spine-thorax-1" data-z-index="14" data-blend="normal">
    <path d="M 78 88 C 46 72, 18 46, 24 22 C 30 22, 34 38, 46 52 C 58 66, 70 74, 84 80 Z" fill="url(#blv-chitin)" stroke="#0f0208" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Glowing Neon-Lime Bio-Laser Emitter Nozzle at Tentacle Tip -->
    <ellipse cx="24" cy="22" rx="7" ry="5" transform="rotate(-35 24 22)" fill="url(#blv-brain-lime)" stroke="#0f0208" stroke-width="1.8"/>
    <circle cx="24" cy="22" r="2.5" fill="#fef08a"/>
    <circle cx="42" cy="54" r="3" fill="#a3e635" stroke="#0f0208" stroke-width="1"/>
    <circle cx="56" cy="68" r="3.2" fill="#a3e635" stroke="#0f0208" stroke-width="1"/>
  </g>
  <!-- Upper-Right Bio-Laser Tentacle (part-leg-R1) -->

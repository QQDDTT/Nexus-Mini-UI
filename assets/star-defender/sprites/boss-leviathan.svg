    <circle cx="222" cy="96" r="3" fill="#a3e635" stroke="#0f0208" stroke-width="1"/>
    <circle cx="204" cy="106" r="3.2" fill="#a3e635" stroke="#0f0208" stroke-width="1"/>
  </g>

  <!-- 9~12. Four Lower Coiling Sucker-Lined Kraken Tentacles (part-leg-L3/R3/L4/R4) -->

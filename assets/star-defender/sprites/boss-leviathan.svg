    <ellipse cx="12" cy="68" rx="7" ry="5" transform="rotate(-15 12 68)" fill="url(#blv-brain-lime)" stroke="#0f0208" stroke-width="1.8"/>
    <circle cx="12" cy="68" r="2.5" fill="#fef08a"/>
    <circle cx="34" cy="96" r="3" fill="#a3e635" stroke="#0f0208" stroke-width="1"/>
    <circle cx="52" cy="106" r="3.2" fill="#a3e635" stroke="#0f0208" stroke-width="1"/>

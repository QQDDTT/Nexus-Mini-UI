    <ellipse cx="232" cy="22" rx="7" ry="5" transform="rotate(35 232 22)" fill="url(#blv-brain-lime)" stroke="#0f0208" stroke-width="1.8"/>
    <circle cx="232" cy="22" r="2.5" fill="#fef08a"/>
    <circle cx="214" cy="54" r="3" fill="#a3e635" stroke="#0f0208" stroke-width="1"/>
    <circle cx="200" cy="68" r="3.2" fill="#a3e635" stroke="#0f0208" stroke-width="1"/>

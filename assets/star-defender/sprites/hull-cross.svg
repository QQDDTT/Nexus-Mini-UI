<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-rig-id="hull-cross-rig" data-root-anchor="64,64" data-faction="helios" data-has-aura="true">
  <defs>
    <!-- 1. 赫利俄斯阳极氧化暗黑钛合金骨架 -->
    <linearGradient id="hc-titanium-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- 2. NASA 哑光黑碳硅防热瓦 -->
    <linearGradient id="hc-black-tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27303f"/>
      <stop offset="50%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <!-- 3. NASA 高反射极白陶瓷隔热瓦 -->
    <linearGradient id="hc-white-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="82%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- 4. 24K 聚酰亚胺多面体褶皱金箔 -->
    <linearGradient id="hc-kapton-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="22%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="78%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <!-- 5. 电磁导轨紫铜加速块 -->
    <linearGradient id="hc-rail-copper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#290f02"/>
    </linearGradient>
    <!-- 6. 聚变尾焰 -->
    <linearGradient id="hc-plume-amber" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f97316" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </linearGradient>
    <!-- 7. 核心琥珀金辉光 -->
    <radialGradient id="hc-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#431407" stop-opacity="0"/>
    </radialGradient>
    <!-- 8. 底部投影 -->
    <radialGradient id="hc-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.9"/>
      <stop offset="68%" stop-color="#020617" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <!-- 9. Pattern A: NASA 陶瓷瓦接缝网格 -->
    <pattern id="hc-tile-grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none" stroke="#475569" stroke-width="0.45" opacity="0.55"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#64748b" stroke-width="0.35" opacity="0.45"/>
    </pattern>
    <!-- 10. Pattern B: 24K Kapton 金箔立体折痕微肌理 -->
    <pattern id="hc-kapton-crinkle" width="8" height="8" patternUnits="userSpaceOnUse">
      <polygon points="0,0 5,0 3,4" fill="#fef08a" opacity="0.55"/>
      <polygon points="5,0 8,0 8,5 3,4" fill="#ca8a04" opacity="0.5"/>
      <polygon points="0,0 3,4 0,8" fill="#a16207" opacity="0.55"/>
      <polygon points="3,4 8,5 5,8 0,8" fill="#eab308" opacity="0.45"/>
      <path d="M0,0 L3,4 L8,5 M5,0 L3,4 L0,8" fill="none" stroke="#fef9c3" stroke-width="0.4" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- 1. 底部投影 (z=1, <=3 nodes) -->
  <g id="part-shadow-cast" data-pivot="64,68" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">
    <ellipse cx="64" cy="70" rx="58" ry="54" fill="url(#hc-shadow-grad)"/>
    <polygon points="48,6 80,6 84,42 122,48 122,82 84,88 84,108 44,108 44,88 6,82 6,48 44,42" fill="#020617" opacity="0.48"/>
  </g>

  <!-- 2. 外圈航宇校准环 (z=4) -->
  <g id="part-aura-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="4" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="58" fill="none" stroke="#f59e0b" stroke-width="0.75" opacity="0.32"/>
    <path d="M64,4 L64,8 M124,64 L120,64 M64,124 L64,120 M4,64 L8,64" stroke="#fde047" stroke-width="1.1" opacity="0.65"/>
  </g>

  <!-- 3. 内圈火控校准环 (z=5) -->
  <g id="part-aura-ring-inner" data-pivot="64,64" data-parent="root" data-z-index="5" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="46" fill="none" stroke="#38bdf8" stroke-width="0.55" opacity="0.24"/>
  </g>

  <!-- 4. 尾部双 24K 金箔推进器高频喷射尾焰 (z=10) -->
  <g id="part-plume-array" data-pivot="64,106" data-parent="part-cross-hull-body" data-z-index="10" data-blend="screen" style="mix-blend-mode: screen">
    <g transform="translate(49,106)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,0.58;1.1,1.18;0.92,0.7;1,0.58" dur="0.21s" repeatCount="indefinite"/>
        <polygon points="-7,0 7,0 3,19 0,22 -3,19" fill="url(#hc-plume-amber)"/>
        <ellipse cx="0" cy="5" rx="4.2" ry="1.5" fill="#ffffff"/>
      </g>
    </g>
    <g transform="translate(79,106)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,0.64;1.08,1.16;0.94,0.68;1,0.64" dur="0.23s" repeatCount="indefinite"/>
        <polygon points="-7,0 7,0 3,19 0,22 -3,19" fill="url(#hc-plume-amber)"/>
        <ellipse cx="0" cy="5" rx="4.2" ry="1.5" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- 5. 十字无畏舰主舰体：双 24K 金箔尾喷筒 + 横向 NASA 白瓷砖重翼 + 翼根金箔凹舱 + 前伸双叉磁轨炮脊 (z=20, 1:1 对齐 preview.png) -->
  <g id="part-cross-hull-body" data-pivot="64,64" data-parent="root" data-z-index="20" data-blend="normal">
    <!-- 尾部双 24K 褶皱金箔圆筒推进器 -->
    <polygon points="40,92 56,92 54,107 42,107" fill="url(#hc-kapton-gold)" stroke="#090d16" stroke-width="1.6"/>
    <polygon points="40,92 56,92 54,107 42,107" fill="url(#hc-kapton-crinkle)"/>
    <polygon points="72,92 88,92 86,107 74,107" fill="url(#hc-kapton-gold)" stroke="#090d16" stroke-width="1.6"/>
    <polygon points="72,92 88,92 86,107 74,107" fill="url(#hc-kapton-crinkle)"/>
    <polygon points="42,93 48,93 46,105 42,105" fill="#fef9c3" opacity="0.72"/>
    <polygon points="74,93 80,93 78,105 74,105" fill="#fef9c3" opacity="0.72"/>

    <!-- 横向重型十字悬臂 (哑光黑碳硅防热瓦外框 + 极白陶瓷瓦矩阵 + 翼根 24K 金箔凹舱) -->
    <polygon points="46,42 8,50 8,82 46,88 82,88 120,82 120,50 82,42" fill="url(#hc-black-tile)" stroke="#090d16" stroke-width="2.1" stroke-linejoin="round"/>
    <!-- 左右翼根三角形 24K 褶皱金箔热控凹舱 -->
    <polygon points="48,44 32,52 38,68 48,68" fill="url(#hc-kapton-gold)" stroke="#090d16" stroke-width="1.1"/>
    <polygon points="48,44 32,52 38,68 48,68" fill="url(#hc-kapton-crinkle)"/>
    <polygon points="80,44 96,52 90,68 80,68" fill="url(#hc-kapton-gold)" stroke="#090d16" stroke-width="1.1"/>
    <polygon points="80,44 96,52 90,68 80,68" fill="url(#hc-kapton-crinkle)"/>
    <!-- 左右悬臂极白陶瓷隔热瓦矩阵 -->
    <rect x="14" y="54" width="22" height="24" fill="url(#hc-white-tile)" stroke="#0f172a" stroke-width="1.15"/>
    <rect x="14" y="54" width="22" height="24" fill="url(#hc-tile-grid)"/>
    <line x1="25" y1="54" x2="25" y2="78" stroke="#0f172a" stroke-width="1.0"/>
    <line x1="14" y1="66" x2="36" y2="66" stroke="#0f172a" stroke-width="1.0"/>
    <rect x="92" y="54" width="22" height="24" fill="url(#hc-white-tile)" stroke="#0f172a" stroke-width="1.15"/>
    <rect x="92" y="54" width="22" height="24" fill="url(#hc-tile-grid)"/>
    <line x1="103" y1="54" x2="103" y2="78" stroke="#0f172a" stroke-width="1.0"/>
    <line x1="92" y1="66" x2="114" y2="66" stroke="#0f172a" stroke-width="1.0"/>

    <!-- 中央纵向重型钛合金主舰脊 -->
    <rect x="48" y="42" width="32" height="52" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="2.0"/>
    <!-- 前伸双叉重装护臂 (白陶瓷 + 金箔内嵌 + 红/青/琥珀色标块) -->
    <polygon points="48,42 48,12 52,6 60,6 60,42" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="1.9"/>
    <polygon points="49,28 49,13 52,8 59,8 59,28" fill="url(#hc-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <rect x="52" y="10" width="4" height="15" fill="url(#hc-kapton-gold)" stroke="#090d16" stroke-width="0.7"/>
    <polygon points="80,42 80,12 76,6 68,6 68,42" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="1.9"/>
    <polygon points="79,28 79,13 76,8 69,8 69,28" fill="url(#hc-white-tile)" stroke="#0f172a" stroke-width="1.0"/>
    <rect x="72" y="10" width="4" height="15" fill="url(#hc-kapton-gold)" stroke="#090d16" stroke-width="0.7"/>
    <!-- 蓝图红/青/琥珀模块化色标块 -->
    <rect x="44.5" y="34" width="3.5" height="5" fill="#ef4444" stroke="#090d16" stroke-width="0.7"/>
    <rect x="44.5" y="28" width="3.5" height="5" fill="#06b6d4" stroke="#090d16" stroke-width="0.7"/>
    <rect x="80" y="34" width="3.5" height="5" fill="#ef4444" stroke="#090d16" stroke-width="0.7"/>
    <rect x="80" y="28" width="3.5" height="5" fill="#06b6d4" stroke="#090d16" stroke-width="0.7"/>
    <rect x="26" y="44" width="6" height="3.2" fill="#ef4444" stroke="#090d16" stroke-width="0.7"/>
    <rect x="96" y="44" width="6" height="3.2" fill="#ef4444" stroke="#090d16" stroke-width="0.7"/>
    <rect x="26" y="83" width="6" height="3.2" fill="#06b6d4" stroke="#090d16" stroke-width="0.7"/>
    <rect x="96" y="83" width="6" height="3.2" fill="#06b6d4" stroke="#090d16" stroke-width="0.7"/>
    <rect x="44.5" y="22" width="3.5" height="4.5" fill="#f59e0b" stroke="#090d16" stroke-width="0.7"/>
    <rect x="80" y="22" width="3.5" height="4.5" fill="#f59e0b" stroke="#090d16" stroke-width="0.7"/>
    <!-- 24K 金箔立体折痕与航宇沉头铆钉阵列 -->
    <polyline points="34,53 42,56 38,65" fill="none" stroke="#fef9c3" stroke-width="0.65"/>
    <polyline points="94,53 86,56 90,65" fill="none" stroke="#fef9c3" stroke-width="0.65"/>
    <circle cx="17" cy="57" r="0.8" fill="#475569"/>
    <circle cx="33" cy="57" r="0.8" fill="#475569"/>
    <circle cx="17" cy="75" r="0.8" fill="#475569"/>
    <circle cx="33" cy="75" r="0.8" fill="#475569"/>
    <circle cx="95" cy="57" r="0.8" fill="#475569"/>
    <circle cx="111" cy="57" r="0.8" fill="#475569"/>
    <circle cx="95" cy="75" r="0.8" fill="#475569"/>
    <circle cx="111" cy="75" r="0.8" fill="#475569"/>
    <circle cx="51" cy="46" r="0.8" fill="#94a3b8"/>
    <circle cx="77" cy="46" r="0.8" fill="#94a3b8"/>
    <circle cx="51" cy="86" r="0.8" fill="#94a3b8"/>
    <circle cx="77" cy="86" r="0.8" fill="#94a3b8"/>
  </g>

  <!-- 6. 中央圆形重装旋转主反应塔座 (z=30, 1:1 还原 preview.png 舰脊圆形轴承核心) -->
  <g id="part-heavy-reactor" data-pivot="64,66" data-parent="part-cross-hull-body" data-z-index="30" data-blend="normal">
    <rect x="52" y="48" width="24" height="36" fill="#1e293b" stroke="#475569" stroke-width="0.9"/>
    <circle cx="64" cy="66" r="11" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="1.8"/>
    <circle cx="64" cy="66" r="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.0"/>
    <circle cx="64" cy="66" r="4.5" fill="#334155" stroke="#fde047" stroke-width="0.9"/>
    <circle cx="64" cy="66" r="2.0" fill="#fde047"/>
  </g>

  <!-- 7. 前向双联内嵌式模块化磁轨主炮 (z=40) -->
  <g id="part-turret-front" data-pivot="64,38" data-parent="part-cross-hull-body" data-z-index="40" data-blend="normal">
    <rect x="60" y="10" width="3.6" height="30" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="0.85"/>
    <rect x="64.4" y="10" width="3.6" height="30" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="0.85"/>
    <path d="M60.4,14 H63.2 M60.4,20 H63.2 M60.4,26 H63.2 M60.4,32 H63.2 M64.8,14 H67.6 M64.8,20 H67.6 M64.8,26 H67.6 M64.8,32 H67.6" stroke="url(#hc-rail-copper)" stroke-width="2.5"/>
    <rect x="56" y="38" width="16" height="7" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="1.3"/>
  </g>

  <!-- 8. 后向双联防空磁轨炮塔 (z=40) -->
  <g id="part-turret-rear" data-pivot="64,88" data-parent="part-cross-hull-body" data-z-index="40" data-blend="normal">
    <rect x="59.5" y="90" width="3.5" height="14" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="0.9"/>
    <rect x="65" y="90" width="3.5" height="14" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="0.9"/>
    <polygon points="56,83 72,83 74,91 54,91" fill="url(#hc-white-tile)" stroke="#090d16" stroke-width="1.5"/>
    <circle cx="64" cy="87" r="2.8" fill="url(#hc-kapton-gold)" stroke="#090d16" stroke-width="0.8"/>
  </g>

  <!-- 9. 左舷双联重型磁轨副炮塔 (z=40) -->
  <g id="part-turret-left" data-pivot="25,66" data-parent="part-cross-hull-body" data-z-index="40" data-blend="normal">
    <rect x="4" y="61" width="18" height="3.6" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="0.9"/>
    <rect x="4" y="67.4" width="18" height="3.6" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="0.9"/>
    <path d="M8,61 V64.6 M13,61 V64.6 M8,67.4 V71 M13,67.4 V71" stroke="url(#hc-rail-copper)" stroke-width="2.2"/>
    <polygon points="19,58 31,58 33,66 31,74 19,74" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="1.5"/>
    <circle cx="25" cy="66" r="3.5" fill="url(#hc-kapton-gold)" stroke="#090d16" stroke-width="0.9"/>
  </g>

  <!-- 10. 右舷双联重型磁轨副炮塔 (z=40) -->
  <g id="part-turret-right" data-pivot="103,66" data-parent="part-cross-hull-body" data-z-index="40" data-blend="normal">
    <rect x="106" y="61" width="18" height="3.6" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="0.9"/>
    <rect x="106" y="67.4" width="18" height="3.6" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="0.9"/>
    <path d="M115,61 V64.6 M120,61 V64.6 M115,67.4 V71 M120,67.4 V71" stroke="url(#hc-rail-copper)" stroke-width="2.2"/>
    <polygon points="109,58 97,58 95,66 97,74 109,74" fill="url(#hc-titanium-dark)" stroke="#090d16" stroke-width="1.5"/>
    <circle cx="103" cy="66" r="3.5" fill="url(#hc-kapton-gold)" stroke="#090d16" stroke-width="0.9"/>
  </g>

  <!-- 11. 顶层高光反射 (z=45) -->
  <g id="part-light-rim-cross" data-pivot="64,64" data-parent="part-cross-hull-body" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M8,50 L46,42 L48,12 M120,50 L82,42 L80,12" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.82"/>
  </g>

  <!-- 12. 顶层核心光斑 (z=65) -->
  <g id="part-aura-corona-top" data-pivot="64,64" data-parent="root" data-z-index="65" data-blend="screen" style="mix-blend-mode: screen">
    <circle cx="64" cy="66" r="11" fill="url(#hc-core-glow)" opacity="0.48"/>
  </g>
</svg>
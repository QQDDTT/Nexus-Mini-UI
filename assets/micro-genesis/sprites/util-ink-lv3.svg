<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="ink3" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <!-- Lv.3 深渊神经蚀墨腺：三联涡轮毒墨囊 + 紫黑腐蚀孢子环 + 金色高压阀 -->
  <!-- 外圈蚀墨孢子云环 -->
  <circle cx="64" cy="68" r="50" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 5" opacity="0.75"/>
  <!-- 左右副墨腺 -->
  <ellipse cx="36" cy="74" rx="20" ry="28" fill="url(#ink3)" stroke="#c084fc" stroke-width="2.2"/>
  <ellipse cx="92" cy="74" rx="20" ry="28" fill="url(#ink3)" stroke="#c084fc" stroke-width="2.2"/>
  <!-- 中央主深渊墨囊 -->
  <ellipse cx="64" cy="72" rx="26" ry="34" fill="url(#ink3)" stroke="#fbbf24" stroke-width="3"/>
  <!-- 三联加压喷嘴 -->
  <polygon points="48,40 56,16 72,16 80,40" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2.5"/>
  <!-- 神经腐蚀墨核与孢子 -->
  <circle cx="64" cy="72" r="10" fill="#090d16" stroke="#e879f9" stroke-width="2.5"/>
  <circle cx="64" cy="72" r="4" fill="#fbbf24"/>
  <circle cx="64" cy="10" r="6" fill="#3b0764" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="42" cy="14" r="5" fill="#3b0764" stroke="#e879f9" stroke-width="2"/>
  <circle cx="86" cy="14" r="5" fill="#3b0764" stroke="#e879f9" stroke-width="2"/>
</svg>

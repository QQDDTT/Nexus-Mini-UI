<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="ear3Core" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#00f0ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="ear3Beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <!-- Lv.3 Abyssal High-Frequency Echo Sonar: 金银双色多环谐振声呐耳廓 + 高频相位雷达十字波束 -->
  <g id="layer-base">
    <circle cx="48" cy="48" r="41" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="48" cy="48" r="31" fill="none" stroke="url(#ear3Beam)" stroke-width="2.4"/>
    <circle cx="48" cy="48" r="21" fill="url(#ear3Core)" stroke="#00f0ff" stroke-width="2.5"/>
  </g>
  <g id="layer-material">
    <line x1="6" y1="48" x2="90" y2="48" stroke="#ffffff" stroke-width="1.8" opacity="0.75"/>
    <line x1="48" y1="6" x2="48" y2="90" stroke="#ffffff" stroke-width="1.8" opacity="0.75"/>
    <line x1="18" y1="18" x2="78" y2="78" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.65"/>
    <line x1="78" y1="18" x2="18" y2="78" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.65"/>
  </g>
  <g id="layer-glow">
    <circle cx="48" cy="48" r="7.5" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
    <circle cx="48" cy="17" r="3" fill="#00f0ff"/>
    <circle cx="48" cy="79" r="3" fill="#00f0ff"/>
    <circle cx="17" cy="48" r="3" fill="#00f0ff"/>
    <circle cx="79" cy="48" r="3" fill="#00f0ff"/>
  </g>

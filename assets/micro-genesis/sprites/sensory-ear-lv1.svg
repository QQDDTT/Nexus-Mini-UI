<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="ear1Drum" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="ear1Wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Lv.1 Primary Tympanic Membrane: 银灰色单环鼓膜凹槽 + 2 道声波弧线 -->
  <g id="layer-base">
    <circle cx="48" cy="54" r="21" fill="url(#ear1Drum)" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="48" cy="54" r="14" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <g id="layer-material">
    <circle cx="48" cy="54" r="8.5" fill="#cbd5e1" fill-opacity="0.7" stroke="#f8fafc" stroke-width="1.4"/>
    <circle cx="48" cy="54" r="3" fill="#0f172a"/>
  </g>
  <g id="layer-glow">
    <path d="M26 38 A28 28 0 0 1 70 38" fill="none" stroke="url(#ear1Wave)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M18 26 A38 38 0 0 1 78 26" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="meatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#991b1b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meatCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="meatSpec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fecaca" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- Layer 1: Ambient Bioluminescent Nutrient Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#meatGlow)"/>
  <!-- Layer 2: Multi-Faceted Organic Protein Crystal Silhouette -->
  <polygon points="32,10 49,18 53,36 41,51 21,50 12,34 18,16" fill="url(#meatCore)" stroke="#fca5a5" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Layer 3: Internal Myoglobin Facets & Specular Highlights -->
  <polygon points="32,15 44,22 41,37 26,41 19,29" fill="url(#meatSpec)" opacity="0.65"/>
  <polyline points="18,16 32,28 49,18" fill="none" stroke="#fecaca" stroke-width="1.2" opacity="0.8"/>
  <polyline points="32,28 31,46" fill="none" stroke="#fecaca" stroke-width="1.2" opacity="0.7"/>
  <circle cx="27" cy="24" r="2.2" fill="#fff1f2"/>
  <circle cx="42" cy="34" r="1.6" fill="#fde68a"/>
  <circle cx="22" cy="40" r="1.4" fill="#fca5a5"/>
</svg>

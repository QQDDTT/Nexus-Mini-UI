<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="ink2" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <!-- Lv.2 高压迷雾墨囊：双腔加压墨囊 + 声波阻尼混流喷头 + 迷雾粒子 -->
  <!-- 左右双储墨腔 -->
  <ellipse cx="44" cy="72" rx="24" ry="32" fill="url(#ink2)" stroke="#818cf8" stroke-width="2.5"/>
  <ellipse cx="84" cy="72" rx="24" ry="32" fill="url(#ink2)" stroke="#818cf8" stroke-width="2.5"/>
  <!-- 中央高压混流喷嘴 -->
  <polygon points="50,42 58,20 70,20 78,42" fill="#312e81" stroke="#a5b4fc" stroke-width="2.5"/>
  <!-- 浓墨与声学阻尼胶体团 -->
  <circle cx="64" cy="12" r="6" fill="#1e1b4b" stroke="#c084fc" stroke-width="2"/>
  <circle cx="44" cy="16" r="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8"/>
  <circle cx="84" cy="16" r="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8"/>
  <!-- 囊体内部发光脉络 -->
  <path d="M 44 50 Q 64 64 84 50" fill="none" stroke="#c084fc" stroke-width="2.5"/>
  <circle cx="44" cy="72" r="6" fill="#a855f7" opacity="0.7"/>
  <circle cx="84" cy="72" r="6" fill="#a855f7" opacity="0.7"/>
</svg>

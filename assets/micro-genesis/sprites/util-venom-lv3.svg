<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="venom3" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d9f99d"/>
      <stop offset="45%" stop-color="#65a30d"/>
      <stop offset="80%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>
  </defs>
  <!-- Lv.3 噬生剧毒母巢：三腔翠绿紫黑毒巢 + 三联高压注射鳌针 + 传染孢子环 -->
  <!-- 剧毒孢子扩散环 -->
  <circle cx="64" cy="72" r="48" fill="none" stroke="#84cc16" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- 三联注射毒刺 -->
  <polygon points="30,58 34,18 44,58" fill="#a855f7" stroke="#bef264" stroke-width="2"/>
  <polygon points="84,58 94,18 98,58" fill="#a855f7" stroke="#bef264" stroke-width="2"/>
  <polygon points="54,54 64,6 74,54" fill="#84cc16" stroke="#fbbf24" stroke-width="2.5"/>
  <!-- 三腔母巢毒囊 -->
  <circle cx="38" cy="80" r="20" fill="url(#venom3)" stroke="#a3e635" stroke-width="2.2"/>
  <circle cx="90" cy="80" r="20" fill="url(#venom3)" stroke="#a3e635" stroke-width="2.2"/>
  <circle cx="64" cy="76" r="26" fill="url(#venom3)" stroke="#fbbf24" stroke-width="3"/>
  <!-- 剧毒母核 -->
  <circle cx="64" cy="76" r="10" fill="#ecfccb"/>
  <circle cx="64" cy="76" r="5" fill="#a855f7"/>
  <!-- 针尖剧毒液滴 -->
  <circle cx="64" cy="6" r="4" fill="#fbbf24"/>
  <circle cx="34" cy="16" r="3.5" fill="#bef264"/>
  <circle cx="94" cy="16" r="3.5" fill="#bef264"/>
</svg>

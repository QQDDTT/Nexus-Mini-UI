<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="scale3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="aegisCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
  </defs>
  <!-- Lv.3 棱晶反应装甲鳞：多层金青反应甲片 + 偏折力场护盾光晕 -->
  <!-- 外圈偏折力场环 -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10 5" opacity="0.8"/>
  <!-- 侧翼反应逆鳞刺 -->
  <polygon points="10,40 38,20 50,42 46,88 26,104 10,76" fill="url(#scale3)" stroke="#fbbf24" stroke-width="2.5"/>
  <polygon points="118,40 90,20 78,42 82,88 102,104 118,76" fill="url(#scale3)" stroke="#fbbf24" stroke-width="2.5"/>
  <!-- 中央棱晶神盾 -->
  <polygon points="34,24 64,8 94,24 98,74 64,118 30,74" fill="url(#scale3)" stroke="#fbbf24" stroke-width="3.5"/>
  <!-- 反应晶体分面 -->
  <polygon points="46,32 64,18 82,32 84,68 64,102 44,68" fill="#082f49" opacity="0.65" stroke="#00f0ff" stroke-width="2"/>
  <polygon points="54,44 64,32 74,44 74,66 64,84 54,66" fill="url(#aegisCore)" stroke="#ffffff" stroke-width="1.8"/>
  <!-- 棱角高光钉 -->
  <circle cx="64" cy="56" r="5" fill="#ffffff"/>
  <circle cx="28" cy="58" r="4" fill="#fbbf24"/>
  <circle cx="100" cy="58" r="4" fill="#fbbf24"/>
</svg>


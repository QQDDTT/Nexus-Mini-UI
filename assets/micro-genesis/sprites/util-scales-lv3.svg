<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="util-scales-lv3-rig" data-root-anchor="64,64" data-has-aura="true">
  <defs>
    <!-- 1. 环境接触软阴影材质 -->
    <radialGradient id="us3-cast-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#021317" stop-opacity="0.75" />
      <stop offset="62%" stop-color="#03181c" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#03181c" stop-opacity="0" />
    </radialGradient>
    <!-- 2. 棱镜反伤力场光环材质 -->
    <radialGradient id="us3-aura-field" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#d946ef" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#03181c" stop-opacity="0" />
    </radialGradient>
    <!-- 3. 深渊黑曜金晶基底材质 -->
    <linearGradient id="us3-obsidian-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#063136" />
      <stop offset="100%" stop-color="#03181c" />
    </linearGradient>
    <!-- 4. 棱镜反伤晶甲材质 -->
    <linearGradient id="us3-prism-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="28%" stop-color="#fbbf24" />
      <stop offset="68%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <!-- 5. 轴承核心与棱镜逆光边缘高光 -->
    <radialGradient id="us3-joint-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#2dd4bf" />
      <stop offset="75%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="us3-rim-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#fef08a" stop-opacity="0.88" />
      <stop offset="70%" stop-color="#2dd4bf" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="confocal-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="68%" stop-color="#2dd4bf" stop-opacity="0.16" />
      <stop offset="86%" stop-color="#a855f7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#03181c" stop-opacity="0" />
    </radialGradient>
  </defs>

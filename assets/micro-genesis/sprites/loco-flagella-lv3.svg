<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="flag3" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="rotor3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
  </defs>
  <!-- Lv.3 超频涡轮鞭毛簇：ATP 涡轮转子环 + 四联等离子鞭毛束 -->
  <!-- 涡轮护环 -->
  <ellipse cx="26" cy="64" rx="16" ry="32" fill="#082f49" stroke="#fbbf24" stroke-width="2.5"/>
  <ellipse cx="26" cy="64" rx="11" ry="24" fill="url(#rotor3)" stroke="#00f0ff" stroke-width="2"/>
  <!-- 四股高频鞭毛丝 -->
  <path d="M 38 46 C 60 22, 82 70, 104 38 C 114 26, 120 40, 126 34" fill="none" stroke="url(#flag3)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 40 58 C 62 42, 84 86, 106 58 C 116 46, 122 58, 126 54" fill="none" stroke="url(#flag3)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 40 70 C 62 86, 84 42, 106 70 C 116 82, 122 70, 126 74" fill="none" stroke="url(#flag3)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 38 82 C 60 106, 82 58, 104 90 C 114 102, 120 88, 126 94" fill="none" stroke="url(#flag3)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 涡流光环 -->
  <ellipse cx="68" cy="64" rx="6" ry="22" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 3"/>
  <ellipse cx="98" cy="64" rx="5" ry="16" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="26" cy="64" r="6" fill="#ffffff"/>
</svg>

      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="us1-rim-glow" x1="0%" y1="0%" x2="100%" y2="100%">

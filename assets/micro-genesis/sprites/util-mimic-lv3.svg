<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="mimic3" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
  <!-- Lv.3 幻影全息伪装网：双层相位偏移全息场 + 消音吸波蜂巢矩阵 -->
  <!-- 外层消音相位波环 -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10 4"/>
  <!-- 全息多面体隐身罩 -->
  <polygon points="64,14 106,38 106,90 64,114 22,90 22,38" fill="url(#mimic3)" stroke="#00f0ff" stroke-width="2.5"/>
  <!-- 量子干涉网格 -->
  <polygon points="64,26 96,44 96,84 64,102 32,84 32,44" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="64,40 84,52 84,76 64,88 44,76 44,52" fill="#090d16" opacity="0.6" stroke="#ffffff" stroke-width="2"/>
  <!-- 相位棱镜核心 -->
  <circle cx="64" cy="64" r="9" fill="#00f0ff"/>
  <circle cx="64" cy="64" r="4.5" fill="#ffffff"/>
  <!-- 4颗全息投射节点 -->
  <circle cx="64" cy="26" r="3.5" fill="#fbbf24"/>
  <circle cx="64" cy="102" r="3.5" fill="#fbbf24"/>
  <circle cx="32" cy="64" r="3.5" fill="#00f0ff"/>
  <circle cx="96" cy="64" r="3.5" fill="#00f0ff"/>
</svg>

  <polygon points="72,36 82,14 78,38" fill="#e0f2fe"/>
  <!-- 双联气压发射鞘 -->
  <rect x="24" y="76" width="80" height="30" rx="14" fill="#0c4a6e" stroke="#00f0ff" stroke-width="2.5"/>
  <circle cx="46" cy="91" r="8" fill="#00f0ff"/>
  <circle cx="82" cy="91" r="8" fill="#00f0ff"/>

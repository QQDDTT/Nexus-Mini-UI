<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="spike2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="55%" stop-color="#bae6fd"/>

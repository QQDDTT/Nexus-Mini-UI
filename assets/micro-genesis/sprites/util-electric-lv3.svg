<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="elec3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
  </defs>
  <!-- Lv.3 雷暴特斯拉电核：金青双色磁暴球 + 三极放电塔尖 + 360度连锁闪电网 -->
  <!-- 外围电磁脉冲环 -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="12 5"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- 三极特斯拉放电线圈 -->
  <polygon points="56,36 64,8 72,36" fill="#0c4a6e" stroke="#fbbf24" stroke-width="2.5"/>
  <polygon points="36,72 12,96 44,86" fill="#0c4a6e" stroke="#fbbf24" stroke-width="2.5"/>
  <polygon points="92,72 116,96 84,86" fill="#0c4a6e" stroke="#fbbf24" stroke-width="2.5"/>
  <!-- 中央超导磁暴核 -->
  <circle cx="64" cy="64" r="24" fill="url(#elec3)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="64" cy="64" r="10" fill="#ffffff"/>
  <!-- 连锁高压电弧网 -->
  <polyline points="64,10 38,28 24,52 14,94" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="64,10 90,28 104,52 114,94" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="14,94 48,108 64,98 80,108 114,94" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>
  <!-- 塔尖电球 -->
  <circle cx="64" cy="10" r="5" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="14" cy="94" r="5" fill="#ffffff" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="114" cy="94" r="5" fill="#ffffff" stroke="#00f0ff" stroke-width="2"/>
</svg>


  <polygon points="50,84 64,12 78,84" fill="url(#spike1)" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="64" y1="14" x2="64" y2="84" stroke="#ffffff" stroke-width="2.5"/>
  <!-- 肌肉发射囊基座 -->
  <ellipse cx="64" cy="90" rx="28" ry="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <ellipse cx="64" cy="86" rx="18" ry="8" fill="#0f172a" stroke="#7dd3fc" stroke-width="2"/>
</svg>

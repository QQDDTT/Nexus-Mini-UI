  <!-- 第 1 节：流线圆穹头节胶囊 (Head Dome Capsule) -->
  <g id="part-torso-head" data-pivot="64,34" data-parent="part-torso-thorax-1" data-z-index="30" data-blend="normal" data-motion="nod-head">
    <path d="M38 42 C36 20 48 8 64 8 C80 8 92 20 90 42 C78 36 50 36 38 42 Z" fill="url(#t2-jelly-head)" stroke="url(#t2-ctenophore-irid)" stroke-width="2.3" stroke-linejoin="round" />

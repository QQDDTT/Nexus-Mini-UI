  <circle cx="26" cy="64" r="6" fill="#00f0ff"/>
  <!-- 鞭毛主丝 -->
  <path d="M 38 64 C 54 44, 68 84, 86 64 C 98 50, 108 72, 118 64" fill="none" stroke="#0c4a6e" stroke-width="8" stroke-linecap="round"/>
  <path d="M 38 64 C 54 44, 68 84, 86 64 C 98 50, 108 72, 118 64" fill="none" stroke="url(#flag1)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 尾迹粒子 -->
  <circle cx="96" cy="48" r="2.5" fill="#7dd3fc" opacity="0.7"/>
  <circle cx="110" cy="78" r="2" fill="#38bdf8" opacity="0.6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="mimic2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Lv.2 光学折光外皮：虹彩六角微棱镜阵列 + 折光虚影环 -->
  <!-- 虚影错位外轮廓 -->
  <polygon points="68,14 108,36 108,84 68,108 28,84 28,36" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 4" opacity="0.65"/>
  <!-- 主折光棱镜皮膜 -->
  <polygon points="60,18 100,40 100,88 60,110 20,88 20,40" fill="url(#mimic2)" stroke="#f0abfc" stroke-width="2.5"/>
  <!-- 内部六角光学晶格 -->
  <polygon points="60,36 84,50 84,78 60,92 36,78 36,50" fill="#0f172a" opacity="0.45" stroke="#ffffff" stroke-width="1.8"/>
  <line x1="60" y1="18" x2="60" y2="110" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
  <line x1="20" y1="40" x2="100" y2="88" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
  <line x1="100" y1="40" x2="20" y2="88" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
  <circle cx="60" cy="64" r="7" fill="#ffffff"/>
</svg>

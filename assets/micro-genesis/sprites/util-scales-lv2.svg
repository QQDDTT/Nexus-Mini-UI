      <stop offset="30%" stop-color="#1d4ed8" />
      <stop offset="75%" stop-color="#063136" />
      <stop offset="100%" stop-color="#021619" />
    </linearGradient>
    <!-- 5. 轴承核心与金青受光高光 -->
    <radialGradient id="us2-joint-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="us2-rim-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.80" />
      <stop offset="80%" stop-color="#2dd4bf" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="confocal-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="68%" stop-color="#2dd4bf" stop-opacity="0.16" />
      <stop offset="86%" stop-color="#a855f7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#03181c" stop-opacity="0" />
    </radialGradient>
  </defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="util-scales-lv2-rig" data-root-anchor="64,64" data-has-aura="true">
  <defs>
    <!-- 1. 环境接触软阴影材质 -->
    <radialGradient id="us2-cast-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#021317" stop-opacity="0.70" />
      <stop offset="62%" stop-color="#03181c" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#03181c" stop-opacity="0" />
    </radialGradient>
    <!-- 2. 六角重鳞力场光环材质 -->
    <radialGradient id="us2-aura-field" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#03181c" stop-opacity="0" />
    </radialGradient>
    <!-- 3. 几丁质黑曜深海基底材质 -->
    <linearGradient id="us2-chitin-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59" />
      <stop offset="50%" stop-color="#063136" />
      <stop offset="100%" stop-color="#03181c" />
    </linearGradient>
    <!-- 4. 六角钙化重甲板材质 -->

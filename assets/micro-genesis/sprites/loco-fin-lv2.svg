<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fin2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Lv.2 矢量侧翼鳍：双翼铰接翼膜 + 5根发光鳍脉 + 导流前缘 -->
  <!-- 副翼底层 -->
  <path d="M 32 66 C 58 84, 88 102, 110 98 C 98 82, 82 72, 34 58 Z" fill="#0c4a6e" opacity="0.75" stroke="#38bdf8" stroke-width="1.8"/>
  <!-- 主翼膜 -->
  <path d="M 28 46 C 62 16, 102 22, 120 44 C 104 56, 98 68, 112 82 C 84 86, 54 78, 28 74 Z" fill="url(#fin2)" stroke="#00f0ff" stroke-width="2.5"/>
  <!-- 强化导流前缘 -->
  <path d="M 28 46 C 62 16, 102 22, 120 44" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round"/>
  <!-- 5根发光鳍条脉络 -->
  <path d="M 34 50 Q 74 30 114 44" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 36 56 Q 74 46 104 58" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 36 62 Q 72 60 102 70" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
  <path d="M 34 68 Q 70 74 108 80" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
  <path d="M 36 74 Q 72 90 106 96" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- 矢量关节枢纽 -->
  <ellipse cx="26" cy="62" rx="12" ry="20" fill="#082f49" stroke="#00f0ff" stroke-width="2.5"/>
  <circle cx="26" cy="62" r="6" fill="#00f0ff"/>
</svg>


  <g id="part-torso-thorax-3" data-pivot="64,64" data-parent="part-torso-thorax-2" data-z-index="18" data-blend="normal" data-motion="wave-spine-3">
    <path d="M16 52 C14 64 16 76 22 84 L42 74 C38 68 38 60 42 54 Z M112 52 C114 64 112 76 106 84 L86 74 C90 68 90 60 86 54 Z" fill="url(#t4-ring-sss)" stroke="url(#t4-ctenophore-irid)" stroke-width="2.2" stroke-linejoin="round" />

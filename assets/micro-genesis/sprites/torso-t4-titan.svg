  </g>
  <g id="part-aura-ring-outer" data-pivot="64,64" data-parent="root" data-z-index="4" data-blend="screen" data-motion="spin-cw" style="mix-blend-mode: screen">
    <circle cx="64" cy="64" r="60" stroke="url(#t4-ctenophore-irid)" stroke-width="1.4" stroke-opacity="0.62" />
    <circle cx="64" cy="4" r="3.4" fill="#fde047" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="116" cy="34" r="3.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="116" cy="94" r="3.4" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="64" cy="124" r="3.0" fill="#c084fc" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="12" cy="94" r="3.4" fill="#f472b6" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="12" cy="34" r="3.0" fill="#34d399" stroke="#ffffff" stroke-width="0.8" />

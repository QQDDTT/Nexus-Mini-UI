  <g id="part-torso-thorax-2" data-pivot="64,46" data-parent="part-torso-thorax-1" data-z-index="24" data-blend="normal" data-motion="wave-spine-2">
    <path d="M20 54 C26 30 44 18 64 18 C84 18 102 30 108 54 L86 56 C82 44 74 38 64 38 C54 38 46 44 42 56 Z" fill="url(#t4-ring-sss)" stroke="url(#t4-ctenophore-irid)" stroke-width="2.4" stroke-linejoin="round" />
    <ellipse cx="46" cy="30" rx="12" ry="4.5" transform="rotate(-24 46 30)" fill="#ffffff" fill-opacity="0.76" />
    <circle cx="35" cy="38" r="2.6" fill="#ffffff" fill-opacity="0.68" />
  </g>
  <g id="part-torso-thorax-1" data-pivot="64,34" data-parent="root" data-z-index="28" data-blend="normal" data-motion="wave-spine-1">

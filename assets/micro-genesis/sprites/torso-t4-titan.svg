    <path d="M64 64 L64 20 M64 38 Q56 32 50 26 M64 38 Q72 32 78 26" stroke="#fde047" stroke-width="1.8" stroke-linecap="round" />
    <path d="M64 64 L22 58 M42 61 Q34 52 28 46 M42 61 Q34 68 28 74" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" />
    <path d="M64 64 L106 58 M86 61 Q94 52 100 46 M86 61 Q94 68 100 74" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
    <path d="M64 64 L40 94 M50 80 Q42 82 36 86 M64 64 L88 94 M78 80 Q86 82 92 86" stroke="#c084fc" stroke-width="1.7" stroke-linecap="round" />
    <path d="M64 64 L64 108" stroke="#f472b6" stroke-width="1.8" stroke-linecap="round" />
    <!-- 镂空腔中心悬浮聚变核仁 (Suspended Hollow-Cavity Nucleus) -->
    <circle cx="64" cy="64" r="16" fill="url(#t4-star-core)" stroke="#ffffff" stroke-width="1.6" />
    <circle cx="64" cy="64" r="7.5" fill="#fde047" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="61" cy="61" r="3.0" fill="#ffffff" />
  </g>

  <!-- 5. 栉水母薄膜虹彩边缘反光与顶层荧光孢子 -->
  <g id="part-light-rim-torso" data-pivot="64,64" data-parent="part-torso-thorax-1" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M26 42 C34 24 48 16 64 16 C80 16 94 24 102 42" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.68" />
  </g>
  <g id="part-light-rim-flank" data-pivot="64,58" data-parent="part-torso-thorax-1" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">
    <path d="M28 38 C12 46 8 62 14 78 M100 38 C116 46 120 62 114 78" stroke="url(#t4-ctenophore-irid)" stroke-width="2.4" stroke-linecap="round" />

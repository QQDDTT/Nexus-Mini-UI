<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" data-rig-id="torso-t4-titan-rig" data-root-anchor="64,64" data-has-aura="true">
  <defs>
    <!-- 1. 材质物理与光学滤镜层：拓扑 B 中心镂空星环母体 Gooch 次表面散射 + 栉水母薄膜干涉虹彩 -->
    <radialGradient id="t4-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#021317" stop-opacity="0.82" />
      <stop offset="68%" stop-color="#03181c" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#03181c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="t4-ring-sss" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.94" />
      <stop offset="25%" stop-color="#5eead4" stop-opacity="0.84" />
      <stop offset="55%" stop-color="#0d9488" stop-opacity="0.80" />
      <stop offset="82%" stop-color="#115e59" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.96" />
    </radialGradient>
    <radialGradient id="t4-pod-sss" cx="40%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="32%" stop-color="#fde047" stop-opacity="0.86" />
      <stop offset="68%" stop-color="#2dd4bf" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.92" />
    </radialGradient>
    <linearGradient id="t4-ctenophore-irid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="24%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="76%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <radialGradient id="t4-star-core" cx="45%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#2dd4bf" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 2. 流派专属底座：泰坦共聚焦引力波纹与栉水母薄膜干涉环 -->
  <g id="part-shadow-cast" data-pivot="64,68" data-parent="root" data-z-index="1" data-blend="multiply" style="mix-blend-mode: multiply">

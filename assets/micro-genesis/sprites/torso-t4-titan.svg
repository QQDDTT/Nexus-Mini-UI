    <circle cx="90" cy="14" r="2.4" fill="#fde047" />
    <circle cx="10" cy="58" r="2.4" fill="#2dd4bf" />
    <circle cx="118" cy="58" r="2.4" fill="#38bdf8" />
    <circle cx="64" cy="120" r="2.4" fill="#c084fc" />
  </g>
</svg>

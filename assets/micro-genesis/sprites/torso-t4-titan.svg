  <g id="part-torso-thorax-4" data-pivot="64,88" data-parent="part-torso-thorax-3" data-z-index="14" data-blend="normal" data-motion="wave-spine-4">
    <path d="M20 74 C26 98 44 110 64 110 C84 110 102 98 108 74 L86 72 C82 84 74 90 64 90 C54 90 46 84 42 72 Z" fill="url(#t4-ring-sss)" stroke="url(#t4-ctenophore-irid)" stroke-width="2.2" stroke-linejoin="round" />
    <circle cx="48" cy="96" r="4.2" fill="#99f6e4" fill-opacity="0.45" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="80" cy="96" r="4.2" fill="#fde047" fill-opacity="0.45" stroke="#ffffff" stroke-width="0.8" />
  </g>

  </g>

  <!-- 3. 主体体积剪影：拓扑 B · 中心镂空星环悬浮母体构型 (Hollow Star-Ring Orbital Leviathan) -->
  <!-- 外周环形果冻生物圈底弧与推进尾囊 (Posterior Star-Ring Arc & Pod) -->
  <g id="part-torso-tail" data-pivot="64,104" data-parent="part-torso-thorax-4" data-z-index="10" data-blend="normal" data-motion="wave-tail">
    <path d="M40 96 C44 114 54 122 64 122 C74 122 84 114 88 96 C78 102 50 102 40 96 Z" fill="url(#t4-pod-sss)" stroke="url(#t4-ctenophore-irid)" stroke-width="2.2" stroke-linejoin="round" />
    <circle cx="64" cy="108" r="5.5" fill="url(#t4-star-core)" stroke="#ffffff" stroke-width="1.0" />

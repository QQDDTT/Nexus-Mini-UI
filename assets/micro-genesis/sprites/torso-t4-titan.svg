    <ellipse cx="56" cy="14" rx="9" ry="3.4" transform="rotate(-18 56 14)" fill="#ffffff" fill-opacity="0.78" />
    <circle cx="64" cy="18" r="5.0" fill="url(#t4-star-core)" stroke="#ffffff" stroke-width="1.1" />
  </g>

  <!-- 4. 中观解剖：中心镂空水体悬浮核仁 + 6 条放射 L-System 发光突触能量弦 -->
  <g id="part-neural-core" data-pivot="64,64" data-parent="part-torso-thorax-2" data-z-index="36" data-blend="normal" data-motion="pulse-core">

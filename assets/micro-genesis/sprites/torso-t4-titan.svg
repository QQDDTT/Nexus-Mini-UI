  <g id="part-aux-stabilizer-1" data-pivot="84,84" data-parent="root" data-z-index="17" data-blend="normal">
    <circle cx="88" cy="88" r="5.0" fill="url(#t4-pod-sss)" stroke="#ffffff" stroke-width="1.1" />
  </g>
  <g id="part-aux-stabilizer-2" data-pivot="64,94" data-parent="root" data-z-index="18" data-blend="normal">
    <circle cx="64" cy="98" r="4.5" fill="url(#t4-pod-sss)" stroke="#ffffff" stroke-width="1.0" />
  </g>
  <g id="part-aux-stabilizer-3" data-pivot="44,84" data-parent="root" data-z-index="19" data-blend="normal">
    <circle cx="40" cy="88" r="5.0" fill="url(#t4-pod-sss)" stroke="#ffffff" stroke-width="1.1" />

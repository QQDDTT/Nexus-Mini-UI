<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="36" fill="url(#bgGlow)"/>
  
  <!-- 尾部柔性鞭毛 -->
  <path d="M 55 125 C 35 145, 20 120, 15 155" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 60 135 C 45 160, 30 145, 25 170" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 细胞外壁与双层脂质膜呼吸光晕 -->
  <ellipse cx="105" cy="95" rx="55" ry="38" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="3.5" filter="url(#neonBlur)"/>
  
  <!-- 几丁质护盾骨板微结构 -->
  <path d="M 85 62 Q 105 58 125 64" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 75 75 Q 105 70 135 78" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 细胞质与能量光核 -->
  <ellipse cx="108" cy="94" rx="28" ry="20" fill="url(#coreGlow)" filter="url(#neonBlur)"/>
  <circle cx="116" cy="90" r="7" fill="#ffffff" opacity="0.9"/>

  <!-- 摄食口器探针 -->
  <polygon points="160,95 182,88 178,95 182,102" fill="#fbbf24"/>
</svg>

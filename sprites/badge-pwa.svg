<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-asset-id="portal-badge-pwa">
  <!-- 零模糊纯黑硬偏移阴影 -->
  <rect x="24" y="20" width="86" height="94" rx="16" fill="#000000"/>
  <!-- 孔版暖白桌面卡带底座 -->
  <rect x="18" y="14" width="86" height="94" rx="16" fill="#f4efe6" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
  <!-- 顶部黑黄斜纹槽 -->
  <rect x="32" y="24" width="58" height="12" rx="4" fill="#facc15" stroke="#111111" stroke-width="3.5"/>
  <!-- 酸柠绿向下安装大箭头 (带硬阴影) -->
  <polygon points="65,44 65,68 79,68 61,88 43,68 57,68 57,44" fill="#000000" transform="translate(3,3)"/>
  <polygon points="65,42 65,66 81,66 61,88 41,66 57,66 57,42" fill="#a3e635" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <!-- 底部荧光橙底座托盘 -->
  <rect x="34" y="92" width="54" height="8" rx="3" fill="#ff5500" stroke="#111111" stroke-width="3"/>
</svg>

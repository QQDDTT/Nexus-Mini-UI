<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-asset-id="portal-badge-fullscreen">
  <!-- 零模糊纯黑硬偏移阴影 -->
  <rect x="18" y="26" width="98" height="80" rx="14" fill="#000000"/>
  <!-- 孔版暖白横屏掌机外框 -->
  <rect x="12" y="20" width="98" height="80" rx="14" fill="#f4efe6" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
  <!-- 内部深炭黑视口画布 -->
  <rect x="22" y="30" width="78" height="60" rx="8" fill="#171513" stroke="#111111" stroke-width="4"/>
  <!-- 四角酸柠绿与荧光橙全屏张开箭头 -->
  <polyline points="30,48 30,36 42,36" fill="none" stroke="#a3e635" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="92,48 92,36 80,36" fill="none" stroke="#ff5500" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="30,72 30,84 42,84" fill="none" stroke="#ff5500" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="92,72 92,84 80,84" fill="none" stroke="#a3e635" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 中心波普星芒 -->
  <polygon points="61,46 65,56 75,60 65,64 61,74 57,64 47,60 57,56" fill="#facc15" stroke="#111111" stroke-width="2.5"/>
</svg>

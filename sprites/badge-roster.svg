<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-asset-id="portal-badge-roster">
  <defs>
    <pattern id="br-dots" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <circle cx="2" cy="2" r="1.3" fill="#111111" fill-opacity="0.22"/>
    </pattern>
  </defs>
  <!-- 零模糊纯黑硬偏移阴影 -->
  <rect x="18" y="22" width="98" height="90" rx="14" fill="#000000"/>
  <!-- 孔版暖白纸模切底卡 -->
  <rect x="12" y="16" width="98" height="90" rx="14" fill="#f4efe6" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
  <rect x="18" y="22" width="86" height="78" rx="10" fill="url(#br-dots)"/>
  <!-- 5 款微游流派色阶卡带叠层 (Chroma-Muse 5-Game Color Stack) -->
  <rect x="24" y="28" width="74" height="11" rx="3" fill="#22c55e" stroke="#111111" stroke-width="3"/>
  <rect x="24" y="42" width="74" height="11" rx="3" fill="#38bdf8" stroke="#111111" stroke-width="3"/>
  <rect x="24" y="56" width="74" height="11" rx="3" fill="#fbbf24" stroke="#111111" stroke-width="3"/>
  <rect x="24" y="70" width="74" height="11" rx="3" fill="#f472b6" stroke="#111111" stroke-width="3"/>
  <rect x="24" y="84" width="74" height="11" rx="3" fill="#2dd4bf" stroke="#111111" stroke-width="3"/>
  <!-- 右下角波普荧光橙角标 -->
  <circle cx="96" cy="92" r="16" fill="#000000"/>
  <circle cx="93" cy="89" r="16" fill="#ff5500" stroke="#111111" stroke-width="4"/>
  <polygon points="88,81 102,89 88,97" fill="#fdfbf7" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
</svg>

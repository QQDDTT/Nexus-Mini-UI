<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景圆角底盘板 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- 赛博网格与对角线 -->
  <path d="M64 256 H448 M256 64 V448" stroke="#1e293b" stroke-width="2" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8" />

  <!-- 核心几何六边形枢纽徽章 -->
  <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" 
           fill="none" stroke="url(#neonCyan)" stroke-width="12" filter="url(#glow)" />

  <!-- 中央闪电战术能量矩阵 -->
  <path d="M280 136 L176 272 H264 L232 376 L336 240 H248 Z" 
        fill="url(#neonGold)" filter="url(#glow)" />

  <!-- 四角战术雷达刻度点 -->
  <circle cx="160" cy="160" r="8" fill="#00f0ff" />
  <circle cx="352" cy="160" r="8" fill="#00f0ff" />
  <circle cx="160" cy="352" r="8" fill="#00f0ff" />
  <circle cx="352" cy="352" r="8" fill="#00f0ff" />
</svg>

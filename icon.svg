    <circle cx="128" cy="128" r="46" fill="#050b18" stroke="url(#np-cyan-blade)" stroke-width="2.2" />
    <path fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.72" d="M162.24,139.12 A36,36 0 0,1 139.12,162.24 M116.88,162.24 A36,36 0 0,1 93.76,139.12 M93.76,116.88 A36,36 0 0,1 116.88,93.76 M139.12,93.76 A36,36 0 0,1 162.24,116.88" stroke-linecap="square" />

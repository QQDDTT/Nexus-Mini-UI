<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" data-rig-id="nexus-portal-icon-rig" data-has-aura="true" data-style="STYLE-57-39-neo-brutal-risograph">
  <defs>
    <!-- 孔版印刷波普圆点网屏 (Risograph Halftone Dots Pattern) -->
    <pattern id="nb-halftone-dots" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="3" cy="3" r="1.6" fill="#111111" fill-opacity="0.22" />
      <circle cx="8" cy="8" r="1.2" fill="#ff5500" fill-opacity="0.28" />
    </pattern>
    <!-- 45度新粗野工业斜纹图案 (Brutalist Hazard Diagonal Stripes) -->
    <pattern id="nb-stripe-pattern" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="12" fill="#111111" />
      <rect x="6" width="6" height="12" fill="#facc15" />
    </pattern>
    <!-- 孔版暖白画报纸底渐变 (Gooch Warm Paper Base) -->
    <linearGradient id="nb-paper-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="65%" stop-color="#f4efe6" />
      <stop offset="100%" stop-color="#e5dec9" />
    </linearGradient>
    <!-- 酸柠荧光绿主色调 (Acid Lime Main Chassis) -->
    <linearGradient id="nb-acid-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="55%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>
    <!-- 大豆荧光橙爆炸星芒 (Risograph Fluorescent Orange) -->
    <linearGradient id="nb-riso-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <!-- 零模糊纯黑硬偏移阴影滤镜 (Zero-Blur Hard Offset Shadow) -->
    <filter id="nb-hard-shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- 1. 底层零模糊纯黑硬偏移贴纸阴影 (Hard Offset Sticker Shadow, blur=0) -->
  <g id="part-shadow-cast" data-pivot="128,128" data-parent="root" data-z-index="1" data-blend="normal">
    <rect x="36" y="36" width="194" height="194" rx="26" fill="#000000" />
    <polygon points="134,14 156,34 120,34" fill="#000000" />
    <polygon points="134,250 158,226 116,226" fill="#000000" />
    <rect x="18" y="96" width="38" height="74" rx="10" fill="#000000" />
    <rect x="210" y="96" width="38" height="74" rx="10" fill="#000000" />
  </g>

  <!-- 2. 外层顺时针孔版暖米纸模切卡座与铆钉孔 (Die-Cut Risograph Paper Base & Corner Rivets) -->
  <g id="part-aura-ring-outer" data-pivot="128,128" data-parent="root" data-z-index="4" data-blend="normal" data-motion="spin-cw">
    <!-- Risograph 2px 荧光橙错位套印层 -->
    <rect x="30" y="24" width="192" height="192" rx="26" fill="none" stroke="#ff5500" stroke-width="3.5" opacity="0.85" />
    <!-- 主暖米色孔版纸卡座 -->
    <rect x="26" y="26" width="192" height="192" rx="26" fill="url(#nb-paper-warm)" stroke="#111111" stroke-width="5.5" stroke-linejoin="round" />
    <!-- 半调波普圆点网屏覆盖层 -->
    <rect x="34" y="34" width="176" height="176" rx="18" fill="url(#nb-halftone-dots)" />
    <!-- 内框黑黄警示装饰角标与四角粗野铆钉孔 -->
    <circle cx="48" cy="48" r="6.5" fill="#111111" stroke="#ff5500" stroke-width="2" />
    <circle cx="196" cy="48" r="6.5" fill="#111111" stroke="#a3e635" stroke-width="2" />
    <circle cx="48" cy="196" r="6.5" fill="#111111" stroke="#38bdf8" stroke-width="2" />
    <circle cx="196" cy="196" r="6.5" fill="#111111" stroke="#f472b6" stroke-width="2" />
    <!-- 四边裁切刻度短线 (Crop Marks) -->
    <path d="M122,26 V38 M122,206 V218 M26,122 H38 M206,122 H218" stroke="#111111" stroke-width="4" stroke-linecap="square" />
  </g>

  <!-- 3. 内层逆时针波普锯齿爆炸星芒环 (Action Starburst Sawtooth Badge) -->
  <g id="part-aura-ring-inner" data-pivot="128,128" data-parent="root" data-z-index="5" data-blend="normal" data-motion="spin-ccw">
    <!-- 硬偏移纯黑底影 -->
    <polygon points="132,38 152,74 192,58 174,98 214,116 178,140 202,178 160,170 156,212 132,180 104,212 102,170 60,178 84,140 48,116 88,98 70,58 110,74" fill="#000000" />
    <!-- 荧光橙波普爆炸多角星 -->
    <polygon points="128,34 148,70 188,54 170,94 210,112 174,136 198,174 156,166 152,208 128,176 100,208 98,166 56,174 80,136 44,112 84,94 66,54 106,70" fill="url(#nb-riso-orange)" stroke="#111111" stroke-width="5" stroke-linejoin="round" />
    <!-- 错位套印白高光折线 -->
    <polyline points="106,70 128,39 148,70 183,58" fill="none" stroke="#fdfbf7" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- 4. 核心波普放射漫画速度线贴图 (Comic Pop Speed Ray Cones) -->
  <g id="part-light-cone-main" data-pivot="128,128" data-parent="root" data-z-index="8" data-blend="normal">
    <polygon points="128,128 96,28 112,28" fill="#facc15" stroke="#111111" stroke-width="2.5" />
    <polygon points="128,128 144,28 160,28" fill="#38bdf8" stroke="#111111" stroke-width="2.5" />
    <polygon points="128,128 96,228 112,228" fill="#f472b6" stroke="#111111" stroke-width="2.5" />
    <polygon points="128,128 144,228 160,228" fill="#a3e635" stroke="#111111" stroke-width="2.5" />
  </g>

  <!-- 5. 主装甲酸柠绿新粗野街机卡带核心座 (Acid Lime Arcade Cartridge Chassis) -->
  <g id="part-chassis-hex" data-pivot="128,128" data-parent="root" data-z-index="15" data-blend="normal">
    <!-- 5px 零模糊硬偏移纯黑投影 -->
    <rect x="77" y="77" width="112" height="112" rx="18" fill="#000000" />
    <!-- 酸柠绿主立体方盒 -->
    <rect x="72" y="72" width="112" height="112" rx="18" fill="url(#nb-acid-lime)" stroke="#111111" stroke-width="5.5" stroke-linejoin="round" />
    <!-- 顶部街机卡带抓手凹槽条纹 -->
    <rect x="92" y="82" width="72" height="12" rx="4" fill="url(#nb-stripe-pattern)" stroke="#111111" stroke-width="3" />
    <!-- 四角十字螺丝钉 -->
    <circle cx="86" cy="170" r="4.5" fill="#fdfbf7" stroke="#111111" stroke-width="2.5" />
    <circle cx="170" cy="170" r="4.5" fill="#fdfbf7" stroke="#111111" stroke-width="2.5" />
  </g>

  <!-- 6. 左翼天青蓝街机摇杆碰撞翼 (Left Arcade Bumper Wing - Cyan) -->
  <g id="part-wing-shield-L" data-pivot="72,128" data-parent="part-chassis-hex" data-z-index="22" data-blend="normal">
    <path d="M72,92 L22,82 L14,128 L22,174 L72,164 Z" fill="#000000" transform="translate(4, 4)" />
    <path d="M72,92 L22,82 L14,128 L22,174 L72,164 Z" fill="#38bdf8" stroke="#111111" stroke-width="5" stroke-linejoin="round" />
    <rect x="26" y="106" width="32" height="44" rx="6" fill="#fdfbf7" stroke="#111111" stroke-width="3.5" />
    <line x1="34" y1="118" x2="50" y2="118" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
    <line x1="34" y1="128" x2="50" y2="128" stroke="#ff5500" stroke-width="3.5" stroke-linecap="round" />
    <line x1="34" y1="138" x2="50" y2="138" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- 7. 右翼波普粉街机按键碰撞翼 (Right Arcade Bumper Wing - Magenta Pink) -->
  <g id="part-wing-shield-R" data-pivot="184,128" data-parent="part-chassis-hex" data-z-index="22" data-blend="normal">
    <path d="M184,92 L234,82 L242,128 L234,174 L184,164 Z" fill="#000000" transform="translate(4, 4)" />
    <path d="M184,92 L234,82 L242,128 L234,174 L184,164 Z" fill="#f472b6" stroke="#111111" stroke-width="5" stroke-linejoin="round" />
    <rect x="198" y="106" width="32" height="44" rx="6" fill="#fdfbf7" stroke="#111111" stroke-width="3.5" />
    <circle cx="214" cy="119" r="5" fill="#ff5500" stroke="#111111" stroke-width="2.5" />
    <circle cx="214" cy="137" r="5" fill="#a3e635" stroke="#111111" stroke-width="2.5" />
  </g>

  <!-- 8. 上方三尖皇冠波普天线阵列 (Top Basquiat-Style Crown Crest) -->
  <g id="part-sensor-crest-top" data-pivot="128,62" data-parent="part-chassis-hex" data-z-index="26" data-blend="normal">
    <polygon points="94,68 86,22 114,44 128,14 142,44 170,22 162,68" fill="#000000" transform="translate(4, 4)" />
    <polygon points="94,68 86,22 114,44 128,14 142,44 170,22 162,68" fill="#facc15" stroke="#111111" stroke-width="4.5" stroke-linejoin="round" />
    <circle cx="86" cy="20" r="5" fill="#ff5500" stroke="#111111" stroke-width="2.5" />
    <circle cx="128" cy="12" r="6" fill="#a3e635" stroke="#111111" stroke-width="2.5" />
    <circle cx="170" cy="20" r="5" fill="#38bdf8" stroke="#111111" stroke-width="2.5" />
  </g>

  <!-- 9. 下方街机投币口与矢量尾焰贴纸 (Bottom Coin-Slot Thruster Tail) -->
  <g id="part-thruster-tail" data-pivot="128,194" data-parent="part-chassis-hex" data-z-index="26" data-blend="normal">
    <polygon points="100,188 156,188 146,240 110,240" fill="#000000" transform="translate(4, 4)" />
    <polygon points="100,188 156,188 146,240 110,240" fill="#ff5500" stroke="#111111" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="114,196 142,196 128,232" fill="#facc15" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  </g>

  <!-- 10. 中央旋转新粗野播放核心转子 (Center Brutalist Play-Button Rotor) -->
  <g id="part-reactor-rotor" data-pivot="128,128" data-parent="part-chassis-hex" data-z-index="34" data-blend="normal">
    <circle cx="132" cy="132" r="36" fill="#000000" />
    <circle cx="128" cy="128" r="36" fill="#fdfbf7" stroke="#111111" stroke-width="5.5" />
    <!-- 错位套印内圈 -->
    <circle cx="126" cy="126" r="28" fill="none" stroke="#ff5500" stroke-width="2.5" />
    <!-- 核心高能闪电/启动三角组合标 -->
    <polygon points="116,106 150,128 116,150" fill="#111111" transform="translate(3, 3)" />
    <polygon points="116,106 150,128 116,150" fill="#ff5500" stroke="#111111" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- 11. 孔版套印错位白边高光层 (Risograph Misregistration Offset Highlight) -->
  <g id="part-light-rim-chassis" data-pivot="128,128" data-parent="part-chassis-hex" data-z-index="45" data-blend="normal">
    <path d="M78,92 V78 H116" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M22,90 L64,98" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <path d="M192,98 L234,90" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- 12. 顶层基思·哈林风放射动态震动短线与四角星贴纸 (Radiant Pop Ticks & Sparkles) -->
  <g id="part-aura-corona-top" data-pivot="128,128" data-parent="root" data-z-index="65" data-blend="normal">
    <!-- 四角波普十字星贴纸 -->
    <path d="M56,64 L60,74 L70,78 L60,82 L56,92 L52,82 L42,78 L52,74 Z" fill="#facc15" stroke="#111111" stroke-width="2.5" />
    <path d="M200,64 L204,74 L214,78 L204,82 L200,92 L196,82 L186,78 L196,74 Z" fill="#a3e635" stroke="#111111" stroke-width="2.5" />
    <path d="M56,168 L60,178 L70,182 L60,186 L56,196 L52,186 L42,182 L52,178 Z" fill="#38bdf8" stroke="#111111" stroke-width="2.5" />
    <path d="M200,168 L204,178 L214,182 L204,186 L200,196 L196,186 L186,182 L196,178 Z" fill="#f472b6" stroke="#111111" stroke-width="2.5" />
    <!-- 动态震动短线 (Radiant Ticks) -->
    <path d="M36,36 L44,44 M220,36 L212,44 M36,220 L44,212 M220,220 L212,212" stroke="#ff5500" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>

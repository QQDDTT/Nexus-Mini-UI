    <line x1="37" y1="75.4" x2="22.9" y2="67.3" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.8" />
    <line x1="75.4" y1="37" x2="67.3" y2="22.9" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.8" />
    <line x1="128" y1="22.9" x2="128" y2="6.6" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.8" />
    <line x1="180.6" y1="37" x2="188.7" y2="22.9" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.8" />
    <line x1="219" y1="75.4" x2="233.1" y2="67.3" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.8" />

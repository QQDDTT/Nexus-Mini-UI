  <g id="part-sensor-crest-top" data-pivot="128,62" data-parent="part-chassis-hex" data-z-index="26" data-blend="normal">
    <circle cx="128" cy="62" r="7" fill="#0f172a" stroke="#00f0ff" stroke-width="1.4" />
    <circle cx="128" cy="62" r="3" fill="#fbbf24" />
    <polygon points="128,18 156,58 128,48 100,58" fill="url(#np-obsidian-hull)" stroke="#00f0ff" stroke-width="1.8" />

  <!-- 11. 本体与双翼受光边缘高光映射贴图 (Rim Light Overlay) -->
  <g id="part-light-rim-chassis" data-pivot="128,128" data-parent="part-chassis-hex" data-z-index="45" data-blend="plus-lighter" style="mix-blend-mode: plus-lighter">

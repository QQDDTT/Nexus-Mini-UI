<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <title>Nexus-Mini · 平台升级更新中</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <style>
    :root {
      --bg-void: #030712;
      --bg-card: rgba(13, 20, 36, 0.82);
      --border-subtle: rgba(0, 240, 255, 0.22);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-cyan: #00f0ff;
      --accent-gold: #fbbf24;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100dvh;
      background-color: var(--bg-void);
      background-image:
        radial-gradient(circle at 50% 35%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 30px rgba(0, 240, 255, 0.06);
    }
    .logo-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 16px;
      padding: 12px;
      background: rgba(0, 240, 255, 0.06);
      border: 1px solid rgba(0, 240, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: var(--accent-gold);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-gold);
      box-shadow: 0 0 10px var(--accent-gold);
      animation: pulse 1.8s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
      color: var(--text-primary);
    }
    p {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.25), transparent);
      margin-bottom: 20px;
    }
    .meta {
      font-size: 0.8rem;
      color: #64748b;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-wrap">
      <img src="./icon.svg" alt="Nexus-Mini" />
    </div>
    <div class="badge">
      <span class="dot"></span>
      <span>SYSTEM UPDATING · 矩阵更新中</span>
    </div>
    <h1>Nexus-Mini 正在升级更新中</h1>
    <p>
      独立微游与实时微对战矩阵正在按照全新设计规范进行架构重构与视觉升级，敬请期待。
    </p>
    <div class="divider"></div>
    <div class="meta">NEXUS-MINI ARCADE MATRIX · MINI.EVOTENSOR.DEV</div>
  </main>
</body>
</html>
